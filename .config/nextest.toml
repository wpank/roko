# Verification lanes for local/self-hosted development. Runtime filters do not
# prevent Rust from compiling a test target, so credentialed provider coverage
# remains structurally gated by roko-agent's `integration` feature.

[profile.default]
fail-fast = true
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.fast]
inherits = "default"
fail-fast = true
retries = 0
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "20s", terminate-after = 1 }
default-filter = 'not (test(/(e2e|integration|live|crash_recovery|process_integration)/) | binary(/(e2e|integration|live|crash_recovery|process_integration)/))'

[profile.slow]
inherits = "default"
fail-fast = false
status-level = "retry"
final-status-level = "slow"
slow-timeout = { period = "90s", terminate-after = 2 }
default-filter = 'test(/(e2e|integration|crash_recovery|process_integration)/) | binary(/(e2e|integration|crash_recovery|process_integration)/)'

[profile.live]
inherits = "default"
fail-fast = true
retries = 0
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 1 }
default-filter = 'test(/live/) | binary(/live/)'

[[profile.default.overrides]]
filter = 'test(/(flaky|timing_sensitive|timeout)/)'
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
