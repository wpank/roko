# .config/tarpaulin.toml — cargo-tarpaulin configuration
#
# Targets key crates for coverage measurement. Run via:
#   cargo tarpaulin --config .config/tarpaulin.toml
# Or via the wrapper:
#   ./scripts/coverage.sh

[default]
# Crates to measure — core kernel, gate pipeline, learning, graph engine, storage
packages = [
    "roko-core",
    "roko-gate",
    "roko-learn",
    "roko-graph",
    "roko-fs",
]

# Minimum coverage threshold (percent). CI fails below this.
failure-threshold = 40

# Output formats
out = ["Html", "Lcov"]
output-dir = ".roko/coverage"

# Skip autogenerated, vendored, and test-helper code
exclude-files = [
    "*/tests/*",
    "*/test_helpers/*",
    "*/test_utils/*",
    "*/fixtures/*",
    "*/benches/*",
    "*/build.rs",
    "target/*",
]

# Run in workspace mode so path resolution works correctly
workspace = true

# Avoid rerunning doc tests (slow, low signal for coverage purposes)
doc = false

# Use llvm engine when available for more accurate line coverage
# Falls back to ptrace on Linux if llvm is unavailable
engine = "auto"

# Timeout per test binary (seconds)
timeout = 120

# Number of parallel test threads
# Use 1 to avoid flaky race conditions in coverage instrumentation
test-threads = 1
