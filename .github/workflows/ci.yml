name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --no-deps -- -D warnings
      - run: cargo test --workspace

  golden-path:
    name: Golden-path canaries (C1-C8)
    runs-on: ubuntu-latest
    # Building roko-cli's test targets takes most of this; the canaries
    # themselves get ten minutes.
    timeout-minutes: 45
    env:
      # One `--test` per canary target, C1 to C8 in order, as
      # tests/golden_path_suite.rs lists them; C3 and C4 share one.
      CANARIES: >-
        --test honest_verdicts_canary
        --test secrets_and_git_guard_canary
        --test plan_branch_integration
        --test attempt_diff_canary
        --test scheduler_canary
        --test supervision_canary
        --test tier_ladder_canary
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the canaries
        run: cargo test -p roko-cli --no-run $CANARIES
      - name: Run the canaries
        timeout-minutes: 10
        run: cargo test -p roko-cli $CANARIES

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # rust-toolchain.toml overrides rustup's default toolchain, so name nightly explicitly.
      - run: cargo +nightly fmt --all --check

  layer-check:
    name: Layer Check
    runs-on: ubuntu-latest
    # A cold `cargo build -p roko-cli` takes 13-15 minutes on ubuntu-latest.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Build roko-cli
        run: cargo build -p roko-cli
      - name: Run layer check
        run: cargo run -p roko-cli -- layer-check

  cli-feature-matrix:
    name: Lean CLI + Alloy opt-in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Prove the default CLI omits Alloy provider crates
        run: |
          cargo check -p roko-cli
          if cargo tree -p roko-cli -e normal | grep -Eq 'alloy-(provider|network|rpc-client) v'; then
            echo 'lean roko-cli unexpectedly includes the Alloy provider graph' >&2
            exit 1
          fi
      - name: Prove the explicit RPC feature remains buildable
        env:
          SKIP_FRONTEND_BUILD: "1"
        run: cargo check -p roko-cli --features alloy-backend,acp
      - name: Prove roko-serve builds without chain
        env:
          SKIP_FRONTEND_BUILD: "1"
        run: cargo check -p roko-serve --no-default-features --features hdc

  portal:
    name: Portal (types, tests, export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/portal
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: No unreachable source files
        run: node scripts/orphans.mjs
      - run: npm run build:export
      - name: The export is the portal, which roko serve embeds at /
        run: grep -q 'name="roko-portal"' out/index.html

  # The two-action flow in a real browser against `roko serve`, with the
  # deterministic fake agent (no API keys, no spend). Non-blocking until it has
  # a record on Linux runners; remove continue-on-error once it does.
  portal-browser:
    name: Portal browser check (fake agent)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      # Same build as layer-check: reuse its dependency cache, save none.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: layer-check
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/portal/package-lock.json
            demo/demo-app/package-lock.json
      - name: Build the portal export
        working-directory: apps/portal
        run: npm ci --no-audit --no-fund && npm run build:export
      - name: Build the demo app and install Playwright's Chromium
        working-directory: demo/demo-app
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Build roko-cli
        run: cargo build -p roko-cli
      - name: Portal check
        run: bash plans/portal-programme/09-acceptance/portal-check.sh
      - name: Upload the check's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-check-evidence
          path: tmp/portal-audit/evidence/portal-check/
          overwrite: true

  route-inventory:
    name: HTTP route inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test the route scanner
        run: python3 tools/test_http_route_inventory.py
      # A route added or removed in roko-serve fails this until the snapshot
      # is refreshed: python3 tools/http_route_inventory.py --refresh
      - name: Compare roko-serve's routes with the snapshot
        run: python3 tools/http_route_inventory.py --check-snapshot
