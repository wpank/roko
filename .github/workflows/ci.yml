name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --no-deps -- -D warnings
      - run: cargo test --workspace

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  layer-check:
    name: Layer Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Build roko-cli
        run: cargo build -p roko-cli
      - name: Run layer check
        run: cargo run -p roko-cli -- layer-check

  cli-feature-matrix:
    name: Lean CLI + Alloy opt-in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Prove the default CLI omits Alloy provider crates
        run: |
          cargo check -p roko-cli
          if cargo tree -p roko-cli -e normal | grep -Eq 'alloy-(provider|network|rpc-client) v'; then
            echo 'lean roko-cli unexpectedly includes the Alloy provider graph' >&2
            exit 1
          fi
      - name: Prove the explicit RPC feature remains buildable
        env:
          SKIP_FRONTEND_BUILD: "1"
        run: cargo check -p roko-cli --features alloy-backend,acp
