# Arm cheap_direct (S08 §4.9, S09 §4.2): a cheap model alone in the bash-only direct loop, billed through the API.
# The pilot (gap-c33709) runs gpt-oss-120b; S09 adds the best cheap model of the pool after the pilot.
schema_version = "vb.arm/1"

[arm]
id = "cheap_direct"
harness = "mini-loop"                 # S09's harness vocabulary; the runner is driver/mini_loop.py
models_allow = ["gpt-oss-120b"]
line = "BL0"                          # S09 §4.6: the pilot's budget line; LOG1 runs pass --line BL1
billed = true
label = "cheap·direct"

[caps]                                # S08 §4.10, API arms
turns_per_attempt = 12
input_tokens_per_attempt = 150000
turns_per_task = 30
input_tokens_per_task = 300000
wallclock_s = 1200
model_calls_per_task = 30             # runaway detector
identical_calls = 5                   # runaway detector: the same command five times in a row
usd_per_task = 0.30                   # runaway detector; at gpt-oss-120b's rates the token caps bind first ($0.29)
max_output_tokens = 8192              # per call; sent as max_completion_tokens and used for the worst case
command_timeout_s = 60
observation_chars = 10000

[providers.cerebras]
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"
max_tokens_param = "max_completion_tokens"
