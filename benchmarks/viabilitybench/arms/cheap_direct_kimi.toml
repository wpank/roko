# Arm cheap_direct on kimi-k2.6 (3347; S09 §4.3): LOG1 block B's best cheap model. All but the model, its provider
# table, the line and the dollar cap's note is arms/cheap_direct.toml's, the arm id included, so records name the arm
# `cheap_direct` and the model `kimi-k2.6`. One file per model: run_roko.py builds a ladder from an arm with
# several models_allow entries, and a one-model arm needs its own provider's key alone. Keep the caps in
# step with arms/cheap_direct.toml.
schema_version = "vb.arm/1"

[arm]
id = "cheap_direct"
harness = "mini-loop"                 # S09's harness vocabulary; the runner is driver/mini_loop.py
models_allow = ["kimi-k2.6"]
line = "BL1"                          # S09 §4.6: LOG1's line
billed = true
label = "cheap·direct"

[caps]                                # S08 §4.10, API arms
turns_per_attempt = 12
input_tokens_per_attempt = 150000
turns_per_task = 30
input_tokens_per_task = 300000
wallclock_s = 1200
model_calls_per_task = 30             # runaway detector
identical_calls = 5                   # runaway detector: the same command five times in a row
usd_per_task = 0.30                   # binds before the token caps ($1.27 at kimi-k2.6's rates)
max_output_tokens = 8192              # per call; sent as max_completion_tokens and used for the worst case
command_timeout_s = 60
observation_chars = 10000

[providers.moonshot]
base_url = "https://api.moonshot.ai/v1"   # check against platform.kimi.ai before the first billed run
api_key_env = "MOONSHOT_API_KEY"
max_tokens_param = "max_completion_tokens"
