# Arm cheap_direct_msa (S08 §4.9, decision 3; 3317): the same task as cheap_direct, gpt-oss-120b billed through the
# API, but run by the pinned mini-swe-agent (MIT, github.com/SWE-agent/mini-swe-agent) instead of our own bash-only
# loop (mini_loop.py). The runner is driver/run_msa.py, which runs mini-swe-agent's `mini` CLI as a subprocess (it is
# never imported) from its own venv (.venv-msa/, requirements-msa.lock) and points it at the metering proxy. Records
# keep [arm] id = "cheap_direct", the same arm as the bash-only loop's, with `provenance.network_policy.harness`
# naming "mini-swe-agent" so analysis/metrics.py never pools the two loops' runs as one cell's duplicate. Pilot B's
# optional "mini-swe" block (experiments/pilot_b.toml) runs this arm.
schema_version = "vb.arm/1"

[arm]
id = "cheap_direct"
harness = "mini-swe-agent"            # S09's harness vocabulary
runner = "run_msa"
models_allow = ["gpt-oss-120b"]
line = "BL0"                          # S09 §4.6: the pilot's budget line, Pilot B's optional block
billed = true
label = "cheap·msa"

[caps]                                # cheap_direct's own caps: the same task budget, a different loop
turns_per_attempt = 12
input_tokens_per_attempt = 150000
turns_per_task = 30
input_tokens_per_task = 300000
wallclock_s = 1200
model_calls_per_task = 30             # runaway detector
identical_calls = 5                   # runaway detector: the same command five times in a row
usd_per_task = 0.30                   # runaway detector; at gpt-oss-120b's rates the token caps bind first ($0.29)
max_output_tokens = 8192              # per call; sent as max_completion_tokens and used for the worst case
command_timeout_s = 60
observation_chars = 10000

[msa]
binary = ".venv-msa/bin/mini"         # relative to the benchmark tree; driver/run_msa.py's own default

[providers.cerebras]
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"
max_tokens_param = "max_completion_tokens"
