# Arm roko_ladder (3313; decision 3302 option a, D11): the Roko arm on the cheap-model ladder instead of one pinned
# model, three rungs cheapest first (gpt-oss-120b, glm-4.7, gpt-5.4-mini), no frontier rung and learning frozen. It
# tests "Roko with the cheap models plus escalation" on the pilot tasks (P16). The runner is driver/run_roko.py,
# which emits planemit's ladder mode (3310, 3312) instead of one pinned model whenever an arm's models_allow holds
# more than one model, and whose model check (3312) accepts an escalation up these rungs and still rejects a
# failover. Pilot C's manifest is experiments/pilot_c.toml, on budget line BL14.
schema_version = "vb.arm/1"

[arm]
id = "roko_ladder"
harness = "roko"                      # S09's harness vocabulary
runner = "run_roko"
models_allow = ["gpt-oss-120b", "glm-4.7", "gpt-5.4-mini"]   # cheapest first: the ladder's rung order (3312)
line = "BL14"                         # S09 §4.6 v1.5: the exploratory ladder line, gated "after G0"
billed = true
label = "ladder·roko"

[caps]                                # roko_fixed's caps, but usd_per_task at the top rung's (gpt-5.4-mini) token
                                       # worst case ($1.996 at these other caps), so the token caps bind for every
                                       # rung, cheap or expensive, and Roko's own plan budget is never starved by an
                                       # escalation (run_roko._worst_task_usd prices every rung, not just the start).
turns_per_attempt = 12
input_tokens_per_attempt = 150000
turns_per_task = 36
input_tokens_per_task = 450000
wallclock_s = 1200
model_calls_per_task = 45
usd_per_task = 2.00
max_output_tokens = 8192
command_timeout_s = 120

[roko]
binary = "target/debug/roko"          # relative to the repository root; each attempt records the build it ran
build = ""                            # a git sha pins the binary: a different build stops the task
provider_kind = "openai_compat"
context_window = 128000
tier = "focused"
max_retries = 2
skip_enrichment = true                # explicit per arm (B §2.3)

[providers.cerebras]                  # gpt-oss-120b, the start rung
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"
max_tokens_param = "max_completion_tokens"

[providers.zai]                       # glm-4.7, the middle rung
base_url = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
max_tokens_param = "max_completion_tokens"

[providers.openai]                    # gpt-5.4-mini, the top rung
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_tokens_param = "max_completion_tokens"
