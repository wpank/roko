# Arm roko_plan (S09 §4.9/E12, tldr P16; 3319): "frontier plans, cheap models execute." A claude-opus-5-5 planner
# (through 3305's egress allowlist) writes a multi-task plan from a plan-slice feature's description; the
# cheap-model ladder (the same three rungs as roko_ladder) executes it under roko plan run's own parallelism and
# whole-plan gate (gap-60233f, [meta] verify). The runner is driver/run_roko_plan.py, which writes roko.toml itself
# (planemit's ladder tables) since the planner, not this driver, writes plans/<slug>/tasks.toml. gap-1cd676 runs the
# paid slice against fd_claude; this arm file and runner only need to work offline (3319's own scope).
schema_version = "vb.arm/1"

[arm]
id = "roko_plan"
harness = "roko"                      # S09's harness vocabulary
runner = "run_roko_plan"
models_allow = ["gpt-oss-120b", "glm-4.7", "gpt-5.4-mini"]   # the execution ladder, cheapest first (3312)
line = "BL13"                         # S09 §4.6: the plan-level slice's own line, gated "after G0"
billed = true                         # the executors are billed; the planner is a $0 subscription session
label = "plan·roko"

[caps]                                # roko_ladder's own shape; wallclock covers the planner session and execution
turns_per_attempt = 12
input_tokens_per_attempt = 150000
turns_per_task = 36
input_tokens_per_task = 450000
wallclock_s = 2400
model_calls_per_task = 45
usd_per_task = 2.00
max_output_tokens = 8192
command_timeout_s = 120

[roko]
binary = "target/debug/roko"          # relative to the repository root; each attempt records the build it ran
build = ""                            # a git sha pins the binary: a different build stops the task
provider_kind = "openai_compat"       # the execution ladder's own providers; the planner's is [providers.anthropic]
context_window = 128000
tier = "focused"
max_retries = 2
max_parallel = 3                      # roko plan run --max-parallel: the arm's own parallelism (3319 plan point 2)
skip_enrichment = true                # explicit per arm (B §2.3)
egress_allow = ["api.anthropic.com:443"]   # 3305's allowlist (egress.DEFAULT_ALLOW), for the planner session

[planner]
model = "claude-opus-5-5"
turns = 30
wallclock_s = 900
usd_cap = 3.00

[cli]
program = "claude"                    # resolved on the driver's PATH
effort = "high"
credentials = "keychain"              # keychain | credentials_file: how the fresh config directory signs in
cache_write_ttl = "1h"                # S09 §4.1: subscription turns write the 1-hour cache

[providers.cerebras]                  # gpt-oss-120b, the start rung
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"
max_tokens_param = "max_completion_tokens"

[providers.zai]                       # glm-4.7, the middle rung
base_url = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
max_tokens_param = "max_completion_tokens"

[providers.openai]                    # gpt-5.4-mini, the top rung
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_tokens_param = "max_completion_tokens"

[providers.anthropic]                 # the planner's own; what `vb run` admits as a network provider
base_url = "https://api.anthropic.com"
