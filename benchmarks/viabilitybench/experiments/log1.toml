# LOG1 (S09 §4.3, E5; work item gap-2ca903, task 3347): the log-once campaign's runbook. Its billed blocks are
# streams/log1.toml's cells (3330's compiler), one block per cell: A 960, B 660, C 336, D 120 and E 80 runs, 2,156 in
# all on budget line BL1, planned $151.80 ($152.30 with block F's contamination probe, which runs no `vb run`). The
# subscription blocks add 612 must runs and 210 optional ones (--include s-fd-claude-lite, s-fd-codex), $0 billed.
# experiments/test_log1.py checks every count against streams/log1.toml and S09. Validate and estimate with
#     benchmarks/viabilitybench/.venv/bin/python benchmarks/viabilitybench/driver/vb.py campaign \
#         --manifest benchmarks/viabilitybench/experiments/log1.toml --dry-run [--include s-fd-claude-lite]
# The dry run refuses LOG1 until the pre-registration lock is committed (S09 SC1, task 3345; `requires_lock`).
#
# Budget. Planned spend is S09 §3's: $0.075 per Roko run and $0.06 per direct run. Each billed block's max_cost_usd,
# the most it may bill, is its plan scaled by BL1's cap over the plan (160 / 151.80), so the blocks' worst cases sum
# to at most BL1's $160: the campaign refuses a block that could take the line past it.
#
# Order. S09 §4.1: arms interleaved in randomized daily blocks (`daily_interleave`): each block's k-th seed runs on
# day k, in a keyed shuffle of the day's units, so provider drift spreads over every arm.
#
# Secrets. S09 §4.1: one `vb run` at a time per secret file. LOG1 runs sequentially under one secret file, and the
# campaign log pins each instance to it for the whole campaign. To run in parallel, split the blocks between runners
# by whole blocks (never one stream's instances across two files), give each runner its own secret file
# (`secret.py init`) and key file, and set `secret_fingerprint` on each of its blocks to its file's fingerprint; the
# campaign then refuses a block under any other secret.
#
# Subscription schedule. Every subscription block is `off_hours`: the subscription is shared with the development
# agents, so its units run outside working hours, at most the weekly number of runs G1 measured the subscription to
# sustain (S09 §4.7 G1). If throughput is short, S09's scale-down ladder drops the could block, then the should block.
#
# Validity (S09 §4.3): every Roko cell runs with learning frozen (gap-644040's `[learning] frozen`, recorded in each
# run's manifest), routing fixed per cell (one pinned model per arm file), S05 post hoc only and S06 off; G2
# (analysis/gates.py) checks it from each run's wiring census.
schema_version = "vb.experiment/1"
id = "LOG1"
title = "LOG1: blocks A-E (2,156 billed runs) and the subscription cells (612 + 210 optional) of S09 §4.3"
requires_lock = true           # S09 SC1: LOG1 never starts without the pre-registration lock (3345)
requires_live = []
order = { kind = "daily_interleave", seed = 3 }   # S09 §4.1: arms interleaved in randomized daily blocks

