# Pilot A's SC2 spot check (S08 SC2; S09 §4.7 G0), for a person to fill in. Read by gates.py G0 --sc2.
#
# For each item, read the task's spec and the agent's final diff, and judge whether the output meets the spec's
# acceptance criteria: human_label = 1 when it does, 0 when it does not. Judge blind: the census label is not on
# this sheet (gates.py reads it from the records). The files are in the results root:
#   spec:       ~/.roko-bench/viability/PILOT-A/<run_id>/private/<instance_id>.s<seed>/.vb/spec.precise.md
#   diff:       ~/.roko-bench/viability/PILOT-A/<run_id>/archives/<instance_id>.s<seed>.diff
#   final tree: ~/.roko-bench/viability/PILOT-A/<run_id>/archives/<instance_id>.s<seed>.tar.gz
#   transcript: ~/.roko-bench/viability/PILOT-A/<run_id>/transcripts/<instance_id>.s<seed>.json
# Then uncomment checked_by and date, and set human_label on every item.
#
# The sample (18 items, keyed by 'pilot-a-sc2-1'): every Pilot A output with VS = 1 (8: 3 cheap_direct, 5 fd_api),
# and 10 completed cheap_direct outputs with VS = 0 (5 F1, 5 F4). SC2 wants 10 of each label, so the check stays
# 'not evaluated' until 2 more VS = 1 outputs from Pilot B are added.
#
# [direct_loop] (S08 decision 3) picks the direct loop with the higher VS on gpt-oss-120b, between mini_loop.py
# and the pinned mini-swe-agent. Pilot A ran only mini_loop.py; the mini-swe-agent block is Pilot B's optional
# 'mini-swe'. Fill it in once both have run.
