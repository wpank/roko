# A dated price snapshot. Its id, prices-2026-10-27, resolves to this file (config/prices/<date>.toml).
# The Rust cost loader and the ViabilityBench driver (Python tomllib) read these bytes unchanged, and
# benchmarks/viabilitybench/schema/price-snapshot.schema.json validates them. There is no JSON copy.
#
# Immutable: when a provider changes a rate, add a new dated file with a new id; never edit this one.
# Rates are USD per 1M tokens. Every row has every column, in this order, plus an optional `note`:
#   slug, provider, input, cache_read, cache_write_5m, cache_write_1h, output, reasoning_in_output, source_url, verified
# A rate the provider does not publish separately equals `input`. `reasoning_in_output = true` means reasoning
# tokens are already counted in output tokens and are not added again. A model missing from this file has an
# unknown cost (null, with cost source "unknown"), never a fallback rate.
#
# Every rate was read on 2026-10-27 from the provider's own page that its row's source_url names. The rows
# prices-2026-09-28 has were read again that day and are unchanged. OpenAI's GPT-5.6 models write their prompt
# cache for 30 minutes (the default) or 12 hours: their cache_write_5m holds the 30-minute rate and
# cache_write_1h the 12-hour rate.
#
# roko.toml routes to four models this file leaves out, since no provider page gave them a per-token rate on
# 2026-10-27, so their cost stays unknown: gemma-4-31b (Cerebras serves it only on Dedicated Inference),
# glm-5v-turbo (Z.ai's pricing page does not list it), llama-3.3-70b-versatile (Groq lists it as Enterprise,
# "Contact Sales") and sonar (Perplexity's pricing page no longer lists Sonar Chat Completions, whose support
# ended on 2026-09-27; its requests are being moved to the Agent API model by model, and no page says at what
# rate).
