[package]
name = "roko-agent-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Per-agent HTTP server with feature-gated routes, bearer auth, and ERC-8004 agent-card registration helpers."

[lints]
workspace = true

[features]
default = ["chain"]
# ERC-8004 on-chain registration and chain-client state.
# Without this, the sidecar compiles without roko-chain or alloy-primitives.
chain = ["dep:roko-chain", "dep:alloy-primitives"]

[dependencies]
agent-relay = { path = "../../apps/agent-relay" }
roko-agent = { path = "../roko-agent" }
roko-chain = { path = "../roko-chain", optional = true }
roko-core = { path = "../roko-core" }
roko-fs = { path = "../roko-fs" }
roko-learn = { path = "../roko-learn" }
roko-neuro = { path = "../roko-neuro" }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
alloy-primitives = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true, features = ["limit", "load-shed", "util"] }

[package.metadata.roko]
layer = 4
