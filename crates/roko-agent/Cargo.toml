[package]
name = "roko-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Agent trait and backends for Roko: spawn LLMs (Claude, exec'd CLIs, mock) that produce signals."

[lints]
workspace = true

[features]
# Gates the `live` integration-test module in tests/provider_integration.rs.
# Run with: cargo test -p roko-agent --features integration
# Requires real API keys (e.g. ZAI_API_KEY) to be set.
integration = []
# Legacy streaming test gates (tests reference APIs that no longer exist).
__codex_streaming_legacy = []
__cursor_streaming_legacy = []
# Forwarded from roko-std; gates chain-tool count assertions in provider_parity tests.
chain = []

[dependencies]
roko-core = { path = "../roko-core" }
roko-fs = { path = "../roko-fs" }
roko-graph = { path = "../roko-graph" }
roko-std = { path = "../roko-std" }
async-trait = "0.1"
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "rt", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
governor = { version = "0.10", default-features = false, features = ["std"] }
httpdate = "1"
url = "2"
regex = "1"
parking_lot = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
roko-std = { path = "../roko-std" }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
wiremock = "0.6"

[package.metadata.roko]
layer = 2
