[package]
name = "roko-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The `roko` binary: minimal CLI that drives the universal loop (prompt → compose → agent → gate → persist) against a working directory."
default-run = "roko"

[lints]
workspace = true

[features]
default = ["acp", "hdc"]
# Backend-neutral chain tools, parked out of the default build (9201):
# propagates to roko-std (17 chain tool handlers), roko-agent (test
# assertions), roko-serve (chain-family routes, chain state, chain feed
# agents) and the agent sidecar (ERC-8004 registration).
# Real RPC/provider support is an explicit build choice via alloy-backend.
chain = [
    "dep:roko-chain",
    "roko-std/chain",
    "roko-agent/chain",
    "roko-serve/chain",
    "roko-agent-server/chain",
]
# Full HDC fingerprint pipeline: neuro store, prompt composition, substrate
# persistence, and serve webhook handling.
hdc = ["roko-compose/hdc", "roko-fs/hdc", "roko-serve/hdc"]
acp = ["dep:roko-acp"]
# Agent groups in roko serve, parked out of the default build (9219).
groups = ["roko-serve/groups"]
# The relay client in roko serve, parked out of the default build (9220).
relay = ["roko-serve/relay"]
# The cognitive clock and its theta/delta plan-completion sinks, parked out of
# the default build (9222).
cognitive-clock = ["roko-runtime/cognitive-clock"]
alloy-backend = [
    "chain",
    "roko-chain/alloy-backend",
    "roko-serve/alloy-backend",
]
# S03 §4.9's "break a loop" fault flags and their read sites (5129): the
# knowledge, playbook and route readers and the decision-row builders consult
# them. Off by default, where `faults::active` is a const `None`.
fault-injection = ["roko-learn/fault-injection", "roko-serve/fault-injection"]
# tui-png: Optional PNG screenshot capture for TUI visual regression testing.
# Not required for production.
#
# Gates the png_renderer module, a built-in bitmap rasterizer. No heavy image
# dependencies yet — the current implementation uses a minimal hand-rolled
# PNG writer. No callers outside the module itself; its tests run only when
# the feature is enabled. (The text/buffer diff module, screenshot_diff, is
# always built: `roko screenshot --compare` and `--format ansi` use it.)
tui-png = []

[[bin]]
name = "roko"
path = "src/main.rs"

[[bin]]
name = "layer_check"
path = "../../scripts/layer_check.rs"

[[test]]
name = "chain_integration"
path = "tests/chain_integration.rs"
required-features = ["alloy-backend"]

[dependencies]
roko-core = { path = "../roko-core" }
roko-std = { path = "../roko-std" }
roko-fs = { path = "../roko-fs" }
roko-learn = { path = "../roko-learn" }
roko-compose = { path = "../roko-compose" }
roko-agent = { path = "../roko-agent" }
roko-agent-server = { path = "../roko-agent-server", default-features = false }
roko-gate = { path = "../roko-gate" }
roko-dreams = { path = "../roko-dreams" }
roko-daimon = { path = "../roko-daimon" }
roko-neuro = { path = "../roko-neuro", features = ["hdc"] }
roko-conductor = { path = "../roko-conductor" }
roko-plugin = { path = "../roko-plugin" }
roko-runtime = { path = "../roko-runtime" }
roko-serve = { path = "../roko-serve" }
# SQLite is the canonical index persistence backend (backlog #362).
# rkyv remains library-only; tree-sitter is disabled/experimental.
roko-index = { path = "../roko-index", features = ["sqlite"] }
# B2 finds the changed functions with its symbol extractor (backlog 7125).
roko-lang-rust = { path = "../roko-lang-rust" }
roko-graph = { path = "../roko-graph" }
roko-execution = { path = "../roko-execution" }
roko-chain = { path = "../roko-chain", optional = true }
roko-acp = { path = "../roko-acp", optional = true }
roko-mcp-github = { path = "../roko-mcp-github" }

clap = { workspace = true, features = ["derive"] }
cargo_metadata = "0.23"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "net", "signal", "io-util"] }
tokio-util = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
semver = "1"
toml = { workspace = true }
toml_edit = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
axum = { workspace = true }
uuid = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
octocrab = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
wasmi = { workspace = true }
sysinfo = { workspace = true }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy = "0.15"
ed25519-dalek = "2"
dirs = "6"
indicatif = "0.18"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.3"
libc = "0.2"
fs2 = "0.4"
pulldown-cmark = "0.12"
webbrowser = { workspace = true }
glob = { workspace = true }
blake3 = { workspace = true }
rustix = { version = "1.1.4", features = ["fs", "process"] }
tempfile = { workspace = true }

[dev-dependencies]
agent-relay = { path = "../../apps/agent-relay" }
assert_cmd = { workspace = true }
predicates = { workspace = true }
roko-graph = { path = "../roko-graph", features = ["test-support"] }
wat = "1"

[package.metadata.roko]
layer = 4
