# The golden path's acceptance fixture (gap-f30b8e; backlog 3115): nine tasks
# over ../seed/, each with a planner-written [task.accept] test that fails on
# the seed. Written by hand from plan.md, and frozen before any solution or
# replay patch existed. No task pins a model: role and tier pick the rung.

[meta]
plan = "golden-path"
iteration = 1
total = 9
done = 0
status = "ready"
estimated_total_minutes = 60

[[meta.verify]]
phase = "structural"
command = "cargo fmt --all -- --check"
timeout_ms = 600000

[[meta.verify]]
phase = "compile"
command = "cargo clippy --workspace --all-targets -- -D warnings"
timeout_ms = 600000

[[meta.verify]]
phase = "test"
command = "cargo test --workspace"
timeout_ms = 600000

[[meta.verify]]
phase = "test"
command = "python3 -m unittest discover -s py"

[[meta.verify]]
phase = "test"
command = "node --experimental-strip-types --test ts/*.test.ts"

[[task]]
id = "T1"
title = "Add slugify to the Python text helpers"
description = '''
In py/textutil.py add `slugify(text)`, which returns `text` as a URL slug: lower
case, every run of characters that are not ASCII letters or digits replaced by
one hyphen, and no hyphen at either end. `slugify("Hello World")` is
"hello-world" and `slugify("  Roko -- ships!  ")` is "roko-ships". Use only the
standard library, and keep `title_words` as it is.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
files = ["py/textutil.py", "py/test_accept_slugify.py"]

[task.context]
read_files = [
    { path = "py/textutil.py", why = "the module slugify joins" },
    { path = "py/test_textutil.py", why = "how the module's tests import it" },
]

[[task.accept.files]]
src = "accept/test_accept_slugify.py"
dest = "py/test_accept_slugify.py"
runner = "cd py && python3 -m unittest -v test_accept_slugify"
count = 3

[[task]]
id = "T2"
title = "Add camelCase to the TypeScript string helpers"
description = '''
In ts/strings.ts export `camelCase(text: string): string`. It splits `text` into
words on spaces, hyphens and underscores, drops empty words, lower-cases the
first word, and capitalises the first letter of every later word (the rest of
each word lower case), then joins them with nothing between.
`camelCase("golden path run")` is "goldenPathRun". Keep `reverse` as it is. The
file runs under Node's type stripping, so use no TypeScript-only syntax beyond
type annotations.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
files = ["ts/strings.ts", "ts/camel_case.accept.test.ts"]

[task.context]
read_files = [
    { path = "ts/strings.ts", why = "the module camelCase joins" },
    { path = "ts/strings.test.ts", why = "how the module's tests import it" },
]

[[task.accept.files]]
src = "accept/camel_case.test.ts"
dest = "ts/camel_case.accept.test.ts"
runner = "node --experimental-strip-types --test {dest}"
count = 3

