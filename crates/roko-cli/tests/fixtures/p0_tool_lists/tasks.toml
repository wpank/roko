acceptance = [
    "AC1: a new Engine reports every parameter's default value, clamps out-of-range writes, rounds Int and Choice values, maps Bool values, and ignores invalid indices.",
    "AC2: process writes all requested samples of both channels, leaves sentinels beyond numSamples untouched, and stays finite for 0 to 1536-sample blocks with MIDI input.",
    "AC3: process, setParam, getParam, meters, and reset perform no heap allocation over repeated blocks.",
    "AC4: the beat clock follows the host transport when valid, stays at host ppq when stopped, and advances from 0 at seq_bpm when no transport is provided.",
]
