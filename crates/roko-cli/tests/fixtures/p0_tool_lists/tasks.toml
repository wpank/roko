    "AC1: `cmake --preset core` configures successfully and produces a core build tree with UNDERTOW_BUILD_PLUGIN=OFF.",
    "AC2: `cmake --build --preset core` builds the core library target and the spec harness without needing any JUCE package or include path.",
    "AC3: `ctest --preset core` runs from the core preset and succeeds once the core-only tests are present.",
]
