    "AC3: `tools/spec.sh 1 output` passes, proving the mono output stage, DC blocker, master gain smoothing, and soft clipper.",
    "AC4: `tools/spec.sh 1 rumble` passes, proving the kept rumble still works through the new engine.",
]
