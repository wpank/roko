max_retries = 3
acceptance = [
    "AC1: Running `tools/spec.sh 1 params` passes, proving the 49-row parameter table and exact `findParam`/enum index mapping.",
    "AC2: Running `tools/spec.sh 1 engine` passes, proving the new engine skeleton, parameter clamping and rounding, mono block writes, beat clock, allocation-free APIs, and retired core file removal.",
    "AC3: Running `tools/spec.sh 1 output` passes, proving the mono output stage order, DC blocker, master gain smoothing, clip hold, and soft clip ceiling.",
    "AC4: Running `tools/spec.sh 1 rumble` passes, proving the kept rumble behavior through the engine.",
]
sequence = 0
goal = "The core library exposes the phase-1 parameter table, mono engine/output/preset APIs, and compiles after the retired core modules are removed."
non_goals = [
    "Do not change `core/include/undertow/rumble.h` or `core/src/rumble.cpp`.",
    "Do not touch the plugin wrapper, renderer, or install scripts in this task.",
]

