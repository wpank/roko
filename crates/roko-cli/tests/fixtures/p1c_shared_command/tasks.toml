description = "Replace the first-version core with the phase-1 foundation: the 49-row parameter table, exact lookup helpers, the engine skeleton, the mono output stage, and the Init-only preset API. Remove the retired oscillator, filter, envelope, LFO, voice, and sequencer files, and keep the kept rumble module untouched."
role = "implementer"
status = "ready"
tier = "architectural"
max_loc = 300
files = [
    "core/include/undertow/params.h",
    "core/src/params.cpp",
    "core/include/undertow/engine.h",
    "core/src/engine.cpp",
    "core/include/undertow/output_stage.h",
    "core/src/output_stage.cpp",
    "core/include/undertow/presets.h",
    "core/src/presets.cpp",
