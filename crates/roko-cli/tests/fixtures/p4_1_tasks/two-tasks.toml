title = "Restrict bone tokens to the CHEST pitch display"
description = "Assumption: the only code changes needed are the token swaps named in docs/specs/phase-4.1-bone.md, because the failing phase 4 review isolated bone-like pixels to Look.cpp and Status.cpp. Update plugin/ui/Look.cpp so the knob value tick and Slider thumb use rose, and tooltip text uses textPrimary. Update plugin/ui/Status.cpp so the HEAD BPM readout uses textPrimary and the pump field RUMBLE label uses roseDim. Keep bone and boneDim untouched outside these two files so plugin/ui/Displays.cpp remains the one bone number. Do not change layout, sizing, fonts, behavior, tests, docs, tools, or any other editor colour assignments."
role = "implementer"
status = "ready"
tier = "focused"
max_loc = 20
files = [
    "plugin/ui/Look.cpp",
    "plugin/ui/Status.cpp",
]
depends_on = []
depends_on_plan = []
timeout_secs = 0
max_retries = 3
acceptance = [
    "AC1: Running `tools/spec.sh 4 display 'P4.06*,P4.08*,P4.09*'` passes, proving idle frames show effectively no bone-like pixels and playing frames keep all bone-like pixels inside one CHEST region while the tunnel, scope, and AT checks still pass.",
    "AC2: Running `tools/spec.sh 4 display 'P4.05*'` passes after the colour swaps, preserving the void, white-free, rose-dominant panel and calm CHEST at rest.",
    "AC3: Running `tools/spec.sh 4 display 'P4.07*'` passes after the colour swaps, preserving hazard stripes only while clipping.",
]
sequence = 0
goal = "Only the CHEST pitch display keeps bone and bone_dim; the knob tick, knob thumb, tooltip text, BPM readout, and RUMBLE label use the ROSEDUST tokens named by the phase 4.1 spec."
non_goals = [
    "Do not edit plugin/ui/Displays.cpp or change the bone pitch display itself.",
    "Do not change any header, layout, size, font, behaviour, tests/spec files, docs, third_party code, or tools.",
]

[task.context]
symbols = [
    "Look::Look — slider thumb and tooltip token assignments",
    "Look::drawRotarySlider — knob value tick colour",
    "Status::paint — HEAD BPM and RUMBLE label colours",
]
anti_patterns = [
    "Do NOT change tests or tools to satisfy the spec; fix only the colour-token uses named in the spec.",
    "Do NOT touch plugin/ui/Displays.cpp; bone remains reserved for the CHEST pitch display there.",
    "Do NOT substitute different bright colours that would pass the bone-location checks but violate the named tokens.",
]
prior_failures = []

