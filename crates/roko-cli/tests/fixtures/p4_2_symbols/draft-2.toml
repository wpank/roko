[[task]]
id = "T2"
title = "Restore the default sequencer pattern on new engines"
goal = "A new engine starts with defaultPattern in the sequencer itself so playback, pattern readback, and saved plugin state all reflect the default bassline."
description = "Set the sequencer's initial pattern in Engine::Impl() beside the readback slot initialization so new engines and new plugins start with defaultPattern() before any audio runs, and the active pattern remains default after process copies from the sequencer. Assumption: the intended fix is only in the constructor path; reset() and prepare() must remain pattern-preserving for restored or edited patterns."
acceptance = [
  "AC1: Running `tools/spec.sh 4_2 pattern` passes, proving a new engine with sequencer on plays the default bassline, including step 2 as A2, step 5 as rest, and the full defaultPattern bar.",
  "AC2: Running `tools/spec.sh 4_2 pattern` passes, proving a new engine's pattern() remains defaultPattern() after a block and while the sequencer runs.",
  "AC3: Running `tools/spec.sh 4_2 pattern` passes, proving a new plugin that has run a block saves and restores defaultPattern() in its state.",
  "AC4: Running `tools/spec.sh 4 state` still passes the prepare/reset/state regression checks.",
  "AC5: Running `tools/spec.sh 3 engine 'P3.14*,P3.15*'` still passes the engine startup and render-budget regression checks."
]
non_goals = [
  "Do not change reset() or prepare() to reapply the default pattern.",
  "Do not alter unrelated engine DSP, processor plumbing, or UI code."
]
