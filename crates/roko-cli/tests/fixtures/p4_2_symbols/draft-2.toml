[[task]]
id = "T1"
title = "Lay out controls, labels, stamps, and text recording"
goal = "The editor exposes the designed control layout, labels, stamps, and recorded text boxes so the layout spec checks pass."
description = "Implement the phase 4.2 layout in the editor and static layer. Replace the old panel table with the designed OSC/01, FILTER/02, ENV/03, RUMBLE/04, MOD/05, GROUND, VOICE/07, OUT/08, and SEQ/06 arrangement; place every control in its panel with 64x64 cells, square rotary sliders for knobs, and a lamp-style seq_on button. Add plugin/ui/Texts.h as the header-only draw recorder API, route every editor word and number that this task owns through texts::draw, and add UndertowEditor::drawnTexts() to perform one offscreen paint with the static layer re-drawn inside the record. Remove knob text boxes at rest, provide hover/drag readouts under labels using Slider::getTextFromValue after attachments are created, and format units from the parameter table per the spec. Assumption: task 1 owns all control labels, panel stamps, layout tables, and the static text recording hook; it leaves HEAD and bone-number content for task 2. Assumption: the new Texts.h can stay header-only with inline storage for the active record pointer."
acceptance = [
  "AC1: Running `tools/spec.sh 4_2 layout` passes, proving every control lies inside its panel and window, avoids the CHEST, pump field, GUT, and overlaps, and GROUND orders VOICE/07 then OUT/08 then sequencer controls.",
  "AC2: Running `tools/spec.sh 4_2 layout` passes, proving every knob is a rotary slider in square 32 to 64 px bounds and seq_on is a lamp button within 64 x 40.",
  "AC3: Running `tools/spec.sh 4_2 layout` passes, proving knobs show no text box at rest and their min/default/max readouts use choice names or at most two decimals plus units.",
  "AC4: Running `tools/spec.sh 4_2 layout` passes, proving every control has the design label drawn under it inside its panel and with matching pixels.",
  "AC5: Running `tools/spec.sh 4_2 layout` passes, proving OSC/01 to MOD/05 and SEQ/06 are at panel top left and VOICE/07 and OUT/08 sit over their GROUND groups without overlap.",
  "AC6: Running `tools/spec.sh 4 editor` still passes phase 4 frame and control regression checks.",
  "AC7: Running `tools/spec.sh 4 display 'P4.05*'` still passes the display colour-balance regression checks.",
  "AC8: Running `tools/spec.sh 4 steps` still passes the unit-array regression checks."
]
non_goals = [
  "Do not change tests/spec, docs, third_party, or the provided tools.",
  "Do not change the tunnel, scope, AT field, HEAD, bone number, or engine behavior in this task.",
  "Do not modify UnitArray behavior."
]
open_questions = []
status = "ready"
tier = "architectural"
max_loc = 300
files = [
  "plugin/ui/Theme.h",
  "plugin/ui/Texts.h",
  "plugin/PluginEditor.h",
  "plugin/PluginEditor.cpp",
  "plugin/ui/Look.h",
  "plugin/ui/Look.cpp",
]
depends_on = []
role = "implementer"

[task.context]
read_files = [
  { path = "docs/specs/phase-4.2-layout.md", lines = "1-220", why = "The phase spec defines the exact panel rectangles, control order, label text, Texts.h API, and verification mapping for this task." },
  { path = "plugin/ui/Theme.h", lines = "1-220", why = "The current panel table and geometry need replacement with the designed control and panel layout." },
  { path = "plugin/ui/Look.cpp", lines = "1-140", why = "The static layer drawing and cache management live here, so this file provides the stamp drawing path and the drawStaticLayer implementation that must route through text recording." },
]
symbols = [
  "UndertowEditor::initialiseControls — current control creation loop to replace with the designed positions and control kinds",
  "undertow::ui::theme::controlPanels — current panel table that needs the new rectangles and ordering",
  "Look::drawStaticLayer — current static text and stamp drawing site that must route through texts::draw",
]
anti_patterns = [
  "Do NOT leave JUCE text boxes enabled on knobs; the spec requires hover or drag readouts only.",
  "Do NOT record only dynamic text; the static layer text must also be re-drawn inside UndertowEditor::drawnTexts().",
  "Do NOT keep the old oversized 104x72 elliptical knob bounds or any control extending below the editor."
]

