[[task]]
id = "T1"
title = "Add scope, clock, and pattern-state plumbing"
description = "Implement the phase 4 plumbing in the engine and processor. Add `kScopeSamples`, `Meters::hostClock`, `Meters::bpm`, and `Engine::copyScope(float*, int) const` backed by a lock-free mono scope ring that stores the latest output samples oldest-first with no allocation on the audio thread. Update the processor to expose `setPattern` and `pattern`, save and restore all 16 pattern steps in plugin state alongside parameters, keep old states without pattern data on the default pattern, preserve edited or restored patterns through `prepare` and `reset`, and add `plugin/ui/*.cpp` to the plugin target with the requested CMake glob. Assumption: the state format extends the existing XML state tree with a child or properties for the 16-step pattern while remaining backward-compatible with states that omit it."
role = "implementer"
status = "ready"
tier = "integrative"
max_loc = 150
files = [
    "core/include/undertow/engine.h",
    "core/src/engine.cpp",
    "plugin/PluginProcessor.h",
    "plugin/PluginProcessor.cpp",
    "plugin/CMakeLists.txt",
]
depends_on = []
depends_on_plan = []
timeout_secs = 0
max_retries = 3
acceptance = [
    "AC1: `tools/spec.sh 4 scope` passes, proving `copyScope` returns the latest mono output samples in order, clamps to `kScopeSamples`, allocates nowhere on the audio path, and `meters()` reports the clock source and tempo in use.",
    "AC2: `tools/spec.sh 4 state` passes, proving processor pattern handoff, pattern save and restore, and pattern persistence through engine `prepare` and `reset`.",
    "AC3: SC1: P4.01 | `tools/spec.sh 4 scope` | copyScope returns the latest mono output samples in order across odd blocks, clamps to kScopeSamples, never allocates; meters() names the clock in use and its tempo",
    "AC4: SC2: P4.02 | `tools/spec.sh 4 state` | The processor passes patterns to the engine, the 16 steps are saved with the plugin's state and restored, and the engine keeps its pattern through prepare and reset (a host restores the state before prepareToPlay)",
]
sequence = 0
goal = "The engine exposes lock-free scope samples and clock fields, and the processor persists patterns without losing them across prepare or reset."
non_goals = [
    "Do not edit tests, docs, third_party, or tools.",
    "Do not change parameter definitions beyond what state save and restore needs.",
]

[task.context]
symbols = [
    "Engine::copyScope — new lock-free scope reader",
