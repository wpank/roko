description = """
All edits are in crates/roko-cli/src/commands/learn.rs.

1. In `LearnCmd::Reflexes` (lines 86-91), add a field `limit: Option<u32>`. Give it a doc comment and the attribute `#[arg(long, value_parser = clap::value_parser!(u32).range(1..))]`, following the `Episodes --limit` field at lines 64-66. Clap then rejects `--limit 0`. Change the variant's doc comment on line 86 so it no longer says "top five". Say instead that the default is five and that `--limit` changes it.

2. In `dispatch_learn`, the lock-path match near line 363 becomes `LearnCmd::Reflexes { workdir, .. }`. In the arm at line 473, bind `limit` and compute `let limit = limit.map(|n| n as usize).unwrap_or(REFLEX_DISPLAY_LIMIT);`. The non-JSON branch calls `cmd_learn_reflexes(&wd, limit)`. The JSON branch still calls `cmd_learn_json(&wd, "reflexes")` unchanged.

3. Add a `limit: usize` parameter to `cmd_learn_reflexes`, `print_learn_reflexes`, `recent_reflex_demotions` and `format_reflexes_human` (lines 2604-2689). Use `.take(limit)` where these functions now use `.take(REFLEX_DISPLAY_LIMIT)`. `format_reflexes_human` also applies `.take(limit)` to the demotions it prints.

4. Keep the existing callers on the default: `cmd_learn` "all" (line 1437) calls `print_learn_reflexes(workdir, REFLEX_DISPLAY_LIMIT)`, and `collect_reflexes_json` (line 1934) calls `recent_reflex_demotions(workdir, REFLEX_DISPLAY_LIMIT)`. Keep `REFLEX_DISPLAY_LIMIT = 5`.

5. Add unit tests to the existing `mod tests` (line 3532). Each test name starts with `learn_reflexes_limit`:
   - `learn_reflexes_limit_parses`: `roko learn reflexes --limit 3` parses to `limit: Some(3)`, and with no flag it parses to `limit: None`.
   - `learn_reflexes_limit_zero_rejected`: `Cli::try_parse_from` with `--limit 0` returns Err, and the error text contains `--limit`.
   - `learn_reflexes_limit_truncates_demotions`: in a tempdir, write 8 `reflex_demoted` events to `.roko/learn/efficiency.jsonl`. Check that `recent_reflex_demotions(dir, 2)` returns 2 events and that `recent_reflex_demotions(dir, REFLEX_DISPLAY_LIMIT)` returns 5.
"""
