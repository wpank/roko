    "AC1: `work.py close gap-cccccc --evidence x --spend-usd 1.25` exits 0. The item file has `spend_usd = 1.25` (unquoted), and `work.py show gap-cccccc --json` gives closed.spend_usd == 1.25 as a number. `--spend-usd 0` is accepted and stores 0.",
