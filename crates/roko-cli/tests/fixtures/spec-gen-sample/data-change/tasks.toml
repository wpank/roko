description = """
All edits are in tools/work.py.

1. Close subparser (lines 2039-2045): add `p.add_argument("--spend-usd", type=<parser>, help="what the work cost in USD")`. The parser function turns the text into a float. It raises `argparse.ArgumentTypeError` if the text does not parse, is not finite (nan or inf) or is below 0. argparse then exits 2 before anything changes. The default is None.
2. close_item (line 1495): add a keyword `spend_usd=None` and put `"spend_usd": spend_usd` into its `closed` dict. rewrite_item (line 1487) already drops None values, so an item closed without the option gets no key. cmd_close (line 1536) passes `spend_usd=a.spend_usd`.
3. closed_value (line 1449): write an int or float that is not a bool as a bare TOML number (`repr(v)`), not as a quoted string. The `at` case and the bool case stay as they are.
4. check_closed (line 1064): if `spend_usd` is present, add the error `[closed].spend_usd must be a number at least 0` when the value is a bool, is not an int or float, is not finite, or is below 0.
5. cmd_show --json already returns the whole `closed` dict, so spend_usd appears there with no change.
"""
