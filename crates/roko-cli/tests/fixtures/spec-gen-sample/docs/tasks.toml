description = """Add a new top-level section headed exactly '## 12. Plan Authoring and Spec Quality' to docs/v3/21-CONFIG.md, placed after section 11 (Deprecated and Transitional Sections, which ends with the '---' rule at line 588) and before the current '## 12. Minimal Config'. Renumber the headings after it: '## 12. Minimal Config' becomes '## 13. Minimal Config', '## 13. Verification' becomes '## 14. Verification', '## 14. References' becomes '## 15. References'. End the new section with a '---' rule like the other sections. Inside it add two subsections whose headings are exactly: ### then a space then the section name in backticks, i.e. the heading text is [authoring] in backticks and [spec_quality] in backticks. Each subsection has: (1) one or two sentences on what the section controls, from the struct doc comment; (2) a markdown table with header row '| Key | Type | Default | Effect |' and one row per struct field, with the key in backticks in the first cell (for example a row starting '| `planner_model` |'); (3) a short fenced code block tagged toml that starts with the section header line ([authoring] or [spec_quality]). FACTS for [authoring] (AuthoringConfig, crates/roko-core/src/config/authoring.rs): one key planner_model, type string, default written as "" (empty, meaning unset); the model that generates and revises plans, as a key from [models]; when empty, planning falls back to the strategist role's model, then [agent] model; surrounding whitespace is trimmed and a blank value counts as unset; a --model flag overrides it. Unknown keys in the section are rejected. FACTS for [spec_quality] (SpecQualityConfig, crates/roko-core/src/config/spec_quality.rs): what the spec-quality gate does with a plan before plan run dispatches its tasks; in every mode but off a hard fail (HF2 verify that can never fail, HF3 verify that already passes on base) refuses the plan; no per-run override. Keys: mode, string enum off|advise|enforce, default "advise" (off: no scoring; advise: hard fails refuse, scores only reported; enforce: also stops tasks scoring below block_threshold); allow_threshold, float 0-100, default 70.0, score at or above which a task goes to its agent as written; block_threshold, float 0-100, default 40.0, score below which enforce stops a task, must not exceed allow_threshold; red_on_base, bool, default true, run each implementer task's verify steps on the unchanged base first to score SQ06 and find HF3, cargo steps skipped unless red_on_base_cargo; red_on_base_cargo, bool, default false, also run cargo steps in that check; red_on_base_timeout_secs, integer seconds, default 120, longest one verify step may run in that check; holdout_frac, float 0-1, default 0.05, share of score-based gate decisions skipped at random to measure the gate's effect, hard fails never held out. roko config validate and the loader reject thresholds outside 0-100, block_threshold above allow_threshold, and holdout_frac outside 0-1; unknown keys are rejected."""
