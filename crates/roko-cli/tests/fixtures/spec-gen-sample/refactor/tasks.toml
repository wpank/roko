[[task]]
id = "T1"
title = "Replace the three identical truncate_chars helpers with one shared roko-cli function"
description = """
Three private copies of `fn truncate_chars(value: &str, max_chars: usize) -> String` behave the same way. Each keeps the first `max_chars` chars, counted with `chars()` rather than bytes, and appends `...` when `value.chars().count() > max_chars`. The copies are at crates/roko-cli/src/runner/inline_output.rs:325-331, crates/roko-cli/src/runner/output_sink.rs:1622-1628 and crates/roko-cli/src/commands/think.rs:253-259.

Steps:
1. Create crates/roko-cli/src/text_util.rs with a module doc comment and one function, `pub fn truncate_chars(value: &str, max_chars: usize) -> String`. Copy the body exactly from inline_output.rs:325-331. Add a doc comment that states the `...` suffix rule.
2. Declare `pub mod text_util;` in crates/roko-cli/src/lib.rs. Put it in the alphabetical `pub mod` list, between `pub mod task_parser;` (line 233) and `pub mod transcript;` (line 234).
3. In inline_output.rs, delete the private copy and add `use crate::text_util::truncate_chars;` next to the other `use crate::...` lines (lines 15-20). In output_sink.rs, delete the private copy and add the same `use` line next to `use crate::inline::DiffEntry;` (line 28). Leave every call site unchanged.
4. think.rs is compiled into the `roko` binary crate (main.rs line 38 has `mod commands;`), not into the library. Its `crate::` is the binary, so it reaches library items through `roko_cli::`. Delete its private copy and add `use roko_cli::text_util::truncate_chars;` below its `use` lines (lines 3-4). Leave its call sites unchanged.
5. Run `cargo check -p roko-cli --lib --bins`. It must pass with no unused-import warnings.
"""
