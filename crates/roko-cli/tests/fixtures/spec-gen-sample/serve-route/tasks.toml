[[task]]
acceptance = [
    "AC1: GET /api/learn/econ/prices on an empty workspace with the default config returns HTTP 200 and JSON with a string `price_snapshot_id` starting `prices-`, a non-empty string `fetched_at` and a non-empty `rows` array.",
    "AC2: GET /api/learn/econ/prices when `[pricing] snapshot` names a snapshot that does not exist returns HTTP 500 with a JSON body.",
    "AC3: openapi.rs documents `/learn/econ/prices` under the `learning` tag with `doc_get!`, and `cargo test -p roko-serve econ_prices_route` passes.",
]
