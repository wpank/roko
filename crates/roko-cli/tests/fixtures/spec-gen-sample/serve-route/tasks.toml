description = """
Add a read-only handler `econ_prices` to the learning router in crates/roko-serve/src/routes/learning/mod.rs. Register it as `.route("/learn/econ/prices", get(econ_prices))` next to `.route("/learn/reflexes", get(reflexes))` (line 57). The router is nested under /api, so the path is /api/learn/econ/prices.

Handler signature: `async fn econ_prices(State(state): State<Arc<AppState>>) -> Result<Json<Value>, ApiError>`. Call `state.load_roko_config()`, then clone `config.pricing` and `state.workdir`. Inside `tokio::task::spawn_blocking`, call `roko_core::pricing_snapshot::PriceSnapshot::for_workspace(&pricing, &workdir)`. If that returns Err, return `ApiError::internal(format!("load the price snapshot: {err}"))`, which answers 500 with a JSON body. Handle a JoinError the same way the `reflexes` handler does (line 220). If it returns Ok, build the same JSON as `prices_json` in crates/roko-cli/src/commands/learn_self_model.rs (lines 715-721): `json!({"price_snapshot_id": snapshot.id(), "fetched_at": snapshot.fetched_at(), "rows": snapshot.rows()})`. roko-serve cannot depend on roko-cli, so build the JSON inline. Add a doc comment saying that `GET /api/learn/econ/prices` mirrors `roko learn econ prices --json`.

OpenAPI: in crates/roko-serve/src/openapi.rs, add `econ_prices` to the paths list next to `reflexes` (line 430). Add `doc_get!(econ_prices, "/learn/econ/prices", "learning");` next to `doc_get!(reflexes, "/learn/reflexes", "learning");` (line 1764).

Add two tests to the existing `#[cfg(test)] mod tests` in learning/mod.rs. Follow the pattern of `cascade_alias_is_served_under_api_grouping` (lines 995-1044): build the state with `test_state()`, the router with `build_router` and auth disabled, then send a request with `oneshot`.
1. `econ_prices_route_returns_snapshot`: with the default config and an empty tempdir workspace, GET /api/learn/econ/prices returns 200. In the body, `price_snapshot_id` is a string starting with `prices-`, `fetched_at` is a non-empty string, and `rows` is a non-empty array (the built-in snapshot).
2. `econ_prices_route_returns_500_for_unknown_snapshot`: build an AppState the way `test_state` does, but with `RokoConfig` whose `pricing.snapshot = "prices-1900-01-01"`. The tempdir has no such file. The GET returns 500 and the body parses as JSON.
"""
