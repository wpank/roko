[package]
name = "roko-gate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Concrete Gate implementations for Roko: compile, test, lint, symbol, and shell-based verification."

[lints]
workspace = true

[features]
## Chaos engineering / fault injection framework for evaluation testing.
## Activate with `--features chaos` and set `ROKO_CHAOS_MODE=1` at runtime.
chaos = []

[dependencies]
roko-core = { path = "../roko-core" }
roko-agent = { path = "../roko-agent" }
async-trait = "0.1"
tokio = { workspace = true, features = ["process", "time", "rt", "rt-multi-thread", "macros", "sync"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
tempfile = { workspace = true }
roko-std = { path = "../roko-std" }
proptest = "1"

[package.metadata.roko]
layer = 3
