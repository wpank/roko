[package]
name = "roko-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Centralized inference pipeline, controls, caching, routing, and accounting for Roko."

[lints]
workspace = true

[dependencies]
roko-core = { path = "../roko-core" }
roko-agent = { path = "../roko-agent" }
roko-learn = { path = "../roko-learn" }
async-trait = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
roko-graph = { path = "../roko-graph" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.roko]
layer = 3
