# Diamond DAG: A -> {B, C} -> D
# Equivalent authored graph for the diamond_success plan fixture.

[graph]
name = "diamond-success"
description = "Diamond DAG: A -> {B, C} -> D. All tasks succeed."
version = "1.0.0"

[graph.policy]
mode = "one_shot"
failure_strategy = "fail_fast"
max_concurrent_nodes = 2

[graph.labels]
source = "fixture"
fixture_id = "diamond_success"
plan_id = "diamond-success"

[[nodes]]
id = "A"
cell_type = "task-executor"
execution_class = "activity"
[nodes.config]
plan_id = "diamond-success"
plan_dir = "fixtures/engine_convergence/diamond_success"
title = "Root task"
role = "implementer"
tier = "mechanical"
timeout_secs = 300
max_retries = 2
sequence = 0
files = ["src/root.rs"]

