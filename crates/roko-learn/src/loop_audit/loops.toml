# The loop registry (S03 §4.2): one contract per learning loop, read by
# `roko_learn::loop_audit::spec::Registry`. A workspace overrides entries by
# `id` in `.roko/learn/loop-registry.toml`.
#
# Each static finding is a code-review fact the census prints as `declared`
# evidence, with a `path::symbol` pointer and the commit it was checked at.
# `verified_at` rots by design: the census marks a finding `declared_stale`
# when it differs from the harness sha. A finding's `reason` or `qualifier`
# is the code it is evidence for; findings without one are context.
#
# Facts that only logs show (LinUCB's observation count, the bidders'
# posteriors, the holdout's pass rates) belong to the census, not here.
# Nothing enforces yet: enforcement waits for C2, C4 and 14 days (D10).

schema = "roko.loop_registry/1"

