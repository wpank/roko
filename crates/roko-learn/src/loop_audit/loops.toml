# ── The meta-loops (S03 §4.8) ─────────────────────────────────────────────

[[loop]]
id = "L-M1"
name = "M1 ultrastable controller"
decision_point = "S06 controller: the harness policy θ in force at dispatch"
layer = "harness_policy"
opportunity = "every dispatch while θ differs from θ₀ or a disturbance episode is open"
default_policy = "θ₀, the static config"
receipt = "params_digest"
outcome = "IAE and drive against the holdout under the same disturbance, plus U"
fixed_holdout = 0.10
notes = [
    "S06 writes one harness_policy decision row per attempt (8123); the census measures ε from them: the params digest the attempt ran against the controller's θ, honest when the verdict's harness stamp agrees (5135). In shadow mode the learned arm runs θ₀, so ε stays 0.",
    "Its holdout is S06's fixed static arm, never 0 while M1 is on; a demotion forces S06 into shadow mode.",
]

[[loop]]
id = "L-M3"
name = "M3 self-model allocation"
decision_point = "S04 self-model: model, effort and verify depth per dispatch"
layer = "route"
opportunity = "every dispatch whose allocation is not pinned"
default_policy = "the static allocation: config default model, effort and verify depth"
receipt = "prediction_consumed"
notes = [
    "S04's active self-model writes route rows under this loop id in its epochs (6130); the census measures ε from them, its receipt the attempt's prediction row (5135).",
    "Shares the route layer with L-route, rotating by epoch; predictions are computed on both arms, so the CUPED covariate exists on each.",
]

[[loop]]
id = "L-M4"
name = "M4 audit feedback"
decision_point = "S05 audit feedback: router penalty, rung trust and item contradiction"
layer = "audit_feedback"
opportunity = "a passed chain whose audit result would trigger feedback"
default_policy = "audits run and are measured, but give no feedback"
receipt = "audit_penalty_applied"
outcome = "the true false-green rate on hidden tests, plus U"
notes = [
    "S05's feedback shows in later route rows: DP4's audit trust leaves a candidate out with ineligible_reason audit_trust (7131); the census measures ε from those rows, the reason its receipt (5135).",
    "M4's feedback is auditable (S03 §9.6). The M4 sensor, the audits themselves, is exempt (`m4_sensor` in [learning.audit] exempt): never demoted, checked by planted known-bad passes, and outcome_sensor_degraded freezes β-based transitions when its catch rate falls.",
]

