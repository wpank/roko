[package]
name = "roko-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared async runtime primitives for Bardo: typed event bus, process supervision, and cancellation."

[lints]
workspace = true

[features]
# The cognitive clock: the heartbeat policy and scheduler, CorticalState, the
# theta and delta consumers, the attention auction and the heartbeat probes.
# Nothing on the plan path drives them, so they are parked out of the
# default build (9201, 9221, 9222).
cognitive-clock = []

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "process", "macros", "rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
roko-primitives = { path = "../roko-primitives" }
roko-core = { path = "../roko-core" }
sha2 = { workspace = true }
blake3 = { workspace = true }
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = { workspace = true }
roko-compose = { path = "../roko-compose" }
roko-learn = { path = "../roko-learn" }
roko-gate = { path = "../roko-gate" }
axum = { workspace = true }
http-body-util = { workspace = true }

[package.metadata.roko]
layer = 1
