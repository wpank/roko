[package]
name = "roko-serve"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Roko <engineering@roko.dev>"]
description = "HTTP server crate for the roko API."

[lints]
workspace = true

[features]
default = ["chain", "hdc"]
# Backend-independent local chain registries, tools, and observation state.
# Forwards to roko-std so the 17 chain tool handlers compile in.
# This intentionally does not pull in an RPC provider. Without it roko-chain
# is not compiled, and the chain-family routes answer a typed 501.
chain = [
    "dep:roko-chain",
    "dep:alloy-dyn-abi",
    "dep:alloy-json-abi",
    "dep:alloy-primitives",
    "roko-std/chain",
]
# Enables on-chain integration via alloy. Requires Rust 1.91+. Not needed for local-only operation.
# Real EVM JSON-RPC reads/writes. Keep this out of ordinary self-development
# builds: Alloy's provider/full graph dominates a cold CLI compile.
alloy-backend = ["chain", "dep:alloy", "roko-chain/alloy-backend"]
hdc = ["dep:roko-primitives", "roko-compose/hdc", "roko-fs/hdc"]
# Enables OpenTelemetry Protocol (OTLP) trace/metric export. Configure OTEL_EXPORTER_OTLP_ENDPOINT to use.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
roko-core = { path = "../roko-core" }
roko-agent = { path = "../roko-agent" }
roko-agent-server = { path = "../roko-agent-server" }
roko-chain = { path = "../roko-chain", optional = true }
roko-learn = { path = "../roko-learn" }
roko-neuro = { path = "../roko-neuro", features = ["hdc"] }
roko-dreams = { path = "../roko-dreams" }
roko-gate = { path = "../roko-gate" }
roko-gateway = { path = "../roko-gateway" }
roko-fs = { path = "../roko-fs" }
roko-mcp-stdio = { path = "../roko-mcp-stdio" }
roko-compose = { path = "../roko-compose" }
roko-std = { path = "../roko-std" }
roko-plugin = { path = "../roko-plugin" }
roko-daimon = { path = "../roko-daimon" }
roko-runtime = { path = "../roko-runtime" }
roko-execution = { path = "../roko-execution" }
roko-primitives = { path = "../roko-primitives", optional = true }

alloy = { version = "1", features = ["full"], optional = true }
alloy-dyn-abi = { version = "1", optional = true }
alloy-json-abi = { version = "1", optional = true }
alloy-primitives = { workspace = true, optional = true }
anyhow = { workspace = true }
arc-swap = "1"
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
cron = "0.12"
futures = { workspace = true }
governor = { version = "0.10", default-features = false, features = ["std"] }
hmac = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
indexmap = { workspace = true }
regex = { workspace = true }
rustls = "0.23"
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
octocrab = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tokio-rustls = "0.26"
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }
tracing = { workspace = true }
tracing-appender = "0.2"
utoipa = { version = "5", features = ["macros"] }
uuid = { workspace = true }
parking_lot = { workspace = true }
gethostname = "0.5"
validator = { version = "0.20", features = ["derive"] }
portable-pty = "0.9"
dirs = "6"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"

# Optional OTLP tracing export (gated behind the `otlp` feature).
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
http-body-util = { workspace = true }
rcgen = "0.13"
roko-core = { path = "../roko-core" }
roko-graph = { path = "../roko-graph" }
roko-runtime = { path = "../roko-runtime" }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.roko]
layer = 4
