[package]
name = "roko-std"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Standard trait implementations for Roko: in-memory substrate, NoOp defaults, composable scorers."

[lints]
workspace = true

[features]
default = []
# Enables the 17 chain-domain tool catalog entries and their feature-gated handlers.
# Without this feature, chain.* tools are absent from the tool catalog and
# handler_for returns None for all chain.* names, so no model is ever
# advertised a chain tool without an executable handler.
# The dependency itself is optional so the default standard-tool build does
# not compile the deferred chain subsystem.
chain = ["dep:roko-chain"]

[dependencies]
roko-core = { path = "../roko-core" }
roko-chain = { path = "../roko-chain", optional = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = "0.12"
tracing = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "process", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "test-util"] }
tempfile = { workspace = true }
proptest = { workspace = true }

[package.metadata.roko]
layer = 2
