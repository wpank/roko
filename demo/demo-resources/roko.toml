# Demo-specific overrides. Global config (~/.roko/config.toml) provides
# agent, prompt, and provider settings; this file only overrides what
# the demo needs.

[prd]
auto_plan = false

[agent]
command = "echo"
args = ["demo-stub"]
timeout_ms = 30000

[[gates.rungs]]
name = "demo-gate"
command = "true"
timeout_secs = 10
required = true

[runner]
max_concurrent_plans = 1
max_concurrent_tasks = 2

[gates]
max_iterations = 1

[timeouts]
task_attempt_secs = 60

[learning]
replan_on_gate_failure = false
