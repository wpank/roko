# cargo-deny configuration for the roko workspace.
# Run: cargo deny check
# Install: cargo install cargo-deny

[graph]
# Only check workspace crates and their direct/transitive deps.
all-features = true

# --- Advisories --------------------------------------------------------------

[advisories]
# Use the RustSec advisory database.
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Allow specific advisories that we've reviewed and accepted. Each reason names
# the path that pulls the crate in; re-review an entry when that path changes.
ignore = [
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 comes from ratatui 0.29 (layout cache) and apps/mirage-rs. The unsound API is LruCache::iter_mut(), which neither calls. ratatui 0.29 pins lru 0.12, so the fix needs a ratatui upgrade." },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5 via ratatui 0.29 and apps/mirage-rs. The use-after-free needs a cache key whose Drop panics inside pop() and is caught by catch_unwind. Every key here is plain data with no such Drop: (Rect, Layout) in ratatui; B256, Address, (Address, U256) and u64 in mirage-rs." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no known vulnerability and no patched release. It is a compile-time proc macro, reached through alloy-primitives, ark-ff, ratatui, syn-solidity and tokenizers." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained, with no known vulnerability and no patched release. It is compile-time proc-macro support, reached only through alloy-sol-macro." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, with no known vulnerability and no patched release (reviewed 2026-10-19, bug-9dd205). It comes only through serde_yaml_ng 0.10 in roko-cli, which parses local YAML: agent contracts (chat_session.rs) and plan front matter (orchestrator/plan_discovery.rs)." },
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing attack on RSA private-key operations; no patched rsa release. rsa 0.9 comes only from jsonwebtoken 10 inside octocrab, which signs with RSA only for GitHub App auth. roko builds octocrab clients with personal_token() only (roko-cli commands/server.rs, roko-serve feedback.rs), so no RSA private-key operation runs." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability; the fix is 0.7.6, which elliptic-curve 0.13's ^0.5 precludes (reviewed 2026-11-19, bug-996dc9). It comes through elliptic-curve 0.13 from jsonwebtoken's p256/p384, which roko-serve uses only to verify ES256 tokens against a JWKS (public keys and signatures; it signs only in tests), from k256 and revm in apps/mirage-rs, a local EVM stand-in signing with dev keys, and from alloy-signer, which only the parked alloy-backend feature builds. Only an alloy-backend build signing with a real key does secret arithmetic with it; revisit when alloy and jsonwebtoken move to elliptic-curve 0.14." },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained, with no known vulnerability and no patched release (reviewed 2026-11-19, bug-996dc9). It comes only through wasmtimer in alloy-provider, alloy-pubsub, alloy-rpc-client and alloy-transport, which only the parked alloy-backend feature builds." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no known vulnerability and no patched release (reviewed 2026-11-19, bug-996dc9). It is the workspace's date-time type, in 18 workspace crates' records, schedules and serde timestamps; replacing it is a migration of its own." },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, with no known vulnerability and no patched release (reviewed 2026-11-19, bug-996dc9). It comes only through roko-serve's trigger runtime, which reads a cron trigger's time zone (trigger_runtime.rs), and follows chrono." },
]

# --- Licenses ----------------------------------------------------------------

[licenses]
# Confidence threshold for license detection.
confidence-threshold = 0.8
# Allow common permissive OSS licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
]
# Copyleft licenses are denied by omission from the allow list.
# Allow dual-licensed crates where at least one license is acceptable.
# This handles the common "MIT OR Apache-2.0" pattern.

# Some crates have non-standard license expressions. Clarify them here.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# --- Bans --------------------------------------------------------------------

[bans]
# Warn on multiple versions of the same crate.
multiple-versions = "warn"
# Allow specific duplicate crates that are hard to consolidate.
# Add entries here as needed:
# allow = []
# Deny specific crates known to be problematic.
deny = []
# Allow wildcard dependencies in dev/build (not in normal deps).
wildcards = "allow"

# --- Sources -----------------------------------------------------------------

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
# Allow git sources (some deps may use git refs).
unknown-git = "warn"
# Explicitly allow crates.io.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
