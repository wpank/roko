# The showcase image's configuration (S11 §4.7), copied to /workspace/roko.toml by the
# showcase-replay stage. It holds no secret: the passphrase hash and the admin key come from
# Fly secrets (ROKO_SHOWCASE_PASSPHRASE_HASH, ROKO__SERVE__AUTH__API_KEY), and the entrypoint
# turns ROKO_SHOWCASE_PUBLIC_ORIGIN into the public origin.

schema_version = 2

[server]
bind = "0.0.0.0"
port = 6677

[serve]
terminal_enabled = false
# G1: only the probes are public; webhooks, triggers, shares and /metrics are not mounted.
public_routes = ["health", "ready"]

[serve.auth]
enabled = true
enforcement_mode = "enforce"
# G0a: a workspace id no Privy token carries. (G0b's `privy_enabled = false` lands with its task.)
privy_workspace_id = "roko-showcase-privy-disabled-2e0c24bbd6947906d0c5ae1ec054763a"

[showcase]
enabled = true
public_origin = "https://roko-showcase.fly.dev"
# F1 is replay only.
live_enabled = false
bundle_root = "/data/.roko/showcase/bundles"
# "/" redirects to "/demo/"; the portal is not served.
portal_mounted = false
# D22: 72 h absolute, 12 h idle; 5 failures in 15 min block an address.
session = { cookie_name = "__Host-roko_session", cookie_secure = true, ttl_secs = 259200, idle_ttl_secs = 43200, max_sessions = 200 }
login = { per_ip_max_failures = 5, per_ip_window_secs = 900, per_ip_block_secs = 900, block_backoff_max_secs = 86400, global_max_failures = 50, global_window_secs = 3600, global_block_secs = 1800, verify_concurrency = 2, trust_fly_client_ip = true }
# total_usd is open question D41 (S09 BL9 caps demo spend at $20).
caps = { daily_usd = 5.0, total_usd = 50.0, per_run_usd = 1.0, max_concurrent_runs = 1, max_tasks_per_run = 10, max_run_wall_secs = 1800, runs_per_session_per_day = 4 }
# D37: exit after 20 idle minutes.
idle = { exit_after_secs = 1200, sse_max_idle_secs = 1800, hold_file = "/data/.roko/showcase/hold" }

[showcase.models]
# The live allowlist, priced from the prices-2026-09-28 snapshot (S08 §5.6).
price_snapshot_id = "prices-2026-09-28"
allow = [
  { id = "cerebras/gpt-oss-120b", input_per_m = 0.35, output_per_m = 0.75 },
  { id = "zai/glm-4.7", input_per_m = 0.60, cached_per_m = 0.11, output_per_m = 2.20 },
  { id = "moonshot/kimi-k2.6", input_per_m = 0.95, cached_per_m = 0.16, output_per_m = 4.00 },
  { id = "openai/gpt-5.4-mini", input_per_m = 0.75, cached_per_m = 0.075, output_per_m = 4.50 },
]

[runner]
max_concurrent_tasks = 1
# Agent tools get no inherited environment and no network. Gate spawns are not covered (G5, T9).
sandbox_level = "isolate"
