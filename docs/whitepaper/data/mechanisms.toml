# ── IS · Isolation and integration ──────────────────────────────────────────────

[[row]]
id = "IS1"
group = "IS"
name = "Worktrees"
tag = "WIRED"
verdict = "keep"
note = """
Since `39feebc07` (gap-4ec59f) roko plan run and roko serve run each task in its own git worktree by default, with
stale locks and worktree metadata repaired at startup, and a passed attempt is committed onto its plan's branch (IS2).
Every attempt of the 2026-10-02 live run ran in its own worktree; roko run, do and prd, and a workdir that is not a
git checkout, still use the shared tree.
"""
anchors = ["crates/roko-cli/src/graph_execution/plan_runner.rs::worktree_per_task", "crates/roko-cli/src/orchestrator/worktree/mod.rs::WorktreeManager"]
evidence = ["39feebc07", "4787ee6ed", "9c0b9aed0", "gap-4ec59f"]

[[row]]
id = "IS2"
group = "IS"
name = "Merge queue, plan merger and attempt acceptance"
tag = "WIRED"
verdict = "keep"
note = """
Since `4787ee6ed` and `9c0b9aed0`, under per-task worktrees a passed attempt is committed and folded onto its plan's
branch, and each plan whose tasks all passed is merged by git plumbing into a batch branch, one plan at a time, then
checked (IS3) before an optional promotion; both plans of the 2026-10-02 live run were delivered this way. Runner-v2's
merge queue stays unused, and with worktrees off there is nothing to merge.
"""
anchors = ["crates/roko-cli/src/orchestrator/worktree/mod.rs::accept_attempt", "crates/roko-cli/src/graph_execution/batch.rs::BatchIntegration", "crates/roko-cli/src/graph_execution/delivery.rs::CliCompletionDeliveryService"]
evidence = ["4787ee6ed", "9c0b9aed0", "gap-3b5361", "spec-f830c4", "crates/roko-cli/tests/plan_branch_integration.rs::c3_each_passed_task_commits_once_on_the_plan_branch"]

[[row]]
id = "IS3"
group = "IS"
name = "Whole-plan verify on the integrated result"
tag = "WIRED"
verdict = "keep"
note = """
Since `207f91da2`, a plan whose tasks all passed succeeds only once its whole-plan check passes: its authored
plan-level verify steps, or by default in a Cargo workspace fmt, clippy and the tests of the crates it touched. Under
per-task worktrees it runs on the plan's merge into the batch branch, and a failure takes the merge back out. Other
projects get no default.
"""
anchors = ["crates/roko-cli/src/graph_execution/plan_verify.rs::plan_verify_steps", "crates/roko-cli/src/graph_execution/plan_verify.rs::default_plan_verify"]
evidence = ["207f91da2", "gap-60233f", "gap-af00b1", "crates/roko-cli/tests/plan_branch_integration.rs::c4_meta_verify_catches_tasks_that_break_together"]

[[row]]
id = "IS4"
group = "IS"
name = "Git guard hook"
tag = "WIRED"
verdict = "keep"
note = """
Since `0728a2817`, the Claude CLI hook checks every command in a chain, past wrappers, subshells, command strings and
git aliases. It blocks git checkout, switch, restore and push, hard resets, stash and clean, recursive deletes
(through find, xargs, fd, parallel and busybox too since `9b1d46be4` and `8e7949271`) and reads of key files, and it
blocks when python3 is missing. It is best effort: a script file or a variable can still hide a command, and other
provider CLIs have no hook.
"""
anchors = ["crates/roko-agent/src/claude_cli_agent.rs::build_settings_json", "crates/roko-agent/src/claude_cli_guard.py"]
evidence = ["0728a2817", "abc655b5e", "9b1d46be4", "8e7949271", "bug-7de5df", "bug-0bc728", "bug-ceab60", "crates/roko-cli/tests/secrets_and_git_guard_canary.rs::secrets_and_git_guard_canary"]

[[row]]
id = "IS5"
group = "IS"
name = "Environment isolation"
tag = "PARTIAL"
verdict = "fix"
note = """
Gates, roko's own tool shells, MCP servers and probes start without roko's provider keys, one scrubber redacts secrets
from logs and records (`ca834b178`, `04b3793a6`), and roko's tools and the Claude CLI refuse the key files
(`9b1d46be4`, `421346ab2`), which canary C2 checks through a real plan run. But provider CLIs and MCP servers get only
a denylist, so a secret exported under a name roko doesn't know still reaches them; Codex, Cursor and Gemini can read
key files with their own tools, and no OS sandbox exists (IS6).
"""
anchors = ["crates/roko-core/src/child_env.rs::gate_env", "crates/roko-core/src/child_env.rs::CredentialScrub", "crates/roko-core/src/child_env.rs::is_key_file", "crates/roko-gate/src/gate_env.rs"]
evidence = ["dc99a9e81", "ca834b178", "9b1d46be4", "421346ab2", "546d90ae1", "04b3793a6", "bug-0d9ac4", "bug-0eb8e2", "bug-62e7e6", "bug-a9788a", "gap-b7a2d5", "gap-0e2c40", "crates/roko-cli/tests/secrets_and_git_guard_canary.rs::agent_tool_shells_exclude_provider_keys"]
item = "spec-ba7bea"

[[row]]
