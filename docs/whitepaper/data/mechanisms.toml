[[claim]]
id = "V1"
name = "Domain-agnostic orchestration"
tag = "PARTIAL"
rows = ["DM1", "DM2", "DM3", "DM4", "QA6"]
blocker = "Shell commands are the only verifier for work that is not code, and triggers cannot start agent work."

[[claim]]
id = "V2"
name = "A fast authoring loop with a frontier planner"
tag = "PARTIAL"
rows = ["AU1", "AU2", "AU3"]
blocker = "The frontier planner is opt-in, the spec-quality lint blocks nothing before dispatch, and there is no plan diff."

[[claim]]
id = "V3"
name = "Granular tasks executed by the cheapest capable models"
tag = "PARTIAL"
rows = ["AU1", "EX7", "RC2"]
blocker = "One live run on real cheap models exists: the cheap rung carried most tasks and a hard task climbed, but the mid rung returned blank answers, failover moved tasks down the ladder instead of up, and authored plans still pin models with `model_hint`."

[[claim]]
id = "V4"
name = "Parallel execution of the task graph"
tag = "WIRED"
rows = ["EX3", "EX4", "EX5"]
blocker = "An authored `max_parallel` still wins and many plans set it to one; a plan budget without `max_turn_usd` silently runs one task at a time, and several plans run at once only when configured (EX4)."

