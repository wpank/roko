[[row]]
id = "EX9"
group = "EX"
name = "Progress watchdog"
tag = "WIRED"
verdict = "keep"
note = """
Since `dd192cb82` a per-attempt stall watchdog warns after 180 seconds of silence and cancels and retries the attempt
after 300, counting silence only after the attempt has shown progress and while none of its tool calls runs. A
conductor tick every 5 seconds can also restart an attempt or stop the run (RG2).
"""
