# Status matrix data: one row per Roko mechanism, every tag taken at one pinned commit.
#
# tools/status_matrix.py checks each row against the pinned commit and renders
# docs/whitepaper/appendix-status-matrix.md from this file; `--check` fails when a row is bad or the appendix is
# out of date. Rows were seeded from the TL;DR's mechanism table (68 mechanisms in 9 groups, tagged at d9e79e9d8) and
# re-checked against the code at the pin. Two TL;DR rows are split because their parts carry different tags:
# QA7/QA8 (adaptive thresholds; gaming detector and holdout) and DM6/DM7 (plugin install; WASM hooks).
#
# Row fields:
#   id, group    row id = group id + number (the paper cites rows by id, such as EX3)
#   name         plain mechanism name
#   tag          status at the pin (see TAGS in tools/status_matrix.py)
#   verdict      keep | wire | fix | build | redesign | park | remove
#   note         what runs today, in one or two sentences
#   anchors      "path::symbol" or "path"; the path must exist at the pin and contain the symbol as a word
#   evidence     commits (ancestors of the pin), work items, or "path::test_name" anchors
#   item         the work item or spec that would change the tag (required for a row without anchors)
#
# To refresh: move `pinned`, re-check every row against the code at the new commit, then run
# python3 tools/status_matrix.py and python3 tools/status_matrix.py --check.

[matrix]
title = "Appendix: status matrix"
status = "draft"
budget = "none"
owner = "gap-35a614"
pinned = "a17d4dadd"
intro = """
The status of every mechanism in this paper at commit {pin} ({date}), each tag re-checked against the code at that
commit. The matrix is a dated snapshot: the work graph in work/items stays the live status, and the matrix is
refreshed at each review. Sections cite rows by id, such as EX3.
"""
claims_intro = """
The paper's ten vision claims, each tagged at the same commit and traced to the rows it rests on.
"""

[[group]]
id = "AU"
name = "Authoring and specs"
blurb = "Turning a request into a plan whose tasks a cheap model can execute and a machine can check."

[[group]]
id = "EX"
name = "Execution"
blurb = "Running a plan's tasks as a dependency graph, with retries, resume and supervision."

[[group]]
id = "IS"
name = "Isolation and integration"
blurb = "Keeping concurrent agents out of each other's way and out of the operator's secrets, then combining their results."

[[group]]
id = "QA"
name = "Verification and QA"
blurb = "Deciding whether a task is done, and whether that decision can be trusted."

[[group]]
id = "RC"
name = "Routing and cost"
blurb = "Choosing a model for each attempt and accounting for what it costs."

[[group]]
id = "LM"
name = "Learning and memory"
blurb = "Records of past attempts, and the loops that feed them back into prompts and routing."

[[group]]
id = "RG"
name = "Regulation and audits"
blurb = "The second-order loops that watch the first-order ones."

[[group]]
id = "SS"
name = "Safety, steering and surfaces"
blurb = "Who may do what, and how an operator watches and steers a run."

[[group]]
id = "DM"
name = "Domains and automation"
blurb = "Work beyond code, and work started by events rather than by a person."

