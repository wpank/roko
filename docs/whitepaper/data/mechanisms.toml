# ── EX · Execution ──────────────────────────────────────────────────────────────

[[row]]
id = "EX1"
group = "EX"
name = "Graph engine"
tag = "WIRED"
verdict = "keep"
note = """
Runs every plan as a dependency graph of cells. It is the only plan executor: it became the default in `bcd1c8624`,
and the Runner-v2 event loop was deleted in `6b5da8616`.
"""
anchors = ["crates/roko-graph/src/engine.rs::GraphEngine"]
evidence = ["bcd1c8624", "6b5da8616"]

[[row]]
id = "EX2"
group = "EX"
name = "Durable checkpoints and resume"
tag = "WIRED"
verdict = "keep"
note = """
Each plan's checkpoint is replayed on resume, and a fingerprint of the authored plan rejects a changed plan. Failed,
blocked and unstarted tasks are recorded and re-run on resume since `abc1f4b27`.
"""
anchors = ["crates/roko-cli/src/graph_checkpoint.rs::prepare_graph_checkpoint"]
evidence = ["abc1f4b27", "gap-7147bb"]

[[row]]
id = "EX3"
group = "EX"
name = "Parallel task scheduling"
tag = "WIRED"
verdict = "keep"
note = """
A ready queue starts each task once its own dependencies settle, a failed task skips only its dependants, and tasks
whose declared files overlap never run at the same time (`1697fea53`). Since `626e182a9` a plan that omits
`max_parallel` runs as wide as its graph when every task that writes declares its files, and a verify step and a
sibling's edit of what it reads wait for each other. An authored value still wins, and most tracked plans set 1.
"""
anchors = ["crates/roko-graph/src/engine.rs::execute_ready_queue", "crates/roko-graph/src/exclusion.rs::first_overlap", "crates/roko-cli/src/plan_policy.rs::plan_max_parallel"]
evidence = ["abc1f4b27", "1697fea53", "626e182a9", "gap-272448", "gap-1920ba", "crates/roko-cli/tests/scheduler_canary.rs::scheduler_canary", "gap-987064"]

[[row]]
id = "EX4"
group = "EX"
name = "Plan-set scheduler"
tag = "PARTIAL"
verdict = "keep"
note = """
Runs several plans at once, admitting only plans whose file footprints don't overlap, but only when
`max_parallel_plans` is raised above one: the default runs one plan at a time, and per-task worktrees, on by default
since `39feebc07`, force one. Only library tests run several plans together (`8df3a109b`); no canary or live run has,
and whether to raise the default is q-61b3f8.
"""
anchors = ["crates/roko-cli/src/graph_execution/plan_set.rs::PlanSetScheduler"]
evidence = ["725f21e05", "8df3a109b", "39feebc07", "gap-7c9e48", "q-61b3f8"]
item = "q-61b3f8"

[[row]]
id = "EX5"
group = "EX"
name = "Sibling settle"
tag = "WIRED"
verdict = "keep"
note = """
In a shared checkout, a verify step waits, within a bound, until no sibling task is mid-edit on what it reads, and a
sibling waits to edit while it runs (since `626e182a9`, gap-1920ba); a step that failed during a sibling's edit
re-runs once. It matters less once tasks run in their own worktrees.
"""
anchors = ["crates/roko-cli/src/graph_task_dispatch/sibling_settle.rs::InFlightTasks"]
evidence = ["3049b7fcf", "626e182a9", "gap-1920ba"]

[[row]]
id = "EX6"
group = "EX"
name = "Retry with gate feedback"
tag = "WIRED"
verdict = "keep"
note = """
A failed task is re-dispatched with its parsed gate output, up to `max_retries` (3 by default, at least 5 while the
routing ladder places the task). Since `ce3bdcbb8` the retry feedback survives a resume and the failing step names its
rung.
"""
anchors = ["crates/roko-cli/src/task_parser.rs::default_max_retries", "crates/roko-graph/src/cells/task_executor.rs::TaskExecutorCell"]
evidence = ["ce3bdcbb8", "41c7ffbd6"]

[[row]]
id = "EX7"
group = "EX"
name = "Escalation to a stronger model"
tag = "WIRED"
verdict = "keep"
note = """
Since `ce12e86d8`, two failures blamed on the agent move a ladder-routed task one rung up, at most twice and never
past its top rung; provider and harness failures don't count, and a pinned model never moves. The standing survives a
resume, and canary C8 drives it through roko plan run (gap-e21595); in the 2026-10-02 live run a task climbed after
two turn-capped attempts and kept its standing across two resumes.
"""
anchors = ["crates/roko-cli/src/graph_task_dispatch/ladder.rs::note_ladder_outcome", "crates/roko-core/src/config/routing.rs::LadderConfig"]
evidence = ["a13873ad2", "ce12e86d8", "gap-9cbf35", "gap-460230", "crates/roko-cli/src/graph_task_dispatch/ladder.rs::two_failed_attempts_escalate_one_rung", "gap-e21595"]

[[row]]
id = "EX8"
group = "EX"
name = "Split or replan on failure"
tag = "BUILT-UNWIRED"
verdict = "wire"
note = """
The replan controller has no caller, and the per-task split and replan fields are parsed and ignored. Gate-failure
replanning was deleted with Runner-v2.
"""
anchors = ["crates/roko-execution/src/replan_controller.rs::ReplanController"]
evidence = ["6b5da8616"]
