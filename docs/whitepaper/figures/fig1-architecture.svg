<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-label="Roko's layered architecture: surfaces, loops and services, the substrate, and workers, with a column of records">
  <desc>Four layers from top to bottom: operator surfaces; the loops and services, tagged with each loop's clock; the substrate of signals, cells and graphs, bus and store; and the workers reached through twelve provider adapters. Dashed boxes run outside Roko. A side column lists the records the loops write and read.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; font-size: 13px; }
    .h { font-size: 15px; font-weight: bold; }
    .t { font-size: 14px; font-weight: bold; }
    .tb { font-size: 15px; font-weight: bold; }
    .b { font-weight: bold; }
    .m { fill: #4b5563; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .ar { stroke: #475569; stroke-width: 1.5; fill: none; }
    .up { stroke-dasharray: 4 3; }
    .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
    .sub { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
  </style>
  <rect width="1100" height="840" fill="#ffffff"/>

  <!-- Surfaces -->
  <rect x="30" y="20" width="820" height="136" rx="10" class="band"/>
  <text x="44" y="44" class="h">Surfaces</text>
  <rect x="42" y="56" width="128" height="56" rx="6" class="box"/>
  <text x="106" y="79" class="t c">CLI</text>
  <text x="106" y="99" class="c">plan, run, inspect</text>
  <rect x="182" y="56" width="140" height="56" rx="6" class="box"/>
  <text x="252" y="79" class="t c">TUI dashboard</text>
  <text x="252" y="99" class="c">and chat REPL</text>
  <rect x="334" y="56" width="184" height="56" rx="6" class="box"/>
  <text x="426" y="79" class="t c">HTTP control plane</text>
  <text x="426" y="99" class="c">REST · SSE · WebSocket</text>
  <rect x="530" y="56" width="112" height="56" rx="6" class="box"/>
  <text x="586" y="79" class="t c">ACP</text>
  <text x="586" y="99" class="c">for editors</text>
  <rect x="654" y="56" width="184" height="56" rx="6" class="box"/>
  <text x="746" y="79" class="t c">MCP servers</text>
  <text x="746" y="99" class="c">code intelligence, GitHub</text>
  <rect x="182" y="120" width="336" height="24" rx="5" fill="#eef2f7" stroke="#94a3b8" stroke-width="1"/>
  <text x="350" y="137" class="c m">state hub: live events for the TUI and HTTP streams</text>

  <!-- between layers 1 -->
  <line x1="430" y1="160" x2="430" y2="192" class="ar" marker-end="url(#a)"/>
  <line x1="454" y1="192" x2="454" y2="160" class="ar up" marker-end="url(#a)"/>
  <text x="420" y="181" class="e m">commands</text>
  <text x="466" y="181" class="m">events</text>

  <!-- Loops and services -->
  <rect x="30" y="196" width="820" height="228" rx="10" class="band"/>
  <text x="44" y="220" class="h">Loops and services</text>

  <rect x="42" y="232" width="257" height="92" rx="7" fill="#e5f4ef" stroke="#4fa585" stroke-width="1.2"/>
  <rect x="223" y="240" width="64" height="22" rx="5" fill="#ffffff" stroke="#4fa585"/>
  <text x="255" y="256" class="c" style="fill:#2d7f63">hours</text>
  <text x="56" y="256" class="tb">Plan loop</text>
  <text x="56" y="277">the Graph engine and its scheduler,</text>
  <text x="56" y="295">a worktree per task, plan and run</text>
  <text x="56" y="313">branches, checkpoints and resume</text>

  <rect x="311" y="232" width="257" height="92" rx="7" fill="#fdf3e1" stroke="#d09a45" stroke-width="1.2"/>
  <rect x="492" y="240" width="64" height="22" rx="5" fill="#ffffff" stroke="#d09a45"/>
  <text x="524" y="256" class="c" style="fill:#9a6512">days</text>
  <text x="325" y="256" class="tb">Learning loops</text>
  <text x="325" y="277">learned model router, retry budgets,</text>
  <text x="325" y="295">playbooks, prompt experiments,</text>
  <text x="325" y="313">knowledge store, outcome forecaster</text>

  <rect x="580" y="232" width="258" height="92" rx="7" fill="#f1eafb" stroke="#9b7fd4" stroke-width="1.2"/>
  <rect x="762" y="240" width="64" height="22" rx="5" fill="#ffffff" stroke="#9b7fd4"/>
  <text x="794" y="256" class="c" style="fill:#6d4fb0">weeks</text>
  <text x="594" y="256" class="tb">Audit level</text>
  <text x="594" y="277">random deep audits, loop audit,</text>
  <text x="594" y="295">bounded controller,</text>
  <text x="594" y="313">guarded commit</text>

  <rect x="42" y="336" width="257" height="76" rx="7" fill="#e6f0fb" stroke="#5b8fd0" stroke-width="1.2"/>
  <rect x="223" y="344" width="64" height="22" rx="5" fill="#ffffff" stroke="#5b8fd0"/>
  <text x="255" y="360" class="c" style="fill:#2f6db3">minutes</text>
  <text x="56" y="360" class="tb">Attempt loop</text>
  <text x="56" y="381">dispatch, model routing, prompts,</text>
  <text x="56" y="399">retry, escalation, failover</text>

  <rect x="311" y="336" width="257" height="76" rx="7" fill="#e6f0fb" stroke="#5b8fd0" stroke-width="1.2"/>
  <rect x="492" y="344" width="64" height="22" rx="5" fill="#ffffff" stroke="#5b8fd0"/>
  <text x="524" y="360" class="c" style="fill:#2f6db3">minutes</text>
  <text x="325" y="360" class="tb">Gates</text>
  <text x="325" y="381">pre-verify screen, gate rungs,</text>
  <text x="325" y="399">one verdict record per attempt</text>

  <rect x="580" y="336" width="258" height="76" rx="7" fill="#eef2f7" stroke="#6b7f99" stroke-width="1.2"/>
  <rect x="762" y="344" width="64" height="22" rx="5" fill="#ffffff" stroke="#6b7f99"/>
  <text x="794" y="360" class="c" style="fill:#475a73">seconds</text>
  <text x="594" y="360" class="tb">Safety</text>
  <text x="594" y="381">tool-call guard, fail-closed tools,</text>
  <text x="594" y="399">git guard, output screening</text>

  <!-- between layers 2 -->
  <line x1="430" y1="428" x2="430" y2="460" class="ar" marker-end="url(#a)"/>
  <line x1="454" y1="460" x2="454" y2="428" class="ar up" marker-end="url(#a)"/>
  <text x="420" y="449" class="e m">write, publish</text>
  <text x="466" y="449" class="m">read, subscribe</text>

  <!-- Substrate -->
  <rect x="30" y="464" width="820" height="120" rx="10" class="band"/>
  <text x="44" y="488" class="h">Substrate</text>
  <rect x="42" y="500" width="190" height="72" rx="6" class="sub"/>
  <text x="137" y="523" class="t c">Signals</text>
  <text x="137" y="543" class="c">content-addressed,</text>
  <text x="137" y="561" class="c">with lineage</text>
  <rect x="244" y="500" width="190" height="72" rx="6" class="sub"/>
  <text x="339" y="523" class="t c">Cells and graphs</text>
  <text x="339" y="543" class="c">processing steps,</text>
  <text x="339" y="561" class="c">composed into graphs</text>
  <rect x="446" y="500" width="190" height="72" rx="6" class="sub"/>
  <text x="541" y="523" class="t c">Bus</text>
  <text x="541" y="543" class="c">events (ephemeral)</text>
  <rect x="648" y="500" width="190" height="72" rx="6" class="sub"/>
  <text x="743" y="523" class="t c">Store</text>
  <text x="743" y="543" class="c">records (durable)</text>

  <!-- between layers 3 -->
  <line x1="430" y1="588" x2="430" y2="620" class="ar" marker-end="url(#a)"/>
  <line x1="454" y1="620" x2="454" y2="588" class="ar up" marker-end="url(#a)"/>
  <text x="420" y="609" class="e m">prompts</text>
  <text x="466" y="609" class="m">outputs, tool calls</text>

  <!-- Workers -->
  <rect x="30" y="624" width="820" height="196" rx="10" class="band"/>
  <text x="44" y="648" class="h">Workers</text>
  <text x="838" y="648" class="e m">dashed: runs outside Roko</text>
  <rect x="42" y="660" width="796" height="52" rx="6" class="box"/>
  <text x="440" y="681" class="t c">Provider adapters</text>
  <text x="440" y="701" class="c">12 provider kinds, one adapter each; everything above them is provider-neutral</text>
  <line x1="238" y1="712" x2="238" y2="734" class="ar" marker-end="url(#a)"/>
  <line x1="642" y1="712" x2="642" y2="734" class="ar" marker-end="url(#a)"/>
  <rect x="42" y="736" width="392" height="72" rx="6" class="box" style="stroke-dasharray:5 4"/>
  <text x="238" y="758" class="t c">Agent loops</text>
  <text x="238" y="778" class="c">Claude Code, Codex, Gemini CLI, …</text>
  <text x="238" y="796" class="c">each runs its own tool loop, isolated</text>
  <rect x="446" y="736" width="392" height="72" rx="6" class="box" style="stroke-dasharray:5 4"/>
  <text x="642" y="758" class="t c">API models</text>
  <text x="642" y="778" class="c">models called over HTTP;</text>
  <text x="642" y="796" class="c">Roko runs the tool loop and its guard</text>

  <!-- Records column -->
  <rect x="900" y="196" width="180" height="388" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="914" y="222" class="h">Records</text>
  <text x="914" y="241" class="m">durable, attributable</text>
  <rect x="912" y="254" width="156" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="924" y="275" class="t">Verdict records</text>
  <text x="924" y="294">one per attempt</text>
  <rect x="912" y="316" width="156" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="924" y="337" class="t">Episodes</text>
  <text x="924" y="356">per agent turn</text>
  <rect x="912" y="378" width="156" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="924" y="399" class="t">Checkpoints</text>
  <text x="924" y="418">per plan, for resume</text>
  <rect x="912" y="440" width="156" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="924" y="461" class="t">Costs</text>
  <text x="924" y="480">settled spend</text>
  <rect x="912" y="502" width="156" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="924" y="523" class="t">Loop registry</text>
  <text x="924" y="542">each loop's contract</text>

  <!-- loops write and read records -->
  <line x1="852" y1="290" x2="897" y2="290" class="ar" marker-end="url(#a)"/>
  <text x="875" y="282" class="c m">write</text>
  <line x1="897" y1="350" x2="852" y2="350" class="ar up" marker-end="url(#a)"/>
  <text x="875" y="342" class="c m">read</text>
</svg>
