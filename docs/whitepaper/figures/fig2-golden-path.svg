<svg xmlns="http://www.w3.org/2000/svg" width="880" height="608" viewBox="0 0 880 608" role="img" aria-labelledby="title desc" data-pin="ed0c33bd5">
  <title id="title">Figure 2: the golden path</title>
  <desc id="desc">Eleven steps in four phases, each marked by its status tag. Verify passes to integration or fails to Recover, which loops back to Route or to Size and split; Learn feeds the next plan.</desc>
  <defs>
    <pattern id="fill-partial" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fde9b8"/>
      <rect width="3" height="6" fill="#c98500"/>
    </pattern>
    <pattern id="fill-broken" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f7dada"/>
      <rect width="1.6" height="6" fill="#d03b3b"/>
      <rect width="6" height="1.6" fill="#d03b3b"/>
    </pattern>
    <pattern id="fill-built-unwired" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="6" height="6" fill="#efeee9"/>
      <rect width="1.4" height="6" fill="#8f8d86"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', Arimo, sans-serif; fill: #0b0b0b; }
    .note { fill: #52514e; }
    .wired .key { fill: #0ca30c; }
    .partial .key { fill: url(#fill-partial); }
    .broken .key { fill: url(#fill-broken); }
    .orphaned .key { fill: #cfcdc6; }
    .built-unwired .key { fill: url(#fill-built-unwired); }
    .docs-only .key, .missing .key, .removed .key, .unproven .key { fill: #ffffff; stroke: #898781; }
    .missing .key { stroke-dasharray: 3 2; }
    .docs-only .key, .removed .key, .unproven .key { stroke-dasharray: 1 2; }
    .partial .id, .broken .id, .built-unwired .id { paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
    .docs-only .id, .missing .id, .removed .id, .unproven .id { fill: #52514e; }
    .removed .id { text-decoration: line-through; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .title { font-size: 14px; font-weight: bold; }
    .box { fill: #ffffff; stroke: #a9a8a0; }
    .panel { fill: #fafaf8; stroke: #e1e0d9; }
    .flow { fill: none; stroke: #52514e; stroke-width: 1.4; }
    .wired .body { fill: #e7f5e7; stroke: #0ca30c; }
    .partial .body { fill: #fef5de; stroke: #c98500; }
    .broken .body { fill: #fbe8e8; stroke: #d03b3b; }
    .orphaned .body, .built-unwired .body { fill: #f3f2ee; stroke: #a3a19a; }
    .docs-only .body, .missing .body, .removed .body, .unproven .body { fill: #ffffff; stroke: #898781; }
    .missing .body { stroke-dasharray: 4 3; }
    .docs-only .body, .removed .body, .unproven .body { stroke-dasharray: 1.5 2.5; }
    .docs-only .swatch, .missing .swatch, .removed .swatch, .unproven .swatch { stroke: none; }
  </style>
  <rect width="880" height="608" rx="8" fill="#ffffff"/>
  <!-- Phases -->
  <rect class="panel" x="12.5" y="16.5" width="855" height="141" rx="8"/>
  <text class="title" x="28" y="42">Plan</text>
  <text class="note" x="28" y="60" font-size="12">frontier model</text>
  <rect class="panel" x="12.5" y="166.5" width="855" height="185" rx="8"/>
  <text class="title" x="28" y="192">Execute</text>
  <text class="note" x="28" y="210" font-size="12">cheapest capable model</text>
  <rect class="panel" x="12.5" y="360.5" width="855" height="121" rx="8"/>
  <text class="title" x="28" y="386">Integrate</text>
  <rect class="panel" x="12.5" y="490.5" width="855" height="53" rx="8"/>
  <text class="title" x="28" y="516">Learn</text>
  <!-- Steps, tagged as in §4.12. Step 9's two parts are appendix rows IS2 and IS3 (data-row);
       the check mode of tools/status_matrix.py fails when they disagree with the matrix. -->
  <g>
    <g class="partial" data-tag="PARTIAL" transform="translate(210,26)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">1</tspan><tspan x="36">Author</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
    <g class="partial" data-tag="PARTIAL" transform="translate(210,70)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">2</tspan><tspan x="36">Compile the spec</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
    <g class="missing" data-tag="MISSING" transform="translate(210,114)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">3</tspan><tspan x="36">Size and split</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">MISSING</text>
    </g>
    <g class="missing" data-tag="MISSING" transform="translate(210,176)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">4</tspan><tspan x="36">Route</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">MISSING</text>
    </g>
    <g class="partial" data-tag="PARTIAL" transform="translate(210,220)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">5</tspan><tspan x="36">Schedule</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
    <g class="partial" data-tag="PARTIAL" transform="translate(210,264)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">6</tspan><tspan x="36">Isolate</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
    <g class="partial" data-tag="PARTIAL" transform="translate(210,308)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">7</tspan><tspan x="36">Verify</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
    <g transform="translate(210,370)">
      <rect class="box" x="0.5" y="0.5" width="391" height="57" rx="5"/>
      <text x="22" y="21" font-size="13.5"><tspan font-weight="bold">9</tspan><tspan x="36">Integrate</tspan></text>
      <g class="orphaned" data-row="IS2" data-tag="ORPHANED" transform="translate(22,29)"><title>IS2 Merge queue, plan merger and attempt acceptance: ORPHANED</title><rect class="body" x="0.5" y="0.5" width="173" height="21" rx="4"/><path class="key swatch" d="M4.5,0.5 H10 V21.5 H4.5 A4,4 0 0 1 0.5,17.5 V4.5 A4,4 0 0 1 4.5,0.5 Z"/><text x="16" y="15" font-size="12">merge queue <tspan class="note" font-size="11" letter-spacing="0.3">· ORPHANED</tspan></text></g>
      <g class="missing" data-row="IS3" data-tag="MISSING" transform="translate(204,29)"><title>IS3 Whole-plan verify on the integrated result: MISSING</title><rect class="body" x="0.5" y="0.5" width="170" height="21" rx="4"/><path class="key swatch" d="M4.5,0.5 H10 V21.5 H4.5 A4,4 0 0 1 0.5,17.5 V4.5 A4,4 0 0 1 4.5,0.5 Z"/><text x="16" y="15" font-size="12">whole-plan gate <tspan class="note" font-size="11" letter-spacing="0.3">· MISSING</tspan></text></g>
    </g>
    <g class="missing" data-tag="MISSING" transform="translate(210,438)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">10</tspan><tspan x="42">Review</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">MISSING</text>
    </g>
    <g class="partial" data-tag="PARTIAL" transform="translate(210,500)">
      <rect class="body" x="0.5" y="0.5" width="391" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">11</tspan><tspan x="42">Learn</tspan></text><text class="note" x="382" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
    <g class="partial" data-tag="PARTIAL" transform="translate(664,308)">
      <rect class="body" x="0.5" y="0.5" width="157" height="33" rx="5"/><path class="key swatch" d="M5.5,0.5 H12 V33.5 H5.5 A5,5 0 0 1 0.5,28.5 V5.5 A5,5 0 0 1 5.5,0.5 Z"/>
      <text x="22" y="22" font-size="13.5"><tspan font-weight="bold">8</tspan><tspan x="36">Recover</tspan></text><text class="note" x="148" y="21.5" font-size="11" letter-spacing="0.3" text-anchor="end">PARTIAL</text>
    </g>
  </g>
  <!-- Flow: the path down the middle, feedback on the right -->
    <path class="flow" d="M270,60 V68" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,104 V112" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,148 V174" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,210 V218" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,254 V262" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,298 V306" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,342 V368" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,428 V436" marker-end="url(#arrow)"/>
    <path class="flow" d="M270,472 V498" marker-end="url(#arrow)"/>
  <text class="note" x="278" y="360" font-size="11">pass</text>
    <path class="flow" d="M602,325 H662" marker-end="url(#arrow)"/>
  <text class="note" x="633" y="319" font-size="11" text-anchor="middle">fail</text>
    <path class="flow" d="M704,308 V193 H604" marker-end="url(#arrow)"/>
  <text class="note" x="614" y="187" font-size="11">retry, or one rung up</text>
    <path class="flow" d="M774,308 V131 H604" marker-end="url(#arrow)"/>
  <text class="note" x="614" y="125" font-size="11">split or replan</text>
    <path class="flow" d="M602,517 H844 V43 H604" marker-end="url(#arrow)"/>
  <text class="note" x="614" y="37" font-size="11">next plan: outcomes inform steps 1 to 4</text>
  <!-- Legend -->
  <text class="note" x="28" y="572" font-size="12">On the production path</text>
  <g class="partial"><rect class="key" x="210.5" y="560.5" width="22" height="14" rx="2"/><text x="240" y="572" font-size="12">PARTIAL</text></g>
  <text class="note" x="28" y="594" font-size="12">Not on the path</text>
  <g class="orphaned"><rect class="key" x="210.5" y="582.5" width="22" height="14" rx="2"/><text x="240" y="594" font-size="12">ORPHANED</text></g>
  <g class="missing"><rect class="key" x="330.504" y="582.5" width="22" height="14" rx="2"/><text x="360.004" y="594" font-size="12">MISSING</text></g>
  <text class="note" x="852" y="572" font-size="11" text-anchor="end">Status tags at ed0c33bd5, as in the table of §4.12.</text>
</svg>
