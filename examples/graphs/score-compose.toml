# Score -> Compose -> Act pipeline
#
# Demonstrates the universal loop pattern: score a signal, compose a prompt,
# then act on it. Each step passes its output signals to the next.
#
# All three cell types resolve to cognitive cell implementations registered
# in the default registry (score is an alias for AssessCell, compose maps to
# CognitiveComposeCell, act maps to ActCell). ActCell is still a stub that
# dispatches nothing (gap-3d5cce), so `roko graph run` refuses this graph
# until it is wired to a provider (bug-91a34e).
#
# Usage:
#   roko graph show examples/graphs/score-compose.toml

[graph]
name = "score-compose-act"
description = "Universal loop: score -> compose -> act"
version = "1.0.0"

[graph.labels]
category = "workflow"
pattern = "universal-loop"

[[nodes]]
id = "score"
cell_type = "score"
outputs = ["scored_signal"]

[[nodes]]
id = "compose"
cell_type = "compose"
inputs = ["score.scored_signal"]
outputs = ["prompt"]

[[nodes]]
id = "act"
cell_type = "act"
inputs = ["compose.prompt"]
outputs = ["result"]

[[edges]]
from = "score"
to = "compose"

[[edges]]
from = "compose"
to = "act"
