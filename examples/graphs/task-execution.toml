# task-execution.toml — Compose -> Agent -> Gate pipeline.
#
# This is the canonical roko task execution pattern:
# 1. ComposeCell assembles the prompt from template + context
# 2. agent.task runs the implementation as a gated one-task plan, as
#    `roko run` does: its agent works in the workspace, and the workspace's
#    gates verify the change, retrying with their feedback
# 3. Gate validates the output (compile/test/clippy)
#
# If the gate fails, a conditional edge routes back to a retry compose
# that includes the gate feedback.
#
# agent.task carries its own `prompt`: the compose nodes show where prompt
# assembly sits, and the agent nodes do not read their output. The agent
# nodes need the `llm` capability, which a trigger's run has and which
# `roko graph run` does not grant (9129).

[graph]
name = "task-execution"
description = "Standard compose -> agent -> gate pipeline with retry on failure"
version = "1.0.0"

[graph.policy]
mode = "one_shot"
failure_strategy = "fail_fast"
max_concurrent_nodes = 2
timeout_ms = 900000

# ─── Nodes ───────────────────────────────────────────────────────────────────

[[nodes]]
id = "compose_task"
name = "Task Prompt Assembly"
cell_type = "compose"

[nodes.config]
template = """
## Task
{{task_description}}

## Context
{{domain_context}}

## Constraints
- Write idiomatic Rust
- Include unit tests
- No unsafe code
"""

[nodes.config.variables]
task_description = "Implement a rate limiter using token bucket algorithm"
domain_context = "This is for the HTTP API layer in roko-serve"

[[nodes]]
id = "agent_implement"
name = "Implementation Agent"
cell_type = "agent.task"

[nodes.config]
prompt = "Implement a rate limiter using the token bucket algorithm for the HTTP API layer in roko-serve. Write idiomatic Rust with unit tests and no unsafe code."
role = "implementer"
tier = "focused"
max_usd = 2.0

[[nodes]]
id = "compile_gate"
name = "Compilation Check"
cell_type = "gate.compile"

[nodes.config]
command = "cargo check --workspace"

[[nodes]]
id = "test_gate"
name = "Test Suite"
cell_type = "gate.test"

[nodes.config]
command = "cargo test --workspace"

[[nodes]]
id = "success_report"
name = "Success Report"
cell_type = "compose"

[nodes.config]
template = "Task completed successfully. Implementation passed all gates."

[[nodes]]
id = "retry_compose"
name = "Retry Prompt with Feedback"
cell_type = "compose"

[nodes.config]
template = """
## Previous Attempt Failed

The gate check failed with the following output:
{{compile_gate}}

Please fix the issues and try again.

## Original Task
{{compose_task}}
"""

[[nodes]]
id = "retry_agent"
name = "Retry Agent"
cell_type = "agent.task"

[nodes.config]
prompt = "The rate limiter in roko-serve fails `cargo check --workspace`. Run it, read the errors, and fix them, keeping the unit tests."
role = "implementer"
tier = "focused"
max_usd = 2.0

# ─── Edges ───────────────────────────────────────────────────────────────────

# Main path: compose -> agent -> compile gate.
[[edges]]
from = "compose_task"
to = "agent_implement"

[edges.condition]
type = "always"

[[edges]]
from = "agent_implement"
to = "compile_gate"

[edges.condition]
type = "success"

# Gate success path: compile -> test -> success report.
[[edges]]
from = "compile_gate"
to = "test_gate"

[edges.condition]
type = "success"

[[edges]]
from = "test_gate"
to = "success_report"

[edges.condition]
type = "success"

# Gate failure path: compile fails -> retry compose -> retry agent.
[[edges]]
from = "compile_gate"
to = "retry_compose"

[edges.condition]
type = "failure"

[[edges]]
from = "retry_compose"
to = "retry_agent"

[edges.condition]
type = "always"
