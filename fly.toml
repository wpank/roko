app = "roko"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 6677
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  path = "/health"
  method = "GET"

[[mounts]]
  source = "roko_data"
  destination = "/data/.roko"

[env]
  RUST_LOG = "info"
  # The entrypoint links /workspace/.roko to this path, so state lands on the
  # mounted volume instead of the Machine's ephemeral disk.
  ROKO_STATE_ROOT = "/data/.roko"
