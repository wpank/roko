description = "Turn the accepted Connect contract and descriptor registry into a live adapter runtime with at least one useful concrete transport, bounded reconnect/health supervision, secret-safe configuration, and authenticated lifecycle operations."
role = "implementer"
status = "done"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_loc = 700
files = [
    "crates/roko-core/src/connector.rs",
    "crates/roko-runtime/src",
    "crates/roko-serve/src/routes/connectors.rs",
    "crates/roko-serve/src/state.rs",
]
depends_on = []

[task.context]
read_files = [
    { path = ".roko/GAPS.md", why = "E29 accepted contract boundary and remaining concrete connector work" },
    { path = "tmp/status-quo/backlog/plans/E29-connectivity-relay/tasks.toml", why = "accepted protocol contracts that the runtime must consume" },
    { path = "crates/roko-core/src/connector.rs", why = "canonical Connect lifecycle and connector descriptors" },
]
symbols = ["Connect", "ConnectorRegistry", "ReconnectStrategy", "ConnectorHealth"]
anti_patterns = [
    "Do not add a second connector descriptor or health registry.",
    "Do not persist raw connector credentials or expose them through status routes.",
    "Do not claim a connector is connected before a real transport health check succeeds.",
]

