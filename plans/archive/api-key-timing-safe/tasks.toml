[[task]]
id = "T01"
title = "Add canonical constant_time_eq and fix vulnerable comparison"
role = "implementer"
files = ["crates/roko-serve/src/routes/middleware.rs"]
description = """In crates/roko-serve/src/routes/middleware.rs, the legacy API key comparison
uses `token == auth.api_key` which is vulnerable to timing side-channel attacks.

1. Add a `pub(crate) fn constant_time_eq(a: &[u8], b: &[u8]) -> bool` function that uses
   XOR accumulation with `core::hint::black_box`:
```rust
pub(crate) fn constant_time_eq(a: &[u8], b: &[u8]) -> bool {
    if a.len() != b.len() {
        return false;
    }
    let mut diff = 0u8;
    for (lhs, rhs) in a.iter().zip(b.iter()) {
        diff |= lhs ^ rhs;
    }
    core::hint::black_box(diff) == 0
}
```

2. Find the line `if !auth.api_key.is_empty() && token == auth.api_key {` and replace
   `token == auth.api_key` with
   `constant_time_eq(token.as_bytes(), auth.api_key.as_bytes())`.

Verify: `cargo check -p roko-serve` passes."""
status = "done"
tier = "mechanical"

[[task.verify]]
phase = "structural"
command = "cargo check -p roko-serve"

