[[task]]
id = "T01"
title = "Estimate cost from token counts in codex stream parser"
role = "implementer"
files = ["crates/roko-agent/src/provider/codex_cli/stream.rs"]
description = """In `crates/roko-agent/src/provider/codex_cli/stream.rs`, the `parse_stream_line()`
function handles `turn.completed` events. At lines 139-144 it synthesizes:

```rust
AgentRuntimeEvent::TurnCompleted {
    session_id: None,
    total_cost_usd: None,  // <-- always None
    num_turns: None,
    is_error: false,
}
```

The `CodexUsage` struct (lines 66-75) already has `input_tokens`, `output_tokens`,
`cached_input_tokens`, and `reasoning_output_tokens`.

Add a cost estimation function and use it to populate `total_cost_usd`:

1. Add a function `estimate_codex_cost` that takes `&CodexUsage` and returns `f64`:

```rust
fn estimate_codex_cost(usage: &CodexUsage) -> f64 {
    // gpt-5.6-sol pricing (per million tokens)
    let input_per_m = 2.0;
    let cached_per_m = 0.50;
    let output_per_m = 8.0;

    let uncached = usage.input_tokens.saturating_sub(usage.cached_input_tokens);
    let cost = uncached as f64 * input_per_m / 1_000_000.0
        + usage.cached_input_tokens as f64 * cached_per_m / 1_000_000.0
        + usage.output_tokens as f64 * output_per_m / 1_000_000.0;
    cost
}
```

2. Change line 139 from `total_cost_usd: None` to
   `total_cost_usd: Some(estimate_codex_cost(&usage))`.

3. Update the existing `turn_completed_with_usage` test (around line 242) to assert that
   `total_cost_usd` is `Some(cost)` where `cost > 0.0` instead of `None`.

Verify: `cargo test -p roko-agent -- codex_cli::stream` passes."""
status = "done"
tier = "mechanical"

