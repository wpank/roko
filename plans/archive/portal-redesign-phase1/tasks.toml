[[task]]
id = "P1-T02"
title = "Create WorkspaceShell 3-panel layout"
description = """You MUST create the file apps/portal/src/components/layout/WorkspaceShell.tsx

This is the root layout component. It renders a CSS grid with 3 areas:
- Left: sidebar (220px fixed width)
- Center: main area (flex 1fr)
- Bottom: output panel (collapsible, 0px when hidden, 200px when open)

```tsx
'use client';
import { useState } from 'react';
import { ErrorBoundary } from '@/components/ErrorBoundary';
import { PlanSidebar } from './PlanSidebar';
import { MainArea } from './MainArea';
import { OutputPanel } from './OutputPanel';

export function WorkspaceShell() {
  const [selectedPlanId, setSelectedPlanId] = useState<string | null>(null);
  const [outputOpen, setOutputOpen] = useState(false);

  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: '220px 1fr',
      gridTemplateRows: outputOpen ? '1fr 200px' : '1fr 0px',
      height: '100vh',
      background: 'var(--void)',
    }}>
      <div style={{ gridRow: '1 / -1', borderRight: '1px solid var(--text-ghost)', overflow: 'hidden' }}>
        <ErrorBoundary name="Sidebar">
          <PlanSidebar selectedPlanId={selectedPlanId} onSelectPlan={setSelectedPlanId} />
        </ErrorBoundary>
      </div>
      <div style={{ overflow: 'auto' }}>
        <ErrorBoundary name="Main">
          <MainArea
            selectedPlanId={selectedPlanId}
            onSelectPlan={setSelectedPlanId}
            onOutputOpen={() => setOutputOpen(true)}
          />
        </ErrorBoundary>
      </div>
      {outputOpen && (
        <div style={{ borderTop: '1px solid var(--text-ghost)', overflow: 'auto' }}>
          <ErrorBoundary name="Output">
            <OutputPanel onClose={() => setOutputOpen(false)} />
          </ErrorBoundary>
        </div>
      )}
    </div>
  );
}
```

Use ROSEDUST CSS variables. No border-radius. Monospace font throughout."""
