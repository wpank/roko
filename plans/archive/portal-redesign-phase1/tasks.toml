[[task]]
id = "P1-T04"
title = "Create MainArea state router"
description = """You MUST create the file apps/portal/src/components/layout/MainArea.tsx

This component renders one of 4 views based on the current state:

1. IDLE (selectedPlanId is null): Show centered prompt input with textarea, "Generate" button, and recent plan links
2. SELECTED (plan exists, not executing): Show plan name, task list using TaskRow molecule, Execute button
3. EXECUTING (plan is running via SSE): Show progress bar, task list with live status updates, Cancel button
4. DONE (plan completed): Show task list with green checks, per-task cost, total cost

Props: selectedPlanId, onSelectPlan, onOutputOpen

Data sources:
- Plan data: useSafePlans() + useSafePlanTasks(selectedPlanId)
- Live status: useDashboardStore(s => s.tasks) for executing state
- Live plan status: useDashboardStore(s => s.plans)

Determine state:
- No selectedPlanId → IDLE
- Plan status is 'running' or 'gating' (from SSE store) → EXECUTING
- Plan status is 'completed' or 'failed' → DONE
- Otherwise → SELECTED

When transitioning to EXECUTING, call onOutputOpen() to open the output panel.

Use existing atoms (Button, Badge, ProgressBar, Spinner) and TaskRow molecule.
All data access through safe-api mappers (never crash on bad shape).
Every array guarded with ?? [] before .map/.filter."""
