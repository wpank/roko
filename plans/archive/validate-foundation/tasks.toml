[[task]]
id = "FND-T01"
title = "Verify budget defaults are non-zero"
description = """Read the file `crates/roko-core/src/config/budget.rs` and verify that
BudgetConfig::default() returns non-zero values for max_plan_usd and max_turn_usd.
Write a one-line confirmation to `demo/foundation-check/budget-ok.txt` with the actual default values found."""
status = "ready"
tier = "mechanical"
max_loc = 3
model_hint = "cerebras-gptoss"
files = ["demo/foundation-check/budget-ok.txt"]
role = "implementer"
depends_on = []

[[task.verify]]
phase = "structural"
command = "grep -q 'max_plan_usd' demo/foundation-check/budget-ok.txt && grep -q 'max_turn_usd' demo/foundation-check/budget-ok.txt"
fail_msg = "Budget defaults not verified"

