description = """Wire secret scrubbing into `write_shared_workflow_run` in `crates/roko-cli/src/run.rs`.

## 1. Add scrubbing to `write_shared_workflow_run`

In `crates/roko-cli/src/run.rs`, find `write_shared_workflow_run` (around line 87). It builds
a `RunTranscript` from raw prompt/output without any scrubbing. This is the security bug.

Add a `scrub_share_text` helper function (same pattern as `crates/roko-cli/src/share.rs` line 49):

```rust
fn scrub_share_text(text: &str) -> String {
    use std::sync::OnceLock;
    use roko_core::obs::LogScrubber;
    static SCRUBBER: OnceLock<LogScrubber> = OnceLock::new();
    let scrubber = SCRUBBER.get_or_init(LogScrubber::new);
    let redacted = scrubber.scrub(text);
    scrub_long_secret_like_strings(&redacted)
}

fn scrub_long_secret_like_strings(text: &str) -> String {
    use regex::Regex;
    use std::sync::OnceLock;
    static HEX_RE: OnceLock<Regex> = OnceLock::new();
    static B64_RE: OnceLock<Regex> = OnceLock::new();
    let hex_re = HEX_RE.get_or_init(|| {
        Regex::new(r"(^|[^0-9A-Fa-f])([0-9A-Fa-f]{32,})([^0-9A-Fa-f]|$)").unwrap()
    });
    let b64_re = B64_RE.get_or_init(|| {
        Regex::new(r"(^|[^A-Za-z0-9+/=])([A-Za-z0-9+/=]{32,})([^A-Za-z0-9+/=]|$)").unwrap()
    });
    let redacted = hex_re.replace_all(text, "$1[REDACTED]$3");
    b64_re.replace_all(redacted.as_ref(), "$1[REDACTED]$3").into_owned()
}
```

IMPORTANT: Read `crates/roko-cli/src/share.rs` to see the existing helpers. Both
`scrub_share_text` and `scrub_long_secret_like_strings` already exist there (lines 49-66).
You can either:
- (Preferred) Make the functions in `share.rs` `pub(crate)` and call them from `run.rs`
- Or duplicate them in `run.rs`

In `write_shared_workflow_run`, apply scrubbing BEFORE building the `RunTranscript`:
- Scrub `prompt` with `scrub_share_text(prompt)`
- Scrub the output text field: if the report has output text, scrub it
- Also scrub any transcript event content fields that contain agent output

Read the actual `RunTranscript` struct in `crates/roko-serve/src/routes/shared_runs.rs` to see
what fields contain text that could have secrets. At minimum, scrub `prompt` and any `output`/
`content` fields.

