[[task]]
id = "T03"
title = "Strip plans/ prefix in plan commands"
role = "implementer"
files = ["crates/roko-cli/src/commands/plan.rs"]
description = """In crates/roko-cli/src/commands/plan.rs, strip the `plans/` prefix from user-provided plan IDs
before passing them to `discover_plan_by_id()`. This way `roko plan show plans/demo-hello`
works the same as `roko plan show demo-hello`.

Search for all calls to `discover_plan_by_id` in the file and add prefix stripping:
```rust
let plan_id = plan_id
    .strip_prefix("plans/")
    .or_else(|| plan_id.strip_prefix("plans\\\\"))
    .unwrap_or(&plan_id);
```

Verify: `cargo check -p roko-cli` passes."""
status = "ready"
tier = "mechanical"
depends_on = ["T01"]

[[task.verify]]
phase = "structural"
command = "cargo check -p roko-cli"

