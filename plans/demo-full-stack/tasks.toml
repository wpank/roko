[[task]]
id = "T04"
title = "Audit the server code for security issues"
description = """Perform a security audit of the hello-server implementation
and write a report to `demo/hello-server/AUDIT.md`. You must create the file
`demo/hello-server/AUDIT.md`.

The audit must cover and address all of the following:

1. Panic paths — check that .unwrap() and .expect() are absent from
   main.rs; report PASS or FAIL with evidence.
2. Error handling — verify that all fallible operations propagate errors
   using ? or explicit error types; report PASS or FAIL.
3. Hardcoded secrets — confirm no API keys, tokens, passwords, or
   credentials appear in the source; report PASS or FAIL.
4. Input validation — note that GET / and /health accept no user input;
   assess /info; report PASS or FAIL.
5. Dependency surface — list the four direct dependencies (axum, tokio,
   serde, serde_json) and note their security posture.

The file must contain these exact Markdown headings (in order):
  ## Audit summary
  ## Panic paths
  ## Error handling
  ## Hardcoded secrets
  ## Input validation
  ## Dependency surface
  ## Verdict

Under `## Verdict` write exactly one of: `PASS` or `FAIL — <reason>`.
Given that T02 and T03 prohibit .unwrap() and hardcoded secrets, the
expected verdict is PASS.

Do not modify any source file. This is a read-only audit task."""
status = "ready"
tier = "integrative"
max_loc = 100
files = ["demo/hello-server/AUDIT.md"]
role = "auditor"
depends_on = ["T03"]

[task.context]
read_files = [
    { path = "demo/hello-server/src/main.rs", why = "Audit the implementation for every security category." },
    { path = "demo/hello-server/Cargo.toml", why = "Audit the direct dependency surface." },
]
symbols = [
    "PASS — expected verdict given no .unwrap() and no hardcoded secrets",
    "axum, tokio, serde, serde_json — the four direct dependencies",
]
anti_patterns = [
    "Do not modify main.rs or Cargo.toml during the audit.",
    "Do not mark FAIL without citing evidence from the source files.",
    "Do not omit any of the seven required section headings.",
]

[[task.verify]]
phase = "file-exists"
command = "test -f demo/hello-server/AUDIT.md"
fail_msg = "demo/hello-server/AUDIT.md must be created by T04."

[[task.verify]]
phase = "headings"
command = "rg -qxF '## Audit summary' demo/hello-server/AUDIT.md && rg -qxF '## Panic paths' demo/hello-server/AUDIT.md && rg -qxF '## Error handling' demo/hello-server/AUDIT.md && rg -qxF '## Hardcoded secrets' demo/hello-server/AUDIT.md && rg -qxF '## Input validation' demo/hello-server/AUDIT.md && rg -qxF '## Dependency surface' demo/hello-server/AUDIT.md && rg -qxF '## Verdict' demo/hello-server/AUDIT.md"
fail_msg = "AUDIT.md must contain all seven required section headings."

[[task.verify]]
phase = "verdict-present"
command = "python3 -c \"text=open('demo/hello-server/AUDIT.md').read(); verdict_section=text.split('## Verdict',1)[1].strip(); assert verdict_section.startswith('PASS') or verdict_section.startswith('FAIL'), 'Verdict section must start with PASS or FAIL'\""
fail_msg = "The Verdict section must begin with PASS or FAIL."

[[task.verify]]
phase = "dependency-coverage"
command = "python3 -c \"text=open('demo/hello-server/AUDIT.md').read().lower(); assert all(dep in text for dep in ('axum','tokio','serde','serde_json')), 'All four dependencies must be mentioned in the audit'\""
fail_msg = "AUDIT.md must mention all four direct dependencies: axum, tokio, serde, serde_json."

