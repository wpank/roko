[meta]
plan = "demo-full-stack"
total = 6
done = 0
status = "fixture"
max_parallel = 2
skip_enrichment = true
estimated_total_minutes = 18

# Dependency DAG:
#
#   T01 (researcher)
#    └── T02 (implementer) — axum skeleton
#         └── T03 (implementer) — health + info endpoints
#              ├── T04 (auditor)  ─── T06 (conductor)
#              └── T05 (scribe)  ─/

[[task]]
id = "T01"
title = "Research and recommend a Rust web framework"
description = """Research which Rust HTTP framework to use for a minimal demo
server and write your findings to `demo/hello-server/research.md`.

You must create the file `demo/hello-server/research.md` by the end of this
task. The file must contain these exact Markdown headings (in order):
  ## Frameworks evaluated
  ## Recommendation
  ## Rationale
  ## Trade-offs

The file must name and briefly describe axum, actix-web, and warp under
`## Frameworks evaluated`. Under `## Recommendation` the file must contain
exactly the word `axum` as the chosen framework. Under `## Rationale` you
must cite at least three specific technical reasons: Tower ecosystem
compatibility, ergonomic handler typing, and minimal boilerplate for small
servers. Under `## Trade-offs` you must acknowledge at least one limitation
of the chosen framework.

Do not create any source-code files in this task; this is a research and
documentation task only. Do not modify any existing repository file."""
status = "ready"
tier = "focused"
max_loc = 80
files = ["demo/hello-server/research.md"]
role = "researcher"
depends_on = []

[task.context]
read_files = [
    { path = "README.md", lines = "1-60", why = "Understand Roko's context so the recommendation is grounded in the project." },
    { path = "Cargo.toml", lines = "1-40", why = "Check workspace conventions before recommending dependency additions." },
]
symbols = []
anti_patterns = [
    "Do not recommend actix-web or warp as the final choice.",
    "Do not write Rust source code or create Cargo.toml in this task.",
    "Do not leave any section heading empty or with placeholder text.",
]

[[task.verify]]
phase = "structural"
command = "test -f demo/hello-server/research.md"
fail_msg = "demo/hello-server/research.md must be created by T01."

[[task.verify]]
phase = "headings"
command = "rg -qxF '## Frameworks evaluated' demo/hello-server/research.md && rg -qxF '## Recommendation' demo/hello-server/research.md && rg -qxF '## Rationale' demo/hello-server/research.md && rg -qxF '## Trade-offs' demo/hello-server/research.md"
fail_msg = "research.md must contain all four required section headings."

[[task.verify]]
phase = "recommendation"
command = "python3 -c \"import re; text=open('demo/hello-server/research.md').read(); section=text.split('## Recommendation',1)[1].split('##',1)[0]; assert 'axum' in section.lower(), 'Recommendation section must contain axum'\""
fail_msg = "The Recommendation section must name axum as the chosen framework."

[[task.verify]]
phase = "coverage"
command = "python3 -c \"text=open('demo/hello-server/research.md').read().lower(); assert 'axum' in text and 'actix' in text and 'warp' in text, 'All three frameworks must appear in the research'\""
fail_msg = "research.md must evaluate axum, actix-web, and warp."

# ---------------------------------------------------------------------------

[[task]]
id = "T02"
title = "Scaffold the axum hello-server skeleton"
description = """Create the minimal Rust package `demo/hello-server/` that
compiles to a runnable binary using axum and tokio. You must create both files:

1. `demo/hello-server/Cargo.toml` — a standalone [package] (not a workspace
   member) named `hello-server` with version `0.1.0` and edition `2021`. The
   [dependencies] section must include:
     axum = "0.7"
     tokio = { version = "1", features = ["full"] }

2. `demo/hello-server/src/main.rs` — a complete, compilable axum application
   that:
     - Imports axum::routing::get and axum::Router
     - Defines an async handler function named `hello` that returns the static
       &'static str value `"Hello from Roko!"`
     - Builds a Router with `.route("/", get(hello))`
     - Binds a TcpListener on `0.0.0.0:3333` using tokio::net::TcpListener
     - Calls axum::serve(listener, app).await and propagates the error
     - Has a #[tokio::main] async fn main() -> Result<(), Box<dyn std::error::Error>>

Do not use .unwrap() anywhere in main.rs. Use `?` for all fallible operations.
Do not create any files outside `demo/hello-server/`.
Do not add `demo/hello-server` to the workspace Cargo.toml — leave the
workspace members list unchanged."""
status = "ready"
tier = "focused"
max_loc = 35
files = [
    "demo/hello-server/Cargo.toml",
    "demo/hello-server/src/main.rs",
]
role = "implementer"
depends_on = ["T01"]

[task.context]
read_files = [
    { path = "demo/hello-server/research.md", why = "Confirm axum was recommended before writing the implementation." },
    { path = "Cargo.toml", lines = "1-40", why = "Verify the workspace structure so the new package is kept standalone." },
]
symbols = [
    "axum::routing::get",
    "axum::Router",
    "tokio::net::TcpListener",
    "axum::serve",
]
anti_patterns = [
    "Do not use .unwrap() — every fallible call must use ? operator.",
    "Do not add demo/hello-server to the workspace Cargo.toml members list.",
    "Do not import crates beyond axum and tokio.",
    "Do not add a [workspace] table to demo/hello-server/Cargo.toml.",
]

[[task.verify]]
phase = "files-exist"
command = "test -f demo/hello-server/Cargo.toml && test -f demo/hello-server/src/main.rs"
fail_msg = "Both demo/hello-server/Cargo.toml and demo/hello-server/src/main.rs must exist."

[[task.verify]]
phase = "cargo-toml-schema"
command = "python3 -c \"import tomllib; d=tomllib.load(open('demo/hello-server/Cargo.toml','rb')); assert d['package']['name']=='hello-server'; assert d['package']['edition']=='2021'; deps=d.get('dependencies',{}); assert 'axum' in deps and 'tokio' in deps\""
fail_msg = "Cargo.toml must declare package name hello-server, edition 2021, and axum + tokio dependencies."

[[task.verify]]
phase = "no-unwrap"
command = "python3 -c \"src=open('demo/hello-server/src/main.rs').read(); assert '.unwrap()' not in src, 'main.rs must not contain .unwrap()'\""
fail_msg = "main.rs must not use .unwrap() — use ? for all fallible operations."

[[task.verify]]
phase = "compiles"
command = "cd demo/hello-server && cargo build --quiet 2>&1 | head -20"
fail_msg = "The hello-server package must compile without errors."

[[task.verify]]
phase = "hello-route"
command = "rg -q 'Hello from Roko' demo/hello-server/src/main.rs"
fail_msg = "main.rs must contain the exact string 'Hello from Roko' in the hello handler."

# ---------------------------------------------------------------------------

[[task]]
id = "T03"
title = "Add /health and /info endpoints"
description = """Extend `demo/hello-server/src/main.rs` to add two new JSON
endpoints in addition to the existing GET / handler. You must modify only
`demo/hello-server/src/main.rs`. Do not change Cargo.toml.

Add the following to Cargo.toml dependencies (by editing it):
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"

Then update src/main.rs to:

1. Add a GET /health handler named `health` that returns a JSON response body
   `{"status":"ok","version":"0.1.0"}`. Use serde_json::json! macro or a
   serializable struct — either approach is acceptable. The Content-Type must
   be application/json. Use axum::Json or axum::response::Json for the return
   type.

2. Add a GET /info handler named `info` that returns a JSON response body
   `{"built_by":"roko","plan":"demo-full-stack"}`. Same JSON response
   requirements as /health.

3. Update the Router to include:
     .route("/health", get(health))
     .route("/info", get(info))

Do not use .unwrap() anywhere. Do not remove the existing GET / route.
Do not create any new files — edit only demo/hello-server/Cargo.toml and
demo/hello-server/src/main.rs."""
status = "ready"
tier = "focused"
max_loc = 60
files = [
    "demo/hello-server/Cargo.toml",
    "demo/hello-server/src/main.rs",
]
role = "implementer"
depends_on = ["T02"]

[task.context]
read_files = [
    { path = "demo/hello-server/Cargo.toml", why = "Read the current dependency list before adding serde and serde_json." },
    { path = "demo/hello-server/src/main.rs", why = "Read the existing axum router structure before adding new routes." },
]
symbols = [
    "serde_json::json!",
    "axum::Json",
    ".route(\"/health\", get(health))",
    ".route(\"/info\", get(info))",
]
anti_patterns = [
    "Do not remove the existing GET / hello route.",
    "Do not use .unwrap() anywhere.",
    "Do not create additional source files.",
    "Do not hard-code a different built_by value.",
]

[[task.verify]]
phase = "compiles"
command = "cd demo/hello-server && cargo build --quiet 2>&1 | head -20"
fail_msg = "The hello-server package must still compile after adding the new endpoints."

[[task.verify]]
phase = "routes-present"
command = "rg -q '/health' demo/hello-server/src/main.rs && rg -q '/info' demo/hello-server/src/main.rs"
fail_msg = "src/main.rs must define both /health and /info routes."

[[task.verify]]
phase = "json-content"
command = "python3 -c \"src=open('demo/hello-server/src/main.rs').read(); assert 'ok' in src and '0.1.0' in src, '/health content must contain ok and 0.1.0'; assert 'roko' in src and 'demo-full-stack' in src, '/info content must reference roko and demo-full-stack'\""
fail_msg = "Handler implementations must contain the expected JSON field values."

[[task.verify]]
phase = "no-unwrap"
command = "python3 -c \"src=open('demo/hello-server/src/main.rs').read(); assert '.unwrap()' not in src, 'main.rs must not contain .unwrap()'\""
fail_msg = "main.rs must not use .unwrap() after endpoint additions."

[[task.verify]]
phase = "original-route-preserved"
command = "rg -q 'Hello from Roko' demo/hello-server/src/main.rs"
fail_msg = "The original GET / route returning 'Hello from Roko' must be preserved."

