[meta]
plan = "demo-incident-tabletop"
total = 4
done = 0
status = "fixture"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 7

[[task]]
id = "INC-1"
title = "Build an evidence-based incident risk register"
description = """Inspect README.md, Cargo.toml, and the centralized timeout
configuration. Create `demo/incident-tabletop/risk-register.csv` as strict CSV
with exactly these columns in order: `risk_id`, `signal`, `impact`, `owner`,
`trigger`, `mitigation`. Include at least five distinct operational risks. IDs
must be `RISK-01`, `RISK-02`, and so on; every cell must be non-empty; `signal`
must cite one inspected source path; and risks must cover provider failure,
timeouts, verification, workspace isolation, and state recovery. Do not modify
the inspected sources."""
status = "ready"
tier = "focused"
max_loc = 40
files = ["demo/incident-tabletop/risk-register.csv"]
role = "scribe"
depends_on = []

[task.context]
read_files = [
    { path = "README.md", lines = "1-220", why = "Identify documented execution and recovery behavior." },
    { path = "Cargo.toml", lines = "1-140", why = "Understand workspace scope and verification exposure." },
    { path = "crates/roko-core/src/config/timeouts.rs", lines = "1-210", why = "Ground timeout risks in actual runtime configuration." },
]
anti_patterns = [
    "Do not invent source paths or leave placeholder owners.",
    "Do not embed commas in unquoted CSV fields.",
    "Do not write product source code.",
]

[[task.verify]]
phase = "csv-schema"
command = "python3 -c 'import csv; p=\"demo/incident-tabletop/risk-register.csv\"; rows=list(csv.DictReader(open(p,newline=\"\"))); assert rows and list(rows[0])==[\"risk_id\",\"signal\",\"impact\",\"owner\",\"trigger\",\"mitigation\"]; assert len(rows)>=5; assert [r[\"risk_id\"] for r in rows]==[f\"RISK-{i:02d}\" for i in range(1,len(rows)+1)]; assert all(all(v.strip() for v in r.values()) for r in rows)'"
fail_msg = "Risk register must be strict, complete CSV with sequential IDs."

[[task.verify]]
phase = "risk-coverage"
command = "python3 -c 'import csv; rows=list(csv.DictReader(open(\"demo/incident-tabletop/risk-register.csv\"))); text=\" \".join(\" \".join(r.values()) for r in rows).lower(); assert all(x in text for x in (\"provider\",\"timeout\",\"verif\",\"worktree\",\"state\")); assert all(any(p in r[\"signal\"] for p in (\"README.md\",\"Cargo.toml\",\"crates/roko-core/src/config/timeouts.rs\")) for r in rows)'"
fail_msg = "Register must cover all five operational areas and cite inspected sources."

[[task]]
id = "INC-2"
title = "Design a timed tabletop scenario"
description = """Read the accepted risk register. Create
`demo/incident-tabletop/scenario.json` as strict JSON with exactly these
top-level keys: `schema_version`, `title`, `objectives`, `roles`, `injects`, and
`success_criteria`. Set schema_version to 1. Include at least three objectives,
three named roles, four injects, and four success criteria. Every inject must
have exactly `minute`, `source_risk`, `event`, `expected_action`, and
`evidence`; minutes must be strictly increasing non-negative integers and every
source_risk must reference an ID in risk-register.csv. Model decision-making
and communication, not code implementation."""
status = "ready"
tier = "mechanical"
max_loc = 100
files = ["demo/incident-tabletop/scenario.json"]
role = "implementer"
depends_on = ["INC-1"]

[task.context]
read_files = [
    { path = "demo/incident-tabletop/risk-register.csv", why = "Use accepted risk IDs and mitigations as scenario evidence." },
]
anti_patterns = [
    "Do not use comments or trailing commas in JSON.",
    "Do not reference a risk ID that is absent from the register.",
    "Do not make writing code the expected incident response.",
]

[[task.verify]]
phase = "json-schema"
command = "python3 -c 'import csv,json; base=\"demo/incident-tabletop/\"; risks={r[\"risk_id\"] for r in csv.DictReader(open(base+\"risk-register.csv\"))}; d=json.load(open(base+\"scenario.json\")); assert list(d)==[\"schema_version\",\"title\",\"objectives\",\"roles\",\"injects\",\"success_criteria\"]; assert d[\"schema_version\"]==1; assert len(d[\"objectives\"])>=3 and len(d[\"roles\"])>=3 and len(d[\"injects\"])>=4 and len(d[\"success_criteria\"])>=4; mins=[x[\"minute\"] for x in d[\"injects\"]]; assert all(type(x) is int and x>=0 for x in mins) and mins==sorted(set(mins)); assert all(set(x)=={\"minute\",\"source_risk\",\"event\",\"expected_action\",\"evidence\"} and x[\"source_risk\"] in risks for x in d[\"injects\"])'"
fail_msg = "Scenario must have the exact schema, ordered timing, and valid risk references."

[[task]]
id = "INC-3"
title = "Write the facilitator guide"
description = """Create `demo/incident-tabletop/facilitator-guide.md` from the
risk register and scenario. It must contain the exact headings `## Purpose`,
`## Preparation`, `## Roles`, `## Timeline`, `## Debrief`, and `## Evidence to
retain`. Include a Markdown timeline table with one row per JSON inject, name
every scenario role, reference both upstream artifact paths, provide at least
five debrief questions, and distinguish facilitator prompts from expected
participant actions. Do not modify the upstream artifacts."""
status = "ready"
tier = "focused"
max_loc = 150
files = ["demo/incident-tabletop/facilitator-guide.md"]
role = "scribe"
depends_on = ["INC-2"]

[task.context]
read_files = [
    { path = "demo/incident-tabletop/risk-register.csv", why = "Trace the guide to operational evidence." },
    { path = "demo/incident-tabletop/scenario.json", why = "Render every role and timed inject for a human facilitator." },
]
anti_patterns = [
    "Do not collapse facilitator prompts and participant actions into one instruction.",
    "Do not omit quiet evidence-capture and debrief work.",
]

[[task.verify]]
phase = "guide-structure"
command = "test -f demo/incident-tabletop/facilitator-guide.md && for h in '## Purpose' '## Preparation' '## Roles' '## Timeline' '## Debrief' '## Evidence to retain'; do rg -Fqx \"$h\" demo/incident-tabletop/facilitator-guide.md || exit 1; done"
fail_msg = "Facilitator guide must contain every required section."

[[task.verify]]
phase = "guide-traceability"
command = "python3 -c 'import json,re; p=\"demo/incident-tabletop/\"; d=json.load(open(p+\"scenario.json\")); text=open(p+\"facilitator-guide.md\").read(); assert \"demo/incident-tabletop/risk-register.csv\" in text and \"demo/incident-tabletop/scenario.json\" in text; assert all(str(x[\"minute\"]) in text for x in d[\"injects\"]); assert all((r if isinstance(r,str) else r.get(\"name\",\"\")) in text for r in d[\"roles\"]); section=text.split(\"## Debrief\",1)[1].split(\"## Evidence to retain\",1)[0]; assert section.count(\"?\")>=5; assert re.search(r\"\\|.*Minute.*\\|\",text,re.I)'"
fail_msg = "Guide must trace all scenario timing, roles, evidence, and debrief questions."

[[task]]
id = "INC-4"
title = "Audit the tabletop package without editing"
description = """Independently inspect all three generated artifacts. Confirm
that risks are evidence-backed, scenario injects reference real risks, timing
is usable, expected actions emphasize coordination and evidence, and the guide
can be facilitated without reading source code. Do not modify any file. Report
a concise pass/fail result and residual risks; executable checks are the
authoritative acceptance decision."""
status = "ready"
tier = "integrative"
max_loc = 0
files = []
role = "quick-reviewer"
depends_on = ["INC-3"]

[task.context]
read_files = [
    { path = "demo/incident-tabletop/risk-register.csv", why = "Audit evidence and coverage." },
    { path = "demo/incident-tabletop/scenario.json", why = "Audit timing and traceability." },
    { path = "demo/incident-tabletop/facilitator-guide.md", why = "Audit human usability." },
]

[[task.verify]]
phase = "package-audit"
command = "python3 -c 'import csv,json; p=\"demo/incident-tabletop/\"; rows=list(csv.DictReader(open(p+\"risk-register.csv\"))); d=json.load(open(p+\"scenario.json\")); guide=open(p+\"facilitator-guide.md\").read(); risks={r[\"risk_id\"] for r in rows}; assert all(x[\"source_risk\"] in risks for x in d[\"injects\"]); assert all(x[\"expected_action\"].strip() and x[\"evidence\"].strip() for x in d[\"injects\"]); assert guide.count(\"## \")>=6'"
fail_msg = "Final audit requires cross-artifact risk, action, evidence, and guide coverage."
