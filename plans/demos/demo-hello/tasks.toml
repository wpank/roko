[meta]
plan = "demo-hello"
total = 1
done = 0
status = "fixture"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 2

[[task]]
id = "DEMO-T01"
title = "Create the Roko plan-runner smoke artifact"
description = """Write `demo/roko-plan-smoke-output.md` with exactly these three lines,
replacing what the file holds now:

# Roko plan runner works

Created by the `demo-hello` example plan on DATE.

DATE is today's date in UTC as `date -u +%F` prints it, for example 2026-10-15.
Do not modify any other file. This intentionally tiny change exists only to make a
successful agent run and gate result immediately visible to a first-time user."""
status = "ready"
tier = "mechanical"
max_loc = 3
files = ["demo/roko-plan-smoke-output.md"]
role = "implementer"
depends_on = []

[[task.verify]]
phase = "structural"
# The date makes every run a real change: an older copy of the file (one is checked in)
# fails this check, so the plan is never refused for passing before an agent ran.
command = '''f=demo/roko-plan-smoke-output.md && test "$(head -1 "$f")" = '# Roko plan runner works' && grep -qxF "Created by the \`demo-hello\` example plan on $(date -u +%F)." "$f"'''
fail_msg = "demo/roko-plan-smoke-output.md must hold the three lines, with today's UTC date"
