[[task]]
id = "T02"
title = "Add regression test validating all example graphs parse"
role = "implementer"
files = ["crates/roko-graph/tests/example_graphs.rs"]
depends_on = ["T01"]
description = """Add a new integration test file at `crates/roko-graph/tests/example_graphs.rs`
that validates all `examples/graphs/*.toml` files parse successfully via the graph loader.

```rust
#[test]
fn all_example_graphs_parse_successfully() {
    let examples_dir = std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
        .parent()  // crates/
        .unwrap()
        .parent()  // workspace root
        .unwrap()
        .join("examples")
        .join("graphs");

    let mut failed = Vec::new();
    for entry in std::fs::read_dir(&examples_dir)
        .expect("examples/graphs/ must exist")
    {
        let path = entry.unwrap().path();
        if path.extension().and_then(|e| e.to_str()) == Some("toml") {
            let content = std::fs::read_to_string(&path)
                .unwrap_or_else(|e| panic!("cannot read {}: {e}", path.display()));
            if let Err(e) = roko_graph::loader::load_from_str(&content) {
                failed.push(format!("{}: {}", path.display(), e));
            }
        }
    }

    if !failed.is_empty() {
        panic!(
            "{} example graph(s) failed to parse:\\n{}",
            failed.len(),
            failed.join("\\n")
        );
    }
}
```

NOTE: Check that `roko_graph::loader::load_from_str` is public. If it isn't, look for
the actual public API to parse a graph from a TOML string (e.g., `load_from_str`,
`GraphLoader::load_str`, `RawGraphFile::from_str`, etc.) and use that instead.

Verify: `cargo test -p roko-graph -- all_example_graphs` passes."""
status = "done"
tier = "mechanical"

[[task.verify]]
phase = "structural"
command = "cargo check -p roko-graph"
