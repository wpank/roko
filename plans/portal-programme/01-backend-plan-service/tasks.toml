[[task]]
id = "T03"
title = "Implement plan listing in ServeRuntime"
description = """
Implement `CliRuntime::list_plans` and `CliRuntime::load_plan_summary` on the real
runtime in `crates/roko-cli/src/serve_runtime.rs`.

This is where roko-cli's working plan discovery gets exposed. Reuse the existing
functions rather than writing new discovery logic:

  roko_cli::plan::summarize_discovered_plans(workdir) -> Result<Vec<PlanSummary>, _>
  roko_cli::plan::overlay_graph_checkpoint_status(workdir, &mut summaries)
  roko_cli::plan::discover_plan_by_id(workdir, plan_id) -> Result<Option<PlanInfo>, _>

`summarize_discovered_plans` already handles both layouts: it calls `plans_dir`,
which prefers the top-level plans directory and falls back to the dotted roko
directory, and it walks plan directories looking for a tasks file rather than only
flat files. `overlay_graph_checkpoint_status` merges live graph checkpoint state so a
running plan reports accurate counts.

Map each `PlanSummary` into the `PlanSummaryDto` added in T02. Sort the result by id
so the response is deterministic.

For `load_plan_summary`, use `discover_plan_by_id`, which matches either the stable
plan id or the directory base name, then summarize just that one.

Handle discovery errors by returning them as anyhow errors with context naming the
workspace directory, not by returning an empty list. A broken plans directory should
be visible to the operator, not silently empty.
"""
status = "ready"
role = "implementer"
tier = "integrative"
max_retries = 2
estimated_minutes = 30
depends_on = ["T02"]
files = ["crates/roko-cli/src/serve_runtime.rs"]

