[meta]
plan = "01-backend-plan-service"
total = 10
done = 0
status = "ready"
skip_enrichment = true
estimated_total_minutes = 210

# Make roko-serve see the real plans on disk.
#
# Today GET /api/plans returns four junk UUID entries from .roko/plans/*.json and
# the ~35 real plan directories under plans/ are invisible. Root cause is three
# independent bugs in crates/roko-serve/src/routes/plans.rs, plus the structural
# fact that roko-serve cannot import roko-cli (the dependency runs cli -> serve).
# The fix widens the existing CliRuntime inversion seam.
#
# See tmp/portal-audit/01-FINDINGS.md section A2 and 03-CONTRACT.md section 2.1.

[[task]]
id = "T01"
title = "Add plan discovery methods to the CliRuntime trait"
description = """
Widen the `CliRuntime` trait in `crates/roko-serve/src/runtime.rs` with three new
async methods so the HTTP layer can ask roko-cli for real plans.

Add these alongside the existing `generate_plan_from_prd` and `run_plan`, each with a
default implementation that returns an explicit "runtime does not support plan
discovery" error, exactly matching the style already used for
`generate_plan_from_prd`:

  async fn list_plans(&self, workdir: &Path) -> anyhow::Result<Vec<PlanSummaryDto>>
  async fn load_plan_summary(&self, workdir: &Path, plan_id: &str) -> anyhow::Result<Option<PlanSummaryDto>>
  async fn load_plan_tasks(&self, workdir: &Path, plan_id: &str) -> anyhow::Result<Option<PlanTasksDto>>

The DTO type names you reference do not exist yet. T02 adds them, and T02 runs after
this task. So this task intentionally leaves roko-serve uncompilable: declare the
methods against the DTO type names, and T02 restores the build. That is why this
task's verify step is a grep rather than a compile check. Do not create the DTO types
here and do not stub them out to make the crate compile.

Why a trait method and not a direct import: roko-cli depends on roko-serve
(crates/roko-cli/Cargo.toml line 67), never the reverse, so roko-serve cannot call
the CLI plan loader directly. `CliRuntime` is the established inversion seam for
exactly this and already carries two plan-related methods.

Do not change any existing method signature. Do not remove the existing defaults.
"""
status = "ready"
role = "implementer"
tier = "integrative"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["crates/roko-serve/src/runtime.rs"]

[task.context]
read_files = [
    { path = "crates/roko-serve/src/runtime.rs", why = "the trait being widened; copy the default-impl style from generate_plan_from_prd" },
    { path = "crates/roko-serve/Cargo.toml", why = "confirms roko-serve does not and cannot depend on roko-cli" },
    { path = "crates/roko-cli/Cargo.toml", why = "shows the dependency edge runs roko-cli to roko-serve" },
]
anti_patterns = [
    "Do not add roko-cli as a dependency of roko-serve. That would create a dependency cycle.",
    "Do not change the signature of any existing CliRuntime method.",
    "Do not make the new methods non-default; existing test runtimes must keep compiling.",
]

[[task.verify]]
phase = "structural"
command = "grep -q 'fn list_plans' crates/roko-serve/src/runtime.rs && grep -q 'fn load_plan_tasks' crates/roko-serve/src/runtime.rs"
fail_msg = "CliRuntime does not declare list_plans and load_plan_tasks"

[[task]]
id = "T02"
title = "Define plan transport types in roko-serve"
description = """
Add the DTO types that `CliRuntime`'s new methods return, in
`crates/roko-serve/src/plan_types.rs`. These are plain serializable structs owned by
roko-serve so the trait has no roko-cli types in its signature.

Define:

  PlanSummaryDto { id, title, task_count, tasks_done, tasks_failed, completed,
                   status, superseded_by, old_format, last_error }
  PlanTaskDto    { id, title, description, role, tier, status, depends_on, files,
                   completed, verify_phases }
  PlanTasksDto   { plan_id, task_count, tasks: Vec<PlanTaskDto> }

Field-for-field these mirror `PlanSummary` in crates/roko-cli/src/plan.rs, which is
already the exact shape the HTTP response wants, and `TaskDef` in
crates/roko-cli/src/task_parser.rs. Derive Debug, Clone, Serialize and Deserialize.
Use serde snake_case, which is the default for these field names, because the portal
reads snake_case on the wire.

After adding the types, make the crate compile: the trait methods from T01 must
resolve. Add the module declaration wherever the other modules in the crate are
declared.
"""
