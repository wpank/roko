[[task]]
id = "T04"
title = "Implement plan task loading in ServeRuntime"
description = """
Implement `CliRuntime::load_plan_tasks` in `crates/roko-cli/src/serve_runtime.rs`.

Resolve the plan with `roko_cli::plan::discover_plan_by_id(workdir, plan_id)`, take
its tasks file path, and parse it with `TasksFile::parse` from
crates/roko-cli/src/task_parser.rs. That parser understands the real schema, which is
a meta table plus an array of task tables. The legacy parser in
crates/roko-serve/src/routes/plans.rs cannot read that schema at all and is the third
reason directory plans are currently invisible.

Map each parsed task into the `PlanTaskDto` from T02. Carry `depends_on` through
faithfully, because the portal computes the DAG waves from it client side; there is
no event that carries task edges. Populate `verify_phases` with the phase string of
each verify step so the Compose view can show them without a second request.

Return Ok(None) when the plan id does not resolve, so the route layer can produce a
clean 404 instead of an error page.
"""
