# Make POST /api/plans/{id}/execute actually run a plan.
#
# Today it returns 202 and then always fails, because the call chain terminates in
# crates/roko-cli/src/runner/mod.rs run(), a deprecated stub that unconditionally
# bails with "the legacy Runner-v2 event loop has been removed". Every Execute
# button in the portal has always been a no-op that reports success then fails.
#
# See tmp/portal-audit/01-FINDINGS.md section A1 and 03-CONTRACT.md section 2.3.

[[task]]
id = "T01"
title = "Design the lib-side graph plan-run entry point"
description = """
Before changing anything, settle the design and record it in
`plans/portal-programme/02-backend-plan-execution/EXECUTION-PATH.md`.

There is a crate boundary in the way, and getting it wrong wastes the whole plan.
`commands/plan.rs` belongs to the **binary** crate (`crates/roko-cli/src/main.rs`
declares `mod commands;`). `serve_runtime.rs` belongs to the **library** crate
(`crates/roko-cli/src/lib.rs` declares `pub mod serve_runtime;`). The binary depends on
the library, never the reverse, so **`serve_runtime.rs` cannot call anything in
`commands/plan.rs`**, no matter what visibility it is given.

The graph plan-run entry point currently lives in the binary, is private, and takes a
`cli: &Cli` parameter whose type is private to `main.rs`. So it cannot simply be made
public either.

Trace and write down, with file and line for each hop:

  1. The route handler that spawns the execution task.
  2. The runtime trait method it calls.
  3. The roko-cli implementation of that method, and the exact line where it reaches
     the deprecated stub in `crates/roko-cli/src/runner/mod.rs`.
  4. The graph entry point in `crates/roko-cli/src/commands/plan.rs`, with its full
     parameter list.

Then design the extraction. The library already has `crates/roko-cli/src/graph_execution/`
(declared at `lib.rs:161`) holding the supporting pieces — the control adapter, the
feedback settler, the delivery service, the identity map. That is the right home.

Specify:

  - A parameter struct, owned by the library, carrying everything the run needs and
    **mentioning no type private to `main.rs`**. Go through the entry point's parameter
    list one by one and say, for each, whether it becomes a struct field, gets a
    default, or is dropped.
  - The signature of the library function that takes it.
  - Which parts of the current body move to the library and which stay in the binary
    because they are genuinely CLI concerns, such as argument parsing, the TUI launch,
    and terminal progress printing.

This is the same inversion the previous plan solved with the runtime trait, one layer
down. Do not propose making `Cli` public, and do not propose moving `commands/plan.rs`
into the library — it is written against the binary's namespace with `use crate::*`.
"""
status = "ready"
role = "implementer"
tier = "architectural"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 30
depends_on = []
files = ["plans/portal-programme/02-backend-plan-execution/EXECUTION-PATH.md"]

