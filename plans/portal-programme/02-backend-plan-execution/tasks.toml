# Make POST /api/plans/{id}/execute actually run a plan.
#
# Today it returns 202 and then always fails, because the call chain terminates in
# crates/roko-cli/src/runner/mod.rs run(), a deprecated stub that unconditionally
# bails with "the legacy Runner-v2 event loop has been removed". Every Execute
# button in the portal has always been a no-op that reports success then fails.
#
# See tmp/portal-audit/01-FINDINGS.md section A1 and 03-CONTRACT.md section 2.3.

[[task]]
id = "T01"
title = "Document the live plan execution path"
description = """
Before changing anything, establish exactly which function must replace the
deprecated stub, and record it in `plans/portal-programme/02-backend-plan-execution/EXECUTION-PATH.md`.

Trace and write down, with file and line for each hop:

  1. The route handler that spawns the execution task.
  2. The runtime trait method it calls.
  3. The roko-cli implementation of that method.
  4. The function inside that implementation which currently reaches the deprecated
     stub in crates/roko-cli/src/runner/mod.rs.
  5. The graph engine entry point that `roko plan run` uses instead, in
     crates/roko-cli/src/commands/plan.rs, together with its full parameter list.

Then state which parameters of that engine entry point the HTTP path can supply,
which need defaults, and what each default should be. The HTTP caller has no
command-line arguments object, so this mapping is the real design decision of the
plan and every later task depends on getting it right.

Note explicitly whether the engine entry point is private to its module. If it is,
