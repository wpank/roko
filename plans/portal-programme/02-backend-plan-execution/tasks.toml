[[task]]
id = "T05"
title = "Make plan cancellation actually cancel"
description = """
Fix a real bug adjacent to the execute handler in
`crates/roko-serve/src/routes/plans.rs`.

The plan handle stored in the active plans map holds a cancel token that is created
fresh and **never passed to the spawned execution task**. The pause handler calls
cancel on it, which therefore signals nobody; only the abort call on the following
line has any effect, and aborting a task mid-await leaves no chance for ordered
shutdown.

Create the cancel token before spawning, move a clone into the spawned task, and have
the execution path observe it so a cancel request unwinds the run in an orderly way
rather than being aborted. Keep abort as a last resort with a short grace period, not
as the primary mechanism.

Also fix the neighbouring field error: the handle records the whole plans directory as
its plan directory instead of the specific plan's directory.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = ["T04"]
files = ["crates/roko-serve/src/routes/plans.rs"]

[task.context]
read_files = [
    { path = "crates/roko-serve/src/routes/plans.rs", why = "the execute and pause handlers and the token that is never passed" },
    { path = "crates/roko-serve/src/state.rs", why = "the plan handle struct holding the cancel token and plan directory" },
]
anti_patterns = [
    "Do not rely on abort alone. Aborting mid-await skips ordered shutdown.",
    "Do not leave the plan directory field pointing at the whole plans directory.",
]

[[task.verify]]
phase = "compile"
command = "cargo check -p roko-serve"
fail_msg = "roko-serve does not compile after fixing cancellation"

[[task]]
