[[task]]
id = "T02"
title = "Extract the graph plan-run entry point into the library crate"
description = """
Create `crates/roko-cli/src/graph_execution/plan_runner.rs` in the **library** crate and
move the graph plan-run body there, following the design from T01.

This is the crux of the plan. The binary cannot be called from the library, so the
shared code has to live in the library and both sides call it.

Do this:

  1. Add a parameter struct in the new module carrying what the run needs — the plans
     directory, the workspace directory, the resolved config, retry and task limits,
     budget settings, the model override, the permission flag, and the worktree flag.
     It must reference no type private to `main.rs`. Give it a `Default` where that is
     sensible so an HTTP caller can fill in only what it knows.
  2. Move the graph execution body out of `crates/roko-cli/src/commands/plan.rs` into a
     public async function in the new module that takes that struct and returns the
     run report.
  3. Leave in the binary only what is genuinely a CLI concern: argument parsing, the
     TUI launch, terminal progress printing, and translating `Cli` into the new struct.
  4. Declare the module in `crates/roko-cli/src/graph_execution/mod.rs` and re-export
     the function and the struct so `serve_runtime.rs` can reach them.
  5. Make `commands/plan.rs` call the new library function.

`roko plan run` must behave exactly as before. That is the acceptance bar: this is a
move, not a redesign. If a piece of the body genuinely cannot move because it depends
on binary-only types, leave it in the binary, pass its result in through the struct,
and say so in the task output.
"""
