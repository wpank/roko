[[task]]
id = "T04"
title = "Stream agent output during dispatch instead of after"
description = """
Make the transcript arrive while the agent is working.

In crates/roko-cli/src/graph_task_dispatch.rs, the function that forwards dispatch
events to the bridge is invoked **after** the shared agent bridge call has already
returned. The whole transcript is therefore replayed in one burst when the agent is
already done. The doc comment on that function says so outright.

Move the forwarding into a streaming callback that fires as records are produced,
rather than draining a completed collection. Preserve the existing record framing
exactly: output is wrapped in a record separator, a version marker and a JSON body
whose kind is one of text, reasoning, tool start or tool result. The portal parses
that framing, so changing it breaks the transcript.

Preserve the existing truncation of oversized tool output, which keeps the tail
rather than the head.

If the shared agent bridge has no streaming hook today, add the narrowest one that
serves this purpose, and say in the task output what you added.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 35
depends_on = ["T03"]
files = ["crates/roko-cli/src/graph_task_dispatch.rs"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/graph_task_dispatch.rs", why = "the forwarding function, its two post-completion call sites and the truncation rule" },
    { path = "crates/roko-cli/src/runner/tui_bridge.rs", why = "the record framing constants and the agent output publisher" },
]
anti_patterns = [
    "Do not change the record framing. The portal parses the prefix and the JSON body.",
    "Do not remove the oversized tool output truncation.",
    "Do not buffer the whole transcript and flush at the end. That is the current behaviour being fixed.",
]

[[task.verify]]
