[[task]]
id = "T03"
title = "Publish token usage and cost for every provider call"
description = """
Tokens and cost never reach the dashboard. Nothing calls `TuiBridge::token_usage`
(`crates/roko-cli/src/runner/tui_bridge.rs`), and nothing publishes a `cost_usd`
efficiency event. So the agent token fields and the `SnapshotStats` totals stay 0, and
the portal shows "$0.00 · 0 tok" for an agent that clearly ran.

The numbers are already in scope in `GraphTaskDispatcher::emit_feedback`
(`crates/roko-cli/src/graph_task_dispatch.rs`). That is where the `CostRecord` for
`.roko/learn/costs.jsonl` is built from `dispatch.result.usage`.

Next to that `CostRecord` construction, publish through `self.tui_bridge` when it is
set. Keep this outside the `if let Some(costs_path)` block, so it does not depend on
the costs log being configured:

  - `token_usage(plan_id, task_id, input, output, cache_read, cache_write)`, taken
    from `dispatch.result.usage` (`input_tokens`, `output_tokens`,
    `cache_read_tokens`, `cache_create_tokens`).
  - `efficiency_event(plan_id, task_id, "cost_usd", cost)`, with the dispatch's
    `cost_usd`.

`plan_id` is `spec.plan_id` and `task_id` is `task.id`. The metric names must be the
exact strings matched by the `EfficiencyEvent` arm of `DashboardSnapshot::apply`
(`crates/roko-core/src/dashboard_snapshot.rs`). Read it and use them verbatim. That fold
attributes the numbers to the agent that `forward_dispatch_events_to_tui` announced for
the task, so publish after it.

Do not change how the `CostRecord` is written.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
