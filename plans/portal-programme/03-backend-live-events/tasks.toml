[meta]
plan = "03-backend-live-events"
total = 11
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 250

# Make a running plan observable.
#
# Three defects make the run view impossible even once execution works:
#   - task status arrives batched 0 to M, because poll_status_changes has zero callers
#   - tokens and cost never reach the dashboard, because token_usage has zero callers
#   - agent output replays in one burst after the agent has already finished
# And a fourth, deeper one: a CLI plan run publishes to an in-process state hub that
# the HTTP server never sees.
#
# Every fix here is a call-site change. None requires a schema change.
# See tmp/portal-audit/01-FINDINGS.md sections A3 and B1 to B4.

[[task]]
id = "T01"
title = "Emit live task status transitions during plan execution"
description = """
Make per-task status arrive as it happens instead of in two batches.

Today the graph plan run emits a task started event for **every node at once, before
execution begins**, and a task completed event for **every node in one batch after
the whole plan finishes**. Progress therefore jumps from zero to complete with
nothing in between, which is why the portal can never show a task in flight.

The function that emits live transitions already exists:
`GraphTuiBridge::poll_status_changes` in crates/roko-cli/src/runner/graph_tui_bridge.rs.
It has zero production callers; only tests call it.

Call it from the polling loop in crates/roko-cli/src/commands/plan.rs, the same loop
that currently polls for TUI commands. Poll status on each iteration and emit only
the transitions that changed since the previous poll, so the event stream carries
deltas rather than repeated full states.

Then remove the up-front burst that marks every node as started before execution.
A node that has not been dispatched is pending, not started.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 30
depends_on = []
files = ["crates/roko-cli/src/commands/plan.rs"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/commands/plan.rs", why = "the polling loop and the two batch emission sites" },
    { path = "crates/roko-cli/src/runner/graph_tui_bridge.rs", why = "poll_status_changes, which already computes transitions and has no callers" },
    { path = "crates/roko-cli/src/runner/tui_bridge.rs", why = "the bridge methods that publish task events" },
]
anti_patterns = [
    "Do not emit a started event for a node that has not been dispatched.",
    "Do not re-emit unchanged states on every poll. Emit deltas only.",
    "Do not write a second status-diffing implementation. The existing one is correct and unused.",
]

[[task.verify]]
phase = "compile"
command = "cargo check -p roko-cli"
fail_msg = "roko-cli does not compile after wiring live task status"

[[task.verify]]
phase = "structural"
command = "grep -q 'poll_status_changes' crates/roko-cli/src/commands/plan.rs"
fail_msg = "the plan run loop does not call poll_status_changes"

[[task]]
id = "T02"
title = "Emit token usage from the dispatch cost site"
description = """
Make token counts reach the dashboard. Today they are structurally guaranteed to be
zero: `TuiBridge::token_usage` in crates/roko-cli/src/runner/tui_bridge.rs has **zero
callers anywhere**, so every agent's token fields and the snapshot totals read zero
forever. That is why the portal shows zero tokens on an agent that clearly ran.

The data already exists at the right place. In
crates/roko-cli/src/graph_task_dispatch.rs there is a site that builds a cost record
and appends it to the learning costs log. Every field the event needs is already in
scope there: the plan id, task id, role, model, input tokens, output tokens, cached
tokens, cost and duration.

Call the bridge's token usage method at that same site, passing the plan id and task
id so the event can be attributed to a task rather than only to an agent.

Do not move or restructure the cost record writing. Add the event emission next to
it.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = ["T01"]
files = ["crates/roko-cli/src/graph_task_dispatch.rs"]

