[[task]]
id = "T06"
title = "Give plan run an opt-in hub bridge flag"
description = """
Add the mechanism that lets a CLI plan run publish into a state hub the HTTP server
can read.

Today `roko plan run` uses the shared in-process state hub, which has no event log,
no socket and no HTTP, so a terminal run is completely invisible to the portal. The
server builds a different hub object entirely. The bridge that would join them,
the hub inter-process server in crates/roko-cli/src/state_hub_ipc.rs, has **zero
production call sites**.

The module is already declared in `crates/roko-cli/src/lib.rs` and compiles cleanly —
that was done ahead of this task, so you do not need to make it build. Your job is to
wire it.

Add an opt-in flag to the plan run command, off by default, that starts the hub
inter-process server for the duration of the run. Off by default because a plain
terminal run should not open a socket without being asked.

This task adds the flag, the plumbing and the lifecycle: start before the run, shut
down cleanly afterwards, and do not fail the run if the bridge cannot start. Report
a warning and continue. The server side is T07.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 30
