[[task]]
id = "T05"
title = "Publish run_completed on every exit path"
description = """
`DashboardEvent::RunCompleted { outcome, duration_ms, cleanup_degraded,
surviving_agent_ids, surviving_agent_pids }` (`crates/roko-core/src/dashboard_snapshot.rs`)
is never published by a Graph run. So the snapshot's `run_duration_ms` and
`run_outcome` stay null, and the portal has no elapsed time or terminal state for a
run.

In `crates/roko-cli/src/graph_execution/plan_runner.rs`, publish it exactly once per run,
into the hub the run uses (the caller's hub when one was passed in), on every exit
path.
That includes the early `?` returns: plan load, config, provider preflight, extension
start-up and checkpoint errors.

  - Resolve the hub first and take an `Instant` there. Run the rest of the body as an
    inner function, publish `RunCompleted` from the outer function based on the
    inner result, then return that result.
  - `outcome` is "succeeded" when the run returns `EXIT_SUCCESS`. It is "cancelled"
    when the run was stopped on purpose:
    - a TUI cancel (`was_cancelled_by_tui`);
    - a stop request through `GraphPlanRunParams.interrupt`, where
      `PlanRunInterruptHandle::requested()` is `Some` and the run returns
      `PlanRunInterrupt::exit_code()` (130 or 143).
    Thread that fact out of the body. Otherwise it is "failed", including every `Err`.
  - Plans a stop leaves unstarted keep `phase: "pending"` and get no event of their
    own; this `RunCompleted` is what tells a client the whole run is over.
  - `duration_ms` is measured from that `Instant`. Set `cleanup_degraded` to false and
    leave the surviving-agent lists empty; the Graph path tracks neither.

Publish with `TuiBridge::publish_event` or the hub sender. Do not go through
`TuiBridge::runner_event`, which also writes a legacy event-log entry.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 25
