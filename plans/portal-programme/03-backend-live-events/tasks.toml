fail_msg = "roko-cli does not compile after streaming agent output"

[[task]]
id = "T05"
title = "Emit a run completion event carrying elapsed time"
description = """
Emit the run completed dashboard event at the end of a graph plan run, in
crates/roko-cli/src/commands/plan.rs.

The variant exists and carries the run outcome, the duration in milliseconds, whether
cleanup was degraded, and any surviving agent ids and process ids. It is **never
emitted in the graph path**, so the snapshot's run duration and run outcome stay
null and the portal has no elapsed time for the run.

Emit it on every terminal path, including cancellation and failure, not only on
success. A run that was cancelled still has an elapsed time and still needs to leave
the running state in the portal.

Take the start instant at the point the run actually begins, not when the command is
parsed.
"""
