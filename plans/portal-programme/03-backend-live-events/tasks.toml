# One runner per workspace, and a running plan observable live on the hub its watchers
# read.
#
# Prerequisite, landed by e2-planset on 2026-09-28: server-initiated runs publish into
# the server's hub. `GraphPlanRunParams.state_hub` is passed by
# `run_plan_on_local_runtime` (serve_runtime.rs); test
# `graph_execution::plan_runner::tests::provided_state_hub_receives_the_runs_plan_events`.
# Without it the live check in T06 sees no task events at all. e2 does not publish
# RunCompleted; T05 does.
#
#   T01      server runs take the same runner lock as `roko plan run`, so two runners
#            can never execute in one workspace (first: concurrent runners corrupt state)
#   T02-T05  live task status, token and cost, a visible agent, run_completed
#   T06      live acceptance check (plans/portal-programme/_harness/live-events-check.sh)
#   T07      contract as built, work items
#
# Deliberately NOT here: streaming the agent transcript. Every provider agent is
# wrapped by the immune boundary (crates/roko-agent/src/immune_boundary.rs), which
# lets only the screened final body out. That is a safety decision, not a wiring gap.
#
# The rest of "the server owns the workspace" (cancel, run sets, CLI clients) is plan
# 03b-backend-workspace-server. See tmp/portal-audit/03-CONTRACT.md sections 3 and 4.

[[task]]
id = "T01"
title = "Hold the runner lock for server-initiated runs"
description = """
Two runners can execute in one workspace at once, sharing its checkpoints, git working
tree and learning files.

  - `roko plan run` takes `.roko/runtime/roko.runner.lock` through
    `workspace_lock::acquire_runner_lock` (`PlanCmd::Run` in
    `crates/roko-cli/src/commands/plan.rs`).
  - The server's run path takes no lock at all.
  - `roko serve` holds only the workspace lock, `roko.lock`, which `plan run` never
    takes.

Verified 2026-09-28: `roko plan run` completes inside a workspace while `roko serve`
runs there. The dogfood log's N-1 diagnosis, that both take the exclusive workspace
lock, is stale.

In `run_plan_on_local_runtime` (`crates/roko-cli/src/serve_runtime.rs`), acquire
`crate::workspace_lock::acquire_runner_lock(&workdir.join(".roko"))` before anything
else touches the workspace, and hold the guard until the run returns. Server runs and
CLI runs then exclude each other through the same lock file. If the lock is held,
return its error unchanged; it names the owning PID. Do not retry or wait.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 15
depends_on = []
files = ["crates/roko-cli/src/serve_runtime.rs"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/serve_runtime.rs", why = "run_plan_on_local_runtime, the server's plan run path" },
    { path = "crates/roko-cli/src/workspace_lock.rs", why = "acquire_runner_lock and the guard it returns" },
]
anti_patterns = [
    "Do not take the workspace lock roko.lock here: the server process already holds it exclusively.",
    "Do not wait for or retry the lock; fail with the lock's own error.",
]

