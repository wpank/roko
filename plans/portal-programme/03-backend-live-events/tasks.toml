    { path = "crates/roko-cli/src/runner/tui_bridge.rs", why = "the token usage method being called and the events it publishes" },
    { path = "crates/roko-core/src/dashboard_snapshot.rs", why = "the efficiency event variant and the metric names the snapshot recognises" },
]
anti_patterns = [
    "Do not change how the cost record is written to the learning log.",
    "Do not emit token events without the plan and task ids. Per-agent attribution alone is not enough for the run view.",
]

[[task.verify]]
