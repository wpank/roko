[[task]]
id = "T02"
title = "Emit live per-task status from the run loop"
description = """
The Graph run reports task status wrongly in both directions. Both sites are in
`crates/roko-cli/src/graph_execution/plan_runner.rs`, in the per-plan loop.

  - Before the flow starts, a pre-population loop calls
    `graph_tui_bridge.node_started(..)` for every task. Every task therefore shows as
    started at once.
  - After `flow_handle.await_completion()`, `graph_tui_bridge::emit_plan_lifecycle`
    publishes every completion in one batch, when the plan is already over.

`GraphTuiBridge::poll_status_changes` (`crates/roko-cli/src/runner/graph_tui_bridge.rs`)
already turns two status maps into TaskStarted/TaskCompleted deltas, ETA included. It
has no production caller.

Do this in the per-plan loop:

  1. Delete the pre-population loop. A task that has not been dispatched is pending,
     not started.
  2. Build the title map once with `graph_tui_bridge::build_node_title_map(&tasks)`.
  3. In the existing 100 ms command-polling loop (the one draining `exec_cmd_rx`),
     read `flow_handle.status().node_statuses`. Keep only node ids present in the
     title map; the rich topology adds helper nodes that are not tasks. Call
     `graph_tui_bridge.poll_status_changes(&plan.id, &previous, &current, &titles)`,
     then make `current` the new `previous`.
  4. After `await_completion()` returns output, emit the remaining transitions with
     one more `poll_status_changes` call. Build its `current` from
     `output.node_results` (node id → status, filtered the same way). Then call
     `graph_tui_bridge.plan_completed(&plan.id, execution_succeeded)`. Remove the
     `emit_plan_lifecycle` call from this path, so no completion is published twice.
     Leave the branch where the flow produced no output as it is.

Each task then produces exactly one TaskStarted and one TaskCompleted, in execution
order.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 30
depends_on = ["T01"]
files = ["crates/roko-cli/src/graph_execution/plan_runner.rs"]
closes = ["gap-d40bc0"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/graph_execution/plan_runner.rs", why = "the pre-population loop, the command-polling loop and the emit_plan_lifecycle call" },
    { path = "crates/roko-cli/src/runner/graph_tui_bridge.rs", why = "poll_status_changes and build_node_title_map, written and tested but never called" },
    { path = "crates/roko-graph/src/engine.rs", why = "FlowHandle::status returns FlowStatus.node_statuses, a HashMap<NodeId, NodeStatus>" },
]
anti_patterns = [
