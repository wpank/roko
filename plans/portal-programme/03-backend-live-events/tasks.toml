[[task]]
id = "T04"
title = "Show a working agent while it works"
description = """
An agent is invisible for its whole turn. In `GraphTaskDispatcher::dispatch`
(`crates/roko-cli/src/graph_task_dispatch.rs` — the path `TaskExecutorCell` calls, not
`dispatch_streaming`), the dispatcher awaits
`self.factory.run_shared_agent_bridge(request)`. Only afterwards does it call
`forward_dispatch_events_to_tui`, which publishes `agent_spawned`, the transcript and
`agent_completed` in one burst.

The transcript cannot be streamed, and this task must not try. Every provider agent is
wrapped by the immune boundary (`crates/roko-agent/src/immune_boundary.rs`), which lets
only the screened final body cross — its `run_streaming` says "Provider events are not
replayed". The Claude CLI adapter has no `run_streaming` override either. Streaming the
transcript is a safety decision, and the last task of this plan records it as a gap.

The agent's existence and elapsed time can and must be live:

  1. Publish `agent_spawned` immediately before the dispatch starts. Use the same
     agent id, role, model slug and provider that the forwarder uses today; all of
     them are known from `dispatch_plan` before the call. Remove the call from
     `forward_dispatch_events_to_tui`, so it is published exactly once.
  2. While the dispatch future is pending, publish
     `TuiBridge::agent_heartbeat(agent_id, plan_id, task_id, elapsed_ms)` every 5
     seconds. Use a named constant `AGENT_HEARTBEAT_INTERVAL`, and drive it by
     selecting the dispatch future against a `tokio::time::interval`. Nothing calls
     `agent_heartbeat` today, so the agent's `elapsed_ms` stays 0.
  3. After the dispatch returns, keep forwarding the screened transcript and
     `agent_completed` exactly as now, for success and failure alike. If the dispatch
     fails with an error, still publish `agent_completed` before returning the error,
     so no agent is left "running" on the dashboard.
  4. Fix a panic in `forward_dispatch_events_to_tui` while you are in it. Its
     tool-output truncation slices `&output[output.len() - 1024..]` by byte, which
     panics when that index falls inside a multi-byte character. Floor the index to a
     char boundary, and keep the `[...truncated]\\n` prefix, which the portal's
     transcript detects.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 30
depends_on = ["T03"]
files = ["crates/roko-cli/src/graph_task_dispatch.rs"]
closes = ["bug-45c355"]

[task.context]
