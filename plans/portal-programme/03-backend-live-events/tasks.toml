## How to verify inside a plan run

This task runs INSIDE `roko plan run`, which holds an **exclusive** workspace lock
(`commands/plan.rs:302`). `roko serve` acquires the same exclusive lock
(`commands/server.rs:10`), so **you cannot start the server, and you must not try** —
it will fail with "Another roko process holds an exclusive lock" and you will burn the
task's time budget retrying.

Verify everything that does not need a running server, and there is a lot of it:

  - read the code and confirm the change is actually present, citing file and line
  - run `cargo test` / `cargo check` on the affected crates, and quote the real output
  - run the crate's own integration tests, which exercise the handlers directly
    through the router without binding a port
  - inspect artifacts on disk

Then write the report, and give it a section headed exactly
`## Deferred: live-server checks` listing each check that genuinely needs a running
server, as a command the operator can paste. Be specific — the endpoint, the expected
response, and what it would prove.

A report that honestly separates "verified here" from "deferred" is worth far more
than one that claims a live check it could not perform. Do not fabricate server
output.
"""
