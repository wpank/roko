[[task]]
id = "T09"
title = "Add POST /api/plans/execute to run a set of plans or all of them"
description = """
The portal needs "Run all" and a per-group run (section 6, P-6 of
`tmp/portal-audit/03-CONTRACT.md`). The CLI client (T12) needs to submit exactly the
directory the user named. `POST /api/plans/{id}/execute` takes one plan id.

Register `POST /api/plans/execute` in `crates/roko-serve/src/routes/plans.rs`. It is a
static segment, like `/plans/generate`, and stays under the `/api/plans` →
`plan:write` scope. Body, all fields optional: `{ "plans": ["<plan id>", ...],
"target": "<workspace-relative directory>", "resume": false, "max_parallel_plans": 2 }`.

  1. `plans` and `target` are mutually exclusive: both given is 400.
     - `plans`: run those ids from the workspace plans root (`plans_dir`), via
       `PlanRunOptions.only_plans`.
     - `target`: resolve it against `state.workdir` and canonicalize it. Reject with
       400 anything that is not a directory inside the workspace: absolute paths,
       `..` escapes, and symlinks that point out.
     - Neither: run every plan under the plans root ("Run all").
  2. Answer 409 while any run is active (`active_run_conflict`, T01).
  3. Compute the order with `runtime.plan_run_order(..)` before spawning. An error
     naming an unknown plan id is 404; any other ordering error is 422 with its
     message.
  4. `max_parallel_plans`, when given, must be at least 1; otherwise answer 422. Pass
     it as `PlanRunOptions.max_parallel_plans`. The effective limit is the body's
     value, else the loaded config's `[conductor] max_parallel_plans`.
  5. Spawn `runtime.run_plan_with_options(..)` with a new cancel token and `resume`
     mapped as in T05. Register a `PlanHandle` keyed by a new run id, with `members`
     set to the order, so status and cancel work through the run id or any member
     id. On `Err`, publish `ServerEvent::Error`. Publish no plan_started or
     plan_completed for the run id: the run publishes its own per-plan events,
     plan_set_loaded and run_completed.
  6. Respond 202 with `{ "id": run_id, "order": [...], "max_parallel_plans": <the
     effective limit> }`. `order` is the dependency order. With a limit above 1,
     independent plans start together.

However many of its plans run at once, a set run is one run:
  - one `PlanHandle`;
  - one runner lock;
  - one 409 for any other execute;
  - a cancel through the run id or any member plan id stops all of its plans.
"""
