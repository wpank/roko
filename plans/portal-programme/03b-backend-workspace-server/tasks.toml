[[task]]
id = "T03"
title = "Make server runs honour cancel, resume options and plan subsets"
description = """
Implement T02's methods for `RokoCliRuntime` (`crates/roko-cli/src/serve_runtime.rs`),
and make `run_plan` delegate to `run_plan_with_options(.., PlanRunOptions::default())`.

  - `fresh`/`force_resume`: thread them through `run_plan_on_local_runtime` into
    `GraphPlanRunParams`, where both are hard-coded `false` today. Without
    `force_resume`, a plan edited since its last run fails as soon as it starts:
    "cannot resume Graph checkpoint … use --fresh or --force-resume".
  - `only_plans`: add `pub only_plans: Option<Vec<String>>` to `GraphPlanRunParams`
    (`crates/roko-cli/src/graph_execution/plan_runner.rs`); `None` everywhere else,
    including `cmd_plan_run_engine`. After `load_plans`, keep only those ids and fail
    naming any id that was not found. Then order the subset exactly as today.
  - `max_parallel_plans`: pass it to the Graph run as a run parameter.
    - The parallel plan-set change, a separate engine change in this push, adds a
      per-run limit to `GraphPlanRunParams`. Use that field, with `None` when the
      option is `None`.
    - Never apply it by editing the config the plans are built from. Every node's
      config, and so the checkpoint fingerprint, includes the full config, so such an
      edit would make each later resume fail with "the converted plan graph has
      changed".
    - If the field does not exist yet, leave the option unused and say so in the
      task output. Do not add plan scheduling here.
  - `plan_run_order`: expose the ordering the run uses as a public function in
    `plan_runner.rs`, taking the plans directory and the optional id filter and
    returning the ids in execution order. Implement the trait method with it. Do not
    duplicate the topological sort.
  - cancel: use the stop input the Graph run already has; do not add a second
    mechanism. Create a `PlanRunInterruptHandle` and pass it as
    `GraphPlanRunParams.interrupt` (e2-planset, landed 2026-09-28; today
    `run_plan_on_local_runtime` passes `interrupt: None`). Bridge the token by spawning
    a task on the run's runtime that awaits `cancel.cancelled()` and then calls
    `handle.request(PlanRunInterrupt::Interrupt)`. The run then:
    - cancels the running graph;
    - SIGTERMs the in-flight agent process trees, and SIGKILLs them after 3 s;
    - finalizes that plan's checkpoint as `interrupted`;
    - starts no further plan;
    - returns `Ok(130)`.
    Map that to an unsuccessful `PlanExecutionResult`. Install no signal handlers:
    `run_graph_plan` installs none, and the server owns its own signals. The run
    reports itself cancelled with `run_completed` outcome "cancelled"
    (03-backend-live-events T05).
"""
