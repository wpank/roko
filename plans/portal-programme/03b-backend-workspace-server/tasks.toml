[[task]]
id = "T02"
title = "Add run options and plan-set ordering to the runtime seam"
description = """
Cancel does not reach the run. Verified with the fake agent: after
`POST /api/plans/{id}/cancel` answered `{"cancelled":true}`, the agent process was still
running 8 seconds later, while status already reported no active execution. The
handler's `tokio::select!` drops the future of `runtime.run_plan(..)`, but
`RokoCliRuntime::run_plan` runs the Graph inside `spawn_blocking`, which dropping a
handle cannot stop. Nothing inside the run observes the token.

In `crates/roko-serve/src/runtime.rs`:

  - Add `pub struct PlanRunOptions`, deriving `Clone` and `Default`, with:
    - `pub cancel: Option<CancelToken>` (`roko_runtime::cancel::CancelToken`, which the
      plan routes already use);
    - `pub fresh: bool` and `pub force_resume: bool`, documented as meaning exactly
      what the `roko plan run` flags of the same names mean;
    - `pub only_plans: Option<Vec<String>>`, which restricts a plan-set directory to
      these plan ids;
    - `pub max_parallel_plans: Option<usize>`, how many independent plans of a set
      may run at once. `None` means what `roko plan run` uses: the workspace's
      `[conductor] max_parallel_plans`.
  - Add `async fn run_plan_with_options(&self, workdir: &Path, plan_target: &Path,
    options: PlanRunOptions) -> anyhow::Result<PlanExecutionResult>` to `CliRuntime`.
    Its default body ignores the options and calls `run_plan`, so every existing
    runtime keeps compiling, including the test runtimes under
    `crates/roko-serve/tests`.
  - Add `async fn plan_run_order(&self, workdir: &Path, plan_target: &Path,
    only_plans: Option<Vec<String>>) -> anyhow::Result<Vec<String>>`: the plan ids a
    run of that target would execute, in execution order. Its default body bails
    like the other plan methods.
"""
