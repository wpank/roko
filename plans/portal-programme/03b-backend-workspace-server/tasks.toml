# While `roko serve` runs for a workspace, it owns the workspace, and CLI commands
# become its clients: one runner, one hub, one place to watch.
#
# Verified live 2026-09-28 against a scratch workspace:
#   - `roko plan run` completes while `roko serve` runs in the same workspace. They
#     take different lock files (roko.runner.lock vs roko.lock), and the server's run
#     path takes neither, so two runners can mutate one working tree at once.
#   - the server never sees the CLI run; its hub stays empty.
#   - `roko dashboard` and `plan list/show/validate/status` fail while the server
#     runs, because their shared lock collides with serve's exclusive one.
#   - POST /api/plans/{id}/cancel answers {"cancelled":true}, but the agent keeps
#     running: the run is orphaned and invisible.
#
# The design (tmp/portal-audit/03-CONTRACT.md section 4), which also carries the
# portal's run asks P-6, P-7 and P-9 (section 6):
#   T01      one run per workspace: run bookkeeping by member id (the runner lock
#            itself is 03-backend-live-events T01)
#   T02-T05  run options: cancel through the run's own interrupt, resume, plan subsets,
#            and single plans run in place so their checkpoints resume
#   T17-T18  (run right after T05) POST /api/plans/{id}/resume and the other per-plan
#            routes find directory plans the way execute does (work item bug-9116ff)
#   T06-T08  the server advertises itself (.roko/runtime/serve.json), serves its hub
#            (.roko/runtime/hub.sock), and reports its branch
#   T09-T10  POST /api/plans/execute: run a set of plans or all of them, in plan-set
#            order, independent plans up to max_parallel_plans at once (the engine's
#            parallel plan-set change is separate work in this push), as one run
#            order
#   T11-T13  CLI clients: discovery, `roko plan run` through the server, read-only
#            commands attach instead of locking
#   T14-T16  IPC test, the live acceptance check, docs and gaps
#
# Runs after 03-backend-live-events and e2's hub threading: their live events and
# run_completed are what a client watches. The acceptance check is
# plans/portal-programme/_harness/workspace-server-check.sh.

[[task]]
id = "T01"
title = "Admit one run per server and find it by any member plan"
description = """
Run bookkeeping in `crates/roko-serve/src/routes/plans.rs` is keyed by a single plan id.
`execute_plan` refuses a second run only for the same id. Entries in
`state.active_plans` leave only through pause/cancel or the 60-second
`AppState::gc_completed_handles` sweep. So a finished run blocks re-running its plan
for up to a minute, and two different plans can run concurrently in one working tree.
The portal also needs to cancel or inspect a multi-plan run through any plan it
contains (section 6, P-6 of `tmp/portal-audit/03-CONTRACT.md`).

  1. Add `pub members: Vec<String>` to `PlanHandle` (`crates/roko-serve/src/state.rs`):
     the plan ids the run executes, in order. `execute_plan` sets it to `[id]`.
  2. In `routes/plans.rs`, add two helpers over `&HashMap<String, PlanHandle>`:
     - `active_run_conflict(..) -> Option<String>`, the key of any entry whose `handle`
       is not finished;
     - `active_run_for(.., id) -> Option<String>`, the key of the unfinished entry
       whose key is `id` or whose `members` contain it.
     A finished entry is inactive.
  3. `execute_plan` answers 409, naming the active run, whenever `active_run_conflict`
     finds one. A finished entry under the same key is replaced, not a conflict. Keep
     the check and the insert under one write lock.
  4. `plan_status`, `pause_plan` and `cancel_plan` resolve their `{id}` through
     `active_run_for`, so a run id and any member plan id both work.

Running independent plans in parallel is out of scope; the last task records it as a
gap.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 25
depends_on = []
files = [
    "crates/roko-serve/src/state.rs",
    "crates/roko-serve/src/routes/plans.rs",
]

[task.context]
read_files = [
    { path = "crates/roko-serve/src/routes/plans.rs", why = "execute_plan and the status, pause and cancel lookups" },
    { path = "crates/roko-serve/src/state.rs", why = "PlanHandle, active_plans and gc_completed_handles" },
    { path = "crates/roko-serve/tests/plan_execute.rs", why = "the existing 409 and cancel tests this must keep passing" },
]
anti_patterns = [
    "Do not release the write lock between the conflict check and the insert.",
    "Do not treat a finished handle as an active run.",
]

