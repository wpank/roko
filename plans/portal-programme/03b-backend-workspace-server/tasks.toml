[[task]]
id = "T05"
title = "Make execute cancellable and resumable on request"
description = """
In `crates/roko-serve/src/routes/plans.rs`, `execute_plan` creates a `CancelToken`, moves
a clone into its spawned task, and races `runtime.run_plan(..)` against
`task_cancel.cancelled()` in a `tokio::select!`.

  1. Keep resolving the plan directory through the summary's `group`, which handles
     plans nested in plan sets. The run now executes it in place (T04).
  2. Replace the race: await `runtime.run_plan_with_options(&workdir, &plan_dir,
     options)` with `cancel: Some(task_cancel)`. The run now stops itself and returns,
     and the task then publishes its terminal events once.
  3. Accept an optional JSON body `{ "resume": bool }` (section 6, P-7 of
     `tmp/portal-audit/03-CONTRACT.md`).
     - `resume: true` resumes completed tasks when the plan is unchanged and runs fresh
       when it was edited: `force_resume: true`.
     - No body, or `false`, means a fresh run: `fresh: true`.
     - Answer 202 `{ "id": run_id, "resume": <bool> }`.
     Whether tasks were actually skipped is not known at submit time; replayed tasks
     complete immediately on the stream.
  4. In `cancel_plan` and `pause_plan`, keep grace-then-abort as the last resort, but
     publish `PlanCompleted` from the handler only when it actually had to abort the
     task. Today a cancelled run publishes plan_completed twice.

Leave `resume_plan` to T17, which makes it share this handler's path.
"""
