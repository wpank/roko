     `pause_plan` writes, then calls the helper with resume set. Keep its 202 body
     `{ "id": run_id, "resumed": true }`, and add `"resume": true`.
  3. Delete `build_plan_resume_prompt` once nothing calls it.

Add a unit test beside the handlers, `resume_plan_runs_the_plan_directory`. Extend
the module's `RecordingRuntime` so it records the options it receives and a test can
set the summary's `group`. Assert that resuming a plan whose summary has a group
records one plan run, not a `run_once`, for `plans/<group>/<id>`, with
`force_resume` set.
