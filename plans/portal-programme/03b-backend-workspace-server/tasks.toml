[[task]]
id = "T06"
title = "Let a server advertise itself in its workspace"
description = """
A CLI command cannot tell whether a server owns its workspace, or where that server
listens. The port can come from `--port`, `[serve].port`, `[server].port` or `PORT`,
and `.roko/state/server-state.json` is only an agent and template snapshot.

Create `crates/roko-serve/src/endpoint.rs` and declare it in `lib.rs`. It provides:

  - `pub struct ServeEndpoint { pub pid: u32, pub url: String, pub workdir: PathBuf,
    pub started_at: String }` (serde).
  - `pub fn endpoint_path(workdir: &Path) -> PathBuf`, which is
    `.roko/runtime/serve.json`.
  - `pub fn write_endpoint(workdir, &ServeEndpoint) -> Result<()>`, atomic: a temp file
    then a rename.
  - `pub fn read_endpoint(workdir) -> Option<ServeEndpoint>`.
  - `pub fn remove_endpoint_if_owned(workdir, pid)`, which removes the file only when
    it names `pid`.

Add `ServerBuildConfig::with_advertised_endpoint()` as an opt-in flag, off by default,
so tests and `roko run --serve` do not advertise. In `ServerBuilder::start_background`,
when the flag is set:

