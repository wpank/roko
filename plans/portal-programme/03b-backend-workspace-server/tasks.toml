[[task]]
id = "T17"
title = "Make POST /api/plans/{id}/resume run the plan like execute"
description = """
`resume_plan` in `crates/roko-serve/src/routes/plans.rs` fails for every directory
plan, nested or not (work item bug-9116ff; reported again by e3 on 2026-09-28):

  - It looks the plan up with the legacy flat-file `find_plan`, which probes only
    `plans/<id>.json` and `plans/<id>.toml`, so it answers 404.
  - Past that, it would send a hand-built prompt (`build_plan_resume_prompt`) through
