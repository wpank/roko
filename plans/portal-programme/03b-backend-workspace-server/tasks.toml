[[task]]
id = "T04"
title = "Run a single plan in place so its checkpoint survives between runs"
description = """
A server can run a plan only once. `prepare_plan_execution_root`
(`crates/roko-cli/src/serve_runtime.rs`) copies a plan directory into
`.roko/plan-runs/<plan>-<unique>/` before every run. `plan_to_graph`
(`crates/roko-graph/src/convert.rs`) puts `plan_dir` into every node's config, so the
copy gives the graph a new fingerprint every time. The plan's checkpoint
(`.roko/state/graph/<plan_id>/`) then never matches again.

Verified live on 2026-09-28: a second execute of the same plan fails with "cannot
resume Graph checkpoint … the converted plan graph has changed". A CLI run and a
server run of one plan can never share progress either, and `resume: true` (T05)
could never skip anything.

  - Run a directory that contains `tasks.toml` in place: return it unchanged, as a
    plan-set directory already is.
  - Keep the copy only for a target that is a single `tasks.toml` file.
  - Add a unit test, `plan_directory_runs_in_place`, asserting that a plan directory
    comes back unchanged.
  - `prepare_plan_execution_root` has one caller today, `run_plan_on_local_runtime`.
    Say in the task output whether anything relied on the copy.
"""
