     the plan id and the resume flag. The helper does what execute does after T05:
     - resolve the plan with `runtime.load_plan_summary` (404 when absent);
     - take its directory from the summary's `group`, exactly as `execute_plan` does
       today: `plans_dir(..)`, joined with `group` when set, then with the id;
     - answer 409 through `active_run_conflict`;
     - run `runtime.run_plan_with_options` with the cancel token, and
       `force_resume: true` for a resume.
