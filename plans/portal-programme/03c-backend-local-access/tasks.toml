[[task]]
id = "T02"
title = "Accept the launch token and the session cookie in the auth middleware"
description = """
`require_api_key` (`crates/roko-serve/src/routes/middleware.rs`) takes credentials only
from `X-Api-Key` and `Authorization`. With auth enabled and no key configured, nothing
can match.

  1. Add `AuthMethod::LaunchToken` and `AuthMethod::Session`, with header values
     `launch_token` and `session`.
  2. The launch token presented as `X-Api-Key` or `Authorization: Bearer` is an admin
     credential (`LocalAccess::launch_token_matches`, T01).
  3. With neither header present, read the `roko_session` value from the `Cookie`
     header. A live session is an admin `AuthContext`. A header, when present, keeps
     deciding as today.
  4. A cookie-authenticated request other than GET, HEAD or OPTIONS must carry no
     `Origin`, or an `Origin` whose host and port equal the request's `Host`.
     Otherwise answer 403. `SameSite=Strict` keeps other sites' cookies out, but
     another page on localhost is same-site.

Unit tests beside the code: cookie parsing among other cookies, the Origin rule, and
the launch token as both header forms.
"""
