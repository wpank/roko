    { path = "plans/portal-programme/_harness/access-check.sh", why = "the assertions this plan must satisfy" },
    { path = "plans/portal-programme/_harness/lib.sh", why = "how the scratch workspace and server are built and torn down" },
]
anti_patterns = [
    "Do not start a server against this repository. The check brings its own workspace.",
    "Do not edit or remove an assertion to make the check pass.",
    "Do not report success unless the check printed ACCESS-CHECK: PASS.",
]

[[task.verify]]
phase = "test"
command = "cargo build -p roko-cli && bash plans/portal-programme/_harness/access-check.sh"
fail_msg = "the local access acceptance check does not pass"
timeout_ms = 2700000

[[task.verify]]
phase = "structural"
command = "grep -q 'ACCESS-CHECK: PASS' plans/portal-programme/03c-backend-local-access/REVIEW.md"
fail_msg = "REVIEW.md does not record a passing check"

[[task]]
id = "T10"
title = "Record local access as built, and update the work graph"
description = """
Under a heading reading exactly `AS BUILT 03c-backend-local-access` in
`tmp/portal-audit/03-CONTRACT.md`, restate the local access mechanism as built: when
the token is minted, the session exchange's request and response, the cookie
attributes, the Origin rule, and the token file. Use REVIEW.md as the evidence.
Then mark section 4.3 ("Local access") as built, pointing to the new section, and
correct anything there the build changed.

Then update the work graph: `work/items/`, format in `work/README.md`.
`.roko/GAPS.md` is frozen; do not write there.

  1. Close bug-12d48c (EventSource 401) if the check's cookie-on-event-stream
     assertion passed: set `status = "done"`, set `updated` and `last_verified` to
     today, and fill `[closed]` with `at`, `by`, `run_id` (from
     `.roko/state/graph/03c-backend-local-access/checkpoint.json`) and `evidence`.
  2. Create an item for each residual below, after searching `work/items/` for one
     that already covers it.
     - (gap) The portal's dev server on another port cannot use the cookie without
       credentialed CORS. Development uses `ROKO_API_KEY` or auth disabled.
     - (finding) Sessions live in memory; restarting the server means opening the
       newly printed URL.
     - (gap) Release and Docker builds do not build the portal export:
       `.github/workflows/release.yml` and `Dockerfile` build only the demo app. So a
       packaged binary serves the fallback page at `/`.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 20
depends_on = ["T09"]
files = ["tmp/portal-audit/03-CONTRACT.md", "work/items"]

[task.context]
read_files = [
    { path = "tmp/portal-audit/03-CONTRACT.md", why = "section 4.3, the planned local access design to restate as built" },
    { path = "work/README.md", why = "the item format, IDs and the closure rules" },
    { path = "work/items/bug-12d48c-portal-event-stream-sends-no-credential-so.md", why = "the item this plan closes" },
]
anti_patterns = [
    "Do not close an item whose assertion did not pass in the live check.",
    "Do not write to .roko/GAPS.md; it is frozen.",
    "Do not rewrite other plans' sections of the contract.",
]

[[task.verify]]
phase = "structural"
command = '''grep -q 'AS BUILT 03c-backend-local-access' tmp/portal-audit/03-CONTRACT.md && grep -q '^status = "done"' work/items/bug-12d48c-*.md && python3 -c 'import tomllib, glob; [tomllib.loads(open(f).read().split("+++")[1]) for f in glob.glob("work/items/*.md")]''''
fail_msg = "the contract has no AS BUILT section, bug-12d48c was not closed, or an item's front matter no longer parses"
