[[task]]
id = "T03"
title = "Add POST and DELETE /api/auth/session"
description = """
A browser needs one call that turns the launch token into a cookie.

Create `crates/roko-serve/src/routes/auth_session.rs` and mount it in
`crates/roko-serve/src/routes/mod.rs`, outside the `require_api_key` layer (it is how
a browser obtains a credential) but inside the rate limiter.

  - `POST /api/auth/session` with `{ "token": "..." }`, or with the credential in
    `X-Api-Key`/`Authorization`. It accepts the launch token, or any API key the
    middleware accepts, so a workspace with configured keys can also give its portal
    a cookie. It mints a session (`LocalAccess::create_session`) and answers 204 with
    `Set-Cookie: roko_session=<id>; HttpOnly; SameSite=Strict; Path=/`, adding
    `Secure` when the server serves TLS. A bad or missing credential is 401.
  - `DELETE /api/auth/session` ends the cookie's session and clears the cookie
    (`Max-Age=0`).

Record both in the auth audit (`append_auth_audit`) like other auth events.
"""
