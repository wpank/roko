# A fresh workspace's server must be reachable from its own portal and CLI, without
# weakening auth, and must serve both UIs: the portal at / and the demo app at /demo
# (the user's decision, 2026-09-28). Portal asks P-1 and P-10 in
# tmp/portal-audit/03-CONTRACT.md section 6.
#
# Today `roko init` writes `[serve.auth] enabled = true` with an empty key (deliberately
# secure by default), so every /api call to a fresh workspace's loopback server is a
# 401. The browser cannot fix that with a header: EventSource cannot send one
# (work item bug-12d48c).
#
# Chosen mechanism (the lead's first option, Jupyter-style):
#   - When auth is enabled, the bind is loopback and no API key is configured,
#     `roko serve` mints an ephemeral launch token and prints
#     http://127.0.0.1:<port>/#token=<token>.
#   - The portal exchanges the token once, via POST /api/auth/session, for an
#     HttpOnly, SameSite=Strict session cookie. Same-origin fetch and EventSource
#     then authenticate with no header.
#   - CLI clients read the token from .roko/runtime/serve.token (mode 0600).
#
# Why not the fallback (unauthenticated loopback plus Host/Origin checks): it trusts
# every local process and user, and needs its own DNS-rebinding defence. The cookie
# costs little: the middleware already parses credentials from headers, and a Cookie
# header is one more source.
#
# Runs after 03b-backend-workspace-server (serve.json, serve_client). The acceptance
# check is plans/portal-programme/_harness/access-check.sh.

[[task]]
id = "T01"
title = "Give the server an ephemeral launch token and a session store"
description = """
Add the state the local-access mechanism needs to roko-serve.

  1. `ServerBuildConfig::with_launch_token(token: String)` in
     `crates/roko-serve/src/lib.rs`. The token is a credential for this server
     process only, and is never persisted.
  2. A `LocalAccess` value on `AppState` (`crates/roko-serve/src/state.rs`) holding:
     - the optional launch token;
     - a set of live sessions, stored as `middleware::hash_api_key` hashes, never raw
       ids.
     Its methods:
     - `launch_token_matches(&str)`, a constant-time comparison using the existing
       `constant_time_eq`;
     - `create_session()`, which returns 32 random bytes as hex and stores their hash;
     - `session_valid(&str)`;
     - `end_session(&str)`.
  3. When the server advertises itself (`with_advertised_endpoint`, 03b) and has a
     launch token, write `.roko/runtime/serve.token` containing the token, mode 0600,
     next to `serve.json` (`crates/roko-serve/src/endpoint.rs`). Remove it together
     with `serve.json` on exit. The token never goes into `serve.json`.

Unit tests: token matching; create, validate and end a session; the token file is
0600 and is removed with the endpoint.
"""
