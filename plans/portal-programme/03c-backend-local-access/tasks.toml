[[task]]
id = "T09"
title = "Prove a fresh workspace reaches its own server"
description = """
Run the acceptance check and record the result in
`plans/portal-programme/03c-backend-local-access/REVIEW.md`.

  1. `cargo build -p roko-cli`.
  2. `bash plans/portal-programme/_harness/access-check.sh`. It uses a scratch
     workspace with `[serve.auth] enabled = true` and no key, plus the deterministic
     fake agent, and asserts:
       - the printed portal URL carries the token, which matches the 0600
         `serve.token`;
       - a request without a credential is a 401;
       - the session exchange sets a proper cookie;
       - the cookie authenticates both the API and the event stream;
       - a cross-origin write is refused;
       - `roko plan run` through the server authenticates with the token file;
       - the token file is removed on shutdown;
       - `ROKO_SPA_DIR` serves the UI at `/`, a client-side route falls back to its
         index, and a missing asset is a 404;
       - an unknown `/api` path is a JSON 404, never a UI page;
       - the demo app is served under `/demo`, built for that base.
     It costs nothing and takes a few minutes.
  3. When an assertion fails, fix the cause in this plan's code, rebuild and rerun. If
     the harness itself is wrong, fix it and say exactly what and why in REVIEW.md.
     Never delete or weaken an assertion.
