[[task]]
id = "T07"
title = "Serve the portal at / and the demo app at /demo"
description = """
The user decided on 2026-09-28 that `roko serve` serves both UIs:
  - the portal's static export (`apps/portal/out`, now gitignored) at `/`;
  - the demo app under `/demo`.
This is section 6, P-10 of `tmp/portal-audit/03-CONTRACT.md`.

Today `crates/roko-serve/src/embedded.rs` serves one SPA for every path that is not an
API path, trying in order:
  - `ROKO_SPA_DIR`;
  - `demo/demo-app/dist` beside the crate;
  - the copy `rust-embed` baked in at compile time (`EmbeddedAssets`). `build.rs`
    swaps in `assets/frontend-fallback/` under the `roko_frontend_fallback` cfg.

  1. Resolve two UI roots once at startup, and log which one each serves from.
     - **The portal**, for every path outside `/demo`, in this order:
       - `ROKO_SPA_DIR` when it holds an `index.html` (the override keeps its meaning:
         the UI at `/`);
       - `apps/portal/out` beside the crate;
       - a copy embedded at compile time;
       - the fallback page.
     - **The demo app**, for `/demo` and `/demo/*` with the prefix stripped:
       - `demo/demo-app/dist` beside the crate;
       - the embedded copy;
       - the fallback page.
  2. Embed the portal the way the demo is embedded.
     - Add a second `rust_embed::Embed` struct over `../../apps/portal/out/`.
     - Add a `roko_portal_fallback` cfg to `crates/roko-serve/build.rs`, declared with
       `rustc-check-cfg`. It points the struct at the fallback folder when
       `apps/portal/out/index.html` is absent at build time.
     - The build script must never run npm for the portal, and must not rerun on
       every build while the export is absent.
  3. Update `crates/roko-serve/assets/frontend-fallback/index.html`. It should say
     which UI is missing and how to get it: run `npm run build:export` in
     `apps/portal` for `/`; the demo app is at `/demo/` when it is built.
  4. Apply the SPA fallback per UI.
     - Serve the UI's `index.html` only for a path without a file extension, which is
       a client-side route.
     - A missing path with an extension (a stale `_next/static/…` chunk, a missing
       `/demo/assets/…` file) is a plain 404, never an HTML page.
     - Keep `api_or_ws_path_requires_json_404` (`crates/roko-serve/src/lib.rs`) in
       front of both UIs, so `/api/*`, `/ws*` and `/roko-ws*` never reach a UI.
  5. Cache content-hashed assets as immutable: `assets/…` for Vite, `_next/static/…`
     for Next. Everything else is `no-cache`. Today the check looks for `/assets/` in
     a path that has no leading slash, so nothing is cached.

Add unit tests in `embedded.rs` for the path rules:
  - `/demo` and `/demo/x` go to the demo app with the prefix stripped; `/demon` does
    not;
  - a missing path without an extension falls back to the index, and a missing `.js`
    is a 404;
  - the cache rule.
"""
