[[task]]
id = "T03"
title = "Report plan generation progress and completion"
description = """
Generation takes tens of seconds. The portal needs to show progress rather than a
frozen dialog, and it needs to know the slug of what was produced.

In `crates/roko-serve/src/routes/plans.rs`, make the generate operation emit
lifecycle events on the dashboard stream: started when the operation is registered,
and completed carrying the resulting plan slug when the generator returns.

The completion event carrying the slug is the important one. Without it the portal
has to poll the plan list and diff it to guess what was just created, which is both
racy and ugly.

If no existing event variant carries an operation result with an identifier, use the
most specific one that does and say in the task output which fields you had to
overload. Do not add a new variant in this task.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 20
depends_on = ["T02"]
files = ["crates/roko-serve/src/routes/plans.rs"]

