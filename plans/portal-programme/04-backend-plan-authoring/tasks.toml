[[task]]
id = "T07"
title = "Test the authoring round trip"
description = """
Add `crates/roko-serve/tests/plan_authoring.rs` covering read, write and validate.

Assert, through the router against a temporary workspace:

  1. Reading a plan's tasks, writing the same body back unchanged, and reading again
     yields the same tasks. A round trip must be lossless; this is the test that
     catches hand-rolled TOML serialization.
  2. Writing a modified task, such as a changed title or an added dependency,
     persists and reads back with the change.
  3. Writing a body whose dependency references a task id that does not exist is
     rejected with 422 and the plan file on disk is unchanged.
  4. Validating a plan with a broken dependency returns 200 with an error diagnostic
     naming the offending task.
  5. Generating with neither a prompt nor a slug returns 422; with both, 422.

Point four's assertion that the file is unchanged is the important one. Validate
before write means a rejected save must leave no trace.
"""
