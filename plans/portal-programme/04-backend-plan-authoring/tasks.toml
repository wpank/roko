       timeout_ms: Option<u64> }`;
     - add `title: Option<String>` and `max_parallel: u32` to `PlanTasksDto`;
     - add `estimated_minutes: Option<u32>` to `PlanSummaryDto`.
     Mark every new field `#[serde(default)]`, and keep `verify_phases` for existing
