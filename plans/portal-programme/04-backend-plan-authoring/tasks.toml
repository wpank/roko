[meta]
plan = "04-backend-plan-authoring"
total = 15
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 375

# Make plan authoring work from the API: create a plan, edit its source, validate
# while typing, generate one from a sentence, and run what was generated.
#
# Verified 2026-09-28 against the code and a scratch server:
#   - POST /api/plans writes <uuid>.json, which discovery cannot see.
#   - Nothing reads or writes a plan's source over HTTP, and nothing validates it.
#   - POST /api/plans/generate demands a PRD slug, then sends a hand-built prompt
#     through run_once. The `PlanGenerator` trait it was meant to call has no
#     implementation anywhere. The working pipeline is `prd::generate_plan_from_prd`,
#     which also regenerates EVERY old-format plan under plans/, one LLM call each.
#   - A generation's outcome is not observable: its handle never leaves Running, and
#     OperationStarted/Completed never reach the SSE stream.
#
# Revising a plan in place (P-5) is the next plan, 04b-backend-plan-revision.
# The shapes follow the portal's asks P-2, P-3, P-4 and P-11 in
# tmp/portal-audit/03-CONTRACT.md section 6. Editing works on the plan's TOML source,
# which is lossless, rather than on the task DTO. The acceptance check
# (plans/portal-programme/_harness/authoring-check.sh) fails all but two of its
# assertions today; T14 makes it pass.

