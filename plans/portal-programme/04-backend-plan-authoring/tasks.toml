[[task]]
id = "T06"
title = "Add a plan validation endpoint"
description = """
Add `POST /api/plans/{id}/validate` so the portal can show live validation while a
plan is being edited.

Run the same checks the command-line validator runs and return every diagnostic with
its severity, rule id, task id and message. The portal renders these inline on the
offending field, so the task id matters as much as the message.

Return 200 with the diagnostic list even when there are errors. A plan being invalid
