[[task]]
id = "T11"
title = "Report the generation outcome by poll and on the stream"
description = """
A generation's outcome is not observable. The handle `generate_plan` stores in
`state.operations` stays `OperationStatus::Running` forever. The existing
`GET /api/operations/{id}` (`operation_status` in
`crates/roko-serve/src/routes/status/dashboard.rs`) returns the status as a Rust
`Debug` string. And `ServerEvent::OperationStarted`/`OperationCompleted` are not
bridged into the dashboard events the portal reads over SSE.

  1. In `crates/roko-serve/src/routes/plans.rs`, finalize the handle when the work
     ends: `OperationStatus::Completed { result }`, where `result` is the JSON
     `{ "slug", "task_count" }` (count the tasks with `runtime.load_plan_summary`),
     or `Failed { error }`. Register the handle before the spawned task can finish;
     `routes/run.rs` gates its task on a start signal for exactly this reason.
  2. Make `operation_status` answer `{ "id", "kind", "status":
     "running"|"completed"|"failed", "result"?, "error"? }` (section 6, P-2 of
     `tmp/portal-audit/03-CONTRACT.md`). Parse a JSON `result` string back into an
     object. Do not register a second route. Finished handles are swept by
     `gc_completed_handles` within a minute, so this is for polling while the work
     runs.
  3. Publish on `state.state_hub.sender()` a `DashboardEvent::EventLogEntry` with:
     - `event_type` set to `plan_generate.started` when the work starts, and to
       `plan_generate.completed` or `plan_generate.failed` when it ends;
     - `plan_id` set to the slug;
     - `message` set to the operation id and, on failure, the error.
     Keep publishing `OperationStarted` and `OperationCompleted` on the event bus
