[[task]]
id = "T05"
title = "Implement the plan task write through the runtime"
description = """
Implement the write behind the route from T04.

Add a write method to the runtime trait in crates/roko-serve/src/runtime.rs, matching
the style of the read methods, and implement it in
crates/roko-cli/src/serve_runtime.rs using the task parser's existing mutation and
write functions rather than serializing TOML by hand.

The parser owns the file format, including the ordering rule that scalar keys precede
the nested context table and the verify tables. Hand-written TOML gets that wrong and
produces files the parser then rejects.

Requirements:

  - Validate before writing. A request that would produce an invalid plan must be
    rejected with 422 and the rule ids, not written and then discovered broken.
  - Recount the meta totals after mutation so the task count stays consistent.
  - Write atomically: write a temporary file and rename, so an interrupted save
    cannot truncate a plan.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 30
depends_on = ["T04"]
files = ["crates/roko-cli/src/serve_runtime.rs", "crates/roko-serve/src/runtime.rs"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/task_parser.rs", why = "the mutation, recount and write functions, and the key ordering rule the format requires" },
    { path = "crates/roko-cli/src/serve_runtime.rs", why = "the impl block to extend, matching the read method style" },
