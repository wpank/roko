# Make plan authoring work from the API.
#
# Generating a plan from a prompt returns 400 "missing field slug" because the
# request type has no prompt field and looks up a PRD instead. Saving tasks returns
# 405 because only a GET is registered on that path although the portal editor has
# always called PUT. There is no validate endpoint at all.
#
# This plan delivers the "generate" half of the flow that defines success:
# type a sentence, get a plan.
# See tmp/portal-audit/03-CONTRACT.md section 2.2 and 2.4.

[[task]]
id = "T01"
title = "Accept either a prompt or a slug when generating a plan"
description = """
Widen the generate request type in `crates/roko-serve/src/routes/plans.rs` so the
portal can generate a plan from free text.

Today the request struct has a single required slug field with no serde default, so
any body without it fails deserialization and becomes a 400 before the handler runs.
That is exactly what the portal's Develop and Run Prompt dialogs hit.

Make both fields optional and validate that exactly one is present, returning a 422
with a clear message when both or neither are supplied. Keep the existing non-blank
validation on the slug when it is the one provided.

Do not change the handler body in this task. T02 rewrites the dispatch. Keeping the
type change separate means a failure here is unambiguous.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 20
depends_on = []
files = ["crates/roko-serve/src/routes/plans.rs"]

[task.context]
read_files = [
    { path = "crates/roko-serve/src/routes/plans.rs", why = "the generate request struct and its validation attributes" },
    { path = "crates/roko-serve/src/extract.rs", why = "how deserialization failures become 400 and how validation failures become 422" },
]
anti_patterns = [
    "Do not leave the slug field required. That is the defect.",
    "Do not accept both fields at once without an error. Ambiguous input should be rejected.",
]

[[task.verify]]
phase = "compile"
command = "cargo check -p roko-serve"
fail_msg = "roko-serve does not compile after widening the generate request"

[[task]]
id = "T02"
title = "Dispatch plan generation through the plan generator service"
description = """
Rewrite the generate handler in `crates/roko-serve/src/routes/plans.rs` to use the
shared plan generator instead of firing a raw one-shot prompt.

Today, after finding the PRD, the handler calls the runtime's generic one-shot prompt
method with a hand-built instruction string. It does **not** call the runtime's PRD
plan generation method, which exists and which the job runner in this same crate
already uses correctly.

The shared contract in crates/roko-execution/src/plan_generator.rs already models
both inputs: its plan source enum has a PRD variant and a prompt variant. Its adapter
key constants even name this handler as the intended call site, with a comment
pointing at this file and function.

Build a generator request whose source is the prompt variant when a prompt was given
and the PRD variant when a slug was given, tag it with the HTTP adapter key, and
dispatch it through the generator. Keep the existing accepted-with-operation-handle
response shape and the operation completed event.

The generated plan must land in the top-level plans directory as a plan directory
containing a tasks file, so the discovery path from the backend-plan-service plan can
see it. Verify that, do not assume it.
"""
status = "ready"
role = "implementer"
tier = "architectural"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 35
depends_on = ["T01"]
files = ["crates/roko-serve/src/routes/plans.rs"]

[task.context]
read_files = [
    { path = "crates/roko-serve/src/routes/plans.rs", why = "the generate handler, its one-shot dispatch and its operation handle response" },
    { path = "crates/roko-execution/src/plan_generator.rs", why = "the plan source variants, the request type and the adapter key naming this handler" },
    { path = "crates/roko-cli/src/plan_generator.rs", why = "the canonical generator implementation that will run" },
    { path = "crates/roko-serve/src/job_runner.rs", why = "an existing correct call into the runtime plan generation method" },
]
anti_patterns = [
    "Do not keep the hand-built one-shot prompt. The generator service exists for this.",
    "Do not write the generated plan into the dotted roko plans directory. Discovery reads the top-level one first.",
    "Do not change the response shape. The portal reads an accepted response with an operation id.",
]

[[task.verify]]
phase = "compile"
command = "cargo check -p roko-serve"
fail_msg = "roko-serve does not compile after rewiring plan generation"

[[task.verify]]
phase = "structural"
command = "grep -q 'plan_generator\\|PlanSource\\|PlanGenerator' crates/roko-serve/src/routes/plans.rs"
