[[task]]
id = "T12"
title = "Never write a generated plan the run path will reject"
description = """
The generation pipeline in `crates/roko-cli/src/prd.rs` extracts the fenced TOML,
repairs it with `validate_and_fix_generated_plan`, parses it, and checks budgets. It
never runs the check the run path enforces when it loads a plan:
`plan_policy::validate_plan_context(.., PlanExecutionPolicy::for_environment())`,
called from `runner/plan_loader.rs`. A generated plan that names a
`context.read_files` path that does not exist is written as "valid", then fails the
moment it runs.

In the pipeline's extract-and-validate step, after parsing:

  1. Run `validate_plan_context(&parsed, workdir, &plans_root.join(slug),
     PlanExecutionPolicy::for_environment())`.
  2. Drop every read_files entry it reports as missing, then check again.
  3. If anything is still violated, treat it as a validation failure, so the existing
     retry and escalation path runs. If that path gives up, report the failure and
     write nothing.

The written `tasks.toml` must always pass the loader's check.
"""
