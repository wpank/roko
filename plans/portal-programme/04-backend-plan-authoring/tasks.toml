[[task]]
id = "T10"
title = "Keep server-side generation to its own plan"
description = """
Every non-dry-run `prd::generate_plan_from_prd` ends by calling
`regenerate_old_format_plans` over every top-level plan directory in `plans/`. For
each plan missing modern fields, it starts an LLM agent that rewrites that plan's
`tasks.toml` in place (`crates/roko-cli/src/prd.rs`).

That is reasonable for an explicit `roko prd plan`. From the API it is not: one
"Generate…" click in this repository would start one agent per old-format plan and
rewrite plans nobody asked about.

  - In `prd.rs`, give the internal `generate_plan_from_prd_with_outcome` a
    `regenerate_old_plans: bool` parameter. The existing public functions pass `true`,
    so the CLI's behaviour does not change. Add
    `pub async fn generate_plan_from_prd_isolated(slug, prd_path) -> Result<PathBuf>`,
