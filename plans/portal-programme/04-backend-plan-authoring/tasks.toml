[[task]]
id = "T03"
title = "Add the plan source authoring core to roko-cli"
description = """
Create `crates/roko-cli/src/plan_authoring.rs` and declare `pub mod plan_authoring;` in
`crates/roko-cli/src/lib.rs`. It validates and saves a plan's `tasks.toml` source text.
Neither the server nor the portal ever edits TOML by structure; they send the whole
source, and it is saved losslessly.

  - `pub fn validate_plan_source(workdir, plan_id, toml: &str, models) ->
    PlanSourceReport`.
    1. Parse with `TasksFile::parse_str`. A parse error is one diagnostic with rule
       `PLAN_PARSE`.
    2. Otherwise write the text into a temporary plan directory and run
       `validate_plans_dir_with_workdir(tmp, Some(models), Some(workdir))`.
    3. Also run `plan_policy::validate_plan_context(&file, workdir, &tmp,
       PlanExecutionPolicy::for_environment())`. That is the check
       `runner/plan_loader.rs` enforces when a run loads the plan, so count its
       violations as errors, even where `roko plan validate` only warns.
    Report `{ severity, rule_id, task_id, message }` diagnostics, error and warning
    counts, and `valid` = no errors.
  - `pub fn save_plan_source(workdir, tasks_path, toml: &str, models) ->
    anyhow::Result<PlanSourceReport>`. Validate first; on any error return the report
    and leave the file untouched. Otherwise write the text exactly as given, with a
    temp file in the same directory then a rename.
  - `pub fn starter_plan_source(slug, title, default_model) -> String`. A one-task plan
    that passes `validate_plan_source` as created: role implementer, tier focused,
    that model hint, one output file, one verify step.

Call the validator as `crate::plan_validate` (T02 moved it into the library).

Unit tests:

  - a valid plan saves byte-for-byte, comments included;
  - an unknown dependency gives an error naming that task, and the file stays
    byte-identical;
  - a TOML syntax error gives `PLAN_PARSE`, and nothing is written;
  - a `context.read_files` path that does not exist is an error;
  - the starter plan validates.
"""
