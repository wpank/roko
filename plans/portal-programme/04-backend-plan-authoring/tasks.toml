[[task]]
id = "T08"
title = "Make generation produce a plan that immediately runs"
description = """
Close the loop between this plan and the two before it: a generated plan must be
runnable without hand editing.

Generated plans are frequently rejected by the run path even when they lint clean,
because the runtime enforces context file existence more strictly than the linter
does. A generated plan that references a file that does not exist yet, and is not
produced by a declared dependency, will lint with a warning but hard fail at run.

Make the generation path validate its own output against the run path's rules before
reporting success, and when the output fails, repair the common cases rather than
emitting a broken plan: drop context read files that do not exist and are not
produced by a dependency, and ensure every implementer task has at least one verify
step and a non-empty output file list.

If repair cannot make the plan valid, report the operation as failed with the
diagnostics, rather than reporting success and leaving an unrunnable plan on disk.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 30
depends_on = ["T07"]
files = ["crates/roko-cli/src/plan_generator.rs"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/plan_generator.rs", why = "the generator implementation and its existing repair layer" },
    { path = "crates/roko-cli/src/plan_validate.rs", why = "the linter rules and which ones the run path treats as fatal" },
    { path = "crates/roko-cli/src/runner/plan_loader.rs", why = "the run path context checks that hard fail where the linter only warns" },
    { path = "crates/roko-cli/src/task_parser.rs", why = "the schema rules for implementer tasks needing verify steps and output files" },
]
anti_patterns = [
    "Do not report generation success when the produced plan cannot run.",
    "Do not relax the run path checks to make generated plans pass. Fix the generator output.",
]

[[task.verify]]
