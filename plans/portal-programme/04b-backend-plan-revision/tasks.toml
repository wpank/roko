# Revise a plan in place from one sentence: the current tasks.toml plus the operator's
# feedback goes to the planning agent, and the result is validated, then written
# atomically. A revision that does not validate leaves the file untouched. This is the
# portal's ask P-5 (tmp/portal-audit/03-CONTRACT.md section 6), the LLM-assisted
# iteration step of the design.
#
# Builds on 04-backend-plan-authoring: the source save (validate, then temp file and
# rename), the operation reporting, and the generation pipeline's fenced-TOML
# extraction. It deliberately does NOT reuse the generation repair
# `validate_and_fix_generated_plan`, which strips every model_hint as generation policy
# and would silently rewrite the operator's plan.
#
# The acceptance check is plans/portal-programme/_harness/revision-check.sh.

[[task]]
id = "T01"
title = "Add plan revision to the authoring core"
description = """
In `crates/roko-cli/src/plan_authoring.rs` (the authoring core from plan 04), add:

  - `pub fn build_revision_prompt(plan_id, current_toml, feedback) -> String`.
    - It must begin with the sentence `Revise the plan below according to the
      feedback.`.
    - It embeds the current `tasks.toml` verbatim in a fenced ```toml block, then
      gives the feedback.
    - It asks for the complete revised file in one fenced ```toml block, keeping
      `[meta] plan = "<plan_id>"` and the ids of tasks that still apply.
  - `pub fn apply_revision_output(workdir, plan_id, tasks_path, agent_output, models)
    -> anyhow::Result<RevisionOutcome>`.
    1. Extract the block with `crate::prd::extract_fenced_block`, falling back to
       `extract_toml_content_fallback`; make both `pub(crate)`.
    2. Apply only `task_parser::repair_toml`, and require `[meta] plan` to equal
       `plan_id`.
    3. Hand the text to `save_plan_source`, which validates (including the loader's
       context check) and then writes atomically, or rejects and leaves the file
       untouched.
    Do not use `validate_and_fix_generated_plan`: it enforces generation policy (it
    removes every `model_hint`) and would silently rewrite the operator's plan.
  - `pub async fn revise_plan_source(workdir, plan_id, tasks_path, feedback, models)
    -> anyhow::Result<RevisionOutcome>`.
    - Read the current text.
    - Run the planning agent exactly as PRD generation does:
      `agent_exec::run_agent_capture_silent` with `role: Some("strategist")`,
      `allowed_tools: Some("Read,Grep,Glob")`, and
      `plan_generate::build_generator_system_prompt(workdir)` as the system prompt.
    - Then call `apply_revision_output`.
    - If the result is rejected, retry once with the diagnostics appended to the
      feedback, then report the rejection.
  - `RevisionOutcome` carries whether the plan was written, its task count, and the
    validation report.

Unit tests for `apply_revision_output`, with canned agent output:

  - a valid revision is written exactly as extracted;
  - a dangling dependency leaves the file byte-identical;
  - output without a fenced block is an error;
  - a changed `meta.plan` is rejected.
"""
status = "ready"
role = "implementer"
tier = "architectural"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 2
estimated_minutes = 35
depends_on = []
files = [
    "crates/roko-cli/src/plan_authoring.rs",
    "crates/roko-cli/src/prd.rs",
]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/prd.rs", why = "the generation pipeline's agent call, fenced-block extraction and validate_and_fix_generated_plan (not to be reused)" },
    { path = "crates/roko-cli/src/agent_exec.rs", why = "run_agent_capture_silent and AgentExecOpts" },
    { path = "crates/roko-cli/src/task_parser.rs", why = "repair_toml" },
]
anti_patterns = [
    "Do not apply generation policy to an existing plan; keep the operator's model hints and fields.",
    "Do not write a revision that fails validation.",
    "Do not let the agent write files; it returns text and the core writes it.",
]

[[task.verify]]
phase = "test"
command = "grep -q 'pub async fn revise_plan_source' crates/roko-cli/src/plan_authoring.rs && cargo test -p roko-cli --lib plan_authoring"
fail_msg = "the revision core is missing, or the authoring tests fail"
timeout_ms = 2700000

