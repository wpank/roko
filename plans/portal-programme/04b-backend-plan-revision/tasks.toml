    `Completed { result: {"slug", "task_count"} }` when the plan was written, and
    `Failed { error }` with the error count when it was rejected or the agent failed.
  - Publish `event_log_entry` events with `event_type` `plan_revise.started`,
    `plan_revise.completed` or `plan_revise.failed`, and `plan_id`.
"""
