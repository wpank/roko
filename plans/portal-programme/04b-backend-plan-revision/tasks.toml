       - blank feedback, an unknown plan and a running plan are refused.
     It costs nothing and takes a few minutes.
  3. When an assertion fails, fix the cause in this plan's code, rebuild and rerun. If
     the harness itself is wrong, fix it and say exactly what and why in REVIEW.md.
     Never delete or weaken an assertion.
  4. Write REVIEW.md with the full PASS/FAIL output, then the verdict line.
"""
