[[task]]
id = "T05"
title = "Persist the event cursor so reloads do not replay from zero"
description = """
Fix the companion bug to T04 in `apps/portal/src/stores/dashboard.ts` and
`apps/portal/src/api/sse-client.ts`.

The store declares a last event id field and **nothing ever writes it**. The SSE
client tracks the cursor correctly in its own instance, but that lives only in
memory, so a page reload replays from sequence zero and the client re-folds the
entire ring.

Write the cursor into the store as events arrive, and persist it so a reload resumes
from where it left off. Restore it when the client connects.

The server already supports this fully: it honours the standard last event id header,
a query parameter alias, and a numeric parameter, in that precedence. The client
already sends the query parameter. Only the persistence is missing.

Be careful to discard a persisted cursor that the server reports as out of range,
rather than looping on a replay that can never succeed. The server signals this with
a gap frame.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 20
depends_on = ["T04"]
files = ["apps/portal/src/stores/dashboard.ts", "apps/portal/src/api/sse-client.ts"]

[task.context]
read_files = [
    { path = "apps/portal/src/stores/dashboard.ts", why = "the last event id field that is never written" },
    { path = "apps/portal/src/api/sse-client.ts", why = "the cursor tracking, the replay parameter and the gap frame handling" },
    { path = "crates/roko-serve/src/routes/sse.rs", why = "the cursor precedence rules and when the server sends a gap frame" },
]
anti_patterns = [
    "Do not retry indefinitely on a cursor the server cannot serve. Fall back to a fresh bootstrap.",
]

