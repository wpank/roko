[[task]]
id = "T08"
title = "Bootstrap: sign in, fetch the snapshot, then stream from its cursor"
description = '''
Create `apps/portal/src/lib/bootstrap.ts` and `src/lib/bootstrap.test.ts`: how the
portal starts talking to its server, in three steps.

Step 1, sign in. roko-serve keeps API auth on. On a loopback bind with no key
configured, `roko serve` prints `portal: http://127.0.0.1:<port>/#token=<token>`
(backend plan 03c); the browser trades that launch token for an HttpOnly session
cookie with `POST /api/auth/session {"token": …}` (204), after which every
same-origin fetch and the event stream authenticate by cookie. The token must leave
the address bar whatever the outcome.

Steps 2 and 3, the snapshot and the stream. The portal has always opened
`/api/events` and folded whatever it replayed. The
server only sends a snapshot conditionally (`replay_requires_snapshot` in
`crates/roko-serve/src/routes/sse.rs`), so the correct start is: fetch
`GET /api/statehub/snapshot` (`{cursor: "0x…", state}`), install it, then open the
stream from that cursor. Two details make this easy to get wrong:

- the snapshot cursor is the hex **next** sequence (`captured.next_seq`), while
  `/api/events?lastEventId=` takes the **last seen** sequence in decimal and replays
  from lastEventId + 1 (`replay_start`). So "0x1f" means lastEventId "30"; "0x0" (or
  an unparsable cursor) means open with no lastEventId.
- a `snapshot_rebased` event means cached state is stale: fetch a new snapshot and
  reopen the stream from its cursor.

Export:
  parseLaunchToken(hash: string): string | null
      the `token` parameter of a `#token=…` or `#a=b&token=…` fragment; null when
      absent or empty
  type SessionResult = 'none' | 'signed-in' | 'rejected' | 'unavailable'
  SIGN_IN_HINT = 'Not signed in to this roko serve. Open the portal link it
      printed (the one ending in #token=…).'
  cursorToLastEventId(cursor: string | null | undefined): string | null
  interface LiveDeps {
    hash: string;
    postSession(token: string): Promise<number>;   // the HTTP status
    dropFragment(): void;
    setSession(result: SessionResult): void;
    fetchSnapshot(): Promise<WireStateHubSnapshotResponse>;
    openStream(lastEventId: string | null, onEvent: (e: PortalStreamEvent) => void,
               onStatus: (s: ConnectionStatus) => void): { close(): void };
    replace(snapshot: WireDashboardSnapshot): void;
    apply(event: WireDashboardEvent): void;
    setStatus(s: ConnectionStatus): void;
    sleep(ms: number): Promise<void>;
  }
  startLiveState(deps: LiveDeps): { stop(): void }
      first the session: no token → setSession('none') with no request; otherwise
      postSession → 204 'signed-in', 404 or 405 'unavailable' (a server from before
      03c), 401, any other status or a thrown error 'rejected'; call dropFragment()
      whenever a token was present, then setSession(result). Only then
      fetch → replace → openStream(cursorToLastEventId(cursor)); stream events go to
      apply, except a synthetic {type:'snapshot', snapshot} (the SSE client turns
      `gap` frames into it) → replace, and snapshot_rebased → close, refetch,
      reopen. A failed fetch sets status 'error' and retries with backoff
      1s, 2s, 4s … capped at 16s. stop() closes the stream and ends retries.

Define `ConnectionStatus` ('connecting' | 'connected' | 'disconnected' | 'error')
and `PortalStreamEvent` (WireDashboardEvent | {type:'snapshot'; snapshot; cursor})
here and export them; T09 makes the SSE client use them.

At least 12 tests with fakes (no network): fragment parsing with and without other
parameters, each session outcome, dropFragment exactly when a token was present,
the session settling before the snapshot is fetched, cursor conversion (hex, zero,
garbage, null), open-after-replace ordering, gap → replace, rebase → refetch and
reopen, fetch failure → error status then success after a retry, stop() prevents
reopening.
'''
