[[task]]
id = "T06"
title = "Decode framed agent output into transcript blocks"
description = '''
Create `apps/portal/src/lib/streamRecord.ts` and `src/lib/streamRecord.test.ts`.

`agent_output.content` is not raw text. `publish_stream_record` in
`crates/roko-cli/src/runner/tui_bridge.rs` writes `STREAM_RECORD_PREFIX`
("\u001eroko.stream.v1 ", a record-separator character then a space) followed by
JSON `{kind, agent_id, plan_id, task_id, attempt, payload}` with payloads:
text {text}, reasoning {text}, tool_start {tool_id, tool} (no arguments),
tool_result {tool_id, output}. Oversized tool output keeps its tail behind a
literal `[...truncated]\n` prefix (`forward_dispatch_events_to_tui` in
`crates/roko-cli/src/graph_task_dispatch.rs`).

Export exactly:

  STREAM_RECORD_PREFIX, TRUNCATED_PREFIX = '[...truncated]\n'
  type StreamRecord =
      {kind:'text'; text} | {kind:'reasoning'; text}
    | {kind:'tool_start'; toolId; tool}
    | {kind:'tool_result'; toolId; output; truncated: boolean}
    | {kind:'raw'; text; malformed: boolean}
  interface AttemptDivider { kind: 'divider'; attempt: number }
  type TranscriptEntry = StreamRecord | AttemptDivider
  decodeStreamRecord(content: string): StreamRecord
      unframed content → raw (malformed false); prefix with unparsable JSON or an
      unknown kind → raw (malformed true, text = the original content); never throws
  type TranscriptBlock =
      {kind:'text'; text} | {kind:'reasoning'; text}
    | {kind:'tool'; toolId; tool; glyph: ToolGlyph; output: string | null; truncated}
    | {kind:'raw'; text; malformed} | AttemptDivider
  toolGlyph(tool: string): ToolGlyph   ('✎' | '◇' | '⚙')
      edit/write tools (Edit, Write, MultiEdit, NotebookEdit, edit_file, write_file,
      multi_edit, apply_patch; case-insensitive) → ✎; read/search tools (Read, Grep,
      Glob, LS, read_file, list_dir, search) → ◇; anything else → ⚙
  toBlocks(entries: readonly TranscriptEntry[]): TranscriptBlock[]
      consecutive text records merge into one text block (concatenated as sent;
      deltas are fragments), consecutive reasoning likewise; a tool_result attaches
      to the tool block opened by the tool_start with the same toolId; an orphan
      tool_result becomes its own tool block with tool ''; a divider passes
      through and ends any merge in progress.

Tests (at least 12), one per behaviour above: each kind decodes; truncation is
detected and the marker stripped; unframed and malformed input; text and reasoning
merging; tool pairing and orphan results; dividers; the glyph families.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 30
depends_on = ["T05"]
files = ["apps/portal/src/lib/streamRecord.ts", "apps/portal/src/lib/streamRecord.test.ts"]

[task.context]
