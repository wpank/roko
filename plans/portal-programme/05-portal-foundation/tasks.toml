[[task]]
id = "T05"
title = "Rewrite the wire contracts to what the server sends today"
description = '''
`apps/portal/src/api/contracts.ts` has no importers and describes a server that is
gone (junk-UUID plans, managed agents, dreams). Replace its whole content with the
wire shapes this portal consumes: snake_case, exactly as serde writes them. The Rust
sources are the authority; where they disagree with this list (engine work is
changing them), follow the source and say so in the task output.

From `crates/roko-core/src/dashboard_snapshot.rs` (grep `pub enum DashboardEvent`,
`pub struct DashboardSnapshot`, `pub struct PlanSetEntry`, `TaskGateOutput`):

- `WireDashboardEvent`, a union discriminated on `type`, with exactly these
  variants: plan_set_loaded {plans: PlanSetEntry[]}, plan_started {plan_id,
  tasks_total?}, plan_completed {plan_id, success}, run_completed {outcome,
  duration_ms, cleanup_degraded?, surviving_agent_ids?}, task_started {plan_id,
  task_id, title?, phase}, task_completed {plan_id, task_id, outcome},
  task_phase_changed {plan_id, task_id, old_phase, new_phase}, agent_spawned
  {agent_id, plan_id?, task_id?, attempt?, role, model?, provider?}, agent_output
  {agent_id, plan_id?, task_id?, attempt?, content}, agent_completed {agent_id,
  plan_id?, task_id?, attempt?}, agent_heartbeat {agent_id, plan_id, task_id,
  elapsed_ms}, gate_rung_started {plan_id, task_id, rung_name}, gate_output_line
  {plan_id, task_id, gate, line}, gate_result {plan_id, task_id, gate, passed,
  output_text?: string | null}, efficiency_event {plan_id, task_id, metric, value},
  critical_path_eta_updated {plan_id, eta_minutes: number | null},
  snapshot_rebased {revision, source?}, error {message}.
- `TASK_OUTCOME_ACCEPTED_WITH_FAILURES = 'accepted_with_failures'` (the Rust const).
- `WireDashboardSnapshot`, only the fields the portal reads: plans (record of
  {plan_id, phase, tasks_total, tasks_done, tasks_failed, active}), plan_set?
  ({plans, tasks_total, loaded_at_ms} | null), tasks (record keyed
  "plan/task" of {task_id, title?, plan_id, phase, outcome: string | null}), agents
  (record of the AgentState fields: agent_id, role, active, model, provider,
  input_tokens, output_tokens, cost_usd, current_task, current_plan, attempt,
  spawned_at_ms, elapsed_ms), gates ({plan_id, task_id, gate, passed, ts_millis}[]),
  task_gate_outputs? ({plan_id, task_id, gate, passed, lines}[]), task_outputs?
  (record task_id → string[]), errors ({message, ts_millis}[]), stats (at least
  cost_usd_total, total_input_tokens, total_output_tokens), run_duration_ms?,
  run_outcome?, critical_path_eta_minutes?.
- `WireStateHubSnapshotResponse` {cursor: string (hex, e.g. "0x1f"), state:
  WireDashboardSnapshot, recovered?} — `GET /api/statehub/snapshot`
  (`crates/roko-serve/src/projection_contract.rs`, `state_frame`).
- `WireGapPayload` {missed_events, last_materialized_seq, snapshot} —
  `crates/roko-serve/src/routes/sse.rs`.

From `crates/roko-serve/src/plan_types.rs`, plus the fields the portal has asked
roko-serve to add (optional, so the portal runs against today's server):

- `WirePlanSummary` {id, title, task_count, tasks_done, tasks_failed, completed,
  status, superseded_by?, old_format, last_error?, group?, estimated_minutes?}.
- `WirePlanTask` {id, title, description?, role?, tier, status, depends_on, files,
  completed, verify_phases, verify?: {phase, command, fail_msg?, timeout_ms?}[],
  estimated_minutes?, model_hint?}; `WirePlanTasks` {plan_id, task_count, tasks,
  title?, max_parallel?}.
- `WirePlanSource` {id, path, toml}; `WireDiagnostic` {severity: 'error' |
  'warning', rule_id, plan_id?, task_id?, message}; `WireValidation` {valid,
  errors, warnings, diagnostics}; `WireSourceSaved` {saved, errors, warnings,
  diagnostics} (200 from saving the source); `WireInvalidPlan` {code, message,
  errors, warnings, diagnostics} (its 422 body).
- `WireOperation` {id, kind?, status: string, result?: {slug?, task_count?} |
  null, error?: string | null}; `WireAccepted` {id, plan_id?: string, order?:
  string[], resume?: boolean, max_parallel_plans?: number} — generate answers with
  the new plan's `plan_id`, a multi-plan run with its `order` and the effective
  limit on plans running at once;
  `WireStatus` {workdir: string, git_branch?: string | null}.

Types only: no runtime code besides the one constant. Keep a short header comment
naming the Rust sources.
'''
