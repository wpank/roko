[[task]]
id = "T07"
title = "Fold dashboard events into run state"
description = '''
Create `apps/portal/src/lib/runState.ts` and `src/lib/runState.test.ts`: the pure
fold every live view reads. It mirrors `DashboardSnapshot::apply_with_ts` in
`crates/roko-core/src/dashboard_snapshot.rs` (read the match arms for the events
