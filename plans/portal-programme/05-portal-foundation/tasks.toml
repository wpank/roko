[[task]]
id = "T08"
title = "Establish the design tokens"
description = """
Create `apps/portal/src/styles/tokens.css` as the single visual vocabulary.

Build on the existing ROSEDUST palette rather than inventing colours. Define:

  **State tokens**, one per task and agent state: done, active, failed, pending,
  skipped, and the warning state used for work that is dispatched but not finished.
  That last one matters: green must mean actually finished, and a plan whose tasks
  are all dispatched but still in gates must read amber. This single rule prevents
  the most common orchestration misread.

  **Focus tokens**, exactly two: a bright border and a bone title for the focused
  region, and a near-invisible border with a ghost title for everything else. Exactly
  one region ever looks active.

  **Role accent tokens**, one fixed colour per agent role, used everywhere that role
  appears: the roster row, the transcript gutter, the agent tab, the burn row.

  **Semantic progress**, three bands for progress bars: below thirty percent, thirty
  to seventy, and above seventy. The bar's colour encodes the band, so a column of
  bars is scannable before any digit is read.

Define spacing and a type scale with tabular numerals, because the layout uses fixed
metric columns that must align vertically.
"""
