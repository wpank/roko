add the routes this track runs ahead of, and the views that call them explain a 404
or 405). React Query hooks over `api` from `@/api/client`, typed with `@/api/contracts`:

  queryKeys: { plans, planTasks(id), planSource(id), validation(id), workspace }
  usePlans()                   GET  /api/plans                   → WirePlanSummary[]
  usePlanTasks(id)             GET  /api/plans/{id}/tasks        → WirePlanTasks (enabled when id)
  usePlanSource(id, enabled)   GET  /api/plans/{id}/source → WirePlanSource
  useValidation(id)            POST /api/plans/{id}/validate {}  → WireValidation (a query keyed by id)
  useWorkspace()               GET  /api/status → { name: basename(workdir), path: workdir,
                                                    branch: git_branch ?? null }
  useSavePlanSource()          PUT  /api/plans/{id}/source {toml} → WireSourceSaved;
                               a 422 carries WireInvalidPlan
  useGeneratePlan()            POST /api/plans/generate {prompt} → WireAccepted (plan_id)
  useRevisePlan()              POST /api/plans/{id}/revise {feedback} → WireAccepted
                               (409 while the plan runs or is already being revised)
  planExists(id)               GET  /api/plans/{id} → true on 200, false on 404 (plain
                               function; how the portal sees a generated plan land)
  fetchOperation(id)           GET  /api/operations/{id} → WireOperation, or null on 404
                               (plain function; how it sees generation fail)
  useRunPlan()                 POST /api/plans/{id}/execute — no body runs fresh (Run,
                               Run again); {resume: true} for Retry
  useRunPlans()                POST /api/plans/execute {plans?: string[]} — {} runs every
                               plan (Run all), {plans} a group; one run per workspace (409)
  useCancelPlan()              POST /api/plans/{id}/cancel — a plan id or a run id

Encode ids with encodeURIComponent. Mutations that change a plan invalidate its
tasks, source and validation and the plan list; run and cancel invalidate the plan
list. Errors propagate as the client's `ApiError`, whose body the views show.
