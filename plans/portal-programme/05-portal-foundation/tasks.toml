[meta]
plan = "05-portal-foundation"
total = 14
done = 0
status = "ready"
skip_enrichment = true
estimated_total_minutes = 345

# Strip the portal to its working core and build the logic the one screen runs on.
#
# Measured 2026-09-28: 111 files, 33,286 lines, 34 routes, three navigation systems,
# no test runner, and a static export (`npm run build:export`) that has never built.
# This plan adds a test runner, deletes everything the design (02-DESIGN.md in
# tmp/portal-audit of the main checkout) does not use, and writes the pure core every later
# plan renders: wire contracts, the stream-record decoder, the run-state fold, the
# snapshot-then-stream bootstrap, the data hooks, tokens and primitives. No screens.
#
# Runs in its own git worktree beside the backend plans: every task touches only
# apps/portal and needs npm, never cargo or a running server. Live checks are in
# plan 09-acceptance. tmp/ is gitignored, so the audit documents do not exist in
# the worktree: every task here is self-contained and reads none of them.
#
# Verify conventions used throughout plans 05-08:
#   - `[ -d node_modules ] || npm ci` first: a fresh worktree has no node_modules.
#   - `rm -rf .next/types` before `tsc`: stale generated route types reference
#     deleted pages and fail the type check.
#   - the static export is the build gate; each gate deletes `out/` after checking
#     `out/index.html`, which keeps the worktree lean (`apps/portal/out/` is gitignored).
#   - `node scripts/vitest-min.mjs <test file> <n>` passes only when that file has
#     at least n passing tests and no failures (created by T01).

[[task]]
id = "T01"
title = "Add a unit test runner and a minimum-count test gate"
description = '''
`apps/portal` has no test runner: no `test` script, no vitest or jest, no test
files. Every pure-logic module later in plans 05-08 is gated on real unit tests,
so install one first. Work in `apps/portal`.

1. `npm install --save-dev --no-audit --no-fund vitest@5` (updates package.json
   and package-lock.json). vitest 5 supports the installed Node 22.
2. Add `"test": "vitest run"` to the `scripts` in package.json.
3. Create `vitest.config.ts`: `defineConfig` from `vitest/config`; `resolve.alias`
   maps `@` to `fileURLToPath(new URL('./src', import.meta.url))` (the tsconfig
   path alias); `test.include: ['src/**/*.test.ts']`; `test.environment: 'node'`.
   Tests are `.ts` only: logic lives in `.ts` modules, and components are
   verified by the type check and the build.
4. Create `scripts/vitest-min.mjs`, the gate helper later tasks use:
   `node scripts/vitest-min.mjs <test-file> <min>` runs
   `./node_modules/.bin/vitest run <test-file> --reporter=default --reporter=json
   --outputFile.json=<a file under os.tmpdir()>` with inherited stdio, then exits
   0 only if vitest exited 0 and the JSON report has `numFailedTests === 0` and
   `numPassedTests >= min`. It exits 1 otherwise (a missing test file included)
   and 2 on bad usage (missing file argument, or min not a positive integer).
5. Create `src/lib/formatters.test.ts` with three tests, one each for the existing
   `formatCost`, `formatTokens` and `formatDuration` in `src/lib/formatters.ts`,
   asserting the examples in their doc comments.

Run all three verify commands before finishing.
'''
status = "ready"
role = "implementer"
tier = "focused"
timeout_secs = 1200
max_retries = 2
estimated_minutes = 20
depends_on = []
files = [
    "apps/portal/package.json",
    "apps/portal/package-lock.json",
    "apps/portal/vitest.config.ts",
    "apps/portal/scripts/vitest-min.mjs",
    "apps/portal/src/lib/formatters.test.ts",
]

[task.context]
read_files = [
    { path = "apps/portal/package.json", why = "scripts and dependencies being extended" },
    { path = "apps/portal/tsconfig.json", why = "the @/* path alias the test config must mirror" },
    { path = "apps/portal/src/lib/formatters.ts", why = "the functions the sanity tests exercise" },
]
symbols = ["formatCost", "formatTokens", "formatDuration"]
anti_patterns = [
    "Do not install jest, @testing-library/* or jsdom; the portal tests pure .ts modules only.",
    "Do not set passWithNoTests: a gate over a missing test file must fail.",
]

[[task.verify]]
