[[task]]
id = "T04"
title = "Fix the snapshot replacement that wipes live state"
description = """
Fix a real data-loss bug in `apps/portal/src/stores/dashboard.ts`.

The snapshot replacement function reads camelCase keys for recent gates, recent
episodes, recent errors, inbox items, vitals, providers and learning. The server's
snapshot struct has **none of those names** — it uses snake_case, its inbox is a map
rather than an array, and it has no vitals, providers or learning field at all.

The consequence: every gap frame resets seven state slices to their defaults and also
wipes the activity feed. Gap frames arrive whenever the client falls behind the
server's replay ring, which is exactly when losing state hurts most.

Rewrite the function against the real snapshot shape, using the wire types from T03.
For fields the snapshot genuinely does not carry, preserve the existing local value
rather than resetting it — dropping to a default is strictly worse than keeping a
slightly stale value.

Add a unit test that feeds a realistic server snapshot and asserts no slice is reset
to its default.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = ["T03"]
files = ["apps/portal/src/stores/dashboard.ts"]

