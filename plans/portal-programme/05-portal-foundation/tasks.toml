  interface CheckRun  { name; index: number | null; phase: string;
                        status: 'running' | 'passed' | 'failed'; output: string }
  interface TaskRun   { planId; taskId; title; status: TaskStatus; phase;
                        attempts; startedAtMs: number | null; finishedAtMs: number | null;
                        agentId: string | null; role: string | null; model: string | null;
                        costUsd; inputTokens; outputTokens; checks: CheckRun[] }
  interface PlanRun   { planId; title: string | null; phase: PlanPhase; tasksTotal;
                        tasksDone; tasksFailed; tasksAccepted; startedAtMs: number | null;
                        finishedAtMs: number | null; etaMinutes: number | null; costUsd }
  interface AgentRun  { agentId; planId: string | null; taskId: string | null; role;
                        model; active: boolean; spawnedAtMs: number | null; costUsd;
                        inputTokens; outputTokens }
  interface Transcript { entries: TranscriptEntry[]; dropped: number }
  interface RunState  { planSet: {planIds: string[]; tasksTotal; loadedAtMs} | null;
                        plans: Record<string, PlanRun>; tasks: Record<string, TaskRun>;
                        agents: Record<string, AgentRun>; transcripts: Record<string, Transcript>;
                        errors: {message; atMs}[];
                        run: {startedAtMs: number | null; durationMs: number | null; outcome: string | null};
                        totals: {costUsd; inputTokens; outputTokens};
                        usage: {atMs: number; tokens: number}[] }
  MAX_TRANSCRIPT_ENTRIES = 2000, MAX_ERRORS = 50, MAX_USAGE_SAMPLES = 600
  taskKey(planId, taskId) → `${planId}/${taskId}`   (tasks and transcripts use it)
  parseCheckName(name) → {index, phase}: "verify[3:compile]" → {3,'compile'},
      "verify[2]" → {2,''}, anything else → {null, name}
  initialRunState(): RunState
  applyEvent(state, event: WireDashboardEvent, nowMs): RunState
      pure: returns new objects and never mutates its input
  fromSnapshot(snapshot: WireDashboardSnapshot, nowMs): RunState

applyEvent, per event (nowMs stands in for the timestamp events do not carry):
- plan_set_loaded: planSet in the given order with the summed total; each member
  not already running → phase pending, its tasks_total, counters zero, title set;
  run = {startedAtMs: nowMs, durationMs: null, outcome: null}.
- plan_started: phase running, tasksTotal = max(known, event), startedAtMs nowMs;
  when the plan is not in planSet, reset run as above.
- plan_completed: phase completed | failed by success; finishedAtMs nowMs.
- run_completed: durationMs/outcome set only when durationMs is null; running plans
  → completed ('succeeded'), cancelled ('cancelled') or failed (else); tasks still
  active → cancelled; every agent inactive.
- task_started: a known task in a terminal status is a retry — attempts + 1, checks
  cleared, a divider {kind:'divider', attempt} appended to its transcript; otherwise
  attempts 1. Status active, phase, title when non-empty, startedAtMs nowMs;
  plan tasksTotal = max(tasksTotal, known tasks of the plan).
- task_completed: ignored for an unknown task or one already terminal (idempotent).
  Status: exactly 'accepted_with_failures' → accepted_with_failures (tasksDone and
  tasksAccepted + 1) — test this before the next rule, because the string contains
  "fail" (`classify_task_outcome` does the same); contains 'fail' or 'error' →
  failed (tasksFailed + 1); 'skipped', 'condition-skipped' or 'unknown' (a node that
  never ran) → skipped (tasksDone + 1, as Rust counts it); else passed
  (tasksDone + 1). finishedAtMs nowMs.
- task_phase_changed: phase.
- agent_spawned / agent_completed / agent_heartbeat: upsert the agent (role falls
  back to model, then 'impl'); on spawn also set the task's agentId, role, model;
  heartbeat fills spawnedAtMs = nowMs - elapsed_ms when unknown.
- agent_output: decodeStreamRecord(content) appended to the transcript of the
  event's plan/task (else the agent's current plan/task; else dropped); past
  MAX_TRANSCRIPT_ENTRIES drop the oldest and count them in `dropped`.
- gate_rung_started → check {name: rung_name, status running, output ''};
  gate_output_line → append line + '\n' to that check (create it running);
  gate_result → status passed | failed, output = output_text ?? existing.
  Checks carry parseCheckName's index and phase and stay sorted by index (nulls last).
- efficiency_event: input_tokens / output_tokens / cost_usd add to the task, to the
  agent working that task, to the plan (cost) and to totals; each token metric also
  appends `{atMs: nowMs, tokens: value}` to `usage`, keeping the last
  MAX_USAGE_SAMPLES (the burn rate is computed from it); other metrics ignored.
  Several plans may run at once (a plan-set run executes independent plans
  concurrently): nothing here may assume a single running plan.
- critical_path_eta_updated: plan etaMinutes. error: append, keep the last MAX_ERRORS.
- snapshot_rebased and unknown types: return the state unchanged.

fromSnapshot maps plans (active → running; phase pending/completed/complete/
failed/cancelled mapped; anything else → running if active, pending if not),
plan_set, tasks (outcome via the same classification; null outcome → active;
attempts 1), agents (spawned_at_ms 0 → null; link each task's agentId from the
agent whose current_plan/current_task match), checks from `gates` (latest per task
and gate name) with output from task_gate_outputs lines joined by '\n',
transcripts from task_outputs (decoded; keyed to the one plan owning that task id,
skipped when ambiguous), errors, run (startedAtMs = plan_set.loaded_at_ms),
totals from stats; the snapshot's critical_path_eta_minutes goes to the running
plan when exactly one runs.

At least 20 tests: every event rule above, idempotent task_completed, the retry
path, transcript capping, the usage ring, two plans running at once with interleaved
events, fromSnapshot over a fixture shaped like the Rust snapshot JSON (include
plan_set and task_gate_outputs; `usage` starts empty), and an input-is-not-mutated
test (compare a JSON copy before and after applyEvent).
'''
