[meta]
plan = "05-portal-foundation"
total = 12
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 260

# Strip the portal to its working core and give it a foundation.
#
# The portal is 32,437 lines across 119 files and 34 routes, with three parallel
# navigation systems. About 6,000 lines are unreachable from any route, eleven pages
# render invented data, and the store's gap recovery silently wipes seven state
# slices because it reads camelCase keys the server has never sent.
#
# This plan deletes what is dead, fixes what is load bearing, and establishes the
# primitives the new single-screen design needs. It creates no new screens.
# See tmp/portal-audit/01-FINDINGS.md part C and 05-INVENTORY.md.

[[task]]
id = "T01"
title = "Delete the unreachable API layer"
description = """
Remove roughly 3,600 lines of API code in `apps/portal/src` that no route can reach.

Delete these files:

  src/api/safe-api.ts      1404 lines, imported only by safe-hooks.ts
  src/api/safe-hooks.ts     472 lines, zero importers anywhere
  src/api/ws-client.ts      348 lines, imported only by useWebSocket.ts
  src/hooks/useWebSocket.ts 226 lines, zero importers anywhere
  src/api/query-provider.tsx     zero importers; providers.tsx hand-rolls its own

The defensive safe-api layer is worth understanding before deleting it: its own
header declares the rule that no component should import the raw hooks module, and
every single page violates that rule. The layer was written, never adopted, and left
to rot. The new foundation replaces it with typed wire contracts, in T03.

Do **not** delete src/api/contracts.ts. It has zero importers today but it is the
only file in the tree with correct wire shapes, and T03 adopts it.

After deleting, run the type checker and remove any import left dangling.
"""
