# Build the frame of the one screen: header, alert row, plan rail, and the grid that
# holds the stage and the stream (placeholders here; plans 07 and 08 fill them).
#
# The selection principle, from mori: the rail selects a plan, the task list selects
# a task, and every other region is a lens on the selection. Selection is URL state
# (`?plan=&task=`), so a run in progress has an address that survives a reload.
#
# Needs plan 05 (the run-state fold, queries, glyphs, formatters, tokens, the test
# runner). Those files did not exist when this plan was written, so they are named
# in descriptions rather than in read_files. Same worktree and verify conventions as
# plan 05: npm only, `node scripts/vitest-min.mjs` for logic, type check for
# components.
#
# Concurrency (max_parallel 3): tasks that write disjoint files share a wave. Their
# gates are safe side by side — `tsc --noEmit --incremental false` (no shared
# .tsbuildinfo) and single-file vitest runs. The only production build is in T09,
# the final assembly, which depends on every other task.

[[task]]
id = "T01"
title = "Make the selection URL state"
description = '''
Create `apps/portal/src/lib/selection.ts` (pure), `src/lib/selection.test.ts` and
`src/lib/useSelection.ts` (the hook). Read `src/lib/runState.ts` first.

selection.ts exports:
  interface Selection { plan: string | null; task: string | null }
  parseSelection(search: string): Selection
      `plan` and `task` query params; empty values are null
  selectionSearch(search: string, patch: Partial<Selection>): string
      returns the new query string ('' when empty, else '?…'); keeps unrelated
      params; drops null values; changing `plan` clears `task` unless the patch sets it
  resolveSelection(sel: Selection, known: { loaded: boolean; planIds: readonly string[];
                   runningPlanIds: readonly string[] }): Selection
      once loaded, an unknown plan clears the selection silently (no error); before
      the list loads nothing is cleared; with no plan, the first running plan is
      selected (several may run at once)

useSelection.ts ('use client') exports `useSelection(): Selection & { select(patch:
Partial<Selection>): void }`. It reads `useSearchParams()` and writes with
`window.history.replaceState(null, '', location.pathname + selectionSearch(...))`:
Next 15 keeps useSearchParams in sync with history.replaceState, there is no
navigation, and replacing (not pushing) keeps the back button leaving the app.
Components calling it must render under `<Suspense>` (required by the static export).

At least 8 tests over the three pure functions.
'''
