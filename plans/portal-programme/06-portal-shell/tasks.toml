[[task]]
id = "T02"
title = "Derive the rail rows from the plan list and live state"
description = '''
Create `apps/portal/src/lib/planRows.ts` and `src/lib/planRows.test.ts`. Read
`src/lib/runState.ts`, `src/lib/glyphs.ts` and `src/api/contracts.ts` first.

  interface PlanRowModel { id; title; group: string | null; state: GlyphState;
    done; total; fraction; barToken: string;
    time: { kind: 'estimate' | 'elapsed' | 'actual' | 'none'; ms: number | null };
    queuePosition: number | null; supersededBy: string | null; running: boolean }
  interface PlanGroupModel { name: string | null; rows: PlanRowModel[]; done; total }
  interface PlanRowsResult { groups: PlanGroupModel[]; order: string[];
    runningPlanIds: string[]; count: number }
  buildPlanRows(plans: readonly WirePlanSummary[], run: RunState,
                opts: { filter: string; nowMs: number }): PlanRowsResult

Rules:
- Live state (`run.plans[id]`) wins over the disk summary. running → active;
  pending → queued with queuePosition = 1-based index in run.planSet.planIds, but
  only while the run is live (`run.run.durationMs` is null): an interrupted run
  leaves unstarted members `pending` with no further event, and once the run is over
  they fall back to their disk state. `run_completed` — published on every exit path
  by backend plan 03, which this rule depends on — is what sets durationMs; against
  an older server an interrupted run's unstarted plans keep their marks until the
  next set loads. Completed → accepted when tasksAccepted > 0,
  else done; failed → failed (this includes set members that could not start);
  cancelled → skipped.
- Disk only: status 'superseded' → skipped with supersededBy; completed → done;
  tasks_failed > 0 → failed; otherwise pending.
- done/total: live tasksDone/tasksTotal when live and tasksTotal > 0, else
  tasks_done/task_count. fraction = done/total (0 when total is 0).
- barToken: 'var(--progress-high)' only when state is done — green means verified;
  otherwise 'var(--progress-low)' below 0.3 and 'var(--progress-mid)' from 0.3, so a
  running plan at 90% reads amber.
- time: running with startedAtMs → elapsed (nowMs − startedAtMs); finished with both
  times → actual; not started with `estimated_minutes` → estimate (minutes × 60000);
  else none.
- Groups: top-level plans (group absent) first, then groups by name; rows by id
  with numeric-aware ordering (`localeCompare(b, undefined, {numeric: true})`).
  Group done counts rows in state done or accepted.
- filter: case-insensitive substring of id or title; empty groups dropped; count is
  the number of matching rows; order lists the ids in display order.
- runningPlanIds: every running plan — a plan-set run executes independent plans
  concurrently — in planSet order, then any others by id.

At least 14 tests, including: live over disk, two plans running at once, queue
positions, no queue after the run ends, accepted never done
and never green, a running plan at 90% is amber, superseded, grouping and numeric
order, filtering, each time kind.
'''
