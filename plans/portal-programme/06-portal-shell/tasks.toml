[[task]]
id = "T04"
title = "Build the plan row with fixed metric columns"
description = """
Create `apps/portal/src/components/shell/PlanRow.tsx`, one row in the rail.

The row is a grid with fixed column tracks, not a flex row: a status glyph, the plan
name, a done-over-total count, a progress bar, and an age. Numbers use the metric
cell primitive so they are right-aligned with tabular numerals and render a
placeholder dot rather than a blank when absent.

Fixed tracks and tabular numerals are what make a column of rows scannable straight
down. A flex row with proportional numerals is not.

Two rules that carry real information:

  - The name middle-ellipsizes. A plan named portal-redesign-phase-two truncated from
    the end becomes indistinguishable from its siblings; truncated in the middle it
    stays identifiable.
  - The progress bar takes its colour from the semantic band, and the row reads amber
    when every task is dispatched but the plan is not finished. Green means actually
    done. This single rule prevents the most common orchestration misread.

Use the status glyph and metric cell primitives from the foundation plan. Do not
define a second glyph vocabulary here.
"""
