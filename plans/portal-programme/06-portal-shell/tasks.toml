[[task]]
id = "T09"
title = "Assemble the workspace grid and mount it"
description = '''
Create `apps/portal/src/components/shell/Workspace.tsx` and make
`src/app/page.tsx` render `<Suspense fallback={null}><Workspace /></Suspense>`
(the static export requires Suspense around `useSearchParams`).

`export function Workspace()` ('use client') owns the screen state and lays out:
- A CSS grid filling `100dvh` with `overflow: hidden`: header (full width), alert
  row (full width), then the rail track (`var(--rail-width)`) beside a main column.
  The main column stacks the stage (flex 1) over the stream (collapsed to one bar,
  about 40% of the height when open). Every region scrolls on its own
  (`overflow: auto; min-height: 0`); the page never does. Each region is wrapped in
  `ErrorBoundary` from `@/components/ErrorBoundary` with a name.
- State: filter, streamOpen (false), promptOpen, dismissedAlertKey, requestError.
- Data: `usePlans()`, the store's `run` and `connection`, `useSelection()`.
  rows = `buildPlanRows(plans ?? [], run, { filter, nowMs: Date.now() })`; apply
  `resolveSelection` (select the first running plan when none is chosen; clear an unknown
  one once the list has loaded).
- Children: `Header` (`runningPlanIds` from the rail rows and the selected plan;
  onSelectPlan → select; onCancelRun → `window.confirm` naming how many running
  plans stop, then `useCancelPlan`), `AlertBand` (`pickAlert`; select-task → select; retry →
  `useRunPlan` with `{resume: true}`; reconnect → reload the page), `PlanRail`
  (onRunPlans → `window.confirm('Run <label> in dependency order?')`, then
  `useRunPlans` with `{}` for all or `{plans: ids}`; onNewPlan → promptOpen), and
  two placeholders plans 07 and 08
  replace: `<section data-region="stage">` showing `describeEmpty(...)` and
  `<section data-region="stream">` showing a collapse bar.
- `useKeyboard`: prev / next move the selection through `rows.order`; filter
  focuses the rail input; escape clears, in order, the alert, the filter, the prompt;
  stream toggles streamOpen; new sets promptOpen. `run` is wired in plan 07.
- A rejected mutation sets requestError from the ApiError body, so the alert band
  shows it; so does a failed plan list — discovery refuses to guess when two plan
  folders share one id, and `GET /api/plans` returns that error naming both paths.
  Any 401 shows `SIGN_IN_HINT` from `@/lib/bootstrap` instead of the raw error: the
  session is missing or died with a server restart, and the fix is the printed link.

Read every module this names before writing (all created by plan 05 or earlier in
this plan).
'''
