tier = "integrative"
model_hint = "claude-sonnet-4-6"
timeout_secs = 1800
max_retries = 2
estimated_minutes = 40
depends_on = ["T01", "T04", "T06", "T07", "T08"]
files = ["apps/portal/src/components/shell/Workspace.tsx", "apps/portal/src/app/page.tsx"]

[task.context]
read_files = [
    { path = "apps/portal/src/components/rail/PlanRail.tsx", why = "the rail's props" },
    { path = "apps/portal/src/components/shell/Header.tsx", why = "the header's props" },
    { path = "apps/portal/src/components/shell/AlertBand.tsx", why = "the alert band's props" },
    { path = "apps/portal/src/lib/useKeyboard.ts", why = "the key handler contract" },
    { path = "apps/portal/src/lib/useSelection.ts", why = "the selection hook" },
    { path = "apps/portal/src/components/ErrorBoundary.tsx", why = "the per-region boundary" },
]
anti_patterns = [
    "Do not let the page scroll as a whole.",
    "Do not add navigation, routes or a sidebar.",
    "Do not fix pixel widths other than the rail track.",
]

[[task.verify]]
phase = "structural"
command = "cd apps/portal/src && grep -q 'Workspace' app/page.tsx && grep -q 'Suspense' app/page.tsx && cd components/shell && grep -q 'export function Workspace' Workspace.tsx && grep -q 'data-region=\"stage\"' Workspace.tsx && grep -q 'data-region=\"stream\"' Workspace.tsx && grep -q 'ErrorBoundary' Workspace.tsx && grep -q 'useKeyboard' Workspace.tsx && grep -q 'buildPlanRows' Workspace.tsx"
fail_msg = "the workspace is not mounted under Suspense or is missing a region, the boundaries, the keyboard or the rail rows"

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && npm test'
fail_msg = "the unit suite fails"
timeout_ms = 600000

[[task.verify]]
phase = "integration"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && rm -rf .next/types out && ./node_modules/.bin/tsc --noEmit --incremental false && NEXT_TELEMETRY_DISABLED=1 npm run build:export && test -f out/index.html && rm -rf out'
fail_msg = "the portal does not type check or the static export fails with the shell mounted"
timeout_ms = 900000
