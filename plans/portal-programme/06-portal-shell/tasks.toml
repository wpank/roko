[[task]]
id = "T10"
title = "Add the seven keyboard bindings"
description = """
Create `apps/portal/src/lib/useKeyboard.ts` with exactly seven bindings and no more.

Arrow keys move the rail selection. Enter selects. The r key runs the selected plan.
The e key toggles the stage mode. The o key toggles the stream. Slash focuses the
plan filter. Escape dismisses the alert or clears the filter. There is no command
palette any more - it was deleted with the route sprawl - so do not bind modifier-k.

Two rules taken from the reference terminal UI and one rejected from it.

Taken: single unmodified letters for recoverable actions, and a modifier plus
confirmation for destructive ones. Cancelling a run must be confirmed and must not be
adjacent to a bare letter.

Taken: the bindings are context sensitive, meaning the arrow keys move within
whatever region has focus.

Rejected: using the tab key to cycle regions. In a browser, tab belongs to the
accessibility tree and stealing it breaks keyboard navigation for anyone who relies
on it. Use a different key or let focus follow the usual rules.

Do not fire a binding while a text input has focus.
"""
