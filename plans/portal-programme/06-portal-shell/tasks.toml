[[task]]
id = "T03"
title = "Make selection live in the URL"
description = """
Create `apps/portal/src/lib/useSelection.ts` so the selected plan, the stage mode and
the open stream pane are URL state.

The URL carries the plan slug, the mode, and which stream pane is open. Changing the
selection replaces the history entry rather than pushing one, so the back button
leaves the application instead of walking a trail of selections.

This is something the terminal UI this design borrows from structurally could not do:
its selection was ephemeral and unlinkable. Here a run in progress has an address
that survives a reload and can be pasted to a colleague.

Provide a single hook returning the current selection and a setter. Every region
reads from it. No component holds its own copy of the selected plan; that duplication
is how panes drift out of sync.

Handle the invalid cases: a plan slug in the URL that does not exist in the workspace
clears to no selection rather than rendering an error, and an unknown mode falls back
to the state-derived default.
"""
