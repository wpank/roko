total = 12
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 250

# Build the one screen.
#
# Three regions: a plan rail on the left, a stage in the middle that is a lens on the
# selected plan, and a collapsible agent stream at the bottom. One header row and one
# alert row. No navigation, because there is nowhere else to go.
#
# The selection principle: the rail selects and every other region is a lens on that
# selection. You never navigate to watch a run because you never left it.
# See tmp/portal-audit/02-DESIGN.md sections 2 and 3.

[[task]]
id = "T01"
title = "Bootstrap state from the snapshot, then stream deltas"
description = """
Create `apps/portal/src/lib/bootstrap.ts`, the correct way to get initial state.

The portal has always bootstrapped by connecting the event stream and folding
whatever it replayed. That is wrong: the server sends a snapshot only
**conditionally**, when the client's cursor fell out of the replay ring, when the
retained suffix exceeds its replay cap, or when the suffix has holes. A fresh client
with a short retained suffix gets raw events and no snapshot at all, and has to fold
from nothing.

The correct sequence is two steps: fetch the state hub snapshot, which returns the
full dashboard state together with a cursor, then open the event stream from that
cursor.

Implement that. Take the cursor from the snapshot response, not from local storage,
on a cold start. Hand it to the SSE client as its replay position.

The alternative, a single projection stream that sends one state frame then delta
frames, is noted in the contract document. Use the two-step form because it composes
with the persisted cursor from the foundation plan, and say in the task output which
you chose and why.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["apps/portal/src/lib/bootstrap.ts"]

[task.context]
read_files = [
    { path = "apps/portal/src/api/sse-client.ts", why = "the client whose replay position is being set, and its gap frame handling" },
    { path = "apps/portal/src/hooks/useStateHubSSE.ts", why = "the single mount point where the sequence must run" },
    { path = "crates/roko-serve/src/routes/sse.rs", why = "when the server does and does not send a snapshot, and the cursor precedence" },
    { path = "tmp/portal-audit/03-CONTRACT.md", why = "the bootstrap sequence this task implements" },
]
anti_patterns = [
    "Do not bootstrap by folding whatever the event stream happens to replay.",
    "Do not open the stream before the snapshot has supplied a cursor.",
]

[[task.verify]]
phase = "structural"
command = "test -f apps/portal/src/lib/bootstrap.ts && grep -q 'snapshot' apps/portal/src/lib/bootstrap.ts"
fail_msg = "the bootstrap helper is missing or does not fetch a snapshot first"

[[task]]
