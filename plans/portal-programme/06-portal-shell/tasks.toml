title = "Build the stage mode router"
description = """
Create `apps/portal/src/components/shell/Stage.tsx`, which decides what the centre
region shows.

The stage has two modes and picks between them from the selected plan's state: a plan
that has never run, or has been edited since, shows the authoring mode; a plan that
is running or has finished shows the run mode. The selection hook's mode parameter
overrides the derived choice when the operator toggles explicitly.

