[[task]]
id = "T06"
title = "Group the rail by dependency wave"
description = """
Create `apps/portal/src/components/shell/WaveGroup.tsx` and use it in the rail when
plans declare cross-plan dependencies.

A wave is the set of plans whose dependencies are satisfied by earlier waves; every
plan in a wave can run concurrently, and a wave cannot start until the previous one
drains. A wave header shows its index, its done-over-total count, and a blocker label
naming the wave it waits on.

Waves and progress are orthogonal axes and must not be conflated: the wave is
horizontal parallelism across plans, and progress within a plan is vertical. Show
them in different places.

When no plan declares a cross-plan dependency, the rail stays flat. Do not render a
single wave containing everything; that is noise carrying no information.

Groups collapse and expand, and the state persists per wave across reloads.
"""
