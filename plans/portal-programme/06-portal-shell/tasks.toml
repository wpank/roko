[[task]]
id = "T05"
title = "Rank alert candidates into exactly one alert"
description = '''
Create `apps/portal/src/lib/alerts.ts` and `src/lib/alerts.test.ts`. Read
`src/lib/runState.ts` and `src/lib/bootstrap.ts` first.

  type AlertAction = { kind: 'select-task'; planId: string; taskId: string }
                   | { kind: 'retry'; planId: string } | { kind: 'reconnect' }
  interface Alert { key: string; severity: 'error' | 'warning'; text: string;
                    actions: AlertAction[] }
  interface AlertInput { run: RunState; connection: ConnectionStatus;
    selectedPlanId: string | null; validationErrors: number;
    requestError: string | null; dismissedKey: string | null }
  pickAlert(input: AlertInput): Alert | null

One channel, not three (mori stacked an alert band, a toast stack and a status
bar). Candidates in rank order; return the first whose key is not dismissedKey:
1. requestError (a portal action the server rejected), then the newest
   `run.errors` entry — execution errors.
2. A failed task, preferring the selected plan: text `<task> failed: <phase> —
   <first output line of its first failed check that does not start with '$ '>`;
   actions select-task and retry. Key includes the task's attempt count, so a
   retried failure alerts again.
3. validationErrors > 0 on the selected plan: warning `<n> validation errors`,
   action select-task is not applicable, so none.
4. connection disconnected or error: `Lost the server; reconnecting.`, action
   reconnect.
Every alert names what and where; none says only "error".

At least 9 tests: each rank, precedence between ranks, dismissal falling through to
the next candidate, the attempt-keyed re-alert, and null when all is well.
'''
