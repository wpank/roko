    { path = "apps/portal/src/components/stage/PromptPanel.tsx", why = "the generate field" },
]
anti_patterns = [
    "Do not require a click before the generate field appears in a workspace with no plans.",
    "Do not bind r to cancel.",
]

[[task.verify]]
phase = "structural"
command = 'cd apps/portal/src/components && grep -q "export function Stage" stage/Stage.tsx && grep -q "PromptPanel" stage/Stage.tsx && grep -q "PlanView" stage/Stage.tsx && grep -q "<Stage" shell/Workspace.tsx && grep -q "usePrimaryAction" shell/Workspace.tsx'
fail_msg = "Stage is missing, or Workspace does not render it and wire the run key"

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && npm test'
fail_msg = "the unit suite fails"
timeout_ms = 600000

[[task.verify]]
phase = "integration"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && rm -rf .next/types out && ./node_modules/.bin/tsc --noEmit && NEXT_TELEMETRY_DISABLED=1 npm run build:export && test -f out/index.html && rm -rf out'
fail_msg = "the portal does not type check or the static export fails with the stage mounted"
timeout_ms = 900000
