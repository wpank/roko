Create `apps/portal/src/components/compose/GeneratePrompt.tsx`, the single field that
starts everything.

When the operator picks generate in the rail, the stage becomes one prompt field with
one hint. Type a sentence, submit with the modifier and enter, and a plan is
generated. No project type picker, no template gallery, no wizard. One field.

Behaviour:

  - Submit calls the plan generation endpoint with the prompt.
  - Generation takes tens of seconds, so show what is happening rather than a spinner
