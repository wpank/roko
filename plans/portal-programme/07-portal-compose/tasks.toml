  - On failure, show what failed in the alert band and keep the typed prompt so the
    operator can adjust rather than retype.

Offer a small number of example prompts below the field, and make the first one a
rust app that prints hello world, because that is the test that defines done for this
programme.

Read these files before you start. They were created by an earlier plan in the
sequence, so they are not pre-loaded as context here:
