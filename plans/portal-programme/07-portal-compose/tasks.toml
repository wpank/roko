[[task]]
id = "T07"
title = "Wire task editing and saving"
description = """
Make the inspector's edits persist, through the plan tasks write endpoint.

Requirements:

  - Edits are local until saved. An accidental keystroke must not write to disk.
  - The save action is explicit and shows its state: unsaved changes, saving, saved.
  - A rejected save shows why, anchored to the offending field, and leaves the local
    edits intact so the operator can fix them. A rejected save that discards the work
    is worse than no save at all.
  - Saving a plan that is currently running is refused with an explanation, not
    silently allowed. The runner has already read the file.

Round-trip safety is the thing to get right. Read the tasks, make no change, save,
and read again: the result must be identical. The server side validates and writes
through the parser precisely so this holds, and the portal must not undo that by
dropping fields it does not display. Carry unknown fields through untouched.
"""
