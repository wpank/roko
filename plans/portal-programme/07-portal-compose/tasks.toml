# Authoring: the half of the stage where you make a plan.
#
# This delivers the flow that defines success. Click generate, type one sentence,
# get a plan you can read, adjust and run. Three actions, one screen.
#
# The DAG is rendered as ordered waves rather than a node canvas: for a plan of a
# dozen tasks, waves carry the same information in one row and cost nothing to read.
# See tmp/portal-audit/02-DESIGN.md section 4a.

[[task]]
id = "T01"
title = "Compute dependency waves from task edges"
description = """
Create `apps/portal/src/lib/waves.ts`, a pure function turning a task list into
ordered waves.

A wave is the set of tasks whose dependencies are all satisfied by earlier waves.
Everything in a wave can run concurrently. This is the same computation the runner
does server side, and the portal must do it client side because **no event carries
task edges** — the only source is the dependency list on each task from the plan
tasks endpoint.

Requirements:

  - Detect cycles and return them as a diagnostic rather than looping or throwing. A
    plan with a cycle must still render, with the cycle named.
  - Detect dependencies on task ids that do not exist and report them the same way.
    Both of these are real validation rules the server enforces, and the operator
    should see them in the editor before the run path rejects the plan.
  - Be stable: the same input yields the same wave ordering, so the display does not
    reshuffle on refetch.

Pure logic, no rendering. Unit test it in this task with a table of inputs: a linear
chain, a diamond, a cycle, a dangling reference, and an empty plan.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["apps/portal/src/lib/waves.ts"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/runner/plan_dag.rs", why = "the server-side wave computation whose ordering this must match" },
    { path = "crates/roko-cli/src/plan_validate.rs", why = "the cycle and dangling dependency rules the editor should surface early" },
    { path = "apps/portal/src/api/contracts.ts", why = "the task wire shape carrying the dependency list" },
]
anti_patterns = [
    "Do not throw on a cycle. Return it as a diagnostic so the plan still renders.",
    "Do not produce a different ordering for the same input.",
]

[[task.verify]]
phase = "structural"
command = "test -f apps/portal/src/lib/waves.ts && grep -qi 'cycle' apps/portal/src/lib/waves.ts"
fail_msg = "the wave helper is missing or does not detect cycles"

[[task]]
id = "T02"
title = "Build the wave strip"
description = """
Create `apps/portal/src/components/compose/WaveStrip.tsx`, the DAG in one row.

Render the waves from T01 as ordered groups of task chips: wave one, its tasks, then
wave two, its tasks, and so on. Each chip shows the task id and its status glyph.
Clicking a chip selects that task in the inspector.

This is deliberately not a node-and-edge canvas. A canvas needs layout, pan, zoom and
a legend, and for a dozen tasks it conveys nothing a wave strip does not. If a plan
grows past the point where the strip is readable, the strip wraps; it does not become
a graph.

Show the concurrency, because that is the information a wave carries: a wave with
four tasks means four agents can run at once, subject to the plan's parallelism
setting. Make that legible, and mark where the plan's own parallelism limit is lower
than the wave width, since that is a common and invisible bottleneck.

When a cycle or a dangling dependency was detected, render the affected chips in the
failure colour with the diagnostic on hover.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = ["T01"]
