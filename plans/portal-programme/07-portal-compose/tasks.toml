[[task]]
id = "T08"
title = "Wire the run action"
description = """
Make the run control in the compose header actually start the plan, and hand the
screen over to the run view.

On run: call the execute endpoint, switch the stage to run mode, and open the stream.
The stage derives its own mode from plan state, so the switch should follow naturally
from the plan becoming active rather than being forced; verify which happens and make
the transition immediate either way. A visible delay between clicking run and the
screen responding reads as a broken button.

Handle the cases honestly:

  - The plan is already running: the control reads cancel, not run, and cancelling
    asks for confirmation.
  - The plan has unsaved edits: offer to save first rather than running a stale file,
    because the runner reads from disk and would silently ignore the edits.
  - The plan is invalid: say so and do not start. Starting a plan the runner will
    reject wastes a worktree and produces a confusing failure.

Keyboard: the r binding from the shell reaches this action.

Read these files before you start. They were created by an earlier plan in the
sequence, so they are not pre-loaded as context here:
  apps/portal/src/components/shell/Stage.tsx
  apps/portal/src/lib/useKeyboard.ts
"""
