[meta]
plan = "07-portal-compose"
total = 10
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 260

# The stage: one plan view for authoring and for watching, plus plan generation.
#
# There are no Compose and Run modes. The same task list is the authoring view
# before a run and the live view during and after one; rows gain status as events
# arrive. Iteration is Revise (one sentence; the plan is regenerated in place, backend
# plan 04b) or Edit (the plan's tasks.toml as text, validated by the server before it
# is written). Generation is one field; with no plans yet, the stage is that field.
#
# Needs plans 05 and 06, whose files are named in descriptions rather than
# read_files. The routes it calls are the reconciled contract
# (tmp/portal-audit/03-CONTRACT.md section 6 in the main checkout); the backend track
# adds some of them in parallel, so each view explains a 404 or 405 rather than
# failing silently.
# Same worktree and verify conventions as plan 05.

[[task]]
id = "T01"
title = "Compute dependency waves from task edges"
description = '''
Create `apps/portal/src/lib/waves.ts` and `src/lib/waves.test.ts`.

No event carries task edges; the only source is each task's `depends_on` from
`GET /api/plans/{id}/tasks`, so the portal layers the DAG itself.

  interface WaveDiagnostic { kind: 'cycle' | 'dangling'; taskIds: string[]; message: string }
  interface WaveResult { waves: string[][]; diagnostics: WaveDiagnostic[] }
  computeWaves(tasks: ReadonlyArray<{ id: string; depends_on: readonly string[] }>): WaveResult

Kahn layering: the first wave holds tasks with no known dependencies; each next wave
holds tasks whose dependencies all sit in earlier waves; within a wave keep input
order, so the same input always yields the same waves. A dependency on an unknown id
is ignored for layering and reported (`T03 depends on T09, which does not exist`).
Tasks that never become ready are a cycle: report them once (`T04 → T05 → T04 form
a cycle`) and append them as a final wave, so a broken plan still renders. A task
depending on itself is a cycle. Never throw.

At least 9 tests: empty, single, chain, diamond, parallel roots keep input order,
dangling, cycle, self-cycle, and a cycle beside independent tasks.
'''
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 20
depends_on = []
files = ["apps/portal/src/lib/waves.ts", "apps/portal/src/lib/waves.test.ts"]

[task.context]
anti_patterns = [
    "Do not throw on a cycle; return it as a diagnostic.",
    "Do not reorder tasks within a wave.",
]

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/lib/waves.test.ts 9'
fail_msg = "the wave computation lacks at least 9 passing tests"
timeout_ms = 600000

[[task]]
id = "T02"
title = "Wait for a generation or a revision to finish"
description = '''
Create `apps/portal/src/lib/operation.ts` and `src/lib/operation.test.ts`.

`POST /api/plans/generate {prompt}` and `POST /api/plans/{id}/revise {feedback}`
answer 202 with `WireAccepted` (`src/api/contracts.ts`): `{id, plan_id}` — the
operation id and the plan's slug, known up front. `GET /api/operations/{id}` reports
`{status: running|completed|failed, result?: {slug, task_count}, error?}` and is
swept about 60s after the operation finishes, so polling every second sees the
outcome. Waiting on exactly the named plan is not racy; diffing the plan list to
guess what was created is, and the portal never does it.

  interface OperationDeps {
    planExists(id: string): Promise<boolean>;                   // GET /api/plans/{id} is 200
    fetchOperation(id: string): Promise<WireOperation | null>;  // null on 404
    sleep(ms: number): Promise<void>; now(): number }
  waitForOperation(accepted: WireAccepted, deps: OperationDeps, opts: {
    expect: 'new-plan' | 'revision'; intervalMs?: number; timeoutMs?: number;
    onPoll?(elapsedMs: number): void }): Promise<{ slug: string }>

Every intervalMs (default 1000):
- a `failed` operation rejects with its `error` (or a generic message), whatever
  `expect` is;
- `new-plan`: resolve `{slug: plan_id}` once planExists(plan_id) is true, or once
  the operation completes with `result.slug` (an older server that sends `{id}`
  only); a null operation is ignored, because the plan appearing is the signal;
- `revision`: the plan already exists, so resolve only when the operation
  completes; three null operations in a row reject ("the revision cannot be
  tracked"), since then nothing else can report the outcome.
Status is compared case-insensitively on its leading word (an older server prints
Rust Debug, `Completed { … }`). Past timeoutMs (default 600000) reject. Up to three
consecutive fetch errors are tolerated; the fourth rejects with the last error.

At least 10 tests with fake deps: new plan appears, appears late, operation fails
first, Debug-formatted status, `{id}`-only with result.slug, revision completes,
revision fails, revision untrackable, timeout, transient fetch errors recovered.
'''
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = ["T01"]
files = ["apps/portal/src/lib/operation.ts", "apps/portal/src/lib/operation.test.ts"]

[task.context]
anti_patterns = [
    "Do not call Date.now or setTimeout directly; use the injected deps.",
    "Do not poll or diff the plan list.",
]

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/lib/operation.test.ts 10'
fail_msg = "the operation waiter lacks at least 10 passing tests"
timeout_ms = 600000

[[task]]
id = "T03"
title = "Derive task rows from plan tasks and live state"
description = '''
Create `apps/portal/src/lib/taskRows.ts` and `src/lib/taskRows.test.ts`. Read
`src/lib/runState.ts`, `src/lib/glyphs.ts`, `src/lib/waves.ts` and
`src/api/contracts.ts` first.

  interface TaskRowModel { id; title; wave: number; state: GlyphState;
    status: TaskStatus | 'pending'; role: string | null; model: string | null;
    time: { kind: 'estimate' | 'elapsed' | 'actual' | 'none'; ms: number | null };
    costUsd: number | null; attempts: number; checks: CheckRun[];
    dependsOn: string[]; waitingOn: string[]; files: string[];
    description: string | null; verify: { phase: string; command: string }[] }
  buildTaskRows(tasks: readonly WirePlanTask[], run: RunState, planId: string,
                nowMs: number): { rows: TaskRowModel[]; waves: WaveResult }
  focusTaskId(rows: readonly TaskRowModel[], selected: string | null): string | null

- Rows in wave order, input order within a wave; they never move during a run.
- status: live `run.tasks[taskKey(planId, id)]` when present; else skipped when
  the live plan failed or was cancelled and the task never started; else passed
  when the wire task is completed; else pending. state via glyphStateForTask.
- role and model: live, else the wire `role` and `model_hint`. costUsd: live or null.
- time: active with startedAtMs → elapsed; finished with both times → actual;
  pending with `estimated_minutes` → estimate; else none.
- waitingOn: dependencies whose row is not passed, accepted_with_failures or skipped.
- verify: the wire `verify` when the server sends it, else one entry per
  `verify_phases` name with an empty command.
- focusTaskId: `selected` when it is a row; else the first active; else the first
  failed; else the last finished; else null. The stream follows this task.

At least 11 tests: each status source, skipped after a failed plan, wave order,
waitingOn, each time kind, and every focusTaskId branch.
'''
