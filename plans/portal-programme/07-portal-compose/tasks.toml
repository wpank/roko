[[task]]
id = "T03"
title = "Build the task inspector"
description = """
Create `apps/portal/src/components/compose/TaskInspector.tsx`, where a task is read
and edited.

Every field maps to a key in the plan's tasks file. Show and edit: the role, the
tier, the model hint, the dependency list, the output file list, the description, and
the verify steps with their phase and command.

Constrain the fields the format constrains. The role, tier and status are closed
sets, not free text, and offering free text guarantees the operator writes something
the schema rejects. Read the accepted values from the parser rather than hardcoding a
guess, and note in the task output where you read them from.

Two schema rules the inspector must make visible rather than let the operator
discover at run time: a task whose role is implementer must have at least one verify
step, and must have at least one output file. Both are hard schema errors. Show them
as unmet requirements on the field, not as a validation failure after saving.

The description is the agent's prompt and is the most important field on the screen.
Give it room. It is not a one-line input.
"""
