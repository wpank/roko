[[task]]
id = "T05"
title = "Build the live validation badge"
description = """
Create `apps/portal/src/components/compose/ValidationBadge.tsx`, which shows whether
the plan would run.

It calls the plan validation endpoint and renders a summary: valid, or a count of
errors and warnings. Clicking it lists the diagnostics, and clicking a diagnostic
selects the task it names.

The important behaviour is that diagnostics anchor to fields. A rule about an unknown
dependency belongs on the dependency field of the task it names, not in a list at the
bottom of the screen. Pass the diagnostics down so the inspector can render them in
place, and make the badge the summary rather than the only presentation.

Debounce revalidation while the operator types. Validation is a round trip and firing
it per keystroke is both wasteful and visually noisy.

Distinguish severities honestly. An invalid plan is a normal editing state; render it
as information, not as an error state with alarm colouring. Reserve the failure
colour for a plan that genuinely cannot run.
"""
