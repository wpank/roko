[meta]
plan = "08-portal-run"
total = 13
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 280

# Watching: the half of the stage where a plan executes.
#
# Modeled on the terminal dashboard this design borrows from: a progress header over
# four panels, with a structured agent transcript below. Copy its information
# architecture and its colour semantics; do not copy its decoration.
#
# The last three tasks are the end-to-end proof for the whole programme.
# See tmp/portal-audit/02-DESIGN.md sections 4b and 5.

[[task]]
id = "T01"
title = "Decode the framed agent output records"
description = """
Create `apps/portal/src/lib/streamRecord.ts`, which turns an agent output event into
a structured record.

Agent output content is **not raw text**. Every line is wrapped in a record separator
character, a version marker, and a JSON body whose kind is one of text, reasoning,
tool start, or tool result, alongside the agent, plan and task ids and an attempt
number. The framing constants are defined in the runner bridge.

Implement a decoder that strips the prefix, parses the body, and returns a typed
record. Handle the cases that will occur in practice:

  - A line with no prefix, which is legacy or unframed output. Return it as text
    rather than discarding it.
  - A malformed JSON body. Return it as text with a flag, never throw. One bad record
    must not break the transcript.
  - A truncated tool result. Oversized tool output is truncated server side, keeping
    the tail rather than the head, so mark it as truncated and say which end was cut.

Unit test each case in this task. This decoder sits between the event stream and
everything the operator reads, so it has to be robust rather than clever.
"""
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["apps/portal/src/lib/streamRecord.ts"]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/runner/tui_bridge.rs", why = "the framing constants, the record kinds and the exact prefix written" },
    { path = "crates/roko-cli/src/graph_task_dispatch.rs", why = "where records are produced and where oversized tool output is truncated" },
    { path = "apps/portal/src/api/contracts.ts", why = "the agent output event wire shape carrying the framed content" },
]
anti_patterns = [
    "Do not throw on a malformed record. One bad line must not break the transcript.",
    "Do not discard unframed lines. Return them as text.",
]

[[task.verify]]
phase = "structural"
command = "test -f apps/portal/src/lib/streamRecord.ts && grep -qi 'tool' apps/portal/src/lib/streamRecord.ts"
fail_msg = "the stream record decoder is missing or does not handle tool records"

[[task]]
id = "T02"
title = "Build the structured transcript"
description = """
Create `apps/portal/src/components/run/Transcript.tsx`, which renders decoded records
as a readable transcript rather than a log tail.

Each record gets a gutter glyph and the role's accent colour by kind: a filled
diamond for a heading, a hollow circle for reasoning, a pencil for a file edit, a
hollow diamond for a file read, a gear for a tool call, a vertical bar for code, and
a check or cross for success and failure.

The source is already structured, so do not do string surgery on model prose to guess
at paragraph breaks. The terminal UI this borrows from had to, because it received
flat text; here the record kind is explicit and should be trusted.

A browser does this better than a terminal can, and should:

  - Render real markdown in text records.
  - Make tool calls collapsible, collapsed by default, showing the tool name and a
    one-line summary. A long tool result should not push the reasoning off screen.
  - Syntax highlight code records.
  - Make file paths clickable, selecting the task that owns that file.

Auto-scroll while at the bottom; stop when the operator scrolls up and show a control
to resume. Cap the retained lines and say when lines were dropped rather than
silently losing them.
"""
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 35
depends_on = ["T01"]
files = ["apps/portal/src/components/run/Transcript.tsx"]

[task.context]
read_files = [
    { path = "apps/portal/src/lib/streamRecord.ts", why = "the decoded record kinds being rendered" },
    { path = "apps/portal/src/stores/dashboard.ts", why = "the agent output ring the transcript reads from" },
    { path = "apps/portal/src/styles/rosedust.css", why = "the palette the gutter accents draw from" },
    { path = "tmp/portal-audit/02-DESIGN.md", why = "the glyph vocabulary and the transcript specification" },
]
anti_patterns = [
    "Do not do string surgery on prose to fake paragraph breaks. The record kind is explicit.",
    "Do not expand tool results by default. They push the reasoning off screen.",
    "Do not keep auto-scrolling after the operator scrolls up.",
    "Do not drop lines silently when the cap is reached.",
]

[[task.verify]]
phase = "structural"
command = "test -f apps/portal/src/components/run/Transcript.tsx"
fail_msg = "the transcript component was not created"

[[task]]
id = "T03"
title = "Build the stream pane with agent tabs"
description = """
Create `apps/portal/src/components/run/StreamPane.tsx`, the bottom region of the
screen.

Tabs are the agents working on the selected plan, each labelled with a status glyph,
the task id and the role, plus badge tabs for errors, the diff and gate output.

One rule about badges, taken from the reference UI and worth keeping exactly: a count
appears only on an **inactive** tab. The active tab suppresses its own badge, because
the operator is already looking at the content the badge would be summarizing.

The pane collapses and expands, opens automatically when a run starts, and remembers
its state per plan. Its open state and the active tab live in the URL selection, so a
reload restores what the operator was reading.

When nothing is running, do not show an empty pane with dead tabs. Show the last run's
transcript if there is one, or the derived empty sentence if there is not.

Read these files before you start. They were created by an earlier plan in the
sequence, so they are not pre-loaded as context here:
