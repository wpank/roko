[[task]]
id = "T05"
title = "Build the live task list"
description = """
Create `apps/portal/src/components/run/TaskList.tsx`, the run view's primary panel.

Each row: a status glyph, the task id, a countdown when the task is active, the
title, and the short id of the owning agent. Sort active first, then queued, then
done, so the rows the operator cares about are always at the top and do not move as
the run progresses.

The countdown is the estimate minus the elapsed, shown in the warning colour when it
goes negative. That single figure is what tells an operator a task is stuck, and it
is more useful than either number alone.

Selecting a row points the stream pane at that task's agent. Same selection
principle, one level down.

Expanding a row shows the task's output files, its dependencies with their current
status, and its gate results inline.

Use the status glyph and metric cell primitives. Do not define new state colours
here; the amber-for-dispatched-but-unfinished rule applies to tasks exactly as it does
to plans.
"""
