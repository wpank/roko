[meta]
plan = "08-portal-run"
total = 10
done = 0
status = "ready"
max_parallel = 3
skip_enrichment = true
estimated_total_minutes = 245

# What a run looks like while it happens: the stream and the run band.
#
# The stream is a lens on the selected task, or with none selected on the active
# task, else the failed one, else the last finished (focusTaskId). Two views:
# the transcript (decoded agent records) and the checks (verify steps, with a
# failure digested before its raw output). It opens when a run starts.
#
# The run band is mori's dashboard row, kept by decision (2026-09-28): one band,
# three cells, shown while anything runs and zero height otherwise. AGENTS is the
# roster across every running plan — a plan-set run executes independent plans
# concurrently, so rows carry their plan; CHECKS is the verify ladder of the selected
# (else active) task; BURN is tokens, tokens per minute and each role's share (cost
# stays in the header). Each cell is a pure fold with counted unit tests.
#
# The last task removes every module nothing reaches and adds a reachability check,
# so dead code cannot creep back. Live verification of the whole screen is plan
# 09-acceptance. Same worktree and verify conventions as plan 05.
#
# Concurrency (max_parallel 3): tasks that write disjoint files share a wave; their
# gates (`tsc --noEmit --incremental false`, single-file vitest) are safe side by
# side. T09 is the only task that edits Workspace.tsx, and T10 holds the plan's one
# production build.

[[task]]
id = "T01"
title = "Digest check output into grouped, deduplicated diagnostics"
description = '''
Create `apps/portal/src/lib/checks.ts` and `src/lib/checks.test.ts`.

A failing check prints the same few messages many times; the shape of the failure is
what matters. Gate output published by the runner starts with a `$ <command>` line
(`published_gate_output` in crates/roko-cli/src/graph_task_dispatch.rs), then the
captured output.

  interface DigestEntry { severity: 'error' | 'warning'; line: number | null;
                          column: number | null; message: string; count: number }
  interface DigestGroup { file: string; entries: DigestEntry[] }
  interface Digest { command: string | null; groups: DigestGroup[]; unparsed: string[];
                     errorCount: number; warningCount: number }
  digestOutput(output: string): Digest

Recognise:
- the leading `$ command` line → `command`;
- rustc and cargo: `error[E0425]: msg` or `warning: msg`, located by the next
  `  --> path:line:col` line;
- tsc: `path(line,col): error TS2322: msg`;
- compact compiler form: `path:line:col: error: msg` / `path:line: warning: msg`;
- Rust panics: `thread '…' panicked at path:line:col:` with the message on the next
  line.
Identical (file, line, column, severity, message) entries merge with a count.
Groups holding errors come first, then by file name; within a group errors come
before warnings, then by line. Lines that match nothing are kept, in order, in
`unparsed` — a digest that drops the one line that explained the failure is worse
than none. Never throw.

At least 10 tests, one per format plus dedupe, ordering, unparsed retention, the
command line, and empty input.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["apps/portal/src/lib/checks.ts", "apps/portal/src/lib/checks.test.ts"]

[task.context]
anti_patterns = [
    "Do not discard lines that do not parse.",
    "Do not throw on unexpected input.",
]

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/lib/checks.test.ts 10'
fail_msg = "the check digest lacks at least 10 passing tests"
timeout_ms = 600000

[[task]]
id = "T02"
title = "Build the transcript"
description = '''
Create `apps/portal/src/components/stream/Transcript.tsx`:

  export function Transcript({ transcript, working }: {
    transcript: Transcript | undefined; working: { sinceMs: number } | null })

(`Transcript` the type comes from `@/lib/runState`; alias one of the two names.)

Agent output arrives once per agent turn, not token by token: roko's immune
boundary releases only the screened final body. So a long turn must not look like a
hang: while `working` is set, the transcript ends in a live line `agent working ·
<elapsed since sinceMs>` (compactDuration, ticking each second) — the liveness the
server provides through agent_spawned and the 5-second agent_heartbeat.

Render `toBlocks(transcript.entries)` from `@/lib/streamRecord` inside
`<div data-region="transcript">`:
- text: plain text, whitespace preserved; no markdown library, no string surgery.
- reasoning: dim, `◦` gutter, collapsible.
- tool: one collapsed `<details>` row — glyph (`✎` / `◇` / `⚙`), tool name, first
  output line; expanded, the output in a monospace block, and when truncated a note
  that the server kept only the tail.
- raw: monospace, with a marker when malformed.
- divider: `— attempt N —`.
- `dropped > 0`: a first line `N earlier records not shown`.
Auto-scroll while the view is at the bottom (within 24px); stop when the operator
scrolls up and show a `↓ follow` button that resumes. No transcript and not
working: a single line saying the agent has not produced output yet.

Read src/lib/streamRecord.ts and src/lib/runState.ts first.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["apps/portal/src/components/stream/Transcript.tsx"]

[task.context]
anti_patterns = [
    "Do not expand tool calls by default; they push the reasoning off screen.",
    "Do not keep auto-scrolling after the operator scrolls up.",
    "Do not drop records silently.",
]

