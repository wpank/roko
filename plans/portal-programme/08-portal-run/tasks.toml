[[task]]
id = "T05"
title = "Fold the agent roster across running plans"
description = '''
Create `apps/portal/src/lib/agentRoster.ts` and `src/lib/agentRoster.test.ts`: the
AGENTS cell of the run band. Read `src/lib/runState.ts` first.

A plan-set run executes independent plans concurrently, so the roster spans every
running plan and each row names its plan. Do not assume any limit on how many run.

  interface RosterRow { agentId: string; planId: string | null; taskId: string | null;
    role: string; model: string; elapsedMs: number | null; tokens: number }
  interface Roster { rows: RosterRow[]; finished: number; idle: number | null }
  buildRoster(run: RunState, opts: { nowMs: number; runningPlanIds: readonly string[];
    maxParallelByPlan: Readonly<Record<string, number | undefined>> }): Roster

- rows: the active agents of running plans, ordered by the plan's position in
  runningPlanIds, then task id (numeric-aware), then agent id. elapsedMs is
  nowMs − spawnedAtMs (null when unknown); tokens is input + output.
- finished: agents of those plans that are no longer active — counted, not listed.
- idle: open parallel slots, the sum over running plans whose max_parallel is known
  of max(0, maxParallel − that plan's active agents); null when none is known.

At least 8 tests: two plans' agents ordered by plan then task, finished agents
counted and not listed, elapsed and tokens, idle across two plans, a plan with more
active agents than its limit adds 0, unknown limits give null, and an idle run.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 25
depends_on = []
files = ["apps/portal/src/lib/agentRoster.ts", "apps/portal/src/lib/agentRoster.test.ts"]

