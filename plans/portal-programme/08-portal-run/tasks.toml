  interface Burn { tokens: number; tokensPerMin: number | null;
                   byRole: { role: string; tokens: number; share: number }[] }
  buildBurn(run: RunState, opts: { nowMs: number; windowMs?: number }): Burn

- Scope: agents whose planId is in `run.planSet.planIds` when a set is loaded,
  else agents of running plans. This works after a reload too: the snapshot carries
  agents with their token counts.
- tokens: the scope's input + output tokens.
- byRole: the scope grouped by role, largest first, share = tokens / total (0 when
  the total is 0); roles with no tokens are left out. The share is the point: it
  says which role to look at, which an aggregate cannot.
- tokensPerMin: the `usage` samples inside the last windowMs (default 60000),
  scaled to a minute; null when there are none (for example right after a reload).

At least 8 tests: set scope versus running-plan scope, role grouping and ordering,
shares summing to 1, zero totals, the rate window, and null with no samples.
'''
