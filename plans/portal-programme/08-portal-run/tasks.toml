[[task]]
id = "T04"
title = "Build the progress header"
description = """
Create `apps/portal/src/components/run/ProgressHeader.tsx`, the top of the run view.

It shows a progress bar coloured by semantic band, a done-over-total count, elapsed
time, an estimate, and the accumulated cost.

Elapsed and estimate appear together, always. A single elapsed figure cannot answer
the operator's real question, which is whether the run is behind. The estimate comes
from the critical path estimate event; when it is absent, show a placeholder dot
rather than hiding the field, so the layout does not shift when it arrives.

Note a real constraint while building this: until the live events work lands, task
completion arrives in one batch at the end of a run, so this bar will sit at zero and
then jump to complete. Build against the live contract; if the bar behaves that way at
review time, that is a backend gap to report, not a reason to fake intermediate
progress here.

Smooth the cost figure so it does not jitter digit by digit. Smooth once, on ingest,
not per render.
"""
