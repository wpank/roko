phase = "compile"
command = "cd apps/portal && { [ -d node_modules ] || npm ci --no-audit --no-fund --silent; } && rm -rf .next/types && ./node_modules/.bin/tsc --noEmit --incremental false && cd src/components/stream && grep -q 'export function Transcript' Transcript.tsx && grep -q 'toBlocks' Transcript.tsx && grep -q 'data-region=\"transcript\"' Transcript.tsx"
