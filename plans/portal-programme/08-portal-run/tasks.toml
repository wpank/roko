[[task]]
id = "T06"
title = "Fold a task's verify ladder into rungs"
description = '''
Create `apps/portal/src/lib/rungs.ts` and `src/lib/rungs.test.ts`: the CHECKS cell
of the run band. Read `src/lib/runState.ts` (CheckRun, parseCheckName) first.

A task's authored verify steps are its ladder; the event stream reports each step
as it starts (`gate_rung_started`) and ends (`gate_result`), named `verify[i:phase]`.
The ladder shows every step, reached or not, so the operator sees how far it got.

  interface Rung { index: number | null; label: string;
                   state: 'passed' | 'failed' | 'running' | 'pending' }
  buildRungs(checks: readonly CheckRun[], declared: readonly { phase: string }[] | null): Rung[]
      one rung per declared step i, labelled by its phase (else `verify[i]`), taking
      the state of the check with index i, else pending; checks beyond the declared
      list or without an index are appended in order; with no declared list, one rung
      per check
  checkFocusTask(run: RunState, selected: { planId: string | null; taskId: string | null },
                 runningPlanIds: readonly string[]): { planId: string; taskId: string } | null
      the selected task when run.tasks knows it; else the first active task of the
      selected plan; else the first active task across running plans, in
      runningPlanIds order then task id; else null

At least 8 tests: a partly reached ladder, a failed step, a running step, extra
unindexed checks, no declared list, and each focus branch.
'''
