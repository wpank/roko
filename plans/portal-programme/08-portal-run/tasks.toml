id = "T09"
title = "Build the error digest"
description = """
Create `apps/portal/src/components/run/ErrorDigest.tsx`, which makes a failure
readable.

Parse gate output into file, line, message and severity. Group by file. Deduplicate
identical messages with a repeat count. Sort errors before warnings. Render as a tree
with a severity-coloured rail down the left.

Raw compiler output is secondary and available behind a control. The digest is what
the operator reads first, because a failing gate typically produces the same message
many times and the shape of the failure is what matters, not its volume.

Clicking an entry selects the task that owns that file and puts its transcript in the
stream pane.

Parse conservatively. Compiler output formats vary by language and tool, so recognise
the common shapes, and when a line does not parse, keep it as raw text in the group
rather than discarding it. A digest that silently drops the one line that explained
the failure is worse than no digest.
"""
