Create `apps/portal/src/components/run/AgentRoster.tsx`. This is how parallelism is
shown, and it replaces the deleted agent roster and topology routes entirely.

Each row: a status glyph, the role in its accent colour, the bound task, the context
fill as used over available, and a segmented gauge. Active agents sort first.

The context gauge is the panel's real value. Its colour runs from the success colour
through warning to the failure colour as the context fills, with tick marks at eighty
and ninety percent, so an agent approaching its limit is visible before it fails
rather than after. That is information the operator cannot get any other way.

Selecting an agent points the stream pane at its transcript.

Show idle capacity honestly: if the plan permits four concurrent agents and two are
working, say so. An operator watching a slow run needs to know whether it is
bottlenecked on parallelism or on the dependency graph, and this panel plus the wave
width answers that.
"""
