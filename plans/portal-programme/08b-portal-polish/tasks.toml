4. apps/portal/scripts/orphans.mjs: files under src/test/ are test support. Treat
   them like *.test.ts files: excluded from the orphan list and never counted as
   reaching production modules. Update the header comment to match.

The gate copies accept/harness.accept.test.tsx to src/test/ and requires its 8
tests to pass, re-runs an existing .ts suite, and runs tsc and the orphan check.
'''
