[meta]
plan = "08b-portal-polish"
total = 16
done = 0
status = "ready"
max_parallel = 4
skip_enrichment = true
estimated_total_minutes = 345

# Fixes from the 2026-09-28 integration preview of plans 05-08 (mock agent,
# headless browser, today's server). What it found:
# - After one run nothing could run again: the server keeps plan_set after a run
#   (DashboardSnapshot::plan_set_complete), and the portal read "a plan set
#   exists" as "a run is in progress".
# - Rail names were cut to four letters ("Hell") beside "undefined/1": the list
#   route omits tasks_done, and the row grid left the name about 29 px.
# - Header and run band rendered as unstyled text stacked in the top-left.
# - Elapsed times froze between events (Date.now() read only at render).
# - 404/405 answers were retried behind "Loading source…" or shown as
#   "HTTP 405 Method Not Allowed".
# - The status line printed "· · · · ·".
# - The page looked near-unstyled: globals.css reset elements outside any
#   cascade layer, which beats every Tailwind utility class, so `bg-rose`,
#   `border-sage` and the rest never applied.
# Also: queued plans say why they wait (plan_set_loaded now carries wave,
# depends_on and conflicts_with), and the portal tolerates a plan list without
# tasks_done, group or estimated_minutes.
#
# Acceptance tests live in accept/ beside this file. They are pinned acceptance
# tests ([task.accept], gap-d14a43, migrated by gap-ba4d01): a run pins each one
# outside the working tree, and a generated gate that runs before the task's own
# copies the pinned test into apps/portal/src and requires its exact passing
# count, as it does the shared helper dom.tsx. An edited copy is overwritten by
# the next gate run, so fix the code a test exercises, never the test. Each test
# fails on the tree its task starts from and passed against a reference
# implementation on 2026-09-28 (with only that task's dependencies applied, then
# with its own files added; tsc clean at every step). DOM tests run under jsdom
# with @testing-library/react (T01) and check structure, text and state, not
# layout; the classes they require are styled in T07.
#
# Portal only (npm, tsc, vitest; no cargo); run in the portal worktree.
# Concurrency (max_parallel 4): tasks that can run side by side write disjoint
# files, tsc gates use --incremental false, and gates run single test files.
# T16 holds the plan's one production build.

[[task]]
id = "T01"
title = "Add a DOM test harness: Testing Library, jsdom and the shared helper"
description = '''
Give the portal's vitest setup component tests, so the design can be checked
against rendered components without a backend.

1. Install first, before touching any source — other tasks run tsc meanwhile:
     cd apps/portal && npm install --save-dev --no-audit --no-fund \
       @testing-library/react@^16.3.0 @testing-library/dom@^10.4.0 jsdom@^30.1.0
   (Checked 2026-09-28 against React 19.3, vitest 5.0.2 and Vite 8.3.)
2. apps/portal/vitest.config.ts:
   - include `src/**/*.test.tsx` beside `src/**/*.test.ts`;
   - keep `environment: 'node'` as the default: a DOM test opts in with the
     first line `// @vitest-environment jsdom`;
   - add, at the top level of the config, `oxc: { jsx: { runtime: 'automatic' } }`.
     tsconfig.json keeps `"jsx": "preserve"` for Next.js, and Vite 8 (rolldown and
     oxc; there is no esbuild) otherwise leaves JSX untransformed in tests, which
     fails with "Unexpected JSX expression". Do not change tsconfig.json.
3. Copy plans/portal-programme/08b-portal-polish/accept/dom.tsx to
   apps/portal/src/test/dom.tsx unchanged: the helper every acceptance test
