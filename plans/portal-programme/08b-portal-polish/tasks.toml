(lines 236 and 283) and Workspace.tsx (line 86) read Date.now() only when an
event happened to re-render them. T10, T11, T12 and T15 adopt this hook.

Acceptance: accept/useNow.accept.test.tsx (7 tests, fake timers), copied to
src/lib/useNow.accept.test.tsx.
'''
