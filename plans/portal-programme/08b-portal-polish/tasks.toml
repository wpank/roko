[[task]]
id = "T04"
title = "Stop retrying client errors and name missing routes in words"
description = '''
On today's server, validate and source answered 404 and React Query retried
each twice with backoff (`retry: 2` in apps/portal/src/app/providers.tsx), so the
editor sat on "Loading source…" and the badge on `·`; Run all answered 405 and
the alert read "HTTP 405 Method Not Allowed".

1. apps/portal/src/lib/apiErrors.ts (pure):
   isMissingRoute(err: unknown): boolean
     true for an ApiError (@/api/client) with status 405. For a 404: true unless
     the body is the API's own error object — a string `code`, as
     crates/roko-serve/src/error.rs sends for a resource that is not found — and
     its message does not start with "No route matches". So an empty body, or the
     router fallback `{error: "not_found", message: "No route matches …"}`, is a
     missing route; `{code: "not_found", message: "plan 'x' not found"}` is not.
     Anything else is false.
   shouldRetryQuery(failureCount: number, err: unknown): boolean
     false for any ApiError with status 400-499; otherwise failureCount < 2
     (React Query passes 0 after the first failure).
   unsupportedMessage(action: string): string
     `This roko serve does not support ${action} yet.`
   describeRequestError(err: unknown, action: string): string
     401 → SIGN_IN_HINT (@/lib/bootstrap); a missing route →
     unsupportedMessage(action); a non-empty string body.message → it; a
     non-empty string body → it; any other ApiError → `Request failed with status
     ${status}.`; an Error → its message; anything else → String(err). Never the
     raw "HTTP 405 …" line.
2. apps/portal/src/api/queryClient.ts:
   `export function createQueryClient(): QueryClient` with defaultOptions.queries
   `{ staleTime: 30_000, retry: shouldRetryQuery, refetchOnWindowFocus: false }`.
3. apps/portal/src/app/providers.tsx: `useState(createQueryClient)` replaces the
   inline client; keep SSEInitializer and SessionGate as they are.

SourceEditor and ValidationBadge already say `This roko serve does not support
editing plans yet.` and `validation unavailable` for 404/405; without retries
they say it at once. PlanView (T12) and Workspace (T15) adopt
describeRequestError.

Acceptance: accept/apiErrors.accept.test.ts (12 tests) → src/lib/, and
accept/missingRoutes.accept.test.tsx (3 DOM tests: against a stubbed 404 or 405
the editor and the badge must say so within 600 ms after one request) →
src/components/stage/.
'''
