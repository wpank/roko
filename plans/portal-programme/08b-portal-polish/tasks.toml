[[task]]
id = "T03"
title = "Define when a plan-set run is active and why a queued plan waits"
description = '''
Create apps/portal/src/lib/planSet.ts, the one definition of "a run is in
progress". Pure functions; no Date.now(); never mutate the input.

The server keeps plan_set in its snapshot after a run ends, so
`run.planSet !== null` does not mean a run is active. The preview found Run
disabled for every plan after the first run (usePrimaryAction in
src/components/stage/PlanView.tsx).

  planSetActive(run: RunState): boolean
    true only while run.planSet !== null, run.run.outcome === null, and some id
    in run.planSet.planIds has run.plans[id].phase 'pending' or 'running'. A
    member with no live record does not keep the set active.

  queuePosition(run: RunState, planId: string): number | null
    the 1-based index in planSet.planIds when the set is active and the plan's
    phase is 'pending'; otherwise null.

  waitReason(run: RunState, planId: string): string | null
    null unless queuePosition is non-null. Otherwise, from
    run.planSet.members?.[planId] (absent: no facts), the first that applies:
    1. a depends_on member whose phase is 'failed' or 'cancelled' (depends_on
       order) → `blocked: <id> failed` or `blocked: <id> cancelled`;
    2. depends_on members not 'completed' → `after <id>, <id>` (depends_on order);
    3. conflicts_with members that are 'running' → `after <id>, <id> (shared files)`;
    4. otherwise → `waiting for a free slot`.

RunState, PlanRun and PlanSetMember come from @/lib/runState (T02 adds
planSet.members). Acceptance: accept/planSet.accept.test.ts (17 tests), copied to
src/lib/planSet.accept.test.ts.
'''
