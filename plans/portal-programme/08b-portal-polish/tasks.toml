[[task]]
id = "T06"
title = "Derive status-line fields that are known, never placeholders"
description = '''
Create apps/portal/src/lib/statusLine.ts: the plan status line's fields, only
those whose values are known. The preview printed `2 tasks · 2 waves · · · · ·`.

  export type StatusFieldKey = 'tasks' | 'waves' | 'estimate' | 'parallel' |
    'progress' | 'elapsed' | 'eta' | 'cost' | 'agents';
  export interface StatusField { key: StatusFieldKey; text: string }
  export interface StatusLineInput {
    hasRun: boolean; running: boolean;
    taskCount: number; waveCount: number;
    estimatedMinutes: number | null; parallel: number | null;
    tasksDone: number; tasksTotal: number;
    elapsedMs: number | null; etaMinutes: number | null;
    costUsd: number; busyAgents: number; maxParallel: number | null;
  }
  export function statusFields(input: StatusLineInput): StatusField[]

Before a run (hasRun false), in order: tasks `3 tasks` or `1 task` (always);
waves `3 waves` or `1 wave` when above 0; estimate `~9 min` when finite and above
0; parallel `parallel 2` when finite and above 0.
Once run (hasRun true), in order: progress `2/3` (always); elapsed via
compactDuration (@/lib/formatters: `1m12s`, `16s`, `0s`) when finite and at
least 0; eta `~2m` only while running and known; cost via formatCost (`$0.21`)
when above 0; agents `agents 1/1`, or `agents 2` when maxParallel is unknown,
