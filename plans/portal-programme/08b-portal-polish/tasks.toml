title = "Add useNow: a clock that ticks only while something runs"
description = '''
Create apps/portal/src/lib/useNow.ts:

  'use client';
  export function useNow(active: boolean, intervalMs = 1_000): number

It returns Date.now() captured at mount. While `active`, it re-reads the clock
the moment it becomes active and then every intervalMs (setInterval, cleared
when it becomes inactive and on unmount). While inactive it keeps no timer and
holds its last value. Callers pass "something is running", so an idle page costs
nothing.

