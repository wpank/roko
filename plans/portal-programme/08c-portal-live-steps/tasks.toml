[[task]]
id = "T02"
title = "Fold steps and unscreened entries into transcript blocks"
description = '''
apps/portal/src/lib/streamRecord.ts, toBlocks and TranscriptBlock:

- text and reasoning blocks gain `unscreened?: true`; tool blocks gain
  `target?: string`, `input?: string` and `unscreened?: true` (present only when
  set, so screened blocks compare exactly as before); a new block
  `{ kind: 'step'; toolId: string; tool: string; glyph: ToolGlyph;
  target: string | null }`.
- An `unscreened` entry renders like its record, flagged `unscreened: true`.
  Consecutive text (or reasoning) merges only with the same screened-ness:
  unscreened text never joins screened text. An unscreened tool_start's input
  goes on its tool block; a tool_result attaches to the open block with its
  tool id, as today.
- A `step` whose toolId has a tool_start anywhere in the entries (screened or
  unscreened) renders no row of its own and leaves no trace in the block list;
  its target (when not null) is set on that tool block. A step without such a
  tool_start becomes a `step` block at its position, with toolGlyph(tool),
  ending any text or reasoning merge like a tool_start does.
- Everything else behaves exactly as today: the 19 existing tests pass
  unchanged.

Acceptance: accept/liveBlocks.accept.test.ts (10 tests) → src/lib/.
'''
