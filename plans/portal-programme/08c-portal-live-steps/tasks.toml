title = "Render live step rows and framed unscreened content in the transcript"
description = '''
apps/portal/src/components/stream/Transcript.tsx (props unchanged):
- A `step` block is a row
  `<div data-step={toolId}>` glyph · tool · `<span data-target>{target}</span>`
  (only when target is not null) · and, while `working` is set,
  `<span data-live>live</span>`: small, uppercase, --text-faint (dim). Without
  `working` the row stays as history, without the marker.
- A tool block gets `data-tool={toolId}` on its `<details>`, shows
  `<span data-target>` after the tool name when it has a target, and shows its
  input (`<pre data-input>`) above the output when it has one.
- Every block flagged `unscreened` is wrapped in `<div data-unscreened>` that
  starts with `<span data-unscreened-label>live · unscreened</span>`, framed with
  a left border in the warning colour (`border-l-2 border-accent-warn pl-2`,
  label `text-accent-warn`). The fold removes it when the screened transcript
  arrives.
Keep the working line, auto-scroll, `↓ follow` and the dropped-records notice.
Tailwind utilities apply now that 08b layered the element resets.

Acceptance: accept/liveTranscript.accept.test.tsx (6 DOM tests) →
src/components/stream/.
'''
