[[task]]
id = "T03"
title = "Hold unscreened content until the screened transcript replaces it"
description = '''
apps/portal/src/lib/runState.ts. Decode agent_output with decodeFrame (T01)
and fold it through one helper, `appendFrame(transcript, frame, agentId,
attempt)`, used by both applyEvent and fromSnapshot:
- a live tool_start that is not unscreened → append
  `{ kind: 'step', toolId, tool, target, agentId, attempt }`;
- an unscreened record → append
  `{ kind: 'unscreened', record, input, agentId, attempt }`;
- any other live record → ignore it;
- a screened record (no `live`) → first remove the transcript's unscreened
  entries with this agentId and attempt, then append the record as today.
Steps are never removed.

In applyEvent('agent_output'): agentId = event.agent_id; attempt =
event.attempt ?? frame.attempt ?? 0; the transcript key is resolved as today.
agent_completed also removes every unscreened entry with that agentId from
every transcript; run_completed removes every unscreened entry. Return the
same transcripts object when nothing was removed.
In fromSnapshot, task_outputs lines go through appendFrame with agentId =
frame.agentId ?? '' and attempt = frame.attempt ?? 0; a task that is not
active keeps no unscreened entries.

The existing suites keep passing: runState.test.ts (56) and 08b's
runState.accept.test.ts (15).
Acceptance: accept/liveFold.accept.test.ts (11 tests) → src/lib/.
'''
