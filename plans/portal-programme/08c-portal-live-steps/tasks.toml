# Live agent output in the transcript (decision dec-578863, 2026-09-28; backend
# in plan 03c T12-T20, contract §3.5 in the backend worktree's
# tmp/portal-audit/03-CONTRACT.md). Runs after 08b in the same worktree.
#
# agent_output.content keeps its framed records (U+001E + "roko.stream.v1 " +
# JSON {kind, agent_id, plan_id, task_id, attempt, payload}); two top-level
# envelope flags are new:
# 1. Tool step — always on, published as the provider streams the call:
#    {"kind":"tool_start","live":true, …, "payload":{"tool_id","tool","target"}}.
#    target = the call's file_path, notebook_path, path, command (first line),
#    pattern, url, query or description; secret-scrubbed, at most 120 chars,
#    may be "". A step never carries input or a result.
# 2. Unscreened — only with `[serve] live_agent_output = "trusted"` on a
#    loopback-only server, in addition to steps: "live":true,"screened":false on
#    text {text}, reasoning {text}, tool_start {tool_id, tool, input (JSON cut to
#    2048 bytes)} and tool_result {tool_id, output}.
# 3. Screened transcript — ordinary records, no `live` field, at turn end.
# The portal keeps the steps, drops an agent+attempt's unscreened records at
# its first non-live record (or when the agent completes, or the run ends), and
# marks unscreened content visibly while it shows. A screened tool block
# absorbs its step's row and shows the step's target — the file an edit
# touched, which screened records never carried.
#
# Same gate style as 08b: acceptance tests in accept/ are pinned acceptance
# tests ([task.accept], gap-d14a43, migrated by gap-ba4d01): a run pins each one
# outside the working tree, and a generated gate that runs before the task's own
# copies the pinned test into apps/portal/src and requires its exact passing
# count. Each fails on the tree its task starts from and passed against a
# reference implementation (2026-09-28). One production build, in T05.

[[task]]
id = "T01"
title = "Decode the live-output envelope: steps and unscreened records"
description = '''
apps/portal/src/lib/streamRecord.ts

1. Add `live?: boolean` and `screened?: boolean` to the internal WireEnvelope.
2. Export `interface Frame { record: StreamRecord; live: boolean;
   unscreened: boolean; target: string | null; input: string | null;
   attempt: number | null; agentId: string | null }` and
   `decodeFrame(content: string): Frame`, which never throws:
   - `record` is exactly what decodeStreamRecord returns today;
   - live = envelope.live === true; unscreened = envelope.screened === false;
   - target = payload.target for a tool_start when it is a non-empty string,
     else null; input = payload.input for a tool_start when it is a string,
     else null;
   - attempt and agentId from the envelope when they are a number / string;
   - unframed content, unparsable JSON, a non-object envelope (`null`, `42`)
     or an unknown kind give the raw record with every flag false or null.
   decodeStreamRecord(content) becomes `decodeFrame(content).record`: its
   19 existing tests keep passing unchanged.
3. Export the two new transcript entries and widen the union:
     interface ToolStep { kind: 'step'; toolId: string; tool: string;
       target: string | null; agentId: string; attempt: number }
     interface UnscreenedEntry { kind: 'unscreened'; record: StreamRecord;
       input: string | null; agentId: string; attempt: number }
     type TranscriptEntry = StreamRecord | AttemptDivider | ToolStep | UnscreenedEntry
   toBlocks may ignore the new kinds for now (T02 renders them).
Also extend the file's header comment with the live-output rules (see this
plan's header).

Acceptance: accept/liveDecode.accept.test.ts (8 tests) → src/lib/.
'''
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 20
depends_on = []
files = ["apps/portal/src/lib/streamRecord.ts", "apps/portal/src/lib/liveDecode.accept.test.ts"]

[task.context]
read_files = [
    { path = "plans/portal-programme/08c-portal-live-steps/accept/liveDecode.accept.test.ts", why = "the acceptance test the gate runs", lines = "1-" },
    { path = "apps/portal/src/lib/streamRecord.ts", why = "the decoder, entry and block types", lines = "1-" },
]
anti_patterns = [
    "Do not change what decodeStreamRecord returns for any input.",
    "Do not edit the copied acceptance test; the gate overwrites it.",
    "Do not edit a file outside this task's files; a gate failure in one usually means a concurrent task is mid-edit, so re-run the gate first.",
]

