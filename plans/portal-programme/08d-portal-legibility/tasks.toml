# Findings of the second browser preview (i1, 2026-09-28, against 08b), for the
# worktree after 08b and 08c:
# 1. Run again double-counted: "4/2", "↻2" on both tasks, "— attempt 2 —".
#    The fold kept tasksDone and task records across runs (the server's extra
#    pre-run plan_started made it worse; backend 03b T05 removes that, but the
#    fold must not depend on it).
# 2. With the "not supported" edit fallback open, Run again was disabled with
#    "Save or discard your edits first" although nothing was edited.
# 3. Legibility: ids and the plan-id subtitle #3a3440 on black (1.75:1), FILES/
#    VERIFY labels 1.39:1, W1 labels and time dots 2.45:1, descriptions 4.08:1,
#    everything 10-12px, the plan title the same size as task rows. Target WCAG
#    AA: text >= 4.5:1, UI glyphs and focus >= 3:1; a type scale of plan title >
#    section labels >= rows > meta (>= 12px). Enforced by a unit test that reads
#    the token values from styles/rosedust.css and styles/tokens.css.
# 4. Colour semantics: "implementer" used the active rose and read as an error;
#    "not supported" appeared three ways (red inline, grey centred, an orange
#    alert whose left ✗ looked like close); the header ■ was orange while Cancel
#    was red.
# 5. Run band: dividers ignored the rail, it grew 17px mid-run, "no agent
#    working yet" sat beside "+1 finished", "✓structural" lacked a space.
# 6. Rows: placeholder dots at the far right, models cut to "claude…", 20×2px
#    rail bars, times mixing 2.0s / 2s / 11s.
# 7. Generate showed the raw "request body must be valid JSON".
#
# Design decisions (p2, 2026-09-28), measured on the lightest surface
# (--bg-highlight #221c24): text-muted #aa9eae (6.5:1), text-faint #948899
# (4.95:1); --text-ghost becomes an alias of text-faint for text, and a new
# --line (#3a3440) carries borders and bar tracks. Active is --rose-bright
# (5.5:1). Roles take hues no state uses: implementer cyan, strategist
# dream-bright, architect periwinkle (#8ca4e8), scribe bone, quick-reviewer
# lilac (#c9a4dc). Primary buttons are black on rose (5.2:1; bone on rose was
# 2.9:1); destructive actions use one danger fill (#9e2f2f with bone-bright text,
# 5.2:1) for Cancel and the header ■. Sizes step up one notch (xs 12, sm 13,
# base 14, lg 18). The run band puts BURN, its compact cell, above the rail so
# the first divider meets the rail's edge; AGENTS and CHECKS share the stage.
# "Not supported" is one Notice (ⓘ, cyan rule) everywhere, and an info alert.
#
# Same gate style as 08b and 08c: tests in accept/ are copied into
# apps/portal/src by each gate and must pass with their exact count; each fails
# on the tree its task starts from and passed on a reference implementation
# (with only the task's dependencies applied, then with its files; tsc clean).
# Two 08b acceptance tests change with the design: RunBand.accept (chip spacing,
# model slug, cell order, in T08) and TaskList.accept (model slug, in T07).
# One production build, in T11.

[[task]]
id = "T01"
title = "Start a new run when a finished plan starts again"
description = '''
apps/portal/src/lib/runState.ts. "Run again" showed "4/2", "↻2" on both tasks
and "— attempt 2 —": plan_started kept tasksDone for a plan that had finished,
plan_set_loaded kept a plan made 'running' by the server's extra pre-run
plan_started, and task_started treated the new run's first start of each task
as a retry.

1. PlanRun and TaskRun gain an optional `generation?: number` (absent = 0; other
   test fixtures build these types without it).
2. A plan that starts again after a terminal phase ('completed', 'failed',
   'cancelled') begins a new run — one helper used by plan_started (phase
   'running', startedAtMs = now) and by plan_set_loaded (phase 'pending',
   startedAtMs null):
   - generation + 1; finishedAtMs, etaMinutes null; costUsd 0; tasksFailed 0;
     tasksTotal from the event (else the old value);
   - after 'completed' the next run is fresh: remove every task record and
     transcript of the plan; counters 0;
   - after 'failed' or 'cancelled' it is a resume: keep the plan's task records
     that finished well (passed, skipped, accepted_with_failures) and count them
     (tasksDone, and tasksAccepted for accepted); remove the rest and their
     transcripts.
   plan_started on a pending or running plan and plan_set_loaded on a running
   plan behave as today.
3. task_started: a record from an earlier generation starts over — attempts 1,
   fresh checks, cost and tokens 0, its old transcript removed, no divider. Only
   a terminal record of the current generation starting again is a retry
   (attempts + 1, divider, as today). The new record carries the plan's
   generation.
4. Counters move a task between buckets instead of re-adding it: when a
   terminal record starts again, first take it out of its old counter (passed or
   skipped → tasksDone, accepted_with_failures → tasksDone and tasksAccepted,
   failed → tasksFailed), never below 0; task_completed adds it to the new one
   (same rule). A task retried inside one run is then counted once.

Keep runState.test.ts (56), 08b's runState.accept (15), planSet.accept (17),
planRows.wait.accept (8) and 08c's liveFold.accept passing.
Acceptance: accept/runAgain.accept.test.ts (11 tests) → src/lib/.
'''
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
max_retries = 2
estimated_minutes = 35
depends_on = []
files = ["apps/portal/src/lib/runState.ts", "apps/portal/src/lib/runAgain.accept.test.ts"]

[task.context]
