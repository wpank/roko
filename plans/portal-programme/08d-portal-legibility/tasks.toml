  --color-danger-fill, --color-danger-fill-fg (each var(--the-token)).
- Base layer: links var(--rose-bright); scrollbar thumb and scrollbar-color use
  var(--line).
- Components layer:
  .rd-band: `grid-template-columns: var(--rail-width) minmax(0, 1.4fr)
