description = '''
CSS only. The values below were measured against every surface (--void,
--bg-raised, --bg-secondary, --bg-highlight); the acceptance test recomputes
them from the files.

apps/portal/src/styles/rosedust.css
- --text-muted #aa9eae; --text-faint #948899; --text-ghost: var(--text-faint)
  (text stays legible wherever the ghost utilities are used); a new
  --line: #3a3440 for hairlines, borders and bar tracks; --border-default:
  var(--line).
- --accent-error: var(--ember) (error text; #c41f1f was 3.6:1 on black).
- New: --danger-fill: #9e2f2f; --periwinkle: #8ca4e8; --lilac: #c9a4dc.
- Sizes one notch up: --text-xs 12px, --text-sm 13px, --text-base 14px,
  --text-md 15px, --text-lg 18px, --text-xl 20px, --text-2xl 24px, --text-3xl 30px.
apps/portal/src/styles/tokens.css
- --state-active: var(--rose-bright); --state-pending: var(--text-faint);
  --blur-border: var(--line).
- Roles, none a state hue: implementer var(--accent-cyan), strategist
  var(--dream-bright), architect var(--periwinkle), scribe var(--bone),
  quick-reviewer var(--lilac); keep --role-other, --role-impl and
  --role-reviewer.
- --rail-width 336px; --band-height: 112px.
- Type scale: --type-title var(--text-lg), --type-section var(--text-sm),
  --type-row var(--text-sm), --type-meta var(--text-xs).
- Buttons: --button-primary-bg var(--rose), --button-primary-hover
  var(--rose-bright), --button-primary-fg var(--void), --danger-fill-fg
