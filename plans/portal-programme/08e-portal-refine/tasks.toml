[meta]
plan = "08e-portal-refine"
total = 7
done = 0
status = "ready"
max_parallel = 3
skip_enrichment = true
estimated_total_minutes = 130

# Findings of the third browser preview (i1, 2026-09-28, against 08d), for the
# worktree after 08d:
# 1. State colours: running was --rose-bright #e87070 — the Run button's rose
#    family and the selection outline — so work in progress read as an error;
#    failed (ember #c08040, 30°) and accepted-with-failures (warning #c0a040,
#    45°) sat 15° apart (ΔE 21); the implementer role's cyan was the ⓘ info
#    colour.
# 2. Task table: time and cost were not grid columns (row 1's "11s" at x≈1180,
#    row 2's at x≈1275; ~600px between title and role) — optional chips moved
#    them.
# 3. Run band: 112px of mostly half-empty cells.
# 4. Transcript: 10.8px, the smallest text on screen; "agent working" after the
#    agent completed; "The agent has not produced output yet." on a finished
#    (replayed) task.
# 5. Generate's error was a bare red line outside the shared ⓘ notice; the
#    editor's Close was a separate button 1000px wide; row glyph, time and cost
#    sizes were off the 18/13/12 scale.
#
# Design decisions (p2, 2026-09-28), a deliberate departure from mori's terminal
# palette because in a browser rose reads as error: running indigo #8993f0 (hue
# 234°) with a calm 2.4s pulse (still under prefers-reduced-motion), failed red
# #ef6a6a (0°), accepted-with-failures amber #e0b040 (42°), done leaf #6cbf6c
# (120°): pairwise ≥ 42° and ΔE ≥ 56; running is 116° from the Run button's
# rose and 34° from info cyan. Every hue passes 5.5:1 on --bg-highlight. The
# selection outline is neutral bone. A bar takes its state's colour, never its
# fraction's. Roles leave the state and info hues: implementer orchid (280°),
# strategist mint (160°), architect blush (318°), quick-reviewer lime (76°).
# The band is 60px: a head line (title + summary) and two content lines per
# cell. The task row is an 8-track grid. The stream body is 13px with relaxed
# leading. Every request failure is the one Notice, with a compact Close.
#
# Same gate style as 08b-08d: tests in accept/ are pinned acceptance tests
# ([task.accept], gap-d14a43, migrated by gap-ba4d01): a run pins each one
# outside the working tree, and a generated gate that runs before the task's own
# copies the pinned test into apps/portal/src and requires its exact passing
# count. Each fails on the tree its task starts from and passed on a reference
# implementation (with only the task's dependencies applied, then with its
# files; tsc clean). One production build, in T07.

[[task]]
id = "T01"
title = "Give states browser hues and add this pass's shell classes"
description = '''
CSS, plus the rail bar colour. Values below are the reference's; the acceptance
test recomputes hue gaps, ΔE and the shell classes from the files.

apps/portal/src/styles/rosedust.css
- After --lilac, a documented block "Accents — browser state and role hues"
  (mori ran "running" in rose; in a browser rose and red read as error) with one
  /** doc */ line per primitive: --indigo #8993f0 (running), --signal-red #ef6a6a
  (failed), --amber #e0b040 (accepted with failures), --leaf #6cbf6c (done),
  --orchid #c886ea (implementer), --mint #8fd6be (strategist), --blush #e28dc9
  (architect), --lime #c4d78e (quick-reviewer).
- --accent-error: var(--signal-red).
apps/portal/src/styles/tokens.css
- --state-done var(--leaf), --state-active var(--indigo), --state-accepted
  var(--amber), --state-failed var(--signal-red).
- --focus-border: var(--bone) — the selection outline is neutral.
- --progress-low, --progress-mid, --progress-high: all var(--state-active) — a
  running bar is the running colour at any fraction.
- Roles: implementer var(--orchid), strategist var(--mint), architect
  var(--blush), quick-reviewer var(--lime); scribe, other, impl and reviewer stay.
- --band-height: 60px.
- Rewrite the comments that name the old hues (state header, each state, focus,
  progress bands, roles, band height).
apps/portal/src/styles/globals.css — components layer, tokens only:
- .rd-band line-height 1.4. .rd-band__cell padding var(--space-1)
  var(--space-3) and overflow hidden (a head line and two content lines fill
  60px; never a scrollbar). .rd-band__rungs gap `0 var(--space-3)`.
  .rd-band__title: flex-shrink 0 instead of margin-bottom.
- New .rd-band__head { display: flex; align-items: baseline; gap:
  var(--space-2); overflow: hidden; white-space: nowrap } and .rd-band__note {
  min-width: 0; overflow: hidden; color: var(--text-muted); text-overflow:
  ellipsis }.
- New @keyframes rd-pulse (opacity 1 at 0% and 100%, 0.55 at 50%); .rd-pulse {
  animation: rd-pulse 2.4s ease-in-out infinite }; and
  `@media (prefers-reduced-motion: reduce) { .rd-pulse { animation: none; } }`.
- New .rd-task-row { display: grid; grid-template-columns: 2ch 8ch minmax(0, 1fr)
  22ch 7ch 8ch 4ch 30ch; column-gap: var(--space-2); align-items: baseline;
  font-size: var(--type-row) } — glyph · id · title · role·model · time · cost ·
  retries · checks; `.rd-task-row > *` { min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap }; .rd-task-row__meta {
  font-size: var(--type-meta) }; .rd-task-row__num { font-size:
  var(--type-meta); font-variant-numeric: tabular-nums; text-align: right }.
- New .rd-stream-body { font-size: var(--type-row); line-height:
  var(--leading-relaxed) } and `.rd-stream-body pre` { font-size: inherit;
  line-height: inherit }.
- Notice: `.rd-notice[data-notice="error"]` border-left-color
  var(--state-failed) and its .rd-notice__glyph colour var(--state-failed);
  .rd-notice__text { flex: 1; min-width: 0 }; .rd-notice__close { flex-shrink: 0;
  padding: 0 var(--space-2); border: 1px solid var(--border-default);
  background: transparent; color: var(--text-muted); font-size:
  var(--type-meta) } and a :hover (border var(--border-hover), colour
  var(--text-strong)).
- Base layer: the focus-ring comment says "neutral", not "rose".
apps/portal/src/lib/planRows.ts — a rail bar takes its plan state's colour:
planBarToken(state) returns GLYPHS[state].token (import GLYPHS from
@/lib/glyphs) instead of fraction bands; drop BAR_HIGH/BAR_MID/BAR_LOW and fix
the header comment. apps/portal/src/lib/planRows.test.ts: test 6 expects
var(--state-accepted) (and not var(--state-done)), test 7 var(--state-active);
rename both tests and their header lines to match.
apps/portal/src/lib/glyphs.ts — progressToken's comment: the three bands are all
the running colour; finished bars use state tokens.
Keep 08d's legibility.accept (12), 08b's styles.accept (12), planRows.test (20)
and glyphs.test (13) passing.
Acceptance: accept/semantics.accept.test.ts (12) → src/styles/ and
accept/planBars.accept.test.ts (3) → src/lib/.
'''
