[[task]]
id = "T02"
title = "Draw each plan's bar as state segments"
description = '''
A failed plan's bar was all red although T01 passed. A bar now shows what the
plan's tasks came to, one segment per state, in the order verified, accepted,
failed, running.

1. apps/portal/src/lib/planRows.ts:
   - Export `interface BarSegment { state: 'done' | 'accepted' | 'failed' |
     'active'; share: number }` and
     `progressSegments(counts: { done; accepted; failed; active }, total): BarSegment[]`:
     [] when total ≤ 0; otherwise walk the four states in that order, take
     `n = min(max(0, count), tasks left)`, skip n = 0, push `{ state, share:
     n / total }` and subtract n from the tasks left — integer bookkeeping, so
     shares are exact (8 of 10 is 0.8, not 0.7999…) and never sum past 1.
   - PlanRowModel gains `segments: BarSegment[]`: done = the row's `done` minus
     accepted; accepted = live tasksAccepted (0 without a live run); failed =
     live tasksFailed, else the disk summary's tasks_failed; active = tasks in
     run.tasks for the plan whose status is 'active', while the plan runs; the
     total the row already uses. Keep barToken (08e's planBars.accept pins it).
2. apps/portal/src/components/rail/PlanRow.tsx: the `.rd-plan-row__bar` span
   holds one `<span className="rd-seg" data-segment={state} style={{ width:
   `${(share * 100).toFixed(1)}%` }} />` per segment instead of its single
   barToken span (drop the now unused pct).
3. apps/portal/src/components/stage/PlanView.tsx: the header's progress bar
   (role="progressbar", keep its aria attributes) gets `className="rd-progress
   rounded-full"` and the same segment spans, from progressSegments with done =
   tasksDone − tasksAccepted, the live tasksAccepted and tasksFailed, and the
   plan's active tasks. Remove the barColor computation and the progressToken
   import.
T01 styles .rd-seg per data-segment. Keep 08e's planBars.accept (3),
planRows.test (20), 08b's rail.accept (11), PlanView.accept (15), 08d's
planHeader.accept (6) and rows.accept (9) passing.
Acceptance: accept/segments.accept.test.tsx (5) → src/components/rail/.
'''
