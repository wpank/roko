[task.context]
read_files = [
    { path = "plans/portal-programme/08f-final-polish/accept/gate_output_accept.rs", why = "the acceptance test the gate runs", lines = "1-" },
    { path = "crates/roko-cli/src/graph_task_dispatch.rs", why = "the helper, both publish sites, the module list and the existing test" },
    { path = "crates/roko-gate/src/shell.rs", why = "how ShellGate fills reason and detail", lines = "195-220" },
    { path = "crates/roko-core/src/verdict.rs", why = "Verdict", lines = "45-150" },
]
symbols = ["mod sibling_settle;", "fn published_gate_output(", "tui.gate_result_with_output(", "fn published_gate_output_leads_with_the_command"]
anti_patterns = [
    "Do not publish a failed step's output without how it ended.",
    "Do not cut the output tail inside a UTF-8 character.",
    "Do not change what the retry prompt (failures, verify_failure_summary) receives.",
    "Do not edit the copied acceptance test; the gate overwrites it.",
]

[[task.accept.files]]
src = "accept/gate_output_accept.rs"
dest = "crates/roko-cli/src/graph_task_dispatch/gate_output_accept.rs"
runner = 'cargo test -p roko-cli --lib graph_task_dispatch::gate_output_accept'
count = 7
timeout_ms = 1800000

[[task.verify]]
phase = "test"
command = 'cargo test -p roko-cli --lib graph_task_dispatch'
fail_msg = "a graph_task_dispatch test fails"
timeout_ms = 1800000

[[task.verify]]
phase = "compile"
command = 'cargo clippy -p roko-cli --no-deps -- -D warnings'
fail_msg = "clippy reports warnings in roko-cli"
timeout_ms = 1800000

[[task]]
id = "T06"
title = "Prove the final polish together and build once"
description = '''
Run the portal suite together and build the export once.

Its pinned acceptance tests put this plan's four portal acceptance tests back
in the tree, each with its exact count (the semantics test replaces 08e's);
then the gates require: the full suite with at least 669
passing tests (645 after 08e, plus 4 more semantics tests and this plan's 20
new ones) and none failing; the orphan check; tsc; and the one production
build, whose exported CSS must carry the segment and badge classes. T05's Rust
change is proven by its own gates.

Fix only what a gate reports, in the module the failing test exercises. Do not
edit the acceptance copies.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 20
depends_on = ["T01", "T04", "T05"]
files = ["apps/portal/src"]

[task.context]
read_files = [
    { path = "plans/portal-programme/08f-final-polish/accept/oneRetry.accept.test.tsx", why = "the screen-level check the suite adds", lines = "1-" },
    { path = "apps/portal/package.json", why = "test and build:export scripts" },
]
anti_patterns = [
    "Do not weaken or skip a test to make the suite pass.",
    "Do not leave apps/portal/out behind.",
]

[[task.accept.files]]
src = "accept/semantics.accept.test.ts"
dest = "apps/portal/src/styles/semantics.accept.test.ts"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/styles/semantics.accept.test.ts {count}'
count = 16
timeout_ms = 600000

[[task.accept.files]]
src = "accept/segments.accept.test.tsx"
dest = "apps/portal/src/components/rail/segments.accept.test.tsx"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/components/rail/segments.accept.test.tsx {count}'
count = 5
timeout_ms = 600000

[[task.accept.files]]
src = "accept/checkExit.accept.test.tsx"
dest = "apps/portal/src/components/stream/checkExit.accept.test.tsx"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/components/stream/checkExit.accept.test.tsx {count}'
count = 8
timeout_ms = 600000

[[task.accept.files]]
src = "accept/oneRetry.accept.test.tsx"
dest = "apps/portal/src/components/shell/oneRetry.accept.test.tsx"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/components/shell/oneRetry.accept.test.tsx {count}'
count = 7
timeout_ms = 600000

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src 669'
fail_msg = "the full suite, with every acceptance test, lacks 669 passing tests or has a failure"
timeout_ms = 900000

[[task.verify]]
phase = "structural"
command = 'cd apps/portal && node scripts/orphans.mjs'
fail_msg = "a source module is unreachable from src/app"
timeout_ms = 60000

[[task.verify]]
phase = "integration"
command = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && rm -rf .next/types out && ./node_modules/.bin/tsc --noEmit --incremental false && NEXT_TELEMETRY_DISABLED=1 npm run build:export && test -f out/index.html && grep -q "rd-seg" out/_next/static/css/*.css && grep -q "rd-badge" out/_next/static/css/*.css && rm -rf out'
fail_msg = "the portal does not type-check, the static export fails, or its CSS lacks the segment and badge classes"
timeout_ms = 900000
