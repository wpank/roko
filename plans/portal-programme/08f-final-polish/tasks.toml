# Findings of the fourth browser preview (i1, 2026-09-28, against 08e), for the
# main tree after 08e merged, before 09-acceptance:
# 1. The transcript tab's count badge is white on indigo, 2.8:1 (fails AA), and
#    borrows the running hue for a plain count. (The checks badge, white on red,
#    is 3.0:1.)
# 2. A failed plan's bar is all red although T01 passed.
# 3. The alert reads "plan broken completed with task-level failures" — the
#    server's generic line — and a failed task shows Retry twice (plan header
#    and task row).
# 4. The implementer role's orchid #c886ea sits ΔE 24 from running indigo
#    #8993f0 and reads as running.
# 5. A failed verify step never says why: the published check output carries
#    only `$ test -f MISSING.md`.
#
# Design decisions (p2, 2026-09-28): count badges are a neutral bone with black
# text (11.9:1), the failed count red with black text (6.9:1). A bar is a row of
# state segments: verified green, accepted amber, failed red, running indigo.
# A failure alert reads "<plan title>: T02 failed (structural check)" and offers
# Show; the one Retry is the plan header's. A coloured role keeps ≥ 60° and
# ΔE ≥ 35 from running and ≥ 30° from the other states and info: implementer
# moves to blush (ΔE 37); the wheel has no room left for a fifth hue, so
# architect joins scribe in bone. A failed step's published output ends with how
# it ended — `✗ exit status 1` — after at most 60 lines (16 KiB) of its output,
# and the checks view shows that ending, with "no output" when nothing printed.
#
# Tests in accept/ are pinned acceptance tests ([task.accept], gap-d14a43): a
# run pins each one outside the working tree, and a generated gate that runs
# before the task's own copies the pinned test into the tree and requires its
# exact passing count. Each failed on the tree its task starts from and passed
# on a reference implementation (tsc and clippy clean). 08b-08e and 08g pin
# theirs the same way (gap-ba4d01).
# semantics.accept.test.ts replaces 08e's file of the same name. The main tree's
# apps/portal/node_modules predates 08b's jsdom, so every portal gate installs
# when node_modules/jsdom is missing. One production build, in T06.

[[task]]
id = "T01"
title = "Keep roles and count badges off the state hues, and style bar segments"
description = '''
CSS only; the acceptance test recomputes hue gaps, ΔE, Lab chroma and WCAG
contrast from the token files.

apps/portal/src/styles/rosedust.css
- Remove the --orchid primitive (nothing uses it after this task). Re-document
  --blush as the implementer accent (pink; ≥ 60° and ΔE ≥ 35 from indigo).
apps/portal/src/styles/tokens.css
- --role-implementer: var(--blush); --role-architect: var(--bone-bright);
  strategist mint, scribe bone and quick-reviewer lime stay.
- Rewrite the role section's comment: a coloured role sits ≥ 60° and ΔE ≥ 35
  from running and ≥ 30° from every other state hue and from --accent-cyan; the
  wheel has no room left for a fifth hue, so the rare roles read in bone.
apps/portal/src/styles/globals.css (components layer, tokens only):
- .rd-plan-row__bar: `display: flex` (height 4px, overflow hidden, background
  var(--bg-highlight)); drop its position:relative and the absolutely positioned
  `.rd-plan-row__bar > span` rule. .rd-progress gains `display: flex`; drop the
  `.rd-progress > span` rule.
- New .rd-seg { flex: none; height: 100%; transition: width
  var(--duration-slow) var(--ease-out) } and one rule per state:
  `.rd-seg[data-segment="done"]` background var(--state-done), and likewise
  accepted → var(--state-accepted), failed → var(--state-failed), active →
  var(--state-active).
- New .rd-badge { margin-left: 0.25em; padding: 0 3px; border-radius: 3px;
  background: var(--bone); color: var(--void); font-size: var(--type-meta);
  line-height: 1.4 } and .rd-badge--failed { background: var(--state-failed) }.
Keep 08d's legibility.accept (12) and 08b's styles.accept (12) passing.
Acceptance: accept/semantics.accept.test.ts (16) → src/styles/, replacing 08e's
file of the same name (it asked for ≥ 4 roles coloured by HSL saturation; bright
