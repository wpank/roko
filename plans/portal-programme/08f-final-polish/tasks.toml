[[task]]
id = "T05"
title = "Publish how a failed verify step ended, with its output tail"
description = '''
crates/roko-cli/src/graph_task_dispatch.rs. A failed verify step never said
why: settle_task_verification publishes each gate result's output through
`published_gate_output(command, verdict.detail)`, which for `test -f
MISSING.md` (no output) is only `$ test -f MISSING.md`. ShellGate's verdict
already knows how the step ended — `reason` is `exit code: 1`, `exit code:
terminated by signal`, `timed out after <n> ms`, `spawn failed: …` or `wait
failed: …` — and `detail` holds stdout, then `---stderr---` and stderr.

1. Change the helper to `fn published_gate_output(command: &str, verdict:
   &roko_core::Verdict) -> String`: `$ {command}`; then, when the verdict's
   detail is non-empty after trim_end, a newline and its tail; then, when
   `!verdict.passed`, `\n✗ ` and how it ended. Both publish sites (the step and
   the post-auto-fix re-run) pass `&verdict` / `&retry_verdict`.
2. The tail: `const GATE_OUTPUT_TAIL_LINES: usize = 60` and
   `const GATE_OUTPUT_TAIL_BYTES: usize = 16 * 1024`. Keep the last 60 lines
   (joined with \n); when lines were dropped, lead with `… {n} earlier lines not
   shown`; when the kept tail is still over 16 KiB, keep its last 16 KiB (move
   the cut forward to a char boundary) after `… earlier output not shown`
   instead.
3. How it ended: `exit code: <n>` → `exit status <n>`, `exit code: terminated by
   signal` → `terminated by a signal`, an empty reason → `failed`, any other
   reason as it is.
4. Update the existing unit test published_gate_output_leads_with_the_command
   to the new signature (a failed verdict with reason `exit code: 101` and
   detail `error[E0425]\n` publishes `$ cargo check -p roko-cli\nerror[E0425]\n✗
   exit status 101`; a pass with no detail publishes `$ true`).
5. Declare the pinned acceptance module next to `mod sibling_settle;`:
   `#[cfg(test)] mod gate_output_accept;` (the gate copies it to
   crates/roko-cli/src/graph_task_dispatch/gate_output_accept.rs).
T03 teaches the portal's checks view to show the closing line.
Acceptance: accept/gate_output_accept.rs (7 tests).
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 40
