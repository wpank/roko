[meta]
plan = "08g-first-run"
total = 3
done = 0
status = "ready"
skip_enrichment = true
estimated_total_minutes = 60

# Three defects on the hello-world path, found by a browser run of
# 09-acceptance's flow (fake agent, auth on, a workspace with no plans) against
# the merged tree on 2026-09-29, after 03c landed. Each was fixed in a scratch
# copy, after which the whole flow — sign in by the printed link, generate, run,
# live step, reload, revise, run again, two plans at once — passed:
# 1. The first plan of a workspace with none never opens: the portal selected
#    it before the refreshed plan list arrived, and the workspace clears a plan
#    id its loaded list does not know, so the operator was left at "Select a
#    plan".
# 2. A revision's new task never shows: tasks were refreshed on the revise
#    request's 202, but the revision lands only when its operation completes.
# 3. "agent working" and the live marker never show: the dispatcher publishes
#    agent_spawned just before task_started, and the fold linked an agent only
#    to a task that already existed. The fix makes the fold order-independent:
#    whichever of the two arrives second completes the link.
#
# Runs in the main tree after 08f-final-polish and before 09-acceptance. Same
# gate style as 08b-08f: tests in accept/ are pinned acceptance tests
# ([task.accept], gap-d14a43, migrated by gap-ba4d01): a run pins each one
# outside the working tree, and a generated gate that runs before the task's own
# copies the pinned test into apps/portal/src and requires its exact passing
# count. Each fails on the tree its task starts from and passed on the fixed
# reference. One production build, in T03. The main tree's node_modules may
# predate jsdom, so gates install when node_modules/jsdom is missing.

[[task]]
id = "T01"
title = "Link a task to the agent announced just before it started"
description = '''
apps/portal/src/lib/runState.ts. The dispatcher publishes agent_spawned just
before task_started (seen on the merged tree: agent_spawned, then task_started,
sometimes an agent_output between them). agent_spawned links the agent only to
a task record that already exists, so a fresh task started with agentId null
and the stream pane never said "agent working" nor marked a live step live.

The fold must not depend on which of the two arrives first: whichever comes
second completes the link. agent_spawned already links an existing record; in
`case 'task_started'`, unless the record it keeps already points at an active
agent, find an active agent in state.agents whose planId and taskId are the
event's, and take its agentId, role and model for the new record; otherwise
keep what the record kept (or null). Either order then yields the same record,
a retry links its new agent rather than the finished one, and another task's
agent is never linked. Say why in a comment.
Keep runState.test (56), 08b's runState.accept (15), 08c's liveFold.accept
(11), 08d's runAgain.accept (11) and 08e's streamTruth.accept (6) passing.
Acceptance: accept/earlyAgent.accept.test.tsx (5) → src/components/stream/.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 20
depends_on = []
files = [
    "apps/portal/src/lib/runState.ts",
    "apps/portal/src/components/stream/earlyAgent.accept.test.tsx",
]

[task.context]
read_files = [
    { path = "plans/portal-programme/08g-first-run/accept/earlyAgent.accept.test.tsx", why = "the acceptance test the gate runs", lines = "1-" },
    { path = "apps/portal/src/lib/runState.ts", why = "task_started and agent_spawned (TaskRun.agentId/role/model and AgentRun.active/planId/taskId are declared near the top)", lines = "560-750" },
]
anti_patterns = [
    "Do not link an inactive agent or another task's agent.",
    "Do not reorder or drop events to work around the order; fold what arrives.",
    "Do not edit the copied acceptance test; the gate overwrites it.",
]

[[task.accept.files]]
src = "accept/earlyAgent.accept.test.tsx"
dest = "apps/portal/src/components/stream/earlyAgent.accept.test.tsx"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/components/stream/earlyAgent.accept.test.tsx {count}'
count = 5
timeout_ms = 600000

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/lib/runState.test.ts 56 && node scripts/vitest-min.mjs src/lib/runState.accept.test.ts 15'
fail_msg = "a run-state suite does not pass"
timeout_ms = 600000

[[task.verify]]
phase = "test"
command = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/lib/liveFold.accept.test.ts 11 && node scripts/vitest-min.mjs src/lib/runAgain.accept.test.ts 11 && node scripts/vitest-min.mjs src/components/stream/streamTruth.accept.test.tsx 6'
fail_msg = "an 08c-08e fold or stream test broke"
timeout_ms = 600000

[[task.verify]]
phase = "compile"
command = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && rm -rf .next/types && ./node_modules/.bin/tsc --noEmit --incremental false'
fail_msg = "the portal does not type-check"
timeout_ms = 600000

[[task]]
id = "T02"
title = "Open the first generated plan, and a revision's tasks, as soon as they land"
description = '''
1. apps/portal/src/components/stage/Stage.tsx — handleGenerateDone invalidated
   the plan list and selected the new plan at once. The workspace clears a
   selected plan id its loaded list does not know (resolveSelection), and in a
   workspace with no plans the loaded list is still empty while the refetch is
   in flight — so the first plan was deselected and the operator left at
   "Select a plan". Make the handler async: `await
   queryClient.invalidateQueries({ queryKey: queryKeys.plans })`, then select
   the plan and close the prompt. Say why in its comment.
2. apps/portal/src/components/stage/PlanView.tsx — a revision lands when its
   operation completes, after the 202 that useRevisePlan's onSuccess refreshed
   on, so the new task never showed. handleRevisionDone becomes async: await
   invalidating queryKeys.plans, planTasks(plan.id), planSource(plan.id) and
   validation(plan.id) (Promise.all), then setRevising(false). Take the query
   client from useQueryClient() (@tanstack/react-query) with the component's
   other top-level hooks, never inside a callback; import queryKeys from
   @/api/queries. Replace the comment that says onSuccess suffices.
Keep 08b's PlanView.accept (15), Workspace.accept (4), shell.accept (11) and
08d's authoring.accept (5) passing.
Acceptance: accept/firstPlan.accept.test.tsx (1) → src/components/shell/ and
accept/revisionLands.accept.test.tsx (1) → src/components/stage/. Both serve
the new plan or task only once the operation reports completed and read with a
short delay, as a network does; firstPlan re-renders on replaceState as Next
15 does.
'''
status = "ready"
role = "implementer"
tier = "focused"
max_retries = 2
estimated_minutes = 20
depends_on = ["T01"]
files = [
    "apps/portal/src/components/stage/Stage.tsx",
    "apps/portal/src/components/stage/PlanView.tsx",
    "apps/portal/src/components/shell/firstPlan.accept.test.tsx",
    "apps/portal/src/components/stage/revisionLands.accept.test.tsx",
]

[task.context]
read_files = [
    { path = "plans/portal-programme/08g-first-run/accept/firstPlan.accept.test.tsx", why = "the first acceptance test the gate runs", lines = "1-" },
    { path = "plans/portal-programme/08g-first-run/accept/revisionLands.accept.test.tsx", why = "the second acceptance test the gate runs", lines = "1-" },
    { path = "apps/portal/src/components/stage/Stage.tsx", why = "handleGenerateDone", lines = "1-" },
    { path = "apps/portal/src/components/stage/PlanView.tsx", why = "the imports, the hooks and handleRevisionDone" },
    { path = "apps/portal/src/lib/selection.ts", why = "resolveSelection clears an unknown plan", lines = "80-111" },
]
symbols = ["const handleRevisionDone", "usePlanTasks(plan.id)"]
anti_patterns = [
    "Do not select a plan the loaded list does not contain yet.",
    "Do not weaken resolveSelection; wait for the refreshed list instead.",
    "Do not edit the copied acceptance tests; the gate overwrites them.",
]

[[task.accept.files]]
src = "accept/firstPlan.accept.test.tsx"
dest = "apps/portal/src/components/shell/firstPlan.accept.test.tsx"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/components/shell/firstPlan.accept.test.tsx {count}'
count = 1
timeout_ms = 600000

[[task.accept.files]]
src = "accept/revisionLands.accept.test.tsx"
dest = "apps/portal/src/components/stage/revisionLands.accept.test.tsx"
runner = 'cd apps/portal && { [ -d node_modules/jsdom ] || npm ci --no-audit --no-fund --silent; } && node scripts/vitest-min.mjs src/components/stage/revisionLands.accept.test.tsx {count}'
count = 1
timeout_ms = 600000

[[task.verify]]
