    { path = "plans/portal-programme/_harness/sse.py", why = "the event assertions", lines = "1-" },
    { path = "plans/portal-programme/09-acceptance/portal-check.sh", why = "the token reading and authed capture to mirror" },
    { path = "plans/portal-programme/09-acceptance/browser-flow.cjs", why = "the browser steps the real mode runs" },
]
symbols = ["start_server", "start_capture", "wait_idle"]
anti_patterns = [
