[meta]
plan = "09-acceptance"
total = 4
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 145

# The acceptance test for the portal programme, run live.
#
#   In a fresh folder, open the portal, type "a rust app that prints hello world",
#   and watch it get built: two actions (the sentence, Run), no navigation.
#
# Runs in the MAIN tree after the backend plans (01-04, 03b, 03c, 04b) and the
# portal plans (05-08) have merged. It builds roko and the portal's static export,
# then proves the flow against scratch workspaces under /tmp, each with its own
# `roko serve` on a free port (a scratch workspace has its own .roko, so nothing
# contends with the `roko plan run` executing this plan):
#
#   T02  deterministic and free: the plans/portal-programme/_harness fake agent,
#        driven through the portal in a headless browser when one is available,
#        over HTTP otherwise, plus the event stream the portal folds, the run band,
#        a revision, a second run, two plans running at once, and signing in with
#        the launch token.
#   T03  the real model on the user's exact path — `roko init`, `roko serve`, the
#        printed link — over HTTP. Costs a few dollars.
#
# Both checks are verify gates: this plan fails when the flow fails. Their evidence
# (check output, the event capture, server log, screenshots) lands in
# tmp/portal-audit/evidence/, which is where to look when a gate is red. T04 writes
# the verdict and files the gaps only when both checks pass.

[[task]]
id = "T01"
title = "Build roko and the portal's static export"
description = '''
Build what the checks run, from the merged tree:

1. `cargo build -p roko-cli` (it relinks `target/debug/roko`, the binary running
   this plan; that is safe — the running process keeps its inode).
2. In `apps/portal`: `npm ci --no-audit --no-fund`, then `npm test`, then
   `NEXT_TELEMETRY_DISABLED=1 npm run build:export`. Keep `apps/portal/out/`: it is
   what `roko serve` serves. `apps/portal/out/` is gitignored; do not edit any
   .gitignore.

If either build fails, report the error; do not change source to make it pass —
that belongs to the plan that owns the code.
'''
status = "ready"
role = "implementer"
tier = "mechanical"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 1
estimated_minutes = 25
depends_on = []
files = ["apps/portal/out"]

[task.context]
read_files = [
    { path = "apps/portal/package.json", why = "the test and build:export scripts" },
]
anti_patterns = [
    "Do not edit source files to make a build pass.",
    "Do not modify any .gitignore.",
]

[[task.verify]]
phase = "compile"
command = 'cargo build -p roko-cli'
fail_msg = "roko-cli does not build"
timeout_ms = 2700000

[[task.verify]]
phase = "structural"
command = "test -x target/debug/roko && test -f apps/portal/out/index.html && grep -q 'name=\"roko-portal\"' apps/portal/out/index.html"
fail_msg = "the roko binary or the portal export (with its roko-portal meta tag) is missing"

[[task]]
id = "T02"
title = "Prove the flow through the portal with the deterministic agent"
description = '''
Write `plans/portal-programme/09-acceptance/portal-check.sh` and
`plans/portal-programme/09-acceptance/browser-flow.cjs`. The verify step runs the
shell script; write both, check them with `bash -n` and `node --check`, and leave
the full run to the verify step.

portal-check.sh sources `plans/portal-programme/_harness/lib.sh` (resolve it from
the script's own directory) and uses its helpers: `start_server`, `start_capture`,
`api`, `sse`, `jcheck`, `wait_idle`, `wait_plan_listed`, `wait_operation`, `sha`,
`same_sha`, `check` and `finish`. Read lib.sh, `_harness/fake-claude` (its generate
and revise modes) and `_harness/sse.py` first.

A. The flow, in a workspace with no plans.
1. `make_portal_workspace`, defined in the script: lib.sh's `make_workspace`
   without the fixture plans — mktemp under /tmp, a copy of `_harness/fake-claude`,
   README.md, the same roko.toml (`[serve.auth] enabled = false`, so plain curl
   works), git init and commit. No `plans/` directory: the first-run case.
2. `export ROKO_SPA_DIR="$REPO_ROOT/apps/portal/out"`, `start_server`,
   `start_capture`.
3. Checks: `/` serves the portal (`name="roko-portal"` in the HTML); the first
   `/_next/static/…js` it references answers 200; `GET /api/plans` is `[]`.
4. When `NODE_PATH=$REPO_ROOT/demo/demo-app/node_modules node -e
   "require('playwright')"` succeeds, run `browser-flow.cjs flow <url> <evidence
   dir> <workspace name>` and turn each `BROWSER <step>: PASS|FAIL` line into a
   check; exit 3 means no browser could start — print `SKIP browser: <reason>` and
   take the HTTP path. Without Playwright, print the same SKIP. HTTP path: `POST
   /api/plans/generate {"prompt": "a rust app that prints hello world"}` → 202, the
   slug is the response's `plan_id`, then `wait_plan_listed <slug> 120`; `POST
   /api/plans/{slug}/validate` reports `valid`; `POST /api/plans/{slug}/execute`;
   `wait_idle <slug> 180`; `POST /api/plans/{slug}/revise {"feedback": "add a
   closing task"}` → 202, `wait_operation <op id> 120` reports completed and the
   plan's tasks now include T99; a revision with feedback containing BREAK fails
   and leaves tasks.toml byte-identical (`sha` / `same_sha`); then execute the plan
   again (no body) and wait — a second run of one plan, which backend plan 03b T05
   made possible.
5. After the flow: `hello/hello-bin` prints `hello world`; the capture shows the run
   live — `sse has task_started plan_id=<slug>`, `sse before task_started … --
   task_completed …`, `sse has agent_heartbeat plan_id=<slug>`, `sse has
   agent_output plan_id=<slug>`, `sse has task_completed plan_id=<slug>
   outcome=passed`, `sse positive run_completed duration_ms outcome=succeeded`.

B. Signing in, in a second workspace with auth on.
6. Another `make_portal_workspace`, then set `[serve.auth] enabled = true` and
   `api_key = ""` in its roko.toml (as `_harness/access-check.sh` does), start a
   second server, and read the launch token from the `#token=` in its serve.log
   (FAIL naming backend plan 03c when there is none). With a browser, run
   `browser-flow.cjs signin <url>/#token=<token> <evidence dir> <workspace name>`;
   without one, check over curl that `POST /api/auth/session {"token": …}` answers
   204 and sets `roko_session`.

C. Two plans at once, in a third workspace: lib.sh's own `make_workspace` (its
   fixture plans live-a, whose T01 sleeps 12s, live-b and nested-set/live-nested),
   with `[conductor] max_parallel_plans = 2` added to its roko.toml — the workspace
   limit a plain Run all uses (default 1). Start a server and a capture. With a
   browser, run `browser-flow.cjs parallel <url> <evidence dir> <workspace name>`;
   otherwise `POST /api/plans/execute {}` and check the response echoes
   `max_parallel_plans: 2`, then wait for every plan. Either way the capture must show
   a second `plan_started` before the first `plan_completed`: `sse between
   plan_started -- plan_started -- plan_completed`.

D. Copy every capture, every serve.log and the screenshots to
   `$REPO_ROOT/tmp/portal-audit/evidence/portal-check/`, then `finish "PORTAL-CHECK"`.

browser-flow.cjs (Playwright, CommonJS): launch `chromium.launch()`, else
`{channel: 'chrome'}`, else `executablePath` = the first
`~/Library/Caches/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-*/chrome-headless-shell`;
if none starts, print `BROWSER-UNAVAILABLE <reason>` and exit 3. Each step prints
`BROWSER <step>: PASS|FAIL <detail>`; the first failure exits 1.
- `flow`: open the url; `[data-region="rail"]` renders and `[data-region="header"]`
  contains the workspace name; `[data-prompt]` is visible with no click; fill the
  sentence, press Control+Enter (action 1); within 120s a `[data-plan-row]` exists,
  the URL carries `plan=<slug>`, `[data-plan-row="<slug>"][aria-current="true"]`
  exists and there is at least one `[data-task-row]` (screenshot 1-generated.png);
  click `[data-action="run"]` (action 2); within 60s a task row is `active` or
  `done`, `[data-region="stream"]` holds `[data-region="transcript"]` or
  `[data-region="checks"]` without a click, and while the task is active
  `[data-region="run-band"]` shows its task id in `[data-cell="agents"]` and at
  least one rung in `[data-cell="checks"]` (2-running.png); reload, and the same
  plan is still selected; within 180s `[data-plan-row="<slug>"]` has
  `data-state="done"`, every task row is done and `[data-region="run-band"]` is gone
  — nothing runs (3-done.png); click
  `[data-action="revise"]`, type `add a closing task`, press Control+Enter, and
  within 120s `[data-task-row="T99"]` exists (4-revised.png); click
  `[data-action="run-again"]`, wait for the plan row to leave `done`, then within
  180s for it to be `done` again. Print `BROWSER-SLUG <slug>` and `BROWSER-ACTIONS
  <n>`, counting only the actions that built hello world; the shell checks n ≤ 2.
- `parallel`: accept confirm dialogs (`page.on('dialog', d => d.accept())`), open
  the url, click `[data-action="run-all"]`; within 60s `[data-region="header"]`
  reads `2 running` and `[data-cell="agents"]` holds rows of two different plans at
  the same time (6-parallel.png); within 300s every plan row under the plans
  folder is `done`.
- `signin`: open the tokened url; within 30s `[data-region="rail"]` renders, the
  header contains the workspace name, `location.hash` no longer holds the token and
  `[data-region="alert"]` does not mention signing in; reload without the fragment
  and the rail still renders — the session cookie carries it (5-signed-in.png).
'''
status = "ready"
role = "implementer"
tier = "integrative"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 1
estimated_minutes = 55
depends_on = ["T01"]
files = [
    "plans/portal-programme/09-acceptance/portal-check.sh",
    "plans/portal-programme/09-acceptance/browser-flow.cjs",
]

[task.context]
read_files = [
    { path = "plans/portal-programme/_harness/lib.sh", why = "the workspace, server, capture, operation and check helpers to reuse" },
    { path = "plans/portal-programme/_harness/sse.py", why = "the assertions available over an event capture" },
    { path = "plans/portal-programme/_harness/fake-claude", why = "what the fake agent generates, revises and writes" },
    { path = "demo/demo-app/playwright.config.ts", why = "the Playwright install this check borrows" },
]
symbols = ["make_workspace", "start_server", "start_capture", "wait_idle", "wait_plan_listed", "wait_operation"]
anti_patterns = [
    "Do not install Playwright or browsers; use what demo/demo-app already has, or skip the browser steps.",
    "Do not point the check at the repository's own workspace or its roko serve.",
    "Do not count a SKIP as a PASS in the verdict line.",
]

[[task.verify]]
phase = "integration"
command = 'bash plans/portal-programme/09-acceptance/portal-check.sh'
fail_msg = "the portal flow failed; see tmp/portal-audit/evidence/portal-check/"
timeout_ms = 2400000

[[task]]
id = "T03"
title = "Prove hello world end to end with the real model"
description = '''
Write `plans/portal-programme/09-acceptance/hello-world-real.sh`. The verify step
runs it; write it and check it with `bash -n`. It dispatches real agents and costs a
few dollars, so do not run it yourself.

This is the user's path exactly: no fixtures, no fake agent, no `ROKO_SPA_DIR`, auth
as `roko init` leaves it. Source `plans/portal-programme/_harness/lib.sh` for
`start_server`, `start_capture`, `sse`, `jcheck`, `wait_idle`, `check` and `finish`,
then:

1. A fresh folder: `WS=$(mktemp -d /tmp/roko-hello-XXXXXX)`, `git init`, then
   `"$ROKO_BIN" init --profile rust .`.
2. `start_server` with no `ROKO_SPA_DIR`. Checks: serve.log prints the portal link,
   `portal: http://127.0.0.1:<port>/#token=<token>` (backend plan 03c); `/` serves
   the portal (`name="roko-portal"`) with no extra configuration (03c T07); an API
   request without a credential answers 401.
3. Authenticate every API call and the event capture with `Authorization: Bearer
   <token>` (the launch token works as a bearer credential). lib.sh's `api` and
   `start_capture` send no header, so define `authed_api` and `authed_capture`
   in the script, mirroring them.
4. `POST /api/plans/generate {"prompt": "a rust app that prints hello world"}` →
   202 with `plan_id`; wait up to 600s until `GET /api/plans/{plan_id}` answers 200,
   failing early when `GET /api/operations/{id}` reports `failed` (with its error).
   `POST /api/plans/{slug}/validate` reports `valid`.
5. `POST /api/plans/{slug}/execute`; wait up to 1800s for the run to finish; the
   capture has `task_started`, `agent_output` and `task_completed outcome=passed`
   for the slug, and `run_completed outcome=succeeded`.
6. Find the Cargo.toml the plan created (outside `target/` and `.roko/`); `cargo run
   --quiet` there (5-minute timeout) prints `hello world`, case-insensitively, an
   optional comma allowed. No Cargo.toml: find the `.rs` file holding `fn main`,
   compile it with rustc, and check the same.
7. Print the run's cost from `GET /api/statehub/snapshot` (`stats.cost_usd_total`).
   Copy the capture, serve.log, the generated tasks.toml and the program's source to
   `$REPO_ROOT/tmp/portal-audit/evidence/hello-world-real/`, then
   `finish "HELLO-WORLD-REAL"`.
'''
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
timeout_secs = 2700
max_retries = 1
estimated_minutes = 35
depends_on = ["T02"]
files = ["plans/portal-programme/09-acceptance/hello-world-real.sh"]

[task.context]
read_files = [
    { path = "plans/portal-programme/_harness/lib.sh", why = "the server, capture and check helpers to reuse" },
    { path = "plans/portal-programme/_harness/sse.py", why = "the event assertions" },
    { path = "plans/portal-programme/_harness/access-check.sh", why = "how the launch token is read from serve.log and used" },
]
symbols = ["start_server", "start_capture", "wait_idle"]
anti_patterns = [
    "Do not use the fake agent, a fixture roko.toml or ROKO_SPA_DIR here; this check exists to prove the user's path.",
    "Do not disable auth; the launch token is part of what is being proved.",
    "Do not round a partial result up: a failed check fails the script.",
    "Do not run the script from the task; the verify step runs it once.",
]

[[task.verify]]
phase = "integration"
command = 'bash plans/portal-programme/09-acceptance/hello-world-real.sh'
fail_msg = "the real-model hello world flow failed; see tmp/portal-audit/evidence/hello-world-real/"
timeout_ms = 2700000

[[task]]
id = "T04"
title = "Record the verdict and file what is still open"
description = '''
Both checks passed. Record the outcome from evidence, not from memory.

1. Write `plans/portal-programme/09-acceptance/VERDICT.md`:
   - The verdict of each check with its PASS/FAIL lines (re-run
     `bash plans/portal-programme/09-acceptance/portal-check.sh`, which is free and
     deterministic; quote the real-model run from
     `tmp/portal-audit/evidence/hello-world-real/`), the action count from the
     browser run (or that the browser was skipped, and why), wall time and cost.
   - Measured portal numbers: routes (`find apps/portal/src/app -name page.tsx`),
     files and lines under `apps/portal/src`, test files and passing tests
     (`npm test`), runtime dependencies — beside the targets in the budget table of
     `tmp/portal-audit/02-DESIGN.md` §14.
   - Each contract ask P-1 to P-12 (`tmp/portal-audit/03-CONTRACT.md` §6 and §6.1):
     landed or open, with the check or file that shows it.
   - A section headed exactly `## Gaps filed` listing the work items below by id.
2. File one work item per open ask, defect or unbuilt design element under
   `work/items/`, in the format of `work/README.md`: its hash id rule
   (`<prefix>-<first 6 hex of sha256("<kind>|<title>|<created>|<source>")>`,
   computed with `shasum -a 256`), TOML front matter, at least one anchor, and a
   `[[verify]]` command where one can be written — the check scripts in this plan
   usually are one — with `discovered_from = "plan:portal-programme/09-acceptance#T04"`.
   `.roko/GAPS.md` is frozen; do not append to it.
3. Add a section headed exactly `## OUTCOME portal-programme` to
   `tmp/portal-audit/00-README.md` with the verdict and the measured budget.

Be accurate rather than tidy: an optimistic entry costs more than an honest one.
'''
status = "ready"
role = "implementer"
tier = "focused"
model_hint = "claude-sonnet-4-6"
timeout_secs = 1800
max_retries = 2
estimated_minutes = 30
depends_on = ["T03"]
files = [
    "plans/portal-programme/09-acceptance/VERDICT.md",
    "tmp/portal-audit/00-README.md",
    "work/items",
]

[task.context]
read_files = [
    { path = "work/README.md", why = "the work item format, id rule and closure rules" },
    { path = "tmp/portal-audit/00-README.md", why = "the README gaining the outcome section" },
]
anti_patterns = [
    "Do not claim an ask landed without the check or file that shows it.",
    "Do not append to .roko/GAPS.md; it is frozen.",
    "Do not leave a budget target where a measurement is available.",
]

[[task.verify]]
phase = "structural"
command = "test -f plans/portal-programme/09-acceptance/VERDICT.md && grep -q '^## Gaps filed' plans/portal-programme/09-acceptance/VERDICT.md && grep -q 'PORTAL-CHECK' plans/portal-programme/09-acceptance/VERDICT.md && grep -q 'OUTCOME portal-programme' tmp/portal-audit/00-README.md && grep -rlq 'plan:portal-programme/09-acceptance' work/items"
fail_msg = "the verdict, its gap list, the README outcome, or the filed work items are missing"
