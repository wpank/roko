     (`npm test`), runtime dependencies — beside the targets in the budget table of
     `tmp/portal-audit/02-DESIGN.md` §14.
   - Each contract ask P-1 to P-12 (`tmp/portal-audit/03-CONTRACT.md` §6 and §6.1):
     landed or open, with the check or file that shows it.
   - A section headed exactly `## Gaps filed` listing the work items below by id.
2. File one work item per open ask, defect or unbuilt design element under
   `work/items/`, in the format of `work/README.md`: its hash id rule
   (`<prefix>-<first 6 hex of sha256("<kind>|<title>|<created>|<source>")>`,
   computed with `shasum -a 256`), TOML front matter, at least one anchor, and a
   `[[verify]]` command where one can be written — the check scripts in this plan
