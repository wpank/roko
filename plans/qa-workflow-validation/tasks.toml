[[task]]
id = "T03"
title = "Create CLI smoke-test script"
description = """Create `demo/qa-validation/test-cli.sh` that verifies core CLI
commands work correctly and exits 0 only if all checks pass.

The script must:

1. Set ROKO to `cargo run -p roko-cli --quiet --` or, if a pre-built binary
   exists at `./target/debug/roko`, use that instead to avoid rebuild cost.
   Check with `test -x ./target/debug/roko` before deciding.
2. Define a helper function `check_cmd` that takes a label and a command string.
   It runs the command, checks the exit code, and counts failures. If the command
   exits non-zero, print FAIL and the first 3 lines of stderr; otherwise print PASS.
3. Run these checks in order:
     a. `$ROKO --help` — must exit 0
        then grep the output for 'plan' — if absent, count as a failure
        (verifies the plan subcommand is advertised)
     b. `$ROKO plan validate plans/example-hello-world` — must exit 0 or 1
        (exit 0 = valid, exit 1 = warnings only are acceptable; exit 2+ = error)
        Log the result as PASS if exit code is 0 or 1.
     c. `$ROKO config show` — must exit 0
     d. `$ROKO config doctor` — must exit 0
4. Exit 0 if failure counter is 0, otherwise exit 1.
5. Print a summary line at the end: `N/4 CLI checks passed`.

The script must be executable and begin with `#!/usr/bin/env bash`.

Do not create any other files in this task."""
status = "ready"
tier = "mechanical"
max_loc = 80
files = ["demo/qa-validation/test-cli.sh"]
role = "implementer"
depends_on = ["T01"]
acceptance = [
    "demo/qa-validation/test-cli.sh exists and is executable.",
    "Script auto-detects pre-built binary vs cargo run.",
    "Script covers --help, plan validate, config show, config doctor.",
    "Script exits 0 on full success, non-zero on failure.",
    "Script prints a summary line with CLI check pass count.",
]

[task.context]
read_files = [
    { path = "demo/qa-validation/test-portal-api.sh", why = "Reuse the helper pattern for consistent output and failure counting." },
]
symbols = [
    "cargo run -p roko-cli --quiet -- — invoke CLI via cargo when no binary present",
    "./target/debug/roko — pre-built binary path to prefer for speed",
    "roko plan validate — lints tasks.toml without executing",
    "roko config show — prints resolved config",
    "roko config doctor — prints config health diagnostics",
]
anti_patterns = [
    "Do not hard-code the binary path without first checking it exists.",
    "Do not treat exit code 1 from plan validate as a failure — warnings return 1.",
    "Do not create additional files beyond test-cli.sh.",
]

[[task.verify]]
phase = "file-exists"
command = "test -f demo/qa-validation/test-cli.sh"
fail_msg = "demo/qa-validation/test-cli.sh must be created by T03"

[[task.verify]]
phase = "executable"
command = "test -x demo/qa-validation/test-cli.sh"
fail_msg = "demo/qa-validation/test-cli.sh must be executable"

[[task.verify]]
phase = "shebang"
command = "grep -q '#!/usr/bin/env bash' demo/qa-validation/test-cli.sh"
fail_msg = "script must begin with #!/usr/bin/env bash"

[[task.verify]]
phase = "binary-detection"
command = "grep -q 'target/debug/roko' demo/qa-validation/test-cli.sh"
fail_msg = "script must check for and prefer the pre-built binary at ./target/debug/roko"

[[task.verify]]
phase = "checks-covered"
command = "grep -q -- '--help' demo/qa-validation/test-cli.sh && grep -q 'plan validate' demo/qa-validation/test-cli.sh && grep -q 'config show' demo/qa-validation/test-cli.sh && grep -q 'config doctor' demo/qa-validation/test-cli.sh"
fail_msg = "script must cover --help, plan validate, config show, and config doctor"

[[task.verify]]
