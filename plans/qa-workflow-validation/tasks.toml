[meta]
plan = "qa-workflow-validation"
total = 4
done = 0
status = "ready"
max_parallel = 1
skip_enrichment = true
estimated_total_minutes = 20

# Dependency DAG:
#
#   T01 (implementer) — portal API test script
#    ├── T02 (implementer) — plan lifecycle test script
#    ├── T03 (implementer) — CLI test script
#    └── T04 (reviewer)   — run all scripts, write RESULTS.md
#         (depends T01, T02, T03)

# ---------------------------------------------------------------------------

[[task]]
id = "T01"
title = "Create portal API smoke-test script"
description = """Create `demo/qa-validation/test-portal-api.sh` that exercises
all core portal API endpoints and exits 0 only if every check passes.

The script must:

1. Set BASE_URL to `http://localhost:6677` (overridable via environment).
2. Define a helper function `check` that takes a label, HTTP method, path,
   optional body, and expected HTTP status code. It must use curl with
   `-s -o /dev/null -w '%{http_code}'` to capture the status code, print
   PASS or FAIL, and accumulate failures in a counter.
3. Call `check` for each of the following endpoints (in this order):
     GET  /api/health                    expected 200
     GET  /api/plans                     expected 200
     GET  /api/managed-agents            expected 200
     GET  /api/providers                 expected 200
     GET  /api/config                    expected 200
     GET  /api/learn/cascade-router      expected 200
     POST /api/run                       body: {"prompt":"hello"}   expected 200 or 202
     POST /api/plans/generate            body: {"prompt":"test plan"} expected 200 or 202
4. Exit 0 if the failure counter is 0, otherwise exit 1.
5. Print a summary line at the end: `N/8 checks passed`.

The script must be executable (chmod +x) and begin with `#!/usr/bin/env bash`.
Use `set -euo pipefail` only in the function/helper block, not at the top level,
so that curl failures are caught inside `check` rather than aborting the script.
Do not hard-code assumptions about the server being up; if curl fails (e.g. the
server is not running), the `check` helper must catch the failure and count it.

Do not create any other files in this task."""
status = "ready"
tier = "mechanical"
max_loc = 80
files = ["demo/qa-validation/test-portal-api.sh"]
role = "implementer"
depends_on = []
acceptance = [
    "demo/qa-validation/test-portal-api.sh exists and is executable.",
    "Script covers all 8 endpoint checks in the specified order.",
    "Script exits 0 when all checks pass, non-zero if any fail.",
    "Script prints a summary line with pass count.",
]

[task.context]
symbols = [
    "curl -s -o /dev/null -w '%{http_code}' — capture HTTP status without body",
    "/api/health — roko-serve health route, always 200",
    "/api/plans — list plans, always 200",
    "/api/run — dispatch prompt, returns 200 or 202",
    "/api/plans/generate — generate plan from prompt, returns 200 or 202",
]
anti_patterns = [
    "Do not use set -e at the top level — curl failures must be handled inside the check helper.",
    "Do not require jq or any tool beyond curl and standard POSIX utilities.",
    "Do not create additional files beyond test-portal-api.sh.",
]

[[task.verify]]
phase = "file-exists"
command = "test -f demo/qa-validation/test-portal-api.sh"
fail_msg = "demo/qa-validation/test-portal-api.sh must be created by T01"

[[task.verify]]
phase = "executable"
command = "test -x demo/qa-validation/test-portal-api.sh"
fail_msg = "demo/qa-validation/test-portal-api.sh must be executable"

[[task.verify]]
phase = "shebang"
command = "grep -q '#!/usr/bin/env bash' demo/qa-validation/test-portal-api.sh"
fail_msg = "script must begin with #!/usr/bin/env bash"

[[task.verify]]
phase = "endpoints-covered"
command = "grep -q '/api/health' demo/qa-validation/test-portal-api.sh && grep -q '/api/plans' demo/qa-validation/test-portal-api.sh && grep -q '/api/managed-agents' demo/qa-validation/test-portal-api.sh && grep -q '/api/providers' demo/qa-validation/test-portal-api.sh && grep -q '/api/config' demo/qa-validation/test-portal-api.sh && grep -q '/api/learn/cascade-router' demo/qa-validation/test-portal-api.sh && grep -q '/api/run' demo/qa-validation/test-portal-api.sh && grep -q '/api/plans/generate' demo/qa-validation/test-portal-api.sh"
fail_msg = "script must cover all 8 required endpoints"

[[task.verify]]
phase = "summary-line"
command = "grep -q 'checks passed' demo/qa-validation/test-portal-api.sh"
fail_msg = "script must print a summary line containing 'checks passed'"

# ---------------------------------------------------------------------------

[[task]]
id = "T02"
title = "Create plan lifecycle test script"
description = """Create `demo/qa-validation/test-plan-lifecycle.sh` that exercises
the plan CRUD and execution lifecycle via the HTTP API and exits 0 only if every
step succeeds.

The script must:

1. Set BASE_URL to `http://localhost:6677` (overridable via environment).
2. Set PLAN_ID to `qa-test` (used as the plan slug in all routes).
3. Define the same `check` helper pattern from T01 (label, method, path, body,
   expected status) with failure counting.
4. Execute these steps in order:
     a. PUT  /api/plans/qa-test/tasks     body: a minimal tasks.toml JSON payload
        (any non-empty JSON object is acceptable)        expected 200 or 201
     b. GET  /api/plans                                  expected 200
        then grep the output for "qa-test" — if absent, count as a failure
     c. POST /api/plans/qa-test/execute                  expected 200 or 202
     d. GET  /api/plans/qa-test/status                   expected 200 or 404
        (404 is acceptable here since the plan may not persist between API calls
        depending on server state; the important thing is the route exists)
5. Exit 0 if failure counter is 0, otherwise exit 1.
6. Print a summary line at the end: `N/4 lifecycle steps passed`.

The script must be executable and begin with `#!/usr/bin/env bash`.
Do not hard-code assumptions about the server being up; catch curl failures in
the helper.

Do not create any other files in this task."""
status = "ready"
tier = "mechanical"
max_loc = 80
files = ["demo/qa-validation/test-plan-lifecycle.sh"]
role = "implementer"
depends_on = ["T01"]
acceptance = [
    "demo/qa-validation/test-plan-lifecycle.sh exists and is executable.",
    "Script covers PUT create, GET list, POST execute, GET status in order.",
    "Script exits 0 on full success, non-zero on any failure.",
    "Script prints a summary line with lifecycle step pass count.",
]

[task.context]
read_files = [
    { path = "demo/qa-validation/test-portal-api.sh", why = "Reuse the check helper pattern established in T01." },
]
symbols = [
    "PUT /api/plans/{id}/tasks — create or replace plan tasks",
    "POST /api/plans/{id}/execute — trigger plan execution",
    "GET /api/plans/{id}/status — query execution status",
]
anti_patterns = [
    "Do not require jq; use grep or curl output parsing with standard tools only.",
    "Do not fail hard if the execute endpoint returns 202 instead of 200.",
    "Do not create additional files beyond test-plan-lifecycle.sh.",
]

[[task.verify]]
phase = "file-exists"
command = "test -f demo/qa-validation/test-plan-lifecycle.sh"
fail_msg = "demo/qa-validation/test-plan-lifecycle.sh must be created by T02"

[[task.verify]]
phase = "executable"
command = "test -x demo/qa-validation/test-plan-lifecycle.sh"
fail_msg = "demo/qa-validation/test-plan-lifecycle.sh must be executable"

[[task.verify]]
phase = "shebang"
command = "grep -q '#!/usr/bin/env bash' demo/qa-validation/test-plan-lifecycle.sh"
fail_msg = "script must begin with #!/usr/bin/env bash"

[[task.verify]]
phase = "lifecycle-steps-covered"
