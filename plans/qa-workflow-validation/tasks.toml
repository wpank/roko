[[task]]
id = "T04"
title = "Run all test scripts and write RESULTS.md"
description = """Act as an independent reviewer. Read all three test scripts
created by T01, T02, and T03. Then attempt to run each one and record the
results. Finally, create `demo/qa-validation/RESULTS.md` with a full report.

Steps:

1. Read `demo/qa-validation/test-portal-api.sh`,
   `demo/qa-validation/test-plan-lifecycle.sh`, and
   `demo/qa-validation/test-cli.sh` to verify their content before running.

2. Run each script. Capture the exit code and first 20 lines of output.
   For test-portal-api.sh and test-plan-lifecycle.sh: the server may not be
   running; record the actual results (PASS/FAIL per check) without assuming
   the server is up. A curl-connection-refused failure is an expected result
   when the server is not running, not a script defect.

3. Create `demo/qa-validation/RESULTS.md` with exactly these headings (in order):
     # QA Validation Results
     ## test-portal-api.sh
     ## test-plan-lifecycle.sh
     ## test-cli.sh
     ## Summary
     ## Verdict

   Under each script heading write:
     - Exit code observed
     - Output (first 20 lines or `(no output)`)
     - Script quality assessment: does the script correctly implement its
       stated contract regardless of server availability?

   Under `## Summary` write one paragraph summarising what passed, what failed,
   and whether failures are due to server availability vs script defects.

   Under `## Verdict` write exactly one of:
     `SCRIPTS: PASS` — all three scripts are correctly implemented
     `SCRIPTS: FAIL — <reason>` — at least one script has a defect

   A script is correctly implemented if it:
     - Exists, is executable, and has the required shebang
     - Covers the required endpoints or commands
     - Prints a summary line
     - Does not abort on curl/command failures (handles them as counted failures)

4. Do not modify the three test scripts. This is a review-and-run task only."""
status = "ready"
tier = "integrative"
max_loc = 120
files = ["demo/qa-validation/RESULTS.md"]
role = "implementer"
depends_on = ["T01", "T02", "T03"]
acceptance = [
    "demo/qa-validation/RESULTS.md exists with all five required headings.",
    "Each script section records exit code and output.",
    "Verdict section contains 'SCRIPTS: PASS' or 'SCRIPTS: FAIL'.",
    "Review distinguishes server-availability failures from script defects.",
]

[task.context]
read_files = [
    { path = "demo/qa-validation/test-portal-api.sh", why = "Review the portal API test script before running it." },
    { path = "demo/qa-validation/test-plan-lifecycle.sh", why = "Review the lifecycle test script before running it." },
    { path = "demo/qa-validation/test-cli.sh", why = "Review the CLI test script before running it." },
]
symbols = [
    "SCRIPTS: PASS — verdict when all three scripts are correctly implemented",
    "curl connection refused — expected when roko-serve is not running; not a script defect",
]
anti_patterns = [
    "Do not modify any of the three test scripts.",
    "Do not mark SCRIPTS: FAIL due to server not running — that is an environment condition.",
    "Do not omit any of the five required headings from RESULTS.md.",
    "Do not accept a script that aborts on curl failure instead of counting it.",
]

[[task.verify]]
phase = "file-exists"
command = "test -f demo/qa-validation/RESULTS.md"
fail_msg = "demo/qa-validation/RESULTS.md must be created by T04"

[[task.verify]]
phase = "headings"
command = "grep -q '# QA Validation Results' demo/qa-validation/RESULTS.md && grep -q '## test-portal-api.sh' demo/qa-validation/RESULTS.md && grep -q '## test-plan-lifecycle.sh' demo/qa-validation/RESULTS.md && grep -q '## test-cli.sh' demo/qa-validation/RESULTS.md && grep -q '## Summary' demo/qa-validation/RESULTS.md && grep -q '## Verdict' demo/qa-validation/RESULTS.md"
fail_msg = "RESULTS.md must contain all six required headings"

[[task.verify]]
phase = "verdict-present"
command = "grep -qE 'SCRIPTS: PASS|SCRIPTS: FAIL' demo/qa-validation/RESULTS.md"
fail_msg = "RESULTS.md Verdict section must contain 'SCRIPTS: PASS' or 'SCRIPTS: FAIL'"

[[task.verify]]
phase = "all-scripts-exist"
command = "test -f demo/qa-validation/test-portal-api.sh && test -f demo/qa-validation/test-plan-lifecycle.sh && test -f demo/qa-validation/test-cli.sh"
fail_msg = "All three test scripts must exist before T04 can complete its review"
