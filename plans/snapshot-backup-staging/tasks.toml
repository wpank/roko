let backup_path = paths.state_snapshot_json.with_extension("json.bak");
if paths.state_snapshot_json.exists() {
    let _ = std::fs::rename(&paths.state_snapshot_json, &backup_path);
}
```

Add this BEFORE the `atomic_write` call, not after.

## 2. Add `load_state_snapshot_backup` function

In `crates/roko-cli/src/runner/persist.rs`, add a function that loads the backup:

```rust
pub fn load_state_snapshot_backup(paths: &PersistPaths) -> Result<Option<StateSnapshot>> {
    let backup = paths.state_snapshot_json.with_extension("json.bak");
    if !backup.exists() {
        return Ok(None);
    }
    // Reuse the same loading logic as load_state_snapshot
    let bytes = std::fs::read(&backup)?;
    // Parse with the same format as load_state_snapshot
    serde_json::from_slice(&bytes).map(Some).map_err(Into::into)
}
```

IMPORTANT: Read `load_state_snapshot` first to understand the exact format. The snapshot
may have a checksum wrapper, a version field, or other metadata. The backup loader must
use the same deserialization path. If `load_state_snapshot` calls a helper, reuse it.

