# ── T01: Replace run_once with run_plan in the execute_plan handler ────────────
#
# `execute_plan` in `crates/roko-serve/src/routes/plans.rs` (line ~476) builds a
# natural-language prompt from the plan and dispatches it to `runtime.run_once()`.
# That path is a single LLM call: no task graph, no gates, no checkpoints.
#
# The `CliRuntime` trait already provides `run_plan(workdir, plan_target)` (defined
# in `crates/roko-serve/src/runtime.rs` at line ~285). Its concrete implementation
# in `crates/roko-cli/src/serve_runtime.rs` (line ~212) spawns a blocking worker
# that runs `run_plan_on_local_runtime`, which is the graph-engine path.
#
# The handler must:
#   1. Derive the plan directory from the located plan rather than calling
#      `build_plan_execution_prompt`. The plan directory is the argument that
#      `run_plan` expects (equivalent to what `roko plan run <dir>` receives).
#      Use the same search order as `find_plan`: `plans/{id}/`, then
#      `.roko/plans/{id}/`. Fall back to `.roko/plans/{id}` as a synthetic path
#      when only a flat file was found.
#   2. Replace the `runtime.run_once(&workdir, &prompt)` invocation inside the
#      `tokio::spawn` block with `runtime.run_plan(&workdir, &plan_dir).await`.
#   3. Map `PlanExecutionResult::success` (returned by `run_plan`) to the
#      `ServerEvent::PlanCompleted { plan_id, success }` bus publish.
#   4. Remove the now-unused `build_plan_execution_prompt` call and the `prompt`
#      binding inside `execute_plan`. Do not remove the helper function itself if
#      it is used elsewhere in the file.
#
# The `run_once` import / `RunResult` type may become unused inside `execute_plan`
# after this change. Remove the local binding; keep the top-level `use` only if
# other handlers in the file still need it (they do — leave it).

[[task]]
id = "T01"
title = "Replace run_once with run_plan in execute_plan handler"
description = """Modify `crates/roko-serve/src/routes/plans.rs` so that the
`execute_plan` async handler uses `runtime.run_plan(&workdir, &plan_dir)` instead
of `runtime.run_once(&workdir, &prompt)`.

Steps:
1. After `find_plan` returns a `Plan`, derive `plan_dir: PathBuf` as follows:
   - Check `workdir.join("plans").join(&id)` — if it is a directory, use it.
   - Otherwise check `workdir.join(".roko").join("plans").join(&id)` — if it is a
     directory, use it.
   - Otherwise fall back to `workdir.join(".roko").join("plans").join(&id)` as a
     synthetic path (flat-file plans have no directory; run_plan will fail closed
     with a clear error rather than silently mis-dispatching).
2. Remove the `prompt` and `build_plan_execution_prompt` call from `execute_plan`.
   Keep the `build_plan_execution_prompt` function if referenced elsewhere.
3. Inside the `tokio::spawn` block replace:
     `runtime.run_once(&workdir, &prompt).await`
   with:
     `runtime.run_plan(&workdir, &plan_dir).await`
4. Map the `PlanExecutionResult` to success/failure the same way the old code did
   with `RunResult`.
5. Ensure the file still compiles with `cargo check -p roko-serve`."""
status = "ready"
tier = "focused"
max_loc = 60
files = [
    "crates/roko-serve/src/routes/plans.rs",
]
role = "implementer"
depends_on = []
acceptance = [
    "execute_plan no longer calls runtime.run_once inside its tokio::spawn block.",
    "execute_plan calls runtime.run_plan(&workdir, &plan_dir) where plan_dir is derived from the plan id.",
    "The PlanStarted and PlanCompleted ServerEvents are still published around the run_plan call.",
    "`cargo check -p roko-serve` passes with no errors.",
]

[task.context]
