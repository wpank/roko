# ── T02: Forward DashboardEvents through the serve event_bus during execution ──
#
# After T01 the graph engine executes tasks in order, but the serve-side
# `event_bus` only receives PlanStarted / PlanCompleted. The portal SSE stream
# and TUI dashboard depend on TaskStarted, TaskCompleted, and GateResult events
# to show live progress.
#
# The `SharedStateHub` used by `RokoCliRuntime` already receives DashboardEvents
# from the graph engine. The serve-side `event_bus` (a `ServerEventBus`) is a
# separate channel. A bridge is needed so that DashboardEvents emitted by the
# graph engine are also forwarded as ServerEvents on the serve bus.
#
# The cleanest approach is to subscribe to the StateHub's broadcast sender (the
# same mechanism used by the TUI and SSE routes) before spawning the run_plan
# task, then fan DashboardEvent variants of interest into the ServerEvent bus
# inside a sibling tokio::spawn. Forward at minimum:
#   - DashboardEvent::TaskStarted  -> ServerEvent::TaskStarted (if the variant exists)
#     or a generic ServerEvent::EventLogEntry with the task id and "started" status.
#   - DashboardEvent::TaskCompleted -> similar
#   - DashboardEvent::GateResult   -> ServerEvent::GateResult (or EventLogEntry)
#
# Check crates/roko-serve/src/events.rs for the available ServerEvent variants
# before deciding which mapping to use. Prefer exact variants over generic log
# entries; fall back to EventLogEntry when the exact variant is absent.
#
# The forwarding task should stop when the plan_handle's JoinHandle finishes
# (poll `handle.is_finished()` or use a CancelToken that is cancelled after
# run_plan returns). Do not leak background tasks.

[[task]]
id = "T02"
title = "Forward graph DashboardEvents to the serve SSE event bus during plan execution"
description = """Modify `crates/roko-serve/src/routes/plans.rs` so that
DashboardEvents emitted by the graph engine during `run_plan` are forwarded to
the serve-side `state.event_bus` as `ServerEvent`s. This allows the portal SSE
stream and the TUI to display live per-task progress when a plan is triggered via
the HTTP endpoint.

Steps:
1. Before the `tokio::spawn` that calls `run_plan`, subscribe to the StateHub's
   DashboardEvent broadcast channel. The `AppState` has access to a `SharedStateHub`
   (check `crates/roko-serve/src/state.rs` for the field name). Call
   `state_hub.subscribe()` (or the equivalent method) to get a
   `tokio::sync::broadcast::Receiver<DashboardEvent>`.
2. Spawn a sibling forwarding task that receives from the DashboardEvent channel
   and publishes matching ServerEvents to `state.event_bus`. Forward at minimum:
   - `DashboardEvent::TaskStarted { plan_id, task_id, .. }` as an appropriate
     ServerEvent (check `crates/roko-serve/src/events.rs` for exact variants).
   - `DashboardEvent::TaskCompleted { plan_id, task_id, success, .. }` similarly.
   - `DashboardEvent::GateResult { .. }` similarly.
3. Cancel the forwarding task cleanly when `run_plan` returns. Use the existing
   `CancelToken` already attached to the `PlanHandle`, or a new local
   `tokio::sync::oneshot` channel — whichever avoids leaking the background task.
4. Ensure `cargo check -p roko-serve` passes."""
status = "ready"
tier = "focused"
max_loc = 80
files = [
    "crates/roko-serve/src/routes/plans.rs",
]
role = "implementer"
depends_on = ["T01"]
acceptance = [
    "A DashboardEvent subscription is obtained from the StateHub before run_plan is called.",
    "A sibling forwarding task bridges DashboardEvent::TaskStarted/TaskCompleted/GateResult to ServerEvent publishes.",
    "The forwarding task is cancelled or exits cleanly when run_plan completes.",
    "No background task is leaked after PlanCompleted is published.",
    "`cargo check -p roko-serve` passes with no errors.",
]

[task.context]
