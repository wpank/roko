    { path = "crates/roko-serve/src/runtime.rs", lines = "62-75", why = "PlanExecutionResult type definition — fields to map in the success/failure branch." },
    { path = "crates/roko-serve/src/runtime.rs", lines = "280-301", why = "CliRuntime::run_plan default implementation — signature and contract." },
