# ── T02: Add ignored-tests ledger check to `roko doctor` ─────────────────────
#
# Tests marked `#[ignore]` accumulate silently. There are currently 8 such tests
# across the workspace (extension_loader.rs:2841/2859/2911, serve_runtime.rs:736,
# and several in roko-agent). When a previously-live test is demoted to `#[ignore]`
# without a tracking entry, it becomes invisible.
#
# The system prompt builder already references `.roko/plans/ignored-tests.md` as
# a ledger (common.rs:231). Add a `check_ignored_tests_ledger` function to
# `doctor.rs` that counts `#[ignore]` occurrences in `crates/**/*.rs` (excluding
# `target/`) and checks whether `.roko/plans/ignored-tests.md` exists. Returns Ok
# if the ledger exists and Warn with a count and fix command if it is absent.

[[task]]
id = "T02"
title = "Add ignored-tests ledger check to roko doctor"
description = """Add `fn check_ignored_tests_ledger(workdir: &Path) -> DoctorCheck`
to `crates/roko-cli/src/doctor.rs`. The function must:
  1. Count lines matching `#[ignore]` in `<workdir>/crates/**/*.rs` using
     `std::fs::read_dir` recursion or a glob-style walk. Exclude any path
     component equal to `target`.
  2. Check whether `<workdir>/.roko/plans/ignored-tests.md` exists.
  3. If the ledger file exists: return `DoctorStatus::Ok` with message
     "ignored-tests ledger present (<N> #[ignore] markers in crates/)".
  4. If the ledger file is absent and N > 0: return `DoctorStatus::Warn` with
     message "N #[ignore] markers found but .roko/plans/ignored-tests.md is
     missing", detail explaining its purpose, and fix
     `"touch .roko/plans/ignored-tests.md"`.
  5. If the ledger is absent and N == 0: return `DoctorStatus::Ok` with message
     "no #[ignore] markers (ledger not required)".
Check id must be `"ignored_tests_ledger"`. Insert the call in `run_checks`
after the new `check_workspace_map` check added in T01."""
status = "ready"
tier = "focused"
max_loc = 80
files = [
    "crates/roko-cli/src/doctor.rs",
]
role = "implementer"
depends_on = ["T01"]
acceptance = [
    "check_ignored_tests_ledger function exists in doctor.rs with id 'ignored_tests_ledger'.",
    "The function counts #[ignore] markers by walking crates/ excluding target/ paths.",
    "Returns Warn when ledger is absent and count > 0, Ok otherwise.",
    "Called from run_checks after check_workspace_map.",
    "`cargo check -p roko-cli` passes with no new warnings.",
    "`cargo test -p roko-cli -- doctor` passes.",
]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/doctor.rs", lines = "2148-2210", why = "check_orphaned_tmp_files — observe the directory-walk and count pattern." },
    { path = "crates/roko-cli/src/doctor.rs", lines = "175-200", why = "run_checks — where to insert the new check after check_workspace_map." },
    { path = "crates/roko-cli/src/doctor.rs", lines = "509-540", why = "check_workdir — observe DoctorCheck construction with fix field." },
    { path = "crates/roko-compose/src/templates/common.rs", lines = "228-234", why = "Confirms .roko/plans/ignored-tests.md is the canonical ledger path." },
]
symbols = [
