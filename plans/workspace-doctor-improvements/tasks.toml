# ── T01: Add workspace-map.md generation to `roko doctor` ────────────────────
#
# `generate_workspace_map_pub` in `crates/roko-cli/src/dispatch/prompt_builder.rs`
# already produces a crate-tree summary used to seed agent context. However
# `roko doctor` never surfaces this map for human inspection. When operators
# debug agent context issues they have to run a full agent dispatch to see what
# workspace map the agent actually received.
#
# Add a `check_workspace_map` function to `doctor.rs` that calls
# `generate_workspace_map_pub`, writes the output to `.roko/workspace-map.md`,
# and returns a `DoctorCheck` with status `Ok` and the byte count. Include the
# check in `run_checks`. When the workspace is not initialised (`.roko/` absent),
# return early with a Warn check instead of writing.

[[task]]
id = "T01"
title = "Add workspace-map.md generation to roko doctor"
description = """Add `fn check_workspace_map(workdir: &Path) -> DoctorCheck` to
`crates/roko-cli/src/doctor.rs`. The function must:
  1. Return a `DoctorCheck` with status `DoctorStatus::Warn` and message
     "workspace not initialised — skip workspace map" if `.roko/` does not exist.
  2. Call `crate::dispatch::prompt_builder::generate_workspace_map_pub(workdir)`
     to produce the map string.
  3. Write the map to `<workdir>/.roko/workspace-map.md`, creating parent
     directories if needed.
  4. Return a `DoctorCheck` with status `DoctorStatus::Ok`, message
     "workspace map written (<N> bytes)", and `path` set to the output file path.
  5. Return a `DoctorCheck` with status `DoctorStatus::Warn` if the write fails,
     including the error in `detail`.
Insert the check into `run_checks` after the existing `check_layout_basics` call.
The check id must be `"workspace_map"`."""
status = "ready"
tier = "focused"
max_loc = 70
files = [
    "crates/roko-cli/src/doctor.rs",
]
role = "implementer"
depends_on = []
acceptance = [
    "check_workspace_map function exists in doctor.rs with id 'workspace_map'.",
    "The function writes .roko/workspace-map.md when .roko/ exists.",
    "The function returns Warn (not panic) when .roko/ does not exist.",
    "The check is called from run_checks after check_layout_basics.",
    "`cargo check -p roko-cli` passes with no new warnings.",
    "`cargo test -p roko-cli -- doctor` passes.",
]

[task.context]
read_files = [
    { path = "crates/roko-cli/src/doctor.rs", lines = "290-360", why = "check_config_freshness pattern — observe how write-then-check doctor functions are structured." },
    { path = "crates/roko-cli/src/doctor.rs", lines = "622-670", why = "check_layout_basics — the existing check after which workspace_map should be inserted." },
    { path = "crates/roko-cli/src/doctor.rs", lines = "175-193", why = "run_checks — where to call the new check_workspace_map function." },
    { path = "crates/roko-cli/src/dispatch/prompt_builder.rs", lines = "885-892", why = "generate_workspace_map_pub — the public adapter to call." },
    { path = "crates/roko-cli/src/doctor.rs", lines = "509-540", why = "check_workdir — observe DoctorCheck field construction patterns." },
]
symbols = [
    "generate_workspace_map_pub(workdir: &Path) -> String — prompt_builder.rs:886, public workspace map generator",
    "DoctorCheck { id, status, message, detail, path, url, fix } — the return type",
    "DoctorStatus::Ok, DoctorStatus::Warn — status variants",
    "check_layout_basics(workdir: &Path) — doctor.rs:622, insert new check after this one",
    "run_checks — doctor.rs:175, push new check result into the checks vec",
]
anti_patterns = [
    "Do not call generate_workspace_map (private); use generate_workspace_map_pub.",
    "Do not truncate or modify the map string before writing — write the full output.",
    "Do not panic on I/O errors; return a Warn DoctorCheck with the error in detail.",
    "Do not remove or reorder existing checks in run_checks.",
    "Do not add a new test module; the existing doctor test suite covers check registration.",
]

[[task.verify]]
phase = "structural"
command = "grep -q 'fn check_workspace_map' crates/roko-cli/src/doctor.rs"
fail_msg = "check_workspace_map function must exist in doctor.rs"

[[task.verify]]
phase = "structural"
command = "grep -q '\"workspace_map\"' crates/roko-cli/src/doctor.rs"
fail_msg = "DoctorCheck id 'workspace_map' must be set in the function"

[[task.verify]]
phase = "structural"
