config_version = 2
schema_version = 2

[agent]
bare_mode = true
context_limit_k = 200
default_backend = "claude"
default_effort = "medium"
default_model = "codex"
mode = "ephemeral"
temperament = "balanced"

[agent.defaults]

[agent.roles]

[budget]
max_plan_usd = 0.0
max_turn_usd = 0.0
prompt_token_budget = 10000

[chain]
auto_deploy_contracts = false
enabled = false
profile = "mirage"

[cold_storage]
batch_size = 500
enabled = true
interval_secs = 21600
max_age_days = 7

[conductor]
auto_fix_model = "claude-haiku-4-5"
context_pressure_enabled = false
express_mode = false
max_agents = 8
max_auto_fix_attempts = 3
max_parallel_plans = 1
parallel_enabled = false

[conductor.watchers]

[deploy]
backend = "manual"
worker_image = "ghcr.io/nunchi-trade/roko-worker:latest"

[feed_agents]
enabled = false

[[gate]]
args = ["check"]
kind = "shell"
program = "cargo"
timeout_ms = 600000

[[gate]]
args = ["test"]
kind = "shell"
program = "cargo"
timeout_ms = 600000

[[gate]]
args = ["clippy"]
kind = "shell"
program = "cargo"
timeout_ms = 600000

[gates]
cargo_fix_enabled = true
clippy_enabled = true
max_iterations = 3
rungs = []
skip_tests = false

[gemini]
enable_context_caching = false
safety_settings = []
thinking_level = "medium"
use_free_tier = false

[github]
auto_pr = false
auto_update_prs = false
cleanup_merged_branches = false
default_branch = "main"
label_prefix = "roko/"
merge_method = "squash"
sync_interval_hours = 4

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "gate.verdict."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "safety.approval."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "conductor.circuit."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Exact = "cost.charged"

[[graduation.policies]]
always = false
never = true
sample_every = 1

[graduation.policies.watch]
Prefix = "heartbeat."

[isfr]
auto_deploy_contracts = false
enabled = false
epoch_duration_secs = 28800
min_submissions = 2
outlier_sigma = 3.0
poll_interval_secs = 10
sources = []

[learning]
auto_playbook_refresh = true
dream_on_completion = true
file_intel_max_entries = 15
knowledge_error_patterns = true
knowledge_file_intel = true
knowledge_warnings = true
knowledge_wave_context = true
learning_min_occurrences = 2
lookahead_threshold = 0.7
replan_gate_attempts = 3
replan_max_per_plan = 2
replan_on_gate_failure = true
use_lookahead_router = false
warning_max_entries = 5

[models.claude-sonnet]
context_window = 200000
max_tools = 32
provider = "claude_cli"
slug = "claude-sonnet-4-6"
tool_format = "anthropic_blocks"

[models.codex]
context_window = 200000
max_output = 100000
provider = "codex_cli"
slug = "gpt-5.6-sol"

[models.glm51]
context_window = 128000
cost_cache_read_per_m = 0.26
cost_cache_write_per_m = 1.75
cost_input_per_m = 1.40
cost_output_per_m = 4.40
max_output = 4096
provider = "zai"
slug = "glm-5.1"
supports_thinking = true
supports_tools = true

[models.kimi-k2-5]
context_window = 256000
cost_cache_read_per_m = 0.10
cost_input_per_m = 0.60
cost_output_per_m = 3.00
max_output = 65535
provider = "moonshot"
slug = "kimi-k2.5"
supports_thinking = true
supports_tools = true
tool_format = "openai_json"

[models.sonar]
context_window = 127000
cost_input_per_m = 1.00
cost_output_per_m = 1.00
cost_per_request = 0.005
max_output = 16384
provider = "perplexity"
slug = "sonar"
supports_citations = true
supports_search = true
supports_tools = false
tool_format = "openai_json"

[perplexity]
academic_mode = false
return_images = false
return_related_questions = true
search_domain_filter = []
search_recency_filter = "year"

[pipeline]
default_template = "standard"

[pipeline.architectural]
max_iterations = 3
reviewer_mode = "full"
reviewers = true
strategist = true

[pipeline.focused]
max_iterations = 2
reviewer_mode = "quick"
reviewers = false
strategist = false

[pipeline.integrative]
max_iterations = 2
reviewer_mode = "quick"
reviewers = true
strategist = true

[pipeline.mechanical]
max_iterations = 1
reviewer_mode = "quick"
reviewers = false
strategist = false

[prd]
auto_plan = false

[project]
fresh_base_branch = "main"
name = "roko-project"
root = "."

[prompt]
composition_strategy = "auto"
vcg_warmup_observations = 10

[providers.claude_cli]
command = "claude"
kind = "claude_cli"

[providers.codex_cli]
command = "codex"
kind = "claude_cli"

[providers.moonshot]
api_key_env = "MOONSHOT_API_KEY"
base_url = "https://api.moonshot.ai/v1"
kind = "openai_compat"

[providers.perplexity]
api_key_env = "PERPLEXITY_API_KEY"
base_url = "https://api.perplexity.ai"
kind = "perplexity_api"

[providers.zai]
api_key_env = "ZAI_API_KEY"
base_url = "https://api.z.ai/api/paas/v4"
kind = "openai_compat"

[relay]
heartbeat_interval_secs = 30

[resources]
auto_cleanup_on_complete = true
gc_on_failure = true
gc_on_plan_end = true
gc_on_plan_start = true
log_rotation_max_mb = 100
max_plan_disk_mb = 0
min_free_disk_mb = 2048
target_cleanup_enabled = true
target_max_age_days = 3
warn_disk_mb = 5120
worktree_cleanup_on_complete = true
worktree_cleanup_on_failure = true
worktree_max_age_secs = 86400

[routing]
algorithm = "linucb"
complex_task_model = "claude-opus-4-6"
context_strategy = "mcp_first"
discount_factor = 0.99
fast_task_model = "claude-haiku-4-5"
mode = "auto_override"
standard_task_model = "claude-sonnet-4-6"

[routing.weights]
cost = 0.3
latency = 0.2
quality = 0.5

[runner]
dangerously_skip_permissions = false
dispatch_max_retries = 5
plan_timeout_secs = 3600
sandbox_level = "restrict"
warm_pool_idle_timeout_secs = 300
warm_pool_size = 2

[scheduler]

[serve]
acknowledge_public_risk = false
auto_orchestrate = true
auto_start = false
share_ttl_days = 7
terminal_enabled = false

[serve.auth]
api_key = ""
enabled = false
enforcement_mode = "enforce"

[serve.deploy]
environment = [
    "GITHUB_TOKEN",
    "GITHUB_WEBHOOK_SECRET",
    "SLACK_BOT_TOKEN",
    "SLACK_SIGNING_SECRET",
]
provider = "railway"

[serve.tracing]
sample_rate = 1.0
service_name = "roko-serve"

[server]
bind = "127.0.0.1"
cors_origins = []
port = 6677
unsafe_public_cors = false
workspace_gc_interval_secs = 300

[timeouts]
agent_dispatch_secs = 600
gate_clippy_secs = 300
gate_compile_secs = 600
gate_test_secs = 900
health_check_secs = 3
http_request_secs = 30
llm_call_secs = 120
plan_total_secs = 3600
workspace_lock_secs = 5

[tools]
allow = []
deny = []

[tools.profiles]

[tui]
refresh_rate_ms = 250

[tui.effects]
preset = "full"

[validation]
strict_validation = false

[webhooks.github]
secret = ""
