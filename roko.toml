# REQUIRED_ENV
# Required environment variables (set in .env or shell):
# GITHUB_TOKEN       - GitHub personal access token (for MCP GitHub server)
# GITHUB_WEBHOOK_SECRET - GitHub webhook secret for deploy registration
# SLACK_BOT_TOKEN    - Slack bot token (for MCP Slack server)
# SLACK_SIGNING_SECRET - Slack webhook signing secret
# ANTHROPIC_API_KEY  - Claude API key (for direct API agents, not needed for CLI agents)

config_version = 2
schema_version = 2

[project]
name = "roko-project"
root = "."
fresh_base_branch = "main"

[prd]
auto_plan = false

[agent]
default_model = "claude-sonnet"
default_backend = "claude"
default_effort = "medium"
temperament = "balanced"
context_limit_k = 200
bare_mode = true
mode = "ephemeral"

[agent.roles]

[agent.defaults]

[providers]

[models]

[gates]
clippy_enabled = true
skip_tests = false
max_iterations = 3
cargo_fix_enabled = true
rungs = []

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "gate.verdict."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "safety.approval."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "conductor.circuit."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Exact = "cost.charged"

[[graduation.policies]]
always = false
never = true
sample_every = 1

[graduation.policies.watch]
Prefix = "heartbeat."

[routing]
mode = "auto_override"
algorithm = "linucb"
discount_factor = 0.99
fast_task_model = "claude-haiku-4-5"
standard_task_model = "claude-sonnet-4-6"
complex_task_model = "claude-opus-4-6"
context_strategy = "mcp_first"

[routing.weights]
quality = 0.5
cost = 0.3
latency = 0.2

[pipeline]
default_template = "standard"

[pipeline.mechanical]
strategist = false
reviewers = false
reviewer_mode = "quick"
max_iterations = 1

[pipeline.focused]
strategist = false
reviewers = false
reviewer_mode = "quick"
max_iterations = 2

[pipeline.integrative]
strategist = true
reviewers = true
reviewer_mode = "quick"
max_iterations = 2

[pipeline.architectural]
strategist = true
reviewers = true
reviewer_mode = "full"
max_iterations = 3

[budget]
max_plan_usd = 0.0
max_turn_usd = 0.0
prompt_token_budget = 10000

[conductor]
max_agents = 8
max_parallel_plans = 1
parallel_enabled = false
express_mode = false
max_auto_fix_attempts = 3
auto_fix_model = "claude-haiku-4-5"
context_pressure_enabled = false

[conductor.watchers]

[learning]
auto_playbook_refresh = true
knowledge_file_intel = true
knowledge_warnings = true
knowledge_wave_context = true
knowledge_error_patterns = true
learning_min_occurrences = 2
file_intel_max_entries = 15
warning_max_entries = 5
replan_on_gate_failure = true
replan_max_per_plan = 2
replan_gate_attempts = 3
dream_on_completion = true
use_lookahead_router = false
lookahead_threshold = 0.7

[tui]
refresh_rate_ms = 250

[timeouts]
agent_dispatch_secs = 600
gate_compile_secs = 600
gate_test_secs = 900
gate_clippy_secs = 300
llm_call_secs = 120
http_request_secs = 30
workspace_lock_secs = 5
health_check_secs = 3
plan_total_secs = 3600

[serve]
share_ttl_days = 7
terminal_enabled = false
auto_orchestrate = true
auto_start = false
acknowledge_public_risk = false

[serve.auth]
# Disable auth for local development only — production deployments
# should leave this unset (defaults to true) and provision an API key via
# `serve.auth.api_key` or one or more `[[serve.auth.api_keys]]` entries.
enabled = false
api_key = ""
enforcement_mode = "enforce"

[serve.deploy]
provider = "railway"
environment = [
    "GITHUB_TOKEN",
    "GITHUB_WEBHOOK_SECRET",
    "SLACK_BOT_TOKEN",
    "SLACK_SIGNING_SECRET",
]

[serve.tracing]
service_name = "roko-serve"
sample_rate = 1.0

[scheduler]

[webhooks.github]
secret = ""

[github]
default_branch = "main"
auto_pr = false
merge_method = "squash"
label_prefix = "roko/"
auto_update_prs = false
sync_interval_hours = 4
cleanup_merged_branches = false

[server]
bind = "127.0.0.1"
port = 6677
cors_origins = []
unsafe_public_cors = false
workspace_gc_interval_secs = 300

[deploy]
backend = "manual"
worker_image = "ghcr.io/nunchi-trade/roko-worker:latest"

[perplexity]
search_recency_filter = "year"
academic_mode = false
search_domain_filter = []
return_images = false
return_related_questions = true

[gemini]
use_free_tier = false
thinking_level = "medium"
enable_context_caching = false
safety_settings = []

[tools]
allow = []
deny = []

[tools.profiles]

[chain]
enabled = false
profile = "mirage"
auto_deploy_contracts = false

[relay]
heartbeat_interval_secs = 30

[isfr]
enabled = false
epoch_duration_secs = 28800
poll_interval_secs = 10
min_submissions = 2
outlier_sigma = 3.0
sources = []
auto_deploy_contracts = false

[feed_agents]
enabled = false

[runner]
plan_timeout_secs = 3600
dangerously_skip_permissions = true
sandbox_level = "restrict"
dispatch_max_retries = 5
warm_pool_size = 2
warm_pool_idle_timeout_secs = 300

[validation]
strict_validation = false

[cold_storage]
enabled = true
max_age_days = 7
batch_size = 500
interval_secs = 21600

[prompt]
composition_strategy = "auto"
vcg_warmup_observations = 10

[resources]
min_free_disk_mb = 2048
warn_disk_mb = 5120
max_plan_disk_mb = 0
gc_on_plan_start = true
gc_on_plan_end = true
gc_on_failure = true
target_cleanup_enabled = true
target_max_age_days = 3
log_rotation_max_mb = 100
worktree_cleanup_on_complete = true
worktree_cleanup_on_failure = true
worktree_max_age_secs = 86400
auto_cleanup_on_complete = true

[providers.claude_cli]
kind = "claude_cli"
command = "claude"

# Overriding global claude-sonnet to use claude_cli provider instead of API.
# The key must match the global key exactly to override (not create a duplicate).
[models.claude-sonnet]
provider = "claude_cli"
slug = "claude-sonnet-4-6"
context_window = 200000
tool_format = "anthropic_blocks"
max_tools = 32

# -- Verification gates --
# Rust projects use cargo for compile, test, and lint checks.

[[gate]]
kind = "shell"
program = "cargo"
args = ["check"]
timeout_ms = 600000

[[gate]]
kind = "shell"
program = "cargo"
args = ["test"]
timeout_ms = 600000

[[gate]]
kind = "shell"
program = "cargo"
args = ["clippy"]
timeout_ms = 600000
