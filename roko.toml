config_version = 2
schema_version = 2

[project]
name = "roko-project"
root = "."
fresh_base_branch = "main"

# Frontier plans, cheap models execute (decision 3204, task 3217): plan
# generation and revision run on Opus through the Claude CLI subscription.
# Built-in defaults are unchanged; this workspace opts in.
[authoring]
planner_model = "claude-opus"

[agent]
default_model = "claude-sonnet"
default_backend = "claude"
default_effort = "medium"
temperament = "balanced"
context_limit_k = 200
bare_mode = true
mode = "ephemeral"

[agent.roles]

[agent.defaults]

[providers.cerebras]
kind = "openai_compat"
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.claude_cli]
kind = "claude_cli"
command = "claude"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.codex_cli]
kind = "codex_cli"
command = "codex"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.groq]
kind = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.moonshot]
kind = "openai_compat"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "MOONSHOT_API_KEY"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.openai]
kind = "openai_compat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.perplexity]
kind = "perplexity_api"
base_url = "https://api.perplexity.ai"
api_key_env = "PERPLEXITY_API_KEY"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[providers.zai]
kind = "openai_compat"
base_url = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
timeout_ms = 120000
ttft_timeout_ms = 15000
connect_timeout_ms = 5000

[models.cerebras-gemma]
provider = "cerebras"
slug = "gemma-4-31b"
context_window = 128000
max_output = 8192
tool_format = "openai_json"
cost_input_per_m = 0.1
cost_output_per_m = 0.1

[models.cerebras-gptoss]
provider = "cerebras"
slug = "gpt-oss-120b"
context_window = 128000
max_output = 8192
tool_format = "openai_json"
# Rates from prices-2026-09-28 (config/prices/2026-09-28.toml), USD per 1M tokens.
cost_input_per_m = 0.35
cost_output_per_m = 0.75
cost_cache_read_per_m = 0.35

[models.cerebras-qwen]
provider = "cerebras"
slug = "qwen-3.8-27b"
context_window = 64000
max_output = 8192
tool_format = "openai_json"
cost_input_per_m = 0.1
cost_output_per_m = 0.1

# Added 2026-09-25 during dogfood. cheap_agent() (graph_task_dispatch.rs:890) takes
# available_model_slugs_for_cascade().into_iter().next(), and that helper SORTS slugs
# alphabetically -- so the "cheapest available model" was resolving to claude-sonnet-4-6.
# claude-haiku-4-5 sorts before claude-sonnet-4-6, which redirects the quality-judge and
# error-enrichment calls to a genuinely cheap model. Also makes conductor.auto_fix_model
# resolvable, which it previously was not.
[models.claude-haiku]
provider = "claude_cli"
slug = "claude-haiku-4-5"
context_window = 200000
tool_format = "anthropic_blocks"
max_tools = 32

[models.claude-opus]
provider = "claude_cli"
slug = "claude-opus-5-5"
context_window = 200000
tool_format = "anthropic_blocks"
max_tools = 32

[models.claude-sonnet]
provider = "claude_cli"
slug = "claude-sonnet-4-6"
context_window = 200000
tool_format = "anthropic_blocks"
max_tools = 32

[models.codex]
provider = "codex_cli"
slug = "gpt-5.6-sol"
context_window = 200000
max_output = 100000
tool_format = "openai_json"

[models.glm-4-7]
provider = "zai"
slug = "glm-4.7"
context_window = 128000
max_output = 16384
tool_format = "openai_json"
# Rates from prices-2026-09-28 (config/prices/2026-09-28.toml), USD per 1M tokens.
cost_input_per_m = 0.6
cost_output_per_m = 2.2
cost_cache_read_per_m = 0.11

[models.glm51]
provider = "zai"
slug = "glm-5v-turbo"
context_window = 128000
max_output = 4096
tool_format = "openai_json"
cost_input_per_m = 1.4
cost_output_per_m = 4.4
cost_cache_read_per_m = 0.26
cost_cache_write_per_m = 1.75

[models.gpt-4o]
provider = "openai"
slug = "gpt-4o"
context_window = 128000
max_output = 16384
supports_vision = true
tool_format = "openai_json"
cost_input_per_m = 2.5
cost_output_per_m = 10.0

[models.gpt-4o-mini]
provider = "openai"
slug = "gpt-4o-mini"
context_window = 128000
max_output = 16384
supports_vision = true
tool_format = "openai_json"
cost_input_per_m = 0.15
cost_output_per_m = 0.6

[models.gpt-5-4-mini]
provider = "openai"
slug = "gpt-5.4-mini"
context_window = 200000
max_output = 16384
tool_format = "openai_json"
# Rates from prices-2026-09-28 (config/prices/2026-09-28.toml), USD per 1M tokens.
cost_input_per_m = 0.75
cost_output_per_m = 4.5
cost_cache_read_per_m = 0.075

[models.groq-llama70b]
provider = "groq"
slug = "llama-3.3-70b-versatile"
context_window = 128000
max_output = 8192
tool_format = "openai_json"
cost_input_per_m = 0.59
cost_output_per_m = 0.79

[models.kimi-k2-5]
provider = "moonshot"
slug = "kimi-k2.6"
context_window = 256000
max_output = 65535
supports_thinking = true
tool_format = "openai_json"
# Rates from prices-2026-09-28 (config/prices/2026-09-28.toml), USD per 1M tokens.
cost_input_per_m = 0.95
cost_output_per_m = 4.0
cost_cache_read_per_m = 0.16

[models.sonar]
provider = "perplexity"
slug = "sonar"
context_window = 127000
max_output = 16384
supports_tools = false
tool_format = "openai_json"
cost_input_per_m = 1.0
cost_output_per_m = 1.0
supports_search = true
supports_citations = true
cost_per_request = 0.005

[gates]
mode = "full"
clippy_enabled = true
skip_tests = false
max_iterations = 3
# Disabled 2026-09-25: attempt_auto_fix runs `cargo fix --allow-dirty` across the
# WHOLE workspace (no -p scoping, gate_dispatch.rs:557) and awaits it with no
# timeout (gate_dispatch.rs:590). A failure in one task can rewrite crates it
# never touched, and the process can hang indefinitely.
cargo_fix_enabled = false
impact_timeout_ms = 5000
impact_max_reverse_dependents = 4
impact_max_targets = 8
compile_concurrency = 1
rungs = []
ema_alpha = 0.1
# Floor of the adaptive retry budget for tasks without an authored max_retries;
# 3 = the task default, so gate history can only add retries.
adaptive_min_retries = 3
adaptive_max_retries = 5
skip_streak_threshold = 20
convergence_min_observations = 50
# 0 disables force-accept entirely (guard is `max_review_cycles > 0 &&`).
# Was 3, which collided with task max_retries=2: attempts 1,2,3 -> cycle 3 >= 3
# force-accepted the final attempt, so an authored verify step could never fail
# a task. graph_task_dispatch.rs:2553. Changed 2026-09-25 during dogfood.
max_review_cycles = 0

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "gate.verdict."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "safety.approval."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Prefix = "conductor.circuit."

[[graduation.policies]]
always = true
never = false
sample_every = 1

[graduation.policies.watch]
Exact = "cost.charged"

[[graduation.policies]]
always = false
never = true
sample_every = 1

[graduation.policies.watch]
Prefix = "heartbeat."

[routing]
mode = "auto_override"
algorithm = "linucb"
discount_factor = 0.99
# Deprecated for plan tasks: [routing.ladder] below picks their models. fast_task_model is still
# the express-mode model and the preferred model for one-shot helper calls; nothing reads
# standard_task_model or complex_task_model.
fast_task_model = "gpt-4o-mini"
standard_task_model = "gpt-4o"
complex_task_model = "claude-sonnet"
context_strategy = "mcp_first"
# When a task's provider is exhausted (e.g. the Claude CLI session limit) or unusable,
# dispatch falls back through these models in order, skipping any whose provider has no
# API key. Keys are read from the environment; ~/.roko/.env is loaded automatically.
fallback_models = ["kimi-k2-5", "glm51", "gpt-4o"]

[routing.weights]
quality = 0.5
cost = 0.3
latency = 0.2

# Executor ladder (DECISIONS D11; on by default, decided 2026-09-29). A plan task without a
# model_hint starts on the rung its tier names, unless --model pins a model. Rungs whose model has
# no usable provider (API key or CLI on PATH) are skipped, so a workspace with only the Claude CLI
# runs every task on claude-sonnet, as before. [[routing.ladder.roles]] entries (role = "...")
# override rungs or start for one role. Planning uses [authoring] planner_model, not a rung.
[routing.ladder]
enabled = true
rungs = [
  { name = "cheap", model = "cerebras-gptoss" },
  { name = "mid", model = "glm-4-7" },
  { name = "strong", model = "gpt-5-4-mini" },
  { name = "top", model = "claude-sonnet" },
]
start = { mechanical = "cheap", focused = "cheap", integrative = "mid", architectural = "top" }

[pipeline]
default_template = "standard"

[pipeline.mechanical]
# Turn cap per task dispatch (Claude CLI --max-turns). A guard against runaway sessions, not a working limit: the built-in defaults (10/10/20/30) made the CLI exit with error_max_turns mid-task (dogfood 2026-09-28).
max_turns = 40
strategist = false
reviewers = false
reviewer_mode = "quick"
max_iterations = 1

[pipeline.focused]
# Turn cap per task dispatch (Claude CLI --max-turns). A guard against runaway sessions, not a working limit: the built-in defaults (10/10/20/30) made the CLI exit with error_max_turns mid-task (dogfood 2026-09-28).
max_turns = 60
strategist = false
reviewers = false
reviewer_mode = "quick"
max_iterations = 2

[pipeline.integrative]
# Turn cap per task dispatch (Claude CLI --max-turns). A guard against runaway sessions, not a working limit: the built-in defaults (10/10/20/30) made the CLI exit with error_max_turns mid-task (dogfood 2026-09-28).
max_turns = 90
strategist = true
reviewers = true
reviewer_mode = "quick"
max_iterations = 2

[pipeline.architectural]
# Turn cap per task dispatch (Claude CLI --max-turns). A guard against runaway sessions, not a working limit: the built-in defaults (10/10/20/30) made the CLI exit with error_max_turns mid-task (dogfood 2026-09-28).
max_turns = 120
strategist = true
reviewers = true
reviewer_mode = "full"
max_iterations = 3

[budget]
max_plan_usd = 50.0
max_task_usd = 0.0
max_turn_usd = 0.5
# Enforced by the Graph engine since 2026-09-28 (was inert); backend verification tasks can
# spend several dollars on a first attempt, so leave room for retries.
max_task_retry_usd = 15.0
max_daily_usd = 0.0
prompt_token_budget = 10000
max_agent_lifetime_usd = 0.0

[budget.tier_multipliers]
mechanical = 0.20000000298023224
standard = 1.0
complex = 3.0
expert = 5.0

[conductor]
max_agents = 8
max_parallel_plans = 1
parallel_enabled = false
express_mode = false
max_auto_fix_attempts = 3
auto_fix_model = "claude-haiku-4-5"
silence_timeout_secs = 180
compile_fail_threshold = 3
task_stall_secs = 300
context_pressure_pct = 80
phase_timeout_secs = 1800
context_window_small_tokens = 200000
context_window_opus_tokens = 1000000
context_pressure_lookback = 3

[conductor.watchers]

[learning]
auto_playbook_refresh = true
knowledge_file_intel = true
knowledge_warnings = true
knowledge_wave_context = true
knowledge_error_patterns = true
learning_min_occurrences = 2
